  },
};
/* 加碼的建議金額:至少是這一類事業開一家的一半,或現有規模的四成。
   低於這個數字的加碼,現金流的變化小到看不出來。 */
const tyExpandSug = b => Math.max(TY_BIZ[b.k].cost*.5, b.cap*.4);

let TY_DEP = {};
let TY_STRK = {};    // 打擊面板上每一種武器選好的目標城市(純 UI 狀態)     // 部隊面板上每一支選好的目的地(純 UI 狀態,不進存檔)
let TY_PAMT = {};   // 每一個動作自訂的金額(元)。沒有這一筆就用 def()

/* 這個動作這一次要花多少。key 讓同一種動作可以有很多個對象(每家公司一個)。 */
function tyAmtOf(act, arg, key){
  const m = TY_MONEY[act]; if(!m) return 0;
  const max = m.max(arg);
  const v = TY_PAMT[key||act] != null ? TY_PAMT[key||act] : m.def(arg);
  return tyClamp(v, 0, max);
}

/* ---- 效果:錢買得到的東西,買越多邊際越低 ---- */
/* base 是「一般行情」。花兩倍的錢不會有兩倍的效果(0.6 次方),
   而且單次有上限 —— 不然有錢人第一季就把所有點數買滿了。 */
const tyBuyPts = (amt, base, unit, cap) =>
  Math.min(cap, unit * Math.pow(Math.max(amt,1)/Math.max(base,1), .6));

/* ---- 門檻表 ---- */
function tyNeeds(act, arg){
  const biz = ['upgrade','expand','ipo','reverse','sellbiz','strip','ch11'].includes(act)
    ? (arg && typeof arg==='object' ? arg : TY.biz.find(x=>x.id===+arg)) : null;
  const d = biz ? TY_BIZ[biz.k] : null;
  const cashFor = amt => tyNd('現金', TY.cash, amt, tyM);

  switch(act){
    case 'upgrade':
      if(!biz) return [];
      return [ tyNb('有實際業務', !d.shell, '空殼公司沒有業務可以升級'),
               tyNb(`還沒到 Lv${TY_LV_MAX}`, tyBizLv(biz)<TY_LV_MAX, `已經是最高等級 Lv${TY_LV_MAX}`),
               cashFor(tyUpCost(biz)) ];
    case 'expand':
      if(!biz) return [];
      return [ tyNb('有實際業務', !d.shell, '空殼公司沒有業務可以加碼'),
               cashFor(tyAmtOf('expand', biz, 'expand:'+biz.id)) ];

    case 'ipo': {
      if(!biz) return [];
      /* 承銷商看兩件事:賣不賣得掉(名氣)、夠不夠格掛牌(規模)。
         創辦人劇本的門檻低一半 —— 那條路線的整個重點就是「先上市再賺錢」。 */
      const fame = TY.scn==='founder' ? 18 : 35;
      const cap  = TY.scn==='founder' ? 10e8 : 20e8;
      return [ tyNb('還沒上市', !biz.pub, '這家已經是上市公司了'),
               tyNb('有實際業務', !d.shell, '空殼公司沒有業務,掛不上去'),
               tyNd('名氣', TY.fame, fame),
               tyNd('投入資本', biz.cap, cap, tyM) ];
    }

    case 'reverse': {
      if(!biz) return [];
      const shells = TY.biz.filter(x=>TY_BIZ[x.k].shell).length;
      return [ tyNb('還沒上市', !biz.pub, '這家已經上市了'),
               tyNb('有實際業務', !d.shell, '空殼併空殼沒有意義'),
               tyNd('現成的空殼公司', shells, 1, v=>v.toFixed(0)+' 家') ];
    }

    case 'sellbiz':
      if(!biz) return [];
      return d.shell
        ? [ tyNb('不是現在的控股層', TY.holdco!==biz.site,
                 '這家空殼是你的控股層,先把控股層換到別的地方') ]
        : [];

    case 'strip':
      return [ tyNb('掠奪者劇本', TY.scn==='raider', '拆賣是掠奪者的手法,你的團隊做不到') ];

    case 'ch11':
      if(!biz) return [];
      return [ tyNb('有實際業務', !d.shell, '空殼公司沒有債務可以丟'),
               tyNb('有負債可以丟給債權人', TY.debt>0, '你沒有負債要丟給債權人') ];

    case 'found': {
      const k = arg && arg.k, site = arg && arg.site;
      const dd = TY_BIZ[k]; if(!dd) return [];
      const cost = tyBizCost(k, site);
      const out = [ tyNb(`${tySite(site).nm}開得了`, tyCan(site, TY_BIZ_KIND[k]||'hq'),
                         `${tySite(site).nm}沒有這一類事業的環境`) ];
      const par = dd.shell ? null : tyNeedPartner(site);
      if(par) out.push(tyNb(`${TY_REGIONS[par].nm}的在地夥伴`, false,
                            `在${tySite(site).nm}開公司要先有在地夥伴 —— 去「手法」找 ${TY_PARTNERS[par].nm}`));
      if(dd.need && dd.need.fame) out.push(tyNd('名氣', TY.fame, dd.need.fame));
      if(dd.need && dd.need.infl) out.push(tyNd('人脈', TY.infl, dd.need.infl));
      out.push(cashFor(cost));
      return out;
    }

    case 'borrow':
      return [ tyNd('可借額度', tyBorrowMax()-TY.debt,
                    Math.max(tyAmtOf('borrow'), 1e6), tyM) ];

    case 'repay':
      return [ tyNb('有負債', TY.debt>0, '你沒有負債'),
               cashFor(Math.max(tyAmtOf('repay'), 1e6)) ];

    case 'sbl':
      return [ tyNd('可質押的證券', tySecVal(), 1e7, tyM),
               tyNd('質押額度', tySblMax()-(TY.sbl||0),
                    Math.max(tyAmtOf('sbl'), 1e6), tyM) ];

    case 'trust':
      return [ tyNb('還沒設過信託', !TY.struct.trust, '信託已經設好了'),
               tyNd('空殼公司', TY.biz.filter(x=>TY_BIZ[x.k].shell).length, 2,
                    v=>v.toFixed(0)+' 家'),
               cashFor(tyTrustCost()) ];

    case 'lobby': case 'media': case 'charity':
      return [ cashFor(Math.max(tyAmtOf(act), TY_MONEY[act].min())) ];

    case 'movehome':
      return [ tyNb('不是你現在住的地方', TY.home!==arg, '你已經住在這裡了'),
               cashFor(tyMoveCost()) ];

    case 'movecash':
      return [ tyNb('那裡有銀行體系', tyCan(arg,'bank'), '那裡沒有可以放錢的銀行體系'),
               tyNb('不是錢現在放的地方', TY.cashSite!==arg, '錢已經在這裡了'),
               tyNd('現金', TY.cash, 1e6, tyM) ];

    case 'partner': {
      const p = TY_PARTNERS[arg]; if(!p) return [];
      return [ tyNb('還不是你的夥伴', !TY.partners[arg], '他已經是你的夥伴了'),
               cashFor(tyPartnerCost()) ];
    }

    /* ---- 談條件 ---- */
    case 'deal:pact': case 'deal:jv': case 'deal:buy': case 'deal:anchor':
    case 'deal:lobby': case 'deal:hostile': {
      const r=arg; if(!r) return [];
      const key=act.slice(5), amt=tyAmtOf(act, r, `deal:${key}:${r.id}`);
      const out=[ tyNb(`${r.nm}還在場上`, r.alive!==false, `${r.nm}已經不在榜上了`) ];
      if(key==='pact')    out.push(tyNb('目前沒有互不侵犯約', !(r.pact>TY.t), '你們已經有約在身了'));
      if(key==='anchor')  out.push(tyNb('目前沒有基石投資人', !(TY.anchor&&TY.anchor.until>TY.t),
                                        '你已經有一位基石投資人了'));
      if(key==='hostile') out.push(tyNd('你的淨值', tyShownNW(), r.nw*.6, tyM));
      out.push(cashFor(Math.max(amt, TY_MONEY[act].min())));
      return out;
    }
    case 'deal:sell': {
      const r=arg; if(!r) return [];
      return [ tyNb(`${r.nm}還在場上`, r.alive!==false, `${r.nm}已經不在榜上了`),
               tyNb('你有可以賣的事業',
                    TY.biz.some(x=>!TY_BIZ[x.k].shell), '你沒有可以賣的事業') ];
    }

    case 'recruit': {
      const d=TY_UNITS[arg]; if(!d) return [];
      const n=tyUnits().length;
      return [ tyNb(`部隊編制 ${n} / ${TY_UNIT_MAX}`, n<TY_UNIT_MAX,
                    `部隊已經滿編(${TY_UNIT_MAX} 支)—— 先解散一支`),
               cashFor(tyUnitCost(arg)) ];
    }
    case 'strike': {
      const k=arg&&arg.k, site=arg&&arg.site, d=TY_STRIKES[k];
      if(!d) return [];
      const r=site ? tyStrikeTarget(k, site) : null;
      const out=[ tyNb('冷卻完成', tyStrikeReady(k),
                       `${d.nm}還在冷卻,${tyWhen((TY.cd||{})[k]||0)} 才能再用`) ];
      if(site) out.push(tyNb(k==='missile'?`${tySite(site).nm}有對手的大本營`:`${TY_REGIONS[tySite(site).reg].nm}有對手的勢力`,
                             !!r, k==='missile'?'飛彈要打在對手的大本營 —— 這座城市沒有對手住在這裡'
                                               :'這個地區沒有任何對手的勢力,轟炸沒有對象'));
      out.push(cashFor(tyStrikeCost(k)));
      return out;
    }
    case 'deploy': {
      const u=arg&&arg.u, site=arg&&arg.site;
      if(!u || !TY_SITE[site]) return [ tyNb('有這支部隊', false, '找不到這支部隊') ];
      return [ tyNb('不是已經在那裡', !(u.site===site && !u.to), `${TY_UNITS[u.k].nm}已經在${tySite(site).nm}了`),
               tyNb('不是已經在路上', u.to!==site, `${TY_UNITS[u.k].nm}已經在往${tySite(site).nm}的路上了`) ];
    }

    case 'holdco':
      return [ tyNb(`${tySite(arg).nm}有你的空殼公司`,
                    TY.biz.some(b=>TY_BIZ[b.k].shell && b.site===arg),
                    `要先在${tySite(arg).nm}成立一家空殼公司,才有東西可以當控股層`),
               tyNb('不是現在的控股層', TY.holdco!==arg, '控股層已經在這裡了') ];
  }
  return [];
}

const tyTrustCost   = () => Math.max(2e8, tyNW()*.03);
const tyMoveCost    = () => Math.max(1e8, tyNW()*.03);
const tyPartnerCost = () => Math.max(2e8, tyNW()*.035);

/* 每一條都過了沒 */
const tyCanDo = (act, arg) => tyNeeds(act, arg).every(n => n.ok);

/* 動作函式共用的守門。回傳 null = 可以做;回傳字串 = 那一句「為什麼不行」。
   ⚠ 動作函式不可以自己再寫一次條件 —— 一律問這裡。 */
function tyBlock(act, arg){
  const bad = tyNeeds(act, arg).find(n => !n.ok);
  if(!bad) return null;
  return bad.now != null
    ? `${bad.lab}不夠 —— 你現在 ${bad.now},需要 ${bad.want}。`
    : `${bad.no || bad.lab}。`;
}

/* 卡片上那一行:每一條門檻一顆小標,過了打勾、沒過打叉。 */
function tyNeedHTML(list, cls){
  if(!list || !list.length) return '';
  return `<div class="ty-need ${cls||''}">${list.map(n=>
    `<span class="n ${n.ok?'ok':'no'}"><i>${n.ok?'✓':'✕'}</i>${escH(n.lab)}${
      n.now!=null ? ` <b>${n.now}</b> / ${n.want}` : ''}</span>`).join('')}</div>`;
}
/* 按鈕的 disabled 與提示,兩顆按鈕共用一套寫法 */
function tyActBtn(act, arg, label, attrs, cls){
  const ok = tyCanDo(act, arg), why = ok ? '' : tyBlock(act, arg);
  return `<button type="button" class="ty-b ${cls||''}${ok?'':' no'}" data-ty="${act}"${
    attrs||''}${ok?'':' disabled aria-disabled="true"'} title="${escH(why||label)}">${label}</button>`;
}

/* ---- 金額選擇器 ---- */
/* 比例晶片 + 自訂金額 + 一行「這樣會怎樣」。
   跟資產那一頁同一套手感:按下去之前就看得到會發生什麼事。 */
function tyAmtBox(act, arg, key){
  const m = TY_MONEY[act]; if(!m) return '';
  key = key || act;
  const max = m.max(arg), cur = tyAmtOf(act, arg, key), sug = m.def(arg);
  if(max <= 0) return `<div class="ty-money"><div class="m-h"><b>${m.lab}</b>
      <span>${m.hint(arg)}</span></div>
    <div class="m-v">現在沒有額度可以用。</div></div>`;
  const chip = (v, t) => `<button type="button" class="ty-chip${
      Math.abs(cur-v) < Math.max(max*.005, 1e5) ? ' on':''}"
      data-ty="pamt" data-k="${escH(key)}" data-v="${Math.round(v)}">${t}</button>`;
  return `<div class="ty-money">
    <div class="m-h"><b>${m.lab}</b><span>${m.hint(arg)}</span></div>
    <div class="m-c">
      ${chip(max*.25,'25%')}${chip(max*.5,'50%')}${chip(max*.75,'75%')}${chip(max,'全部')}
      ${sug>0 && sug<max && [.25,.5,.75].every(f=>Math.abs(sug-max*f)>max*.02)
        ? chip(sug,'建議') : ''}
      <span class="ty-amt"><input type="number" inputmode="decimal" min="0" step="0.5"
        data-pa="${escH(key)}" value="${(cur/1e8).toFixed(2)}" placeholder="自訂"
        aria-label="${escH(m.lab)}(億)"><i>億</i></span>
    </div>
    <div class="m-v" data-pav="${escH(key)}">${tyAmtPreview(act, arg, key)}</div>
  </div>`;
}

/* 「這樣按下去會怎樣」。每一個手法自己回一句話,寫的是**後果**不是規格。 */
function tyAmtPreview(act, arg, key){
  const amt = tyAmtOf(act, arg, key), m = TY_MONEY[act];
  if(amt < m.min(arg)) return `至少要 ${tyM(m.min(arg))} 才做得成。`;
  switch(act){
    case 'borrow': {
      const nd = TY.debt + amt;
      return `借 <b>${tyM(amt)}</b> · 負債變成 ${tyM(nd)} · `
           + `一年利息約 ${tyM(nd*tyRate()/100)}(每季 ${tyM(nd*tyRate()/400)})· `
           + `額度用掉 ${(nd/Math.max(1,tyBorrowMax())*100).toFixed(0)}%`;
    }
    case 'repay':
      return `還 <b>${tyM(amt)}</b> · 負債剩 ${tyM(TY.debt-amt)} · `
           + `一年少付利息約 ${tyM(amt*tyRate()/100)} · 信用 +${(2*Math.sqrt(amt/Math.max(1e8,TY.debt))).toFixed(0)}`;
    case 'sbl': {
      const cg = tyCg(TY.home,1), save = amt*cg;
      return `借 <b>${tyM(amt)}</b>,年利率 ${tySblRate().toFixed(2)}%(一年 ${tyM(amt*tySblRate()/100)})· `
           + `<b>這筆錢不用繳稅</b> —— 賣股票拿同樣的錢要先繳約 ${tyM(save)} 資本利得稅`;
    }
    case 'lobby': {
      const g = tyBuyPts(amt, TY_MONEY.lobby.def(), 9, 25);
      return `花 <b>${tyM(amt)}</b> · 人脈 +${g.toFixed(0)}(${TY.infl.toFixed(0)} → ${
        Math.min(100,TY.infl+g).toFixed(0)})· 關注 +${tyBuyPts(amt, TY_MONEY.lobby.def(), 3, 8).toFixed(0)}`;
    }
    case 'media': {
      const mul = TY.scn==='self' ? 2 : 1;
      const g = tyBuyPts(amt, TY_MONEY.media.def(), 7*mul, 20*mul);
      return `花 <b>${tyM(amt)}</b> · 名氣 +${g.toFixed(0)}(${TY.fame.toFixed(0)} → ${
        Math.min(100,TY.fame+g).toFixed(0)})${mul>1?' · 白手起家的曝光效果加倍':''}`;
    }
    case 'charity': {
      const g = tyBuyPts(amt, TY_MONEY.charity.def(), 16, 40);
      return `捐 <b>${tyM(amt)}</b> · 關注 −${g.toFixed(0)}(${TY.heat.toFixed(0)} → ${
        Math.max(0,TY.heat-g).toFixed(0)})· 名氣 +${tyBuyPts(amt, TY_MONEY.charity.def(), 5, 12).toFixed(0)}`;
    }
    /* ---- 談條件 ---- */
    case 'deal:pact': case 'deal:jv': case 'deal:buy':
    case 'deal:anchor': case 'deal:lobby': case 'deal:hostile': {
      const r=arg, key=act.slice(5);
      const want=tyDealPrice(key, r), p=tyDealOdds(key, r, amt);
      const ratio=amt/Math.max(1,want);
      const base=`出 <b>${tyM(amt)}</b>(行情 ${tyM(want)},${
        ratio>=1.5?'大幅加價':ratio>=1.02?'高於行情':ratio>=.98?'照行情':'低於行情'})`
        + ` · 成功率 <b>${(p*100).toFixed(0)}%</b> · 談不成會付掉 ${tyM(amt*.12)} 顧問費`;
      if(key==='jv'){
        const reg=Object.keys(r.turf||{}).sort((a,b)=>tyTurf(r,b)-tyTurf(r,a))[0]||tySite(r.home).reg;
        const site=(TY_SITES.filter(x=>x.reg===reg && x.kind.includes('hq'))[0]||tySite(r.home)).id;
        const kind = r.arch==='tech'?'tech' : r.arch==='energy'?'energy'
                   : r.arch==='mine'?'energy' : r.arch==='luxury'?'brand'
                   : r.arch==='mfg'?'infra' : 'dev';
        return base + ` · 談成後在${tySite(site).nm}開${TY_BIZ[kind].nm},`
             + `自有資本還要 ${tyM(tyBizCost(kind,site)*.8)}`;
      }
      if(key==='buy')     return base + ` · 談成後多一家投入資本 ${tyM(amt*.85)} 的事業`;
      if(key==='hostile') return base + ` · 談成後吃下他 ${tyM(r.nw*.45)}、關注 +14`;
      if(key==='lobby')   return base + ` · 人脈 +${tyBuyPts(amt, TY_DEALS.lobby.base(), 10, 22).toFixed(0)}`;
      return base;
    }

    case 'expand': {
      const b = arg, d = TY_BIZ[b.k];
      const cap2 = b.cap + amt;
      return `加碼 <b>${tyM(amt)}</b> · 投入資本 ${tyM(b.cap)} → <b>${tyM(cap2)}</b> · `
           + `每季現金流大約跟著放大到 ${(cap2/Math.max(1,b.cap)).toFixed(2)} 倍 · `
           + `估值約 ${tyM(tyBizVal(b))} → ${tyM(tyBizVal({...b, cap:cap2}))}`;
    }
  }
  return `${tyM(amt)}`;
}

function tyBorrow(){
  const blocked=tyBlock('borrow'); if(blocked) return blocked;
  const amt=tyAmtOf('borrow');
  if(amt<TY_MONEY.borrow.min()) return `至少要借 ${tyM(TY_MONEY.borrow.min())}。`;
  TY.debt+=amt; TY.cash+=amt;
  tyLog('debt',`借款 ${tyM(amt)}`);
  tySave();
  return `借到 <b>${tyM(amt)}</b>,年利率 ${tyRate().toFixed(2)}%。負債變成 ${tyM(TY.debt)},`
       + `一年利息約 ${tyM(TY.debt*tyRate()/100)} —— 不管你賺不賺錢都要付。錢是你的,風險也是。`;
}
function tyRepay(){
  const blocked=tyBlock('repay'); if(blocked) return blocked;
  const amt=Math.min(tyAmtOf('repay'), TY.debt, TY.cash);
  if(amt<TY_MONEY.repay.min()) return `至少要還 ${tyM(TY_MONEY.repay.min())}。`;
  /* 信用回升跟著「還掉多少比例」走,不是固定 +2 ——
     還掉一成跟還清全部不該是同一件事。 */
  const up=tyClamp(2*Math.sqrt(amt/Math.max(1e8,TY.debt)),0,12);
  TY.debt-=amt; TY.cash-=amt; TY.credit=tyClamp(TY.credit+up,0,100);
  // 先還利率高的那一段(一般抵押),質押那一段留到最後 —— 跟現實一樣
  TY.sbl=Math.max(0, Math.min(TY.sbl||0, TY.debt));
  tyLog('debt',`還款 ${tyM(amt)}`);
  tySave();
  return `還掉 <b>${tyM(amt)}</b>,負債剩 ${tyM(TY.debt)}。信用 +${up.toFixed(0)},`
       + `一年少付利息約 ${tyM(amt*tyRate()/100)}。`;
}

function tyFound(k, site, free){
  const d=TY_BIZ[k]; if(!d) return '';
  const ok=tyBizSites(k);
  site = (site && ok.some(x=>x.id===site)) ? site : (ok[0]||tySite(TY.home)).id;
  let cost=tyBizCost(k, site);
  if(!free){
    const blocked=tyBlock('found',{k,site}); if(blocked) return blocked;
    TY.cash-=cost;
  }
  TY.biz.push({ id:TY.bizId++, k, site, cap:cost, cap0:cost, own:1, pub:false, cf:0, born:TY.t });
  if(d.shell) TY.heat=tyClamp(TY.heat+5,0,120);
  tyLog('biz',`在${tySite(site).nm}成立${d.nm}`);
  if(!free) tySave();
  return `${d.nm}在${tySite(site).nm}成立,投入資本 ${tyM(cost)}。`
       + (d.shell?`此地法定公司稅率 ${(tySite(site).tax*100).toFixed(1)}% —— 可以拿它當控股層。`:'');
}
/* =========================================================================
   事業等級 —— 參考那款遊戲的城市建築升級
   -------------------------------------------------------------------------
   使用者:「事業有點不知道要幹嘛,也不知道有沒有用」。原本的「加碼擴張」要自己填金額,
   按下去之後也看不出值不值得。改成一格一格的升級:
     · 每升一級 = 投入資本 × 1.5(花的就是現在資本的一半)
     · 按下去之前就寫著:花多少、每季多賺多少、**幾季回本**
     · 等級 1~10,地圖上的建築跟著長高(建築高度本來就看估值)
   ⚠ 等級是從「現在的資本 ÷ 開辦時的資本」**算出來的**,不另外存 ——
     舊存檔、合資、買來的公司都自動有等級,不會有兩份資料對不上。
   ========================================================================= */
const TY_LV_MAX = 10, TY_LV_STEP = 1.5;
const tyBizCap0 = b => b.cap0 || tyBizCost(b.k, b.site||TY.home);
function tyBizLv(b){
  if(!b || TY_BIZ[b.k].shell) return 0;
  return tyClamp(1+Math.floor(Math.log(Math.max(1e-9,b.cap/tyBizCap0(b)))/Math.log(TY_LV_STEP)+1e-6), 1, TY_LV_MAX);
}
const tyUpCost = b => b.cap*(TY_LV_STEP-1);
/* 這一家一季大概賺多少:上一季真的有數字就用真的,剛開的用模型估 */
function tyBizCfEst(b){
  if(b.cf) return b.cf;
  const d=TY_BIZ[b.k]; if(d.shell) return 0;
  const rate=d.fameCf ? .015+TY.fame/100*.20 : d.cf;
  return b.cap*rate*tySpecMul(b.site||TY.home,'biz',b.k,'cf')*tyClamp(tyRegIdx(tySite(b.site||TY.home).reg),.3,2.2);
}
function tyUpPreview(b){
  const cost=tyUpCost(b), dcf=tyBizCfEst(b)*(TY_LV_STEP-1);
  return { cost, dcf, pay: dcf>0 ? cost/dcf : Infinity, dval: tyBizVal(b)*(TY_LV_STEP-1) };
}
function tyUpgrade(id){
  const b=TY.biz.find(x=>x.id===id); if(!b) return '';
  const blocked=tyBlock('upgrade', b); if(blocked) return blocked;
  const d=TY_BIZ[b.k], lv=tyBizLv(b), pv=tyUpPreview(b);
  TY.cash-=pv.cost; b.cap+=pv.cost;
  tyLog('biz', `${d.nm}(${tySite(b.site||TY.home).nm})升到 Lv${tyBizLv(b)}`);
  tySave();
  return `<b>${d.ic||''} ${d.nm} Lv${lv} → Lv${tyBizLv(b)}</b>。投入 ${tyM(pv.cost)},`
       + (pv.dcf>0 ? `每季現金流大約多 <b>${tyM(pv.dcf)}</b>,${pv.pay.toFixed(1)} 季回本。`
                   : `這一家目前還在燒錢 —— 升級會讓它燒得更快,賭的是估值(×${d.mult})。`);
}

function tyExpand(id){
  const b=TY.biz.find(x=>x.id===id); if(!b) return '';
  const d=TY_BIZ[b.k];
  const blocked=tyBlock('expand',b); if(blocked) return blocked;
  const amt=tyAmtOf('expand', b, 'expand:'+b.id);
  if(amt<TY_MONEY.expand.min()) return `加碼至少要 ${tyM(TY_MONEY.expand.min())}。`;
  const was=b.cap;
  TY.cash-=amt; b.cap+=amt;
  tyLog('biz',`${d.nm}加碼 ${tyM(amt)}`);
  tySave();
  return `${d.nm}再投入 <b>${tyM(amt)}</b>,投入資本 ${tyM(was)} → ${tyM(b.cap)}`
       + `(${(b.cap/Math.max(1,was)).toFixed(2)} 倍)。現金流與估值跟著同一個比例放大 ——`
       + `賺的時候賺得多,燒的時候也燒得快。`;
}
function tyIPO(id){
  const b=TY.biz.find(x=>x.id===id); if(!b) return '';
  const d=TY_BIZ[b.k];
  const blocked=tyBlock('ipo',b);
  if(blocked) return blocked + (d.shell?' —— 但它可以拿來讓別人借殼。':'');
  const val=tyBizVal(b), sell=.2;
  /* 基石投資人:先前談成的那一位對手會認購一大塊(見 TY_DEALS.anchor)。
     現實裡的意義就是「有人先掛保證」,所以募得的錢與名氣都會多一截。 */
  const anc = (TY.anchor && TY.anchor.until>TY.t) ? tyRival(TY.anchor.by) : null;
  const got=val*sell*.93*(anc?1.25:1);            // 承銷費與折價吃掉 7%
  b.pub=true; b.own-=sell; TY.cash+=got; TY.ipo++;
  TY.fame=tyClamp(TY.fame+12*(TY.scn==='founder'?2:1)+(anc?5:0),0,100);
  TY.credit=tyClamp(TY.credit+6,0,100);
  if(anc){ TY.anchor=null; anc.rel=tyClamp((anc.rel||0)+8,-100,100); }
  tyLog('ipo',`${d.nm}掛牌上市,募得 ${tyM(got)}${anc?`(${anc.nm}是基石投資人)`:''}`);
  tySave();
  return `${d.nm}掛牌。賣掉兩成股權募得 ${tyM(got)}`
       + (anc?`—— ${anc.nm}當基石投資人,多募到兩成五,名氣也多加 5。`:'')
       + `,剩下八成從今天起跟著市場情緒一起跳動 —— `
       + `你的身家從此不再由公司決定,而是由「別人願意付多少倍」決定。`;
}
function tyReverse(id){
  const b=TY.biz.find(x=>x.id===id); if(!b) return '';
  const d=TY_BIZ[b.k];
  const blocked=tyBlock('reverse',b);
  if(blocked) return blocked + (TY.biz.some(x=>TY_BIZ[x.k].shell)?'':' 去「手法」那一頁開一家空殼公司。');
  const shell=TY.biz.find(x=>TY_BIZ[x.k].shell);
  const val=tyBizVal(b), got=val*.12*.9;
  b.pub=true; b.own-=.12; TY.cash+=got;
  TY.biz=TY.biz.filter(x=>x.id!==shell.id);
  TY.heat=tyClamp(TY.heat+18,0,120); TY.fame=tyClamp(TY.fame+4,0,100); TY.ipo++;
  tyLog('ipo',`${d.nm}借殼上市`);
  tySave();
  return `${d.nm}併進空殼公司,直接取得上市地位,入帳 ${tyM(got)}。`
       + `沒有承銷商、沒有審查、不用等 —— 代價是監理機關從今天起會多看你兩眼。`;
}
/* 把一家公司整個賣掉。
   使用者問「我的事業可不可以賣掉,在我賺錢之後」—— 本來只有掠奪者能「拆賣」,
   那是把公司拆開當廢鐵賣;一般人賣公司賣的是**整台機器**,價格是它的估值,
   不是它的殘值。所以這是兩個不同的動作,兩個都留著。

   代價寫在回覆裡:賣掉的那一刻你換到一筆現金,但那台每季吐錢的機器從此
   不是你的了。這個遊戲裡最容易後悔的按鈕就是這一顆。 */
function tySellBiz(id){
  const b=TY.biz.find(x=>x.id===id); if(!b) return '';
  const d=TY_BIZ[b.k];
  const blocked=tyBlock('sellbiz',b); if(blocked) return blocked;
  if(d.shell){
    TY.biz=TY.biz.filter(x=>x.id!==b.id);
    tyLog('biz',`註銷${tySite(b.site).nm}的空殼公司`);
    tySave();
    return `${tySite(b.site).nm}的空殼公司註銷了。登記費拿不回來,但它也不再替你累積關注度。`;
  }
  const val=tyBizVal(b)*b.own;
  const fee=.06;                      // 財務顧問、盡職調查、移轉稅
  const got=val*(1-fee);
  const cf=b.cf*b.own;
  TY.cash+=got;
  TY.biz=TY.biz.filter(x=>x.id!==b.id);
  tyLog('biz',`賣掉${d.nm},入帳 ${tyM(got)}`);
  tySave();
  return `賣掉${tySite(b.site).nm}的${d.nm},入帳 <b>${tyM(got)}</b>`
       + `(估值 ${tyM(val)},交易成本 ${tyM(val*fee)})。`
       + (cf>0 ? `它每季 ${tyM(cf)} 的現金流從此不再是你的 —— `
                 + `一年 ${tyM(cf*4)}。你換到的那筆錢要能賺得比這個多,這一手才划算。`
          : cf<0 ? '它本來就在燒錢,現在停損了。'
                 : '它還沒跑過一整季,你其實還不知道它的現金流會是多少。');
}

function tyStrip(id){
  const b=TY.biz.find(x=>x.id===id); if(!b) return '';
  const blocked=tyBlock('strip',b); if(blocked) return blocked;
  const got=b.cap*.8*b.own;
  TY.cash+=got; TY.biz=TY.biz.filter(x=>x.id!==b.id);
  TY.fame=tyClamp(TY.fame-3,0,100);
  tyLog('biz',`拆賣${TY_BIZ[b.k].nm},回收 ${tyM(got)}`);
  tySave();
  return `${TY_BIZ[b.k].nm}被拆開賣掉,回收 ${tyM(got)}。土地與設備比公司本身值錢,通常都是這樣。`;
}
function tyCh11(id){
  const b=TY.biz.find(x=>x.id===id); if(!b) return '';
  const blocked=tyBlock('ch11',b); if(blocked) return blocked;
  const wipe=Math.min(TY.debt, tyBizVal(b)*b.own*1.2);
  TY.debt-=wipe; TY.biz=TY.biz.filter(x=>x.id!==b.id);
  TY.credit=tyClamp(TY.credit-24,0,100);
  TY.fame=tyClamp(TY.fame-(TY.scn==='heir'?4:9),0,100);
  TY.ch11++;
  tyLog('ch11',`${TY_BIZ[b.k].nm}聲請破產保護,甩掉 ${tyM(wipe)} 負債`);
  tySave();
  return `${TY_BIZ[b.k].nm}進入破產保護,${tyM(wipe)} 的債務留在那家公司裡 —— 你個人一毛都不用還。`
       + `信用分數會痛很久,但你還在場上。`;
}


/* =========================================================================
   Buy · Borrow · Die —— 為什麼有錢人跟你玩的不是同一個遊戲
   -------------------------------------------------------------------------
   一般人變現的方式是**賣掉**:賣了才有錢花,而賣掉的那一刻就實現了獲利,
   實現了就要課稅。所以他每動用一塊錢,就先少掉稅率那一截。

   有錢人不賣。他把股票拿去**質押借款**:錢一樣進到口袋,但借來的錢在稅法上
   不是所得,所以那一塊錢完全沒有被課過。資產繼續留在那裡繼續漲,他只付利息 ——
   而利息通常比資本利得稅便宜很多。最後那一步是「die」:繼承時成本基礎被
   墊高(step-up in basis),一輩子沒實現的獲利就再也沒有人課得到。

   這個模擬器原本**看不到這件事**,因為它根本沒有資本利得稅 —— 賣掉是免費的,
   所以借錢一點好處都沒有。這一段把缺的那一半補起來:

     1. 賣出要繳資本利得稅(用每一筆部位自己的成本基礎 p.cb 算)
     2. 證券質押借款(SBLoC):利率比一般借款低,而且**一毛稅都不用繳**
     3. 移居:換一個稅務居住地,證券的資本利得稅率就跟著換
     4. 結算時算給你看:你有多少未實現獲利從來沒被課過

   ⚠ 稅率是概略值,不是報稅用的。真實稅率會因持有期間、資產類別、居住者身分
     與一堆例外而不同(台灣賣上市股票停徵所得稅、但有 0.3% 證交稅;
     房地合一稅依持有年限 45% / 35% / 20% / 15%)。這裡各取一個代表值,
     用途是讓「賣掉 vs 借錢」這個取捨有真實的**量級**。
   ========================================================================= */

/* [不動產處分利得, 證券處分利得] —— 個人、長期持有的概略稅率 */
const TY_CG = {
  nyc:[.238,.238], sfo:[.238,.238], mia:[.238,.238], las:[.238,.238], hou:[.238,.238],
  del:[.238,.238], chi:[.238,.238], tor:[.267,.267],
  lon:[.24,.20],   zur:[.25,0],     fra:[.264,.264], par:[.30,.30],
  dub:[.33,.33],   lux:[.24,0],     mon:[0,0],
  hkg:[0,0],       sha:[.20,.20],   shz:[.20,.20],   bjs:[.20,.20],
  tpe:[.20,0],     hsz:[.20,0],
  tky:[.20,.203],  osa:[.20,.203],  seo:[.22,.22],
  sin:[0,0],       bkk:[.03,0],     jkt:[.025,.001], hcm:[.02,.001], syd:[.235,.235],
  dxb:[0,0],       ruh:[0,0],       doh:[0,0],       tlv:[.25,.25],
  bom:[.125,.125], blr:[.125,.125],
  sao:[.15,.15],   mex:[.30,.10],   scl:[.10,.10],
  jnb:[.18,.18],   lag:[.10,.10],   nbo:[.15,.15],
  cay:[0,0],       vgb:[0,0],       bmu:[0,0],
};
const tyCg = (id,i) => (TY_CG[id]||[.2,.2])[i];
/* 不動產的獲利由**它所在的國家**課(全世界幾乎都這樣);
   證券的獲利由**你的稅務居住地**課。所以「移居」會改變後者,不會改變前者。 */
const tyCgRate = p => tyAsset(p.k).g==='real'
  ? tyCg(p.site,0)
  : tyCg(TY.home,1);

/* 未實現獲利:還沒賣、所以還沒被課到的那一塊 */
function tyUnreal(){
  let gain=0, tax=0;
  for(const p of TY.pos){
    if(p.q<=0) continue;
    const g=tyPosVal(p)-p.cb;
    if(g>0){ gain+=g; tax+=g*tyCgRate(p); }
  }
  return { gain, tax };
}
/* 可以拿去質押的證券市值(不動產不算 —— 它有自己的抵押貸款,不是質押) */
const tySecVal = () => TY.pos.reduce((s,p)=>
  s + (p.q>0 && tyAsset(p.k).g!=='real' ? tyPosVal(p) : 0), 0);
const tySblMax = () => tySecVal()*.5;

/* ---- 證券質押借款 ---- */
function tySbl(){
  const blocked=tyBlock('sbl');
  if(blocked) return tySecVal()<1e7
    ? '你手上沒有可以質押的證券 —— 不動產走的是抵押貸款,不是這一條。' : blocked;
  const amt=tyAmtOf('sbl');
  if(amt<TY_MONEY.sbl.min()) return `至少要借 ${tyM(TY_MONEY.sbl.min())}。`;
  TY.sbl=(TY.sbl||0)+amt; TY.debt+=amt; TY.cash+=amt;
  const un=tyUnreal();
  tyLog('debt',`證券質押借款 ${tyM(amt)}`);
  tySave();
  return `質押手上的證券,借到 <b>${tyM(amt)}</b>,年利率 ${tySblRate().toFixed(2)}%`
       + `(比一般抵押借款便宜 1.5%)。<b>這筆錢一毛稅都不用繳</b> —— `
       + `借來的錢在稅法上不是所得。`
       + (un.tax>1e6 ? `如果改成賣股票拿同樣的錢,你今天要先繳出 ${tyM(Math.min(un.tax,amt*tyCg(TY.home,1)))} 的資本利得稅。`
                     : `(你目前的居住地 ${tySite(TY.home).nm} 證券資本利得稅率是 ${(tyCg(TY.home,1)*100).toFixed(1)}%,`
                       + `所以這一招對你的稅務效果有限 —— 它的價值在「不用賣掉會漲的東西」。)`);
}
/* 質押的利率比一般借款低:抵押品是每天有報價、可以瞬間處分的證券,
   銀行的風險比較低,所以它願意少收一點。 */
const tySblRate = () => Math.max(.4, tyRate()-1.5);

/* ---- 移居:換一個稅務居住地 ---- */
function tyMoveHome(site){
  if(!site || !TY_SITE[site]) return '';
  const blocked=tyBlock('movehome',site);
  if(blocked) return blocked + (TY.cash<tyMoveCost()?'(律師、身分、資產重組)':'');
  const cost=tyMoveCost();
  const from=TY.home, was=tyCg(from,1), now=tyCg(site,1);
  TY.cash-=cost; TY.home=site;
  TY.infl=tyClamp(TY.infl-10,0,100);        // 離開原本的關係網
  TY.heat=tyClamp(TY.heat+4,0,120);
  tyLog('play',`稅務居住地從${tySite(from).nm}遷到${tySite(site).nm}`);
  tySave();
  return `你把稅務居住地遷到${tySite(site).nm}。證券資本利得稅率 `
       + `${(was*100).toFixed(1)}% → <b>${(now*100).toFixed(1)}%</b>,`
       + `一般所得稅率 ${(tySite(from).tax*100).toFixed(1)}% → ${(tySite(site).tax*100).toFixed(1)}%。`
       + `代價是人脈掉了 10 點 —— 你離開了原本認識你的那一群人。`;
}

/* ---- 手法:不是買資產,也不是開公司,而是改變遊戲規則本身 ---- */

/* 把控股層搬到某個司法管轄區。
   跟第一版的差別:它不再是一個「開 / 關」的開關,而是**你在地圖上指一個地方**。
   都柏林 12.5%、新加坡 17%、杜拜 9%、開曼 0% —— 這些是真的法定稅率,
   所以「省多少」是真的算得出來的,「被盯上得多快」也就跟著算得出來。 */
function tySetHoldco(site){
  if(!site) return '要指定一個地方 —— 在地圖上點你有空殼公司的那一個。';
  const blocked=tyBlock('holdco',site); if(blocked) return blocked;
  const from=tyTaxRate(), to=tySite(site).tax;
  TY.holdco=site; TY.heat=tyClamp(TY.heat+6,0,120);
  tyLog('play',`控股層設在${tySite(site).nm}`);
  tySave();
  return `控股層設在${tySite(site).nm},稅率 ${(from*100).toFixed(1)}% → ${(to*100).toFixed(1)}%。`
       + (tyTaxGap()>0
          ? `每一季會累積約 ${(tyTaxGap()*14).toFixed(1)} 點關注度 —— 省得越多,長得越快。`
          : `沒有比原本低,所以不會多招來任何注意。`);
}

/* 把現金搬到另一個金融中心。錢也有地址:它決定哪一場危機掃得到你。 */
function tyMoveCash(site){
  if(!site) return '要指定一個地方。';
  const blocked=tyBlock('movecash',site); if(blocked) return blocked;
  const fee=TY.cash*.0015;
  const from=tySite(TY.cashSite).nm;
  TY.cash-=fee; TY.cashSite=site;
  tyLog('play',`現金從${from}搬到${tySite(site).nm}`);
  tySave();
  return `${tyM(TY.cash)} 從${from}搬到${tySite(site).nm}(電匯與換匯成本 ${tyM(fee)})。`
       + `外匯管制、銀行危機、資產凍結 —— 這些事只會發生在錢所在的那個地方。`;
}

/* 在地夥伴:政策風險高的地區,不是有錢就進得去。 */
function tyPartner(reg){
  const d=TY_PARTNERS[reg];
  if(!d) return `${TY_REGIONS[reg]?TY_REGIONS[reg].nm:'那裡'}不需要在地夥伴,你自己就進得去。`;
  const blocked=tyBlock('partner',reg); if(blocked) return blocked;
  const cost=tyPartnerCost();
  TY.cash-=cost;
  const site=TY_SITES.find(x=>x.reg===reg && x.kind.includes('hq'));
  TY.partners[reg]={ ...d, site:site?site.id:null };
  TY.infl=tyClamp(TY.infl+5,0,100);
  tyLog('play',`與${d.nm}在${TY_REGIONS[reg].nm}合資`);
  tySave();
  return `${d.nm}(${d.tag})成為你在${TY_REGIONS[reg].nm}的合資夥伴。`
       + `他抽走當地事業現金流的 ${(d.cut*100).toFixed(0)}%,但那裡的政策風險對你只剩一半 ——`
       + `而且你現在買得到原本買不到的東西。`;
}
function tyPlayTrust(){
  const blocked=tyBlock('trust'); if(blocked) return blocked;
  const cost=tyTrustCost();
  TY.cash-=cost; TY.struct.trust=true; TY.heat=tyClamp(TY.heat+6,0,120);
  tyLog('play','設立資產隔離信託');
  tySave();
  return `信託設立完成。破產時債權人拿不走裡面的東西,而且富豪榜上看到的你會比實際窮三成。`;
}
/* 這三個是「用錢買點數」。使用者要能選金額,所以效果一定要跟著金額走 ——
   但**不能線性**:線性的話身家一大就能一季把名氣人脈買到滿,
   後面四十季再也沒有任何取捨。0.6 次方 + 單次上限(見 tyBuyPts)。 */
function tyPlayLobby(){
  const blocked=tyBlock('lobby'); if(blocked) return blocked;
  const cost=Math.max(tyAmtOf('lobby'), TY_MONEY.lobby.min());
  const base=TY_MONEY.lobby.def();
  const up=tyBuyPts(cost, base, 9, 25)+tyRnd()*3;
  TY.cash-=cost;
  TY.infl=tyClamp(TY.infl+up,0,100);
  TY.heat=tyClamp(TY.heat+tyBuyPts(cost, base, 3, 8),0,120);
  tyLog('play',`政治獻金 ${tyM(cost)}`);
  tySave();
  return `<b>${tyM(cost)}</b> 分散在幾個委員會的競選帳戶裡。人脈 +${up.toFixed(0)} `
       + `(${TY.infl.toFixed(0)})—— 危機時的紓困名單是照這個排的。`
       + `${cost>base*2?'花得比行情多很多,但效果是遞減的:第二個一億買到的比第一個少。':''}`;
}
function tyPlayMedia(){
  const blocked=tyBlock('media'); if(blocked) return blocked;
  const cost=Math.max(tyAmtOf('media'), TY_MONEY.media.min());
  const mul=TY.scn==='self'?2:1;
  const up=tyBuyPts(cost, TY_MONEY.media.def(), 7*mul, 20*mul);
  TY.cash-=cost;
  TY.fame=tyClamp(TY.fame+up,0,100);
  tyLog('play',`買下一波媒體曝光 ${tyM(cost)}`);
  tySave();
  return `專訪、封面、一本掛你名字的書,花掉 <b>${tyM(cost)}</b>。名氣 +${up.toFixed(0)}`
       + `(${TY.fame.toFixed(0)})。名氣是這個遊戲裡唯一可以用錢直接買、`
       + `又能反過來變成現金流的東西(見品牌授權)。`;
}
function tyPlayCharity(){
  const blocked=tyBlock('charity'); if(blocked) return blocked;
  const cost=Math.max(tyAmtOf('charity'), TY_MONEY.charity.min());
  const base=TY_MONEY.charity.def();
  const cool=tyBuyPts(cost, base, 16, 40), up=tyBuyPts(cost, base, 5, 12);
  TY.cash-=cost;
  TY.fame=tyClamp(TY.fame+up,0,100); TY.heat=tyClamp(TY.heat-cool,0,120);
  tyLog('play',`慈善基金會 ${tyM(cost)}`);
  tySave();
  return `基金會成立,初始捐贈 <b>${tyM(cost)}</b>。關注 −${cool.toFixed(0)}`
       + `(${TY.heat.toFixed(0)})、名氣 +${up.toFixed(0)} —— `
       + `一個正在蓋醫院的人,比較不像一個要被查的人。`;
}

/* =========================================================================
   結算 —— 一份傳記
   -------------------------------------------------------------------------
   為什麼不是只給一個分數:分數不會讓人學到東西。這一段是回頭讀你自己的
   log,把「你到底是靠什麼變有錢的」講成一句話 —— 這也是所有富豪故事被
   整理出來時真正有價值的部分。
   ========================================================================= */
function tyBio(){
  const nw=tyNW(), st=tyScn();
  const start=TY.nw[0]||1, mult=nw/Math.max(1,start);
  const rank=tyRank();
  const bizN=TY.biz.filter(b=>!TY_BIZ[b.k].shell).length;
  const lines=[];
  lines.push(`你以「${st.nm}」開局,十年之間把 ${tyM(start)} 變成 ${tyM(nw)}`
             + `(${mult>=1?mult.toFixed(1)+' 倍':'剩下 '+(mult*100).toFixed(0)+'%'})。`);
  if(TY.ipo)   lines.push(`你把 ${TY.ipo} 家公司送上市 —— 這是你身家跳得最快的那幾季,`
                          + `因為市場給的是倍數,不是利潤。`);
  if(TY.ch11)  lines.push(`你用了 ${TY.ch11} 次破產保護,把債務留在公司裡、名字留在自己身上。`);
  if(TY.holdco) lines.push(`你的控股層設在${tySite(TY.holdco).nm},稅率壓在 `
        + `${(tyTaxRate()*100).toFixed(1)}%(原本 ${(tyHomeTax()*100).toFixed(1)}%),`
        + `代價是監理關注度累積到 ${TY.heat.toFixed(0)}。`);
  if(TY.infl>60) lines.push(`你的人脈到了 ${TY.infl.toFixed(0)} —— 在這個世界裡,那比信用分數有用。`);
  if(TY.fame>65) lines.push(`你的名氣是 ${TY.fame.toFixed(0)}。名氣本身已經變成一條現金流。`);
  const un=tyUnreal();
  if(un.gain>1e7)
    lines.push(`你有 ${tyM(un.gain)} 的獲利**從來沒有被實現過** —— 所以也從來沒有被課過稅。`
      + `如果這十年你是「賣掉再買回來」,光是資本利得稅就會被拿走 ${tyM(un.tax)}。`
      + (TY.sbl>1e7?`而你靠質押借款拿了 ${tyM(TY.sbl)} 的免稅現金去用。`
                   :`把它拿去質押,你可以在完全不繳稅的情況下動用 ${tyM(tySblMax())}。`)
      + `這就是 buy-borrow-die。`);
  lines.push(`利息總共付掉 ${tyM(TY.interest)}、稅付掉 ${tyM(TY.taxPaid)}。`
             + `最大回落 ${TY.worst.toFixed(0)}%。`);
  lines.push(rank===1 ? '富豪榜第一名。這十年是你的。'
                      : `富豪榜第 ${rank} 名,榜首還在你前面 ${tyM(tyRivalsA().reduce((m,r)=>Math.max(m,r.nw),0)-tyShownNW())}。`);
  if(bizN===0) lines.push('你整局都在買賣資產,沒有蓋出任何一台自己的機器 —— 這是報酬率的玩法,不是帝國的玩法。');
  return lines;
}
function tyRank(){
  const all=[...tyRivalsA().map(r=>r.nw), tyShownNW()].sort((a,b)=>b-a);
  return all.indexOf(tyShownNW())+1;
}

/* =========================================================================
   帝國 —— 畫面
   -------------------------------------------------------------------------
   跟站上其他分頁一樣的作法:一支函式把整頁組成字串,一支函式綁事件,
   任何動作之後整頁重畫。這一頁的狀態小(一個物件),重畫成本可以忽略,
   而「永遠只有一條更新路徑」省下的除錯時間遠比效能值錢。

   ⚠ 所有按鈕都用真的 <button>。這一頁是新寫的,沒有理由重蹈站上其他地方
     用 <span> 當按鈕、鍵盤走不到、事後再靠 armKeyboard() 補 tabindex 的路。
   ========================================================================= */
let TY_MSG='';                       // 上一個動作的回覆,顯示在動作區最上面


/* 名氣 / 人脈 / 關注度那三條。用長條而不是數字,因為它們沒有單位 ——
   重要的是「還有多少空間」和「離危險線多遠」,不是精確值。 */
function tyMeter(lab, v, hint, danger){
  const w=Math.max(2,Math.min(100,v));
  return `<div class="ty-mt${danger&&v>=danger?' hot':''}">
      <div class="l"><span>${lab}</span><b>${v.toFixed(0)}</b></div>
      <div class="bar"><i style="width:${w}%"></i></div>
      <div class="h">${hint}</div></div>`;
}

/* 淨值走勢。跟交易日誌的縮圖同一套畫法:沒有座標軸,只有形狀。 */
function tySpark(){
  const d=TY.nw; if(d.length<2) return '';
  const W=560,H=90,P=6;
  const mn=Math.min.apply(null,d), mx=Math.max.apply(null,d), rg=(mx-mn)||1;
  const X=i=>P+i/(d.length-1)*(W-P*2), Y=v=>H-P-(v-mn)/rg*(H-P*2);
  const line=d.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' L');
  const up=d[d.length-1]>=d[0], col=up?'var(--up)':'var(--down)';
  return `<svg class="ty-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <path d="M${X(0).toFixed(1)},${H-P} L${line} L${X(d.length-1).toFixed(1)},${H-P} Z"
            fill="${col}" opacity=".10"/>
      <path d="M${line}" fill="none" stroke="${col}" stroke-width="2"/></svg>`;
}

/* =========================================================================
   資產分頁
   -------------------------------------------------------------------------
   使用者回報的三件事,這一段全部在回答:

     「買的時候可以選擇要買多少」        → 金額輸入框 + 快捷比例
     「可以馬上知道價值多少、買幾棟」    → 每一列下面的成交預覽
     「資產的走勢、大致上的 K 線圖」      → 每一列的縮圖 + 點開看大圖

   預覽那一行是這一版最重要的改動。原本按下「買進」之前,畫面上沒有任何一個
   數字告訴你會發生什麼事 —— 你只知道「現金的 25%」。現在它直接寫:
   買 3.0 億 ≈ 6 棟(每棟 5,000 萬)· 年租金 1,320 萬 · 佔淨值 12%。
   ========================================================================= */
let TY_AMT=null;             // 下單金額(元)。null = 用比例
let TY_EXP=null;             // 目前展開的資產

/* 這一筆單要下多少錢 */
function tyOrderAmt(){
  if(TY_AMT!=null) return Math.max(0, Math.min(TY_AMT, Math.max(0,TY.cash)));
  return Math.max(0,TY.cash)*TY_SIZE;
}
/* 交易成本。第二個參數是「在哪個市場買」——
   倫敦買黃金跟在奈洛比買黃金,價差不是同一個量級(見 TY_SPEC 的 vault / thin)。 */
function tyFeeOf(k, site){
  const a=tyAsset(k);
  let fee=a.fee*tyFeeMul();
  if(TY.scn==='heir'  && k==='estate') fee*=.5;
  if(TY.scn==='macro' && k==='fx')     fee*=.5;
  if(site) fee *= tySpecMul(site, 'asset', k, 'fee');
  return fee;
}
/* 這筆錢在這個市場買得到什麼 —— 買進按鈕底下那一行 */
function tyBuyPreview(k, site){
  const a=tyAsset(k), amt=tyOrderAmt();
  if(amt<1e6) return '現金不夠,連一筆像樣的單都下不了。';
  const fee=tyFeeOf(k, site), upx=tyUnitPx(k,site);
  const n=amt*(1-fee)/upx;
  const yr=a.yld ? amt*a.yld*4 : 0;
  const ym=tySpecMul(site,'asset',k,'yld'), fm=tySpecMul(site,'asset',k,'fee');
  return `買 <b>${tyM(amt)}</b> ≈ <b>${tyUnitTxt(n,a.u)}</b>`
    + `(每${a.u} ${tyM(upx)})`
    + (yr?` · 一年孳息約 ${tyM(yr*ym)}${Math.abs(ym-1)>.02
          ?`(${tySite(site).nm} ${ym>1?'+':''}${((ym-1)*100).toFixed(0)}%)`:''}`
        :' · 沒有配息,只能賺價差')
    + ` · 佔淨值 ${(amt/Math.max(1,tyNW())*100).toFixed(1)}%`
    + ` · 交易成本 ${tyM(amt*fee)}${Math.abs(fm-1)>.02
        ?`(${tySite(site).nm} ${fm>1?'+':''}${((fm-1)*100).toFixed(0)}%)`:''}`;
}

/* 走勢縮圖。跟交易日誌的縮圖同一套畫法:沒有座標軸,只有形狀。 */
function tyPxSpark(k, w, h){
  const d=(TY.pxH&&TY.pxH[k])||[];
  if(d.length<2) return '';
  const P=2, mn=Math.min(...d), mx=Math.max(...d), rg=(mx-mn)||1;
  const X=i=>P+i/(d.length-1)*(w-P*2), Y=v=>h-P-(v-mn)/rg*(h-P*2);
  const line=d.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' L');
  const up=d[d.length-1]>=d[0], col=up?'var(--up)':'var(--down)';
  return `<svg class="ty-px" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
      <path d="M${X(0).toFixed(1)},${h-P} L${line} L${X(d.length-1).toFixed(1)},${h-P} Z"
            fill="${col}" opacity=".10"/>
      <path d="M${line}" fill="none" stroke="${col}" stroke-width="1.6"/></svg>`;
}

/* 展開之後的大圖:多了座標與幾個關鍵數字。
   為什麼不用真的 K 棒:這個模擬器一季只產生一個價格,一季一根 K 棒畫出來
   是四十根柱子,看不出任何形狀。折線才讀得出「這十年它走了什麼路」。 */
function tyBigChart(k){
  const d=(TY.pxH&&TY.pxH[k])||[];
  if(d.length<3) return '<div class="empty">還沒有走勢 —— 先按幾次「下一季」。</div>';
  const W=640,H=150,P=8;
  const mn=Math.min(...d), mx=Math.max(...d), rg=(mx-mn)||1;
  const X=i=>P+i/(d.length-1)*(W-P*2), Y=v=>H-P-(v-mn)/rg*(H-P*2);
  const line=d.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' L');
  const up=d[d.length-1]>=d[0], col=up?'var(--up)':'var(--down)';
  // 100 是開局的價格 —— 那條線在哪裡,決定你這十年到底有沒有賺
  const base=(mn<=100&&mx>=100) ? `<line x1="${P}" y1="${Y(100).toFixed(1)}" x2="${W-P}"
      y2="${Y(100).toFixed(1)}" stroke="var(--txt-faintest)" stroke-dasharray="3 3" stroke-width="1"/>` : '';
  const tot=(d[d.length-1]/d[0]-1)*100;
  const yrs=Math.max(1,(d.length-1)/4);
  const cagr=(Math.pow(d[d.length-1]/d[0],1/yrs)-1)*100;
  return `<svg class="ty-big" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      ${base}
      <path d="M${X(0).toFixed(1)},${H-P} L${line} L${X(d.length-1).toFixed(1)},${H-P} Z"
            fill="${col}" opacity=".10"/>
      <path d="M${line}" fill="none" stroke="${col}" stroke-width="2"/></svg>
    <div class="ty-chartfig">
      <span>開局 <b>100.0</b></span>
      <span>現在 <b>${d[d.length-1].toFixed(1)}</b></span>
      <span>最高 <b>${mx.toFixed(1)}</b></span>
      <span>最低 <b>${mn.toFixed(1)}</b></span>
      <span>累計 <b class="${tot>=0?'up':'down'}">${tyPct1(tot)}</b></span>
      <span>年化 <b class="${cagr>=0?'up':'down'}">${tyPct1(cagr)}</b></span>
    </div>
    <div class="ty-why">${tyAsset(k).why}</div>`;
}

function tyAssetTab(){
  const chips=[['.1','10%'],['.25','25%'],['.5','50%'],['1','全部']].map(([v,t])=>
    `<button type="button" class="ty-chip${TY_AMT==null&&Math.abs(TY_SIZE-+v)<1e-9?' on':''}"
       data-ty="size" data-v="${v}">${t}</button>`).join('');

  const row = a => {
    const px=TY.px[a.k], prev=(TY.pxPrev&&TY.pxPrev[a.k])||px;
    const ch=(px/prev-1)*100;
    const v=tyVal(a.k), short=v<0;
    const mkt=tyMktOf(a.k);
    const mine=TY.pos.filter(p=>p.k===a.k);
    const units=mine.reduce((s,p)=>s+tyUnitCount(p),0);
    const opts=tyMarkets(a.k).map(m=>{
      const i=tyRegIdx(m.reg);
      // 同一種資產在不同市場的交易成本與孳息不一樣(見城市特色)
      const fe=tySpecMul(m.id,'asset',a.k,'fee'), yl=tySpecMul(m.id,'asset',a.k,'yld');
      const tag=[Math.abs(fe-1)>.02?`成本 ${fe>1?'+':''}${((fe-1)*100).toFixed(0)}%`:'',
                 (a.yld&&Math.abs(yl-1)>.02)?`孳息 ${yl>1?'+':''}${((yl-1)*100).toFixed(0)}%`:'']
                .filter(Boolean).join(' · ');
      return `<option value="${m.id}"${m.id===mkt?' selected':''}>${m.nm} 景氣 ${
        ((i-1)*100>=0?'+':'')}${((i-1)*100).toFixed(0)}%${tag?' · '+tag:''}</option>`;
    }).join('');
    const where=mine.sort((x,y)=>Math.abs(tyPosVal(y))-Math.abs(tyPosVal(x)))
      .map(p=>`${tySite(p.site).nm} ${tyUnitTxt(tyUnitCount(p),a.u)}`).join(' · ');
    const open=TY_EXP===a.k;
    return `<div class="ty-row${open?' open':''}">
      <button type="button" class="r-nm" data-ty="exp" data-k="${a.k}"
        aria-expanded="${open?'true':'false'}">
        <span class="r-ic">${a.ic}</span>
        <span class="r-t"><b>${a.nm}</b><span>${a.tag}</span>
          <em>${a.dsc}</em></span></button>
      <div class="r-px"><b>${(px*tyRegIdx(tySite(mkt).reg)).toFixed(1)}</b>
        <span class="${ch>=0?'up':'down'}">${tyPct1(ch)}</span>
        ${tyPxSpark(a.k,88,26)}
        <em>抵押 ${(a.ltv*100).toFixed(0)}% · 成本 ${(a.fee*100).toFixed(1)}%${
          a.yld?` · 孳息 ${(a.yld*400).toFixed(1)}%/年`:''}</em></div>
      <div class="r-pos ${short?'sh':''}">${v?tyM(Math.abs(v)):'—'}
        <em>${short ? '空單 '+tyUnitTxt(Math.abs(units),a.u)
                    : (v ? tyUnitTxt(units,a.u)+(where?' · '+where:'') : '未持有')}</em></div>
      <div class="r-act">
        <select class="ty-mkt" data-mkt="${a.k}" aria-label="${a.nm}的市場">${opts}</select>
        <button type="button" class="ty-b" data-ty="buy" data-k="${a.k}">買進</button>
        <button type="button" class="ty-b" data-ty="sell" data-k="${a.k}">賣出</button>
        ${a.short?`<button type="button" class="ty-b alt" data-ty="${short?'cover':'short'}" data-k="${a.k}">${short?'回補':'放空'}</button>`:''}
      </div>
      <div class="r-pre">${tyBuyPreview(a.k, mkt)}</div>
      ${open?`<div class="r-detail">${tyBigChart(a.k)}</div>`:''}
    </div>`;
  };

  const groups=TY_GROUPS.map(g=>{
    const rows=TY_ASSETS.filter(a=>a.g===g.k).map(row).join('');
    return `<div class="p-sec">${g.nm}<span>${g.sub}</span></div><div class="ty-rows">${rows}</div>`;
  }).join('');

  return `<div class="ty-sizebar"><span>下單金額</span>${chips}
      <span class="ty-amt">
        <input type="number" inputmode="decimal" min="0" step="0.5" id="tyAmt"
          value="${TY_AMT!=null?(TY_AMT/1e8).toFixed(1):''}" placeholder="自訂" aria-label="下單金額(億)">
        <i>億</i></span>
      <em>選比例或直接打金額。每一列底下那一行會直接告訴你這筆錢買得到什麼、
        一年生得出多少孳息 —— 按下去之前就看得到。
        下拉是「買在哪個市場」,後面的百分比是當地景氣指數。</em></div>
    ${groups}`;
}

/* ---------- 事業 ---------- */
/* 一家公司的卡片。
   使用者說「我點上市的時候,如果名氣不夠可以顯示出來,在我這個頁面要看得到」——

    main.push(row('ipo','🔔 送上市 IPO','',id,
      `賣兩成股權,約募得 ${tyM(val*.2*.93)}`,
      `<div class="c-note">里程碑:上市之後你的身家由「別人願意付多少倍」決定 ——
        名氣 +12、信用 +6,但估值從此跟著市場情緒一起跳。</div>`));
  }
  if(!d.shell){
    const amt=tyAmtOf('expand', b, 'expand:'+b.id);
    more.push(row('expand','自訂金額加碼','alt',id,
      amt>0?`+${tyM(amt)} → 資本 ${tyM(b.cap+amt)}`:'',
      tyAmtBox('expand', b, 'expand:'+b.id)));
  }
  if(!d.shell && !b.pub){
    more.push(row('reverse','借殼上市','alt',id,
      `賣 12% 股權,約入帳 ${tyM(val*.12*.9)}`,
      `<div class="c-note">併進一家空殼公司直接取得上市地位:沒有承銷商、
        沒有審查、不用等 —— 代價是<b>關注度 +18</b>,而且會吃掉那家空殼。</div>`));
  }
  more.push(row('sellbiz', d.shell?'註銷這家空殼':`賣掉(約 ${tyM(val*b.own*.94)})`,'alt',id,
    d.shell?'':`交易成本 6% · 每季 ${tySgn(b.cf*b.own)} 的現金流從此不是你的`));
  if(!d.shell && TY.scn==='raider')
    more.push(row('strip','拆賣資產','alt',id, `回收 ${tyM(b.cap*.8*b.own)}(土地與設備)`));
  if(!d.shell)
    more.push(row('ch11','聲請破產保護','warn',id,
      `甩掉 ${tyM(Math.min(TY.debt, val*b.own*1.2))} 負債 · 信用 −24`));
  return `<div class="c-acts">${main.join('')}</div>
    ${more.length?`<details class="c-more"><summary>更多動作(${more.length})</summary>
      <div class="c-acts">${more.join('')}</div></details>`:''}`;
}

function tyBizTab(){
  const mine=TY.biz.length ? TY.biz.map(b=>{
    const d=TY_BIZ[b.k], val=tyBizVal(b);
    const shell=d.shell;
    const lv=tyBizLv(b);
    return `<div class="ty-card">
      <div class="c-hd">${shell?'':`<span class="c-lv">Lv${lv}</span>`}<b>${d.ic||''} ${d.nm}</b>
        ${b.pub?'<span class="tag pub">上市</span>':''}
        ${shell?'<span class="tag shell">空殼</span>':''}
        ${TY.holdco===b.site&&shell?'<span class="tag shell">控股層</span>':''}
        <button type="button" class="tag site" data-ty="site" data-k="${b.site||TY.home}"
          title="在地圖上看這裡">📍 ${escH(tySite(b.site||TY.home).nm)}</button>
        <span class="tag">${tyWhen(b.born)} 成立</span></div>
      <div class="c-fig">
        <span>投入資本 <b>${tyM(b.cap)}</b></span>
        <span>估值 <b>${shell?'—':tyM(val)}</b></span>
        <span>持股 <b>${(b.own*100).toFixed(0)}%</b></span>
        <span>上季現金流 <b class="${b.cf>=0?'up':'down'}">${shell?'—':tySgn(b.cf)}</b></span></div>
      ${shell?'':`<div class="c-lvbar" title="等級 ${lv} / ${TY_LV_MAX}">${
        Array.from({length:TY_LV_MAX},(_,i)=>`<i class="${i<lv?'on':''}${i===4?' ms':''}"></i>`).join('')}</div>`}
      ${tyBizActs(b)}
      <div class="c-dsc">${d.dsc}</div></div>`;
  }).join('') : '<div class="empty">你還沒有任何事業。買資產讓錢變多,開公司讓錢生錢。</div>';

  const list=Object.entries(TY_BIZ).filter(([k])=>k!=='shell').map(([k,d])=>{
    const cost=d.cost*(TY.scn==='raider'?.75:1);
    const site=tyBizSiteOf(k);
    const opts=tyBizSites(k).map(x=>{
      const i=tyRegIdx(x.reg), lock=tyNeedPartner(x.id);
      /* 下拉裡就要看得出「開在這裡划不划算」—— 不然使用者得一個一個點過去比。
         cf 是城市特色對現金流的加成,cost 是對開辦成本的。 */
      const cf=tySpecMul(x.id,'biz',k,'cf'), co=tySpecMul(x.id,'biz',k,'cost');
      const tag=[Math.abs(cf-1)>.02?`現金流 ${cf>1?'+':''}${((cf-1)*100).toFixed(0)}%`:'',
                 Math.abs(co-1)>.02?`成本 ${co>1?'+':''}${((co-1)*100).toFixed(0)}%`:'']
                .filter(Boolean).join(' · ');
      return `<option value="${x.id}"${x.id===site?' selected':''}>${x.nm} 景氣 ${
        ((i-1)*100>=0?'+':'')}${((i-1)*100).toFixed(0)}%${tag?' · '+tag:''}${lock?' 🔒':''}</option>`;
    }).join('');
    /* 開一家要多少現金流、多少估值 —— 按下去之前就看得到,
       跟資產那一頁的成交預覽同一套規矩。 */
    const idx=tyRegIdx(tySite(site).reg);
    const cf=cost*d.cf*idx, val=Math.max(cost*.4, Math.max(0,cf)*4*d.mult*.5);
    return `<div class="ty-open">
      <div class="o-t"><b>${d.nm}</b><span>${tyM(cost)}
        · 稅率 ${(tySite(site).tax*100).toFixed(1)}% · 估值倍數 ${d.mult}×</span></div>
      <div class="o-d">${d.dsc}</div>
      <div class="o-row">
        <select class="ty-mkt" data-bizsite="${k}" aria-label="${d.nm}開在哪">${opts}</select>
        ${tyActBtn('found',{k,site},'成立',` data-k="${k}" data-site="${site}"`)}
      </div>
      ${tyNeedHTML(tyNeeds('found',{k,site}))}
      <div class="o-pre">開在${escH(tySite(site).nm)} · 投入 <b>${tyM(cost)}</b> ·
        第一季現金流大約 <b class="${cf>=0?'up':'down'}">${tySgn(cf)}</b>${
          d.fameCf?'(這一家的現金流看名氣不看資本)':''} · 估值起點約 ${tyM(val)}</div>
      </div>`;
  }).join('');

  return `<div class="ty-cards">${mine}</div>
    <div class="hm-sec">可以成立的事業<span class="stag">估值倍數越高的,現金流通常越差 —— 那是市場在買故事</span></div>
    <div class="expo-note">下拉選的是「開在哪裡」。後面的百分比是當地景氣指數(直接乘進現金流與估值),
      前面的稅率是那個司法管轄區的法定公司稅率 —— 那是真實數字,不是模型算出來的。
      每一顆「成立」底下那一行寫著它要什麼:<b>打勾的是你已經有的,打叉的是還差的</b>。</div>
    <div class="ty-opens">${list}</div>`;
}

/* ---------- 手法 ---------- */
/* 每一個手法 = 標題 + 說明 + 條件 + (要花錢的話)金額選擇器 + 按鈕。
   使用者要的兩件事都在這裡:條件寫在畫面上、金額自己選。 */
function tyPlayCard(act, nm, sub, dsc, opt){
  opt = opt || {};
  const need = tyNeeds(act, opt.arg);
  const done = opt.done;
  return `<div class="ty-open${done?' is-done':''}">
      <div class="o-t"><b>${nm}</b><span>${sub}</span></div>
      <div class="o-d">${dsc}</div>
      ${done ? '' : (TY_MONEY[act] ? tyAmtBox(act, opt.arg, opt.key) : '')}
      ${done ? '' : tyNeedHTML(need)}
      ${done
        ? `<button type="button" class="ty-b" disabled>${done}</button>`
        : tyActBtn(act, opt.arg, opt.label||'執行', opt.attrs)}
    </div>`;
}

function tyDataTab(){

  const pos=TY.pos.filter(p=>Math.abs(p.q)>1e-9).map(p=>{
    const v=tyPosVal(p), pl=v-p.cb;
    return row([escH(tyAsset(p.k).nm)+(p.q<0?' <em>空單</em>':''), escH(tySite(p.site).nm), N(tyM(v)), N(tyM(p.cb)),

  }).join('');
  const biz=TY.biz.map(b=>{

    return row([`${d.ic||''} ${escH(d.nm)}${b.pub?' <em>上市</em>':''}`, escH(tySite(b.site||TY.home).nm),

  }).join('');
  const units=tyUnits().map(u=>row([`${TY_UNITS[u.k].ic} ${TY_UNITS[u.k].nm}`,
    u.to?`→ ${escH(tySite(u.to).nm)}(下季到位)`:escH(tySite(u.site).nm), N(tyM(u.up)+'/季')])).join('');
  const strikes=Object.entries(TY_STRIKES).map(([k,d])=>row([`${d.ic} ${d.nm}`,
    tyStrikeReady(k)?'<span class="up">可以用</span>':`冷卻到 ${tyWhen(TY.cd[k])}`, N(tyM(tyStrikeCost(k)))])).join('');
  const rv=tyRivalsA().slice().sort((x,y)=>y.nw-x.nw).map(r=>row([`${r.ic||''} ${escH(r.nm)}`, escH(tySite(r.home).nm),

    ` data-ty="rival" data-k="${r.id}"`)).join('');
  const T=(head,body,empty)=>body?`<div class="ty-scroll"><table class="ty-data"><thead><tr>${

  <div class="ty-stack">${parts.map(x=>`<i style="width:${(x[1]/gross*100).toFixed(1)}%;background:${x[2]}"></i>`).join('')}</div>

  <div class="ty-facts">
    <div><em>信用</em><b>${TY.credit.toFixed(0)}</b></div><div><em>名氣</em><b>${TY.fame.toFixed(0)}</b></div>
    <div><em>人脈</em><b>${TY.infl.toFixed(0)}</b></div><div><em>關注</em><b class="${TY.heat>=60?'down':''}">${TY.heat.toFixed(0)}</b></div>
    <div><em>居住地 / 現金在</em><b>${escH(tySite(TY.home).nm)} / ${escH(tySite(TY.cashSite).nm)}</b></div>
    <div><em>集團稅率 / 控股層</em><b>${(tyTaxRate()*100).toFixed(1)}% / ${TY.holdco?escH(tySite(TY.holdco).nm):'—'}</b></div>
    <div><em>累計繳稅</em><b>${tyM(TY.taxPaid||0)}</b></div><div><em>累計利息</em><b>${tyM(TY.interest||0)}</b></div>
  </div>

  <div class="p-sec">事業<span>${TY.biz.length} 家 · ${tyM(bz)}</span></div>
  ${T([['公司'],['在哪'],['等級'],['你的持股價值',1],['每季',1]], biz, '還沒有任何事業。')}
  <div class="p-sec">部隊與武器<span>${tyUnits().length} / ${TY_UNIT_MAX} 支 · 維持費 ${tyM(tyUnitUpkeep())}/季</span></div>

/* =========================================================================
   金庫 —— 你的錢是怎麼疊起來的
   -------------------------------------------------------------------------
   借了多少、還能借多少、離被追繳還有多遠 —— 一個儀表看完。
   底下才是可以動的東西:借 / 還、質押、控股層與空殼、錢放在哪裡、信託。
   ========================================================================= */
function tyGauge(lab, used, max, say){
  const r = max>0 ? used/max : (used>0?1.2:0);
  const pct = tyClamp(r, 0, 1.2)/1.2*100;
  /* ⚠ 不能用 .up / .down:站上是「紅漲綠跌」,.up 是紅色 —— 「安全」會被塗成紅的 */
  const zone = r<.5 ? ['安全','#30d158'] : r<.8 ? ['小心','#ffb13a'] : r<1 ? ['危險','#ff453a'] : ['會被追繳','#ff453a'];
  return `<div class="ty-gauge">
    <div class="g-h"><span>${lab}</span><span><b style="color:${zone[1]}">${(r*100).toFixed(0)}%</b> ${zone[0]}</span></div>
    <div class="g-bar"><u style="left:${pct.toFixed(1)}%"></u></div>
    <div class="g-lab"><span>0</span><span>50% 小心</span><span>80% 危險</span><span>超過 100% 強制處分</span></div>
    ${say?`<div class="g-say">${say}</div>`:''}
  </div>`;
}
function tyVaultTab(){
  const shells=TY.biz.filter(b=>TY_BIZ[b.k].shell).length;
  const sbl=Math.min(TY.sbl||0, TY.debt);
  const intr=(TY.debt-sbl)*tyRate()/100/4 + sbl*tySblRate()/100/4;
  return `
  ${tyGauge('抵押借款的槓桿', TY.debt, tyBorrowMax(),
     `負債 <b>${tyM(TY.debt)}</b> / 抵押上限 ${tyM(tyBorrowMax())} · 每季利息 <b class="down">${tyM(intr)}</b>(年利率 ${tyRate().toFixed(2)}%)。
      資產一跌,上限跟著縮 —— 同樣的負債,比例會自己往右跑。`)}
  ${(TY.sbl||0)>0 || tySecVal()>0 ? tyGauge('證券質押的維持率', TY.sbl||0, tySblMax(),
     `質押 ${tyM(TY.sbl||0)} / 額度 ${tyM(tySblMax())}。超過 115% 券商會直接賣你的證券 —— 一賣就實現獲利、當場課稅。`) : ''}
  <div class="ty-facts">

/* =========================================================================
   富豪榜 —— 兩種榜,一個問題
   -------------------------------------------------------------------------
   虛構對手那一份是遊戲的一部分(他們會成長、會倒、會打進你的地盤)。
   但一個虛構的第一名回答不了那個真正有意思的問題:
   **我這一局跑出來的身家,放到真實世界排第幾?**

   所以多一份真的:走後端 /api/rich 去拿 Forbes 的即時富豪榜,
   把你的模擬淨值換成美元插進去排。

   ⚠ 誠實的部分,畫面上也照樣寫:
     · 那是一個**非官方**端點,Forbes 沒有公開 API 文件,它隨時可能改或關掉
     · 拿不到就直說拿不到,退回虛構對手 —— 絕不拿一份寫死的假榜單充數
     · 你的那個數字是**模擬出來的**,榜上其他人的是真的。兩者放在同一張表
       上比較是為了有個尺度感,不是說你真的有那麼多錢
   ========================================================================= */
let TY_RANK='sim';                 // sim = 模擬對手 | real = 真實富豪榜
const RICH={ at:0, rows:[], busy:false, err:'' };

async function loadRich(){
  if(RICH.busy || RICH.rows.length) return;
  RICH.busy=true; RICH.err='';
  if(PAGE==='tycoon' && TY_MODAL==='rank') renderPage();
  try{
    await probeProxy();
    const u=apiPath('rich','n=200');
    if(!u) throw new Error(LOCAL_FILE
      ? '你正在用 file:// 開本機檔案,沒有後端'
      : '找不到後端代打(/api/rich 沒有回應)');
    const d=await getJSON(u);
    if(d && d.error) throw new Error(d.error);
    if(!d || !Array.isArray(d.rows) || !d.rows.length) throw new Error('後端回了空的榜單');
    RICH.rows=d.rows; RICH.at=d.at||Date.now();
  }catch(e){ RICH.err=String((e&&e.message)||e); }
  RICH.busy=false;
  if(PAGE==='tycoon' && TY_MODAL==='rank') renderPage();
}

   一張卡 = 一個人:他多有錢、勢力在哪、跟你什麼關係、可以跟他談什麼。

/* 可以派去的地方:你有東西的城市 + 對手的大本營 + 其餘城市。用 optgroup 分開,
   不然 44 個城市排成一列根本找不到。 */
function tyDestOpts(u, sel){
  const mine=new Set(tyMySites().map(s=>s.id));
  const rv=new Set(tyRivalsA().map(r=>r.home));
  const opt=s=>`<option value="${s.id}"${s.id===sel?' selected':''}${s.id===u.site&&!u.to?' disabled':''}>${
    escH(s.nm)}(${TY_REGIONS[s.reg].nm}${tyTravel(u.site,s.id)>1?' · 2 季':' · 1 季'})</option>`;
  const g=(lab,list)=>list.length?`<optgroup label="${lab}">${list.map(opt).join('')}</optgroup>`:'';
  return g('你的據點', TY_SITES.filter(s=>mine.has(s.id)))
       + g('對手大本營', TY_SITES.filter(s=>rv.has(s.id)&&!mine.has(s.id)))
       + g('其他城市', TY_SITES.filter(s=>!mine.has(s.id)&&!rv.has(s.id)));
}
function tyUnitWhere(u){
  if(u.to) return `<span class="u-mv">→ ${escH(tySite(u.to).nm)} · ${Math.max(1,u.eta-TY.t)} 季後到</span>`;
  return `<span class="u-at">駐 ${escH(tySite(u.site).nm)} · ${TY_REGIONS[tySite(u.site).reg].nm}</span>`;
}

  return `${T.length?`<div class="p-sec">來襲<span>${T.length} 支正在路上</span></div>${threats}`:''}
    <div class="p-sec">你的部隊<span>${U.length} / ${TY_UNIT_MAX} · 維持費 ${tyM(tyUnitUpkeep())}/季</span></div>

/* 派遣 / 打擊之後,把剛剛發生的事交給畫面層演出來(飛機、船、飛彈、戰機) */
function tyPlayLast(){
  if(!window.W3D || !W3D.ok) return;
  /* 手機上面板是整張蓋住地圖的(而且面板打開時地球會暫停繪圖)——
     不先收起來,飛機、飛彈全部在面板底下播完,等於沒有動畫。 */
  if((TY_LAST_MOVE || TY_LAST_STRIKE) && TY_MODAL && !tySideModal()){ TY_MODAL=null; renderPage(); }
  if(TY_LAST_MOVE){ W3D.animMove(TY_LAST_MOVE); TY_LAST_MOVE=null; }
  if(TY_LAST_STRIKE){ W3D.animStrike(TY_LAST_STRIKE); TY_LAST_STRIKE=null; }
}
/* 拉線:從部隊(或你的大本營)拉一條線,點 / 放開在一座城市上就是目標。
   手機沒有「拖曳」可言,一樣是先按「地圖上選」再點城市。 */
function tyAimUnits(units){
  if(!window.W3D || !W3D.ok || !units.length){ TY_MODAL='troop'; renderPage(); return; }
  if(!tySideModal()){ TY_MODAL=null; renderPage(); }
  const from=tySite(units[0].to || units[0].site);
  W3D.aim({ from, label:`${units.map(u=>TY_UNITS[u.k].ic).join('')} 派到哪裡?`,
    valid: id=>units.some(u=>u.site!==id || u.to), hint: id=>{
      const r=tyRivalsA().find(x=>x.home===id);
      return r ? `${r.ic||''} ${r.nm}的大本營 · 併購小組駐紮後敵意收購 +10%/支` : '';
    },
    pick: id=>{
      const msgs=[];
      for(const u of units){ TY_LAST_MOVE=null; const m=tyDeploy(u.id, id); msgs.push(m); tyPlayLast(); }
      TY_MSG=msgs.join('<br>'); renderPage();
    } });
}
function tyAimStrike(k){
  if(!window.W3D || !W3D.ok){ return; }
  if(!tySideModal()){ TY_MODAL=null; renderPage(); }
  const d=TY_STRIKES[k];
  W3D.aim({ from:tySite(TY.home), strike:k, label:`${d.ic} ${d.nm}的目標?`,
    valid: id=>!!tyStrikeTarget(k, id),
    hint: id=>{ const r=tyStrikeTarget(k, id); return r ? `打擊 ${r.ic||''} ${r.nm}` : (k==='missile'?'這裡沒有對手的大本營':'這個地區沒有對手的勢力'); },
    pick: id=>{ TY_LAST_STRIKE=null; TY_MSG=tyStrike(k, id); renderPage(); tyPlayLast(); } });
}

/* 勢力條:他在哪幾個地區有多少,跟你重疊的標出來 —— 那就是「會打架的地方」。 */
function tyTurfHTML(r){
  const mine=new Set(tyMyRegions());
  const rows=Object.entries(r.turf||{}).filter(([,v])=>v>2)
    .sort((a,b)=>b[1]-a[1]).slice(0,5);
  if(!rows.length) return '<div class="rv-turf"><em>他目前沒有明顯的地盤。</em></div>';
  return `<div class="rv-turf">${rows.map(([g,v])=>`
    <div class="tf${mine.has(g)?' clash':''}">
      <span class="tf-n">${escH(TY_REGIONS[g].nm)}${mine.has(g)?' ⚔':''}</span>
      <span class="tf-b"><u style="width:${Math.min(100,v).toFixed(0)}%"></u>

      <span class="tf-v">${v.toFixed(0)}</span></div>`).join('')}

      競爭度會吃掉雙方的現金流</div></div>`;
}
