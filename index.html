/* =========================================================================
   帝國地球 —— 把整局攤在一顆星球上
   -------------------------------------------------------------------------
   為什麼要第二顆地球,而不是把資料塞進原本那顆:
     原本那顆講的是「你真實的錢暴露在哪些國家」,它的圖層(新聞熱度、衝突、
     持股光柱、關聯弧線)全部綁在真實資料上。這一顆講的是一局模擬 ——
     兩者共用一個實例的話,每次切換都要把六種圖層全部換掉再換回來,
     而且任何一個沒清乾淨就會變成「真實資產裡多了一家開曼空殼公司」。
     分開兩顆,誰也污染不了誰。

   兩個實作上的坑,都是原本那顆已經踩過的:

   1. **WebGL 容器不能被 innerHTML 洗掉。** renderPage() 每次都會清空 #page,
      所以地球不能直接畫在分頁裡 —— 它會連同 canvas 一起被銷毀,再建一次
      就是新的 WebGL context(瀏覽器同時只允許十幾個,切個幾次分頁就爆)。
      作法跟站上 #dataPnl 一樣:把它停在 #page 外面,要用的時候 appendChild
      進去,重畫之前先搬回停車位。

   2. **不在這一頁的時候要停掉。** 跟 globeAwake() 同樣的理由:一顆看不到的
      地球沒有理由繼續用 60fps 燒電。
   ========================================================================= */
let TYG=null;                 // 第二顆地球(懶載入:第一次打開地圖才建)
let TYG_RO=null;              // ResizeObserver
let TY_LAYER='mine';          // 國家著色:mine 我的曝險 / econ 地區景氣
let TY_BLD=null;              // 地圖上目前點開的那一棟建築

function tyParkGlobe(){
  const h=document.getElementById('tyGlobeHost'),
        park=document.getElementById('tyGlobePark');
  if(h && park && h.parentNode!==park){ park.appendChild(h); tyGlobeAwake(false); }
}
function tyGlobeAwake(on){
  if(!TYG) return;
  try{
    if(typeof TYG.enablePointerInteraction==='function') TYG.enablePointerInteraction(on);
    if(typeof TYG.pauseAnimation==='function') on ? TYG.resumeAnimation() : TYG.pauseAnimation();
  }catch(e){}
}

/* 一個地點上要畫哪些圖示。
   使用者說「柱子有點醜,可以像大富翁一樣有堆硬的資產或建設的圖案」——
   所以光柱從「一根高高的棒子」改成「地上一塊有顏色的地磚 + 上面站著的東西」。
   房地產照大富翁的規矩:每五棟房子換成一間旅館。 */
/* 一棟建築 = { c 類型顏色, f 樓層(決定高度), tag 名字, st 狀態 }。
   高度用 log 壓縮:線性的話最大的那一棟會有一百層,其他全部貼在地上 ——
   跟光柱當初的問題一模一樣。
   狀態(st)是使用者要求的「一眼分辨資產或事業的狀態」:
     earn 這一季有現金流進來 / burn 還在燒錢 / pub 已經上市 / shell 空殼 / hold 控股層 */
/* 城市等級 1–10 —— 參考的那款遊戲每座城旁邊都有一個「(8)」。
   這裡的等級 = 你在那裡放了多少身家,log 壓縮:1 億是 1 級,每多約 2.4 倍升一級,
   3000 億封頂。純顯示用,不參與任何計算。 */
const tySiteLv = v => Math.max(1, Math.min(10, 1+Math.round((Math.log10(Math.max(1e8,v))-8)/3.5*9)));
const tyFloors = v => Math.max(1, Math.min(7, 1+Math.round(Math.log10(Math.max(1,v/3e8))*2)));
function tySiteBuildings(id){
  const t=tySiteStuff(id), out=[];
  for(const p of t.pos){
    if(p.q<=0) continue;
    const a=tyAsset(p.k), v=tyPosVal(p);
    /* ref 是「這一棟代表什麼」—— 點下去要開得出它自己的資訊卡,
       所以每一棟都要記得自己是哪一筆部位、哪一家公司。 */
    const ref=`pos:${p.k}`;
    if(p.k==='estate'){
      // 大富翁的規矩:五棟房子換一間旅館
      const n=Math.max(1,Math.round(tyUnitCount(p)));
      const hotel=Math.floor(n/5), house=n%5;
      for(let i=0;i<Math.min(2,hotel);i++) out.push({ c:'estate', f:5, ref, tag:'旅館(5 棟)' });
      for(let i=0;i<Math.min(3,house);i++) out.push({ c:'estate', f:1, ref, tag:'房子' });
      if(!hotel && !house) out.push({ c:'estate', f:1, ref, tag:'房子' });
    }else{
      const gainy = tyPosVal(p) > p.cb;
      out.push({ c: a.k==='gold'?'gold':a.g==='real'?'real':'paper',
                 f: tyFloors(v), ref, tag:`${a.nm} ${tyM(v)}`, st: gainy?'earn':'' });
    }
  }
  for(const b of t.biz){
    const d=TY_BIZ[b.k], ref=`biz:${b.id}`;
    if(d.shell){ out.push({ c:'shell', f:1, ref, tag:'空殼公司', st:'shell' }); continue; }
    out.push({ c:'biz', f:tyFloors(tyBizVal(b)*b.own), ref, tag:`${d.nm}${b.pub?'(上市)':''}`,
               st: b.pub?'pub':(b.cf<0?'burn':(b.cf>0?'earn':'')) });
  }
  if(t.cash>0) out.push({ c:'cash', f:1, ref:'cash', tag:`現金 ${tyM(t.cash)}` });
  if(t.holdco) out.push({ c:'hold', f:2, ref:'hold', tag:'控股層', st:'hold' });
  return out.slice(0,5);
}
/* 一棟 CSS 等角方塊:三個面用 clip-path 切出來。
   為什麼不用真的 3D:globe.gl 的 UMD 版沒有把 THREE 匯出來,要畫真的網格
   就得再載一份 three.js —— 多一個 CDN 依賴、而且兩份 three 在同一頁上
   很容易出事。CSS 的方塊永遠面向鏡頭,在小螢幕上反而更好認。 */
const tyBldHTML = b => `<span class="bld c-${b.c} f${b.f}${b.st?' st-'+b.st:''}"`
  + ` data-r="${escH(b.ref||'')}" title="${escH(b.tag)}"><i></i><i></i><i></i>`
  + (b.st==='earn'?'<em>▲</em>':b.st==='burn'?'<em>▼</em>':b.st==='pub'?'<em>◈</em>':'')
  + '</span>';

/* 一個地點上「最主要」是什麼 —— 決定地磚的顏色 */
const TY_CAT = {
  biz   : { c:'#bf5af2', ic:'🏢', nm:'事業' },
  estate: { c:'#ff9f0a', ic:'🏠', nm:'房地產' },
  paper : { c:'#2997ff', ic:'📈', nm:'金融資產' },
  gold  : { c:'#e0b23c', ic:'🪙', nm:'黃金' },
  cash  : { c:'#30d158', ic:'💵', nm:'現金' },
  shell : { c:'#ff453a', ic:'📄', nm:'空殼 / 控股' },
};
function tySiteCat(id){
  const t=tySiteStuff(id);
  const by={ biz:0, estate:0, paper:0, gold:0, shell:0, cash:Math.max(0,t.cash) };
  for(const b of t.biz){
    // 空殼公司沒有估值,但它是這個地點最重要的事 —— 用一個「贏得過 0」的值標記
    if(TY_BIZ[b.k].shell) by.shell = Math.max(by.shell, 1);
    else by.biz += tyBizVal(b)*b.own;
  }
  for(const p of t.pos){
    const v=Math.abs(tyPosVal(p));
    by[p.k==='estate'?'estate':p.k==='gold'?'gold':'paper'] += v;
  }
  /* 控股層一定要贏過其他所有東西:一個地點如果是你整個集團的稅務終點,
     那就是它在這張地圖上的身分,不管你在那裡還放了多少現金。 */
  if(t.holdco) return 'shell';
  let best='paper', bv=-1;
  for(const k in by) if(by[k]>bv){ bv=by[k]; best=k; }
  return best;
}

/* 兩個標記在畫面上會不會撞在一起。經緯度直接當平面座標就夠了 ——
   會撞的本來就是很近的兩點,近距離下這個近似的誤差比名牌本身還小。 */
function tyNear(a,b,r){
  const dLat=a.lat-b.lat,
        dLng=(a.lng-b.lng)*Math.cos((a.lat+b.lat)/2*Math.PI/180);
  return dLat*dLat + dLng*dLng < r*r;
}
/* 依序給每個標記一條「道」:第一個能站的空道。四道以上就不再往下疊,
   再讓也讀不到,那個高度本來就該把它們收起來(見 data-z)。 */
function tyLanes(list){
  const R=5.5, done=[];
  for(const d of list){
    let lane=0;
    while(lane<4 && done.some(o=>o._lane===lane && tyNear(o,d,R))) lane++;
    d._lane = Math.min(lane,3);
    done.push(d);
  }
  return list;
}

/* 光柱高度:用平方根壓縮。線性的話最大的那一根會有一百倍高,
   其他全部貼在地表上看不見 —— 這個網站的持股光柱也是同一個理由。 */
let TYG_SIG='';
function tyGlobeData(){
  if(!TYG) return;
  const mine=tyMySites(), mineSet=new Set(mine.map(s=>s.id));
  const mx=Math.max(1, ...mine.map(s=>tySiteStuff(s.id).val));
  /* 地磚:又扁又寬的圓柱,不是柱子。大小靠面積與顏色分辨,不靠高度。 */
  const pts=mine.map(s=>{
    const t=tySiteStuff(s.id), cat=tySiteCat(s.id), f=Math.sqrt(t.val/mx);
    /* 地磚是一塊**扁**的圓柱,不是柱子。半徑是「度」,所以推到貼著地表的時候
       它會跟著放大到蓋掉整座城市 —— 使用者截圖裡那一坨紫色就是它。
       壓小之後遠看還認得出顏色,近看不會擋住站在上面的建築。 */
    return { ...s, _v:t.val, _cat:cat, _blds:tySiteBuildings(s.id),
             _alt: 0.002 + f*0.006,
             _rad: 0.22 + f*0.38,
             _col: TY_CAT[cat].c };
  });
  /* 還沒進場的地方也要看得到 —— 不然你不知道還能去哪裡。
     它們只有一個很淡的點與名字,點下去就是那個據點的面板。 */
  const rest=TY_SITES.filter(s=>!mineSet.has(s.id))
    .map(s=>({ ...s, _idle:true, _v:0, _alt:0.0015, _rad:0.12,
               _col:'rgba(140,140,150,.35)' }));
  // 對手也在地圖上 —— 他們的大本營是你要搶的地方
  /* 對手的大本營。點的大小跟著他的身家走 —— 榜首在地圖上就是最大的那一點。
     顏色是他自己的顏色,跟勢力圖層與對手卡上的一致。 */
  const rvMax=Math.max(1e8, ...tyRivalsA().map(r=>r.nw));
  const rv=tyRivalsA().map(r=>{ const s=tySite(r.home);
    return { ...s, _rival:r, _v:r.nw,
             _alt:0.002, _rad:0.16+Math.sqrt(r.nw/rvMax)*0.22,
             _col:`rgba(${TY_RVCOL[r.id]||'160,160,170'},.85)` }; });

  /* 3D 層啟用時,我的據點與對手大本營是真的 3D 小城(world3d.js),
     原本的扁圓柱地磚就不畫了 —— 兩個疊在一起會互相穿透。
     建築要站在「那個國家被抬起來的高度」上,不然會埋進勢力圖層裡。 */
  const w3=!!(window.W3D && W3D.ok);
  /* 地圖上的東西沒變就不要重建。每點一顆按鈕都會 renderPage → 這裡,
     原本每次都把所有 3D 建築、名牌、部隊整批拆掉重蓋 —— 使用者說的「操作很卡」
     有一大半是這個。簽章只放「畫面上看得出差別」的東西。 */
  const troopsNow=tyTroopMarks();
  const sig=JSON.stringify([TY.t, TY_LAYER, TY_SEL, TY.holdco, (window.W3D&&W3D.ok)?1:0,
    pts.map(d=>[d.id,d._cat,Math.round(d._v/1e6),d._blds.map(b=>b.c+b.f+(b.st||'')).join()]),
    rv.map(d=>[d._rival.id,Math.round(d._v/1e7),Math.sign(Math.trunc((d._rival.rel||0)/20))]),
    troopsNow.map(t=>t._k+':'+(t._mv||'')+':'+(t._units?t._units.map(u=>u.k).join():'')),
    Object.keys(TY.partners||{}), (window.W3D&&W3D.extraArcs||[]).length]);
  if(w3 && sig===TYG_SIG){ W3D.rings(); W3D.repaint(); return; }
  TYG_SIG=sig;
  if(w3){
    // 國界與勢力已經畫進貼圖(地表是平的),建築直接站在地面上
    for(const d of [...pts, ...rv]) d._base = W3D.textured ? .0008 : tyIsoAlt(d.iso) + .0006;
    W3D.sites(pts, rv, troopsNow);
    W3D.repaint();
  }
  TYG.pointsData(w3 ? rest : [...rest, ...pts, ...rv]);

  /* 控股鏈:每一家公司的利潤最後流去哪裡。這條弧線是整張地圖上最有意思的
     一條 —— 它把「一家在杜拜的建設公司,獲利掛在開曼」畫成一條看得見的線。 */
  const arcs=[];
  if(TY.holdco){
    const to=tySite(TY.holdco);
    for(const b of TY.biz){
      const from=tySite(b.site||TY.home);
      if(from.id===to.id) continue;
      arcs.push({ startLat:from.lat, startLng:from.lng, endLat:to.lat, endLng:to.lng,
                  _c:['rgba(255,69,58,.15)','rgba(255,69,58,.85)'] });
    }
  }
  for(const [reg,par] of Object.entries(TY.partners||{})){
    if(!par.site) continue;
    const from=tySite(par.site), to=tySite(TY.home);
    arcs.push({ startLat:from.lat, startLng:from.lng, endLat:to.lat, endLng:to.lng,
                _c:['rgba(48,209,88,.12)','rgba(48,209,88,.7)'] });
  }
  /* 部隊與來襲的敵軍。駐紮的照城市合併成一枚徽章;在路上的站在
     「走了幾成」的位置,拉一條虛線弧到目的地 —— 你看得到它、對手也看得到你。 */
  const troops=tyTroopMarks();
  // 3D 啟用時行軍路線是貼地的虛線(world3d.js 的 paths 圖層),弧線只在退回模式用
  if(!(window.W3D && W3D.ok)) for(const m of troops) if(m._arc) arcs.push(m._arc);
  TYG.arcsData(window.W3D ? arcs.concat(W3D.extraArcs||[]) : arcs);

  if(typeof TYG.htmlElementsData==='function'){
    /* 名牌分道 —— 使用者說「建築物可以放在對應的位子不要重疊」。
       建築本身一格都不能動(那是它真正的座標),所以錯開的只有**名牌**:
       靠得太近的城市各自往下讓一格,像地圖上的地名一樣。
       順序就是優先權:自己的據點先挑道,對手次之,還沒進場的最後。 */
    tyLanes([...pts, ...rv, ...rest]);
    // 3D 啟用時部隊是站在地上的棋子(world3d.js),HTML 徽章只在退回模式用
    TYG.htmlElementsData([...rest, ...pts, ...rv, ...(w3 ? [] : troops)]);
  }
  /* 有沙盤貼圖的時候國界已經畫在貼圖上,多邊形層整個拿掉(點國家改由
     onGlobeClick + W3D.featAt 判斷)—— 疊一層半透明多邊形在上面只會糊掉海岸線。 */
  if(countries && countries.length) TYG.polygonsData(window.W3D && W3D.textured ? [] : countries);
}

/* 大圓上兩點之間的第 f 段(0~1)。經緯度直接線性內插的話,
   跨太平洋的路線會走成一條穿過北極的怪線。純顯示用。 */
function tyGeoLerp(a, b, f){
  const t=Math.PI/180, v=p=>[Math.cos(p.lat*t)*Math.cos(p.lng*t), Math.cos(p.lat*t)*Math.sin(p.lng*t), Math.sin(p.lat*t)];
  const A=v(a), B=v(b);
  const d=Math.acos(tyClamp(A[0]*B[0]+A[1]*B[1]+A[2]*B[2], -1, 1));
  if(d<1e-6) return { lat:a.lat, lng:a.lng };
  const k1=Math.sin((1-f)*d)/Math.sin(d), k2=Math.sin(f*d)/Math.sin(d);
  const x=A[0]*k1+B[0]*k2, y=A[1]*k1+B[1]*k2, z=A[2]*k1+B[2]*k2;
  return { lat:Math.atan2(z, Math.hypot(x,y))/t, lng:Math.atan2(y,x)/t };
}
function tyTroopMarks(){
  if(!TY) return [];
  const out=[], at={};
  for(const u of tyUnits()){
    if(!u.to){ (at[u.site]=at[u.site]||[]).push(u); continue; }
    /* 自己的部隊下一季就到位,出發動畫已經把它送到目的地了 —— 所以畫在目的地,
       標籤寫「下季到位」。 */
    const b=tySite(u.to), p={ lat:b.lat, lng:b.lng };
    out.push({ ...p, _k:'mv:'+u.id, _units:[u], _mv:Math.max(1,u.eta-TY.t), _alt:.02,
      _arc:{ startLat:p.lat, startLng:p.lng, endLat:b.lat, endLng:b.lng,
             _c:['rgba(79,195,247,.35)','rgba(79,195,247,.95)'] } });
  }
  for(const [id,list] of Object.entries(at)){
    const s=tySite(id); out.push({ lat:s.lat, lng:s.lng, _k:'at:'+id, _units:list, _alt:.02 });
  }
  for(const th of tyThreats()){
    const r=tyRival(th.rid); if(!r) continue;
    const a=tySite(th.from), b=tySite(th.site);
    const f=tyClamp(Math.max(.15,(TY.t-th.dep)/Math.max(1,th.eta-th.dep)),0,1);
    const p=tyGeoLerp(a, b, f), col=TY_RVCOL[r.id]||'255,69,58';
    out.push({ ...p, _k:'th:'+th.id, _threat:th, _r:r, _alt:.02,
      _arc:{ startLat:p.lat, startLng:p.lng, endLat:b.lat, endLng:b.lng,
             _c:[`rgba(${col},.4)`, 'rgba(255,69,58,1)'] } });
  }
  return out;
}

/* 國家著色。兩個圖層都只用已經算好的數字,不多做任何運算。 */
/* 每個對手一個顏色 —— 地圖、勢力條、對手卡上都是同一個,
   不然「這塊地是誰的」要靠記名字。 */
const TY_RVCOL = { r1:'255,149,0', r2:'94,132,255', r3:'52,199,89',
                   r4:'255,214,10', r5:'191,90,242', r6:'255,105,160' };
/* 這個國家屬於哪一個經濟圈。有城市的直接用城市的;沒有城市的(蒙古、哈薩克…)
   歸到國土中心最近的那座城市的地區。算一次就記住 —— 國家不會搬家。
   使用者要的是「整張地圖都有顏色」,而不是只有 44 座城市所在的國家有。 */
const TY_ISO_REG={};
/* 「離哪座城市最近」會算錯的國家,直接指定。例如菲律賓的國土中心離香港最近,
   但它的經濟跟東南亞是一體的;巴基斯坦離杜拜最近,但它是南亞。 */
const TY_ISO_REG_FIX={
  PH:'apac', MY:'apac', MM:'apac', KH:'apac', LA:'apac', BN:'apac', TL:'apac', PG:'apac', NZ:'apac', FJ:'apac',
  MN:'cn', KP:'cn', MO:'cn',
  PK:'sa', BD:'sa', LK:'sa', NP:'sa', BT:'sa', AF:'sa', MV:'sa',
  RU:'eu', UA:'eu', BY:'eu', GL:'na',
  IR:'me', IQ:'me', KW:'me', BH:'me', OM:'me', YE:'me', JO:'me', SY:'me', LB:'me', TR:'me', EG:'me',
};
function tyIsoReg(code, f){
  const key=code && code!=='-99' ? code : (f && f.properties && f.properties.NAME) || '';
  if(!key) return null;
  if(key in TY_ISO_REG) return TY_ISO_REG[key];
  const here=TY_SITES.find(s=>s.iso===code);
  let reg=here ? here.reg : (TY_ISO_REG_FIX[code] || null);
  if(!reg){
    const c=tyIsoCenter(code, f);
    /* ⚠ 台灣與境外金融中心是「一國一區」的地區,不能把鄰國吸進來 ——
       不然菲律賓會因為離台北最近,被算成台灣的景氣。 */
    if(c){ let bd=1e9; for(const s of TY_SITES){ if(s.reg==='off'||s.reg==='tw') continue; const d=tyKm(c,s); if(d<bd){ bd=d; reg=s.reg; } } }
    // 太遠的(離任何一座城市超過 4000 公里,例如格陵蘭)不硬塞進某個經濟圈
    if(reg && c){ const near=Math.min(...TY_SITES.filter(s=>s.reg===reg).map(s=>tyKm(c,s))); if(near>4000) reg=null; }
  }
  return (TY_ISO_REG[key]=reg);
}
/* 地區景氣的五級色階:跟**全球平均**比(不是跟開局比 —— 十年下來每一區都漲,
   跟開局比的話後期整張地圖都是紅的,看不出誰強誰弱)。紅是熱、綠是冷,跟站上的漲跌色一致。 */
const TY_ECON_STEPS=[
  { min:.12,  c:'214,48,39',   a:.62, nm:'大熱' },
  { min:.04,  c:'244,109,67',  a:.5,  nm:'偏熱' },
  { min:-.04, c:'254,224,139', a:.36, nm:'持平' },
  { min:-.12, c:'102,189,99',  a:.5,  nm:'偏冷' },
  { min:-9,   c:'26,152,80',   a:.62, nm:'大冷' },
];
function tyEconRel(reg){
  const ks=Object.keys(TY_REGIONS).filter(k=>k!=='off');
  const avg=ks.reduce((s,k)=>s+tyRegIdx(k),0)/ks.length;
  return tyRegIdx(reg)/Math.max(.01,avg)-1;
}
const tyEconStep = reg => { const d=tyEconRel(reg); return TY_ECON_STEPS.find(x=>d>=x.min); };
function tyCountryColor(feat){
  const code=iso(feat);
  if(TY_LAYER==='power'){
    /* 勢力範圍:這個地區現在是誰的天下。你是藍的,對手各有各的顏色。
       深淺 = 領先者的勢力有多強。 */
    const reg=tyIsoReg(code, feat);
    if(!reg) return 'rgba(150,180,205,.05)';
    const o=tyRegOwner(reg);
    /* ⚠ 上限 .34 不是隨便挑的:再深一點整片國家會變成實色,
       國界、你自己的建築、地名全部被蓋掉 —— 那就不是地圖了。 */
    const a=(.07+Math.min(1,o.v/70)*.27).toFixed(3);
    if(!o.r) return o.v>2 ? `rgba(41,151,255,${a})` : 'rgba(150,180,205,.05)';
    return `rgba(${TY_RVCOL[o.r.id]||'200,200,210'},${a})`;
  }
  if(TY_LAYER==='econ'){
    const reg=tyIsoReg(code, feat);
    if(!reg) return 'rgba(150,180,205,.05)';
    const st=tyEconStep(reg);
    return `rgba(${st.c},${st.a})`;
  }
  const nw=Math.max(1,tyNW());
  const v=tyIsoSites(code).reduce((s,x)=>s+tySiteStuff(x.id).val,0);
  if(v<=0) return 'rgba(150,180,205,.07)';
  const share=tyClamp(v/nw,0,1);
  return `rgba(41,151,255,${(.10+Math.sqrt(share)*.55).toFixed(3)})`;
}

/* 國家的高度 = 勢力。參考的那款遊戲裡「這塊地是誰的」一眼就看得出來,
   因為領土是有厚度的。這裡把同一個數字(tyCountryColor 用的那個)
   同時拿去決定高度:你有東西 / 誰的天下越穩,那一塊就被抬得越高。
   ⚠ 上限約 .015 —— 再高的話側面會把旁邊的小國整個遮住。 */
function tyIsoAlt(code){
  const base=.004;
  if(!TY || !code) return base;
  if(TY_LAYER==='power'){
    const site=TY_SITES.find(x=>x.iso===code);
    if(!site) return base;
    const o=tyRegOwner(site.reg);
    return o.v>2 ? .005+Math.min(1,o.v/70)*.009 : base;
  }
  if(TY_LAYER==='econ') return .005;
  const v=tyIsoSites(code).reduce((s,x)=>s+tySiteStuff(x.id).val,0);
  if(v<=0) return base;
  return .006+Math.sqrt(tyClamp(v/Math.max(1,tyNW()),0,1))*.008;
}
const tyCountryAlt = f => tyIsoAlt(iso(f));
/* 側面比頂面深一點、不透明一點 —— 那就是「厚度」看起來的樣子 */
/* 幾乎透明的國家(沒人管、你也沒東西)不畫側面,不然整片大陸都是一圈圈的鬼牆。 */
const tyCountrySide = f => tyCountryColor(f).replace(/,([\d.]+)\)$/,
  (m,a)=> (+a)<.09 ? ',0)' : `,${Math.min(.8,(+a)*2.1).toFixed(3)})`);

function tyGlobeMount(){
  const fresh = !TYG;
  const slot=document.getElementById('tyGlobeSlot');
  const host=document.getElementById('tyGlobeHost');
  if(!slot || !host) return;
  if(host.parentNode!==slot) slot.appendChild(host);
  if(!GLOBE_OK || !GEO_OK) return;

  if(!TYG){
    TYG = Globe()(document.getElementById('tyGlobe'))
      .backgroundColor('rgba(0,0,0,0)')
      .showGlobe(true).showAtmosphere(true)
      .atmosphereColor('#4fc3f7')
      .atmosphereAltitude(0.16)
      .globeImageUrl(null)
      .hexPolygonResolution(3).hexPolygonMargin(0.62).hexPolygonAltitude(0.002)
      .polygonCapColor(tyCountryColor)
      .polygonSideColor(tyCountrySide)
      .polygonStrokeColor(()=> 'rgba(125,200,245,.34)')
      .polygonAltitude(tyCountryAlt)
      .onPolygonClick(f => tyPickIso(iso(f)))
      .onGlobeClick(p => { if(window.W3D && W3D.aiming && W3D.aiming()) return; if(window.W3D && W3D.textured && p){ const f=W3D.featAt(p.lat, p.lng); if(f) tyPickIso(iso(f)); } })
      .pointLat('lat').pointLng('lng')
      .pointAltitude('_alt').pointRadius('_rad').pointColor('_col')
      .pointsMerge(false).pointsTransitionDuration(500)
      .onPointClick(p => p._rival ? tyPickIso(p.iso) : tyPickSite(p.id))
      .arcsData([]).arcColor('_c')
      .arcAltitudeAutoScale(0.34).arcStroke(0.4)
      .arcDashLength(0.45).arcDashGap(1.2).arcDashAnimateTime(2400)
      .arcsTransitionDuration(400);

    if(typeof TYG.htmlElementsData==='function'){
      TYG.htmlLat('lat').htmlLng('lng')
         /* 3D 建築啟用時名牌掛在地面、往下垂(建築本身往上長),
            兩者才不會疊在一起。 */
         .htmlAltitude(d=>(d._base && window.W3D && W3D.ok) ? d._base : (d._alt||0)+0.016)
         .htmlElement(d=>{
            const el=document.createElement('div');
            /* 部隊徽章與來襲的敵軍 —— 參考那款遊戲的單位牌:一個方塊、一個圖示、
               一個數字。點下去開部隊面板。 */
            if(d._units || d._threat){
              el.className='tyu'+(d._threat?' th':'')+(d._mv?' mv':'');
              if(d._threat){
                el.style.setProperty('--rc', `rgb(${TY_RVCOL[d._r.id]||'255,69,58'})`);
                el.innerHTML=`<i>${d._r.ic||'⚔'}</i><b>⚔</b><em>${Math.max(0,d._threat.eta-TY.t)}季</em>`;
                el.title=`${d._r.nm}的併購小組 → ${tySite(d._threat.site).nm},`
                        +`${Math.max(0,d._threat.eta-TY.t)} 季後抵達。防守率 ${(tyThreatBlock(d._threat)*100).toFixed(0)}%`;
              }else{
                const ics=d._units.map(u=>TY_UNITS[u.k].ic).join('');
                el.innerHTML=`<b>${ics}</b>${d._mv?`<em>${d._mv}季</em>`:(d._units.length>1?`<em>×${d._units.length}</em>`:'')}`;
                el.title=d._units.map(u=>`${TY_UNITS[u.k].nm}${u.to?` → ${tySite(u.to).nm}`:''}`).join('、');
              }
              el.onclick=()=>{ TY_MODAL='troop'; renderPage(); };
              return el;
            }
            el.className='tyk'+(d._rival?' rv':'')+(d._idle?' idle':'');
            el.style.setProperty('--lane', d._lane||0);
            if(d._col) el.style.setProperty('--kg', d._col);
            if(d._rival){
              const r=d._rival, rel=r.rel||0;
              const mark = rel>=20?'🤝' : rel<=-20?'⚔' : '';
              el.innerHTML=`<i class="k-ic">${r.ic||'👤'}</i>`
                + `<b class="k-n">${escH(r.nm)}${mark?` <u class="k-s">${mark}</u>`:''}</b>`;
              el.title=`${r.nm} · ${r.tag} · ${tyM(r.nw)}\n關係 ${tyRelTxt(rel)}(${rel.toFixed(0)})\n`
                     + `勢力:${Object.entries(r.turf||{}).filter(([,v])=>v>2)
                          .sort((a,b)=>b[1]-a[1])
                          .map(([g,v])=>`${TY_REGIONS[g].nm} ${v.toFixed(0)}`).join(' · ')||'—'}`;
            }else if(d._idle){
              /* 使用者:「地圖上可以顯示原本這個城市有的東西,根據他們真實的特色」。
                 所以還沒進場的城市不再只是一個名字 —— 名字前面掛著它的特色圖示
                 (🔬 半導體、🏛 資本市場、🛢 能源、🔐 金庫…),一眼看得出
                 「這裡本來就有什麼」。最多兩個,再多在球上就變成一團符號。 */
              const ics=tySpecs(d.id).filter(k=>TY_SPEC[k]&&TY_SPEC[k].good)
                        .slice(0,2).map(k=>TY_SPEC[k].ic).join('');
              el.innerHTML=`<b class="k-n">${ics?`<u class="k-s">${ics}</u>`:''}${escH(d.nm)}</b>`;
              el.title=`${d.nm} —— 還沒進場。法定公司稅率 ${(d.tax*100).toFixed(1)}%\n`
                     + tySpecs(d.id).map(k=>`${TY_SPEC[k].ic} ${TY_SPEC[k].nm}`).join(' · ');
            }else{
              // 空殼 / 控股層本身沒有估值,印一個「0」出來只會讓人以為壞了
              const ics=tySpecs(d.id).filter(k=>TY_SPEC[k]&&TY_SPEC[k].good)
                        .slice(0,2).map(k=>TY_SPEC[k].ic).join('');
              el.innerHTML=`<span class="k-b">${d._blds.map(tyBldHTML).join('')}</span>`
                + `<b class="k-n"><em class="k-lv" title="城市等級">${tySiteLv(d._v)}</em>${
                    ics?`<u class="k-s">${ics}</u>`:''}${escH(d.nm)}${
                    d._v>1?` <span>${tyM(d._v)}</span>`:''}</b>`;
              el.title=`${d.nm} · ${tyM(d._v)}\n`
                     + tySpecs(d.id).map(k=>`${TY_SPEC[k].ic} ${TY_SPEC[k].nm}`).join(' · ');
            }
            /* 點在某一棟建築上 → 開那一棟自己的資訊卡;
               點在名字或空白處 → 開整個據點的面板。 */
            el.onclick = ev => {
              // 點對手 → 直接開他的談判卡,不是開那個國家
              if(d._rival){ TY_RIVAL=d._rival.id; TY_DEAL=null; TY_MODAL='rival';
                            renderPage(); return; }
              const b=ev.target.closest && ev.target.closest('.bld');
              tyPickSite(d.id, b?b.dataset.r:null);
            };
            return el;
         });
    }
    // 背面的標記要淡掉,不然整顆球會被穿透顯示的圖示塞滿
    if(typeof TYG.htmlElementVisibilityModifier==='function')
      TYG.htmlElementVisibilityModifier((el,vis)=>{
        el.style.opacity = vis?1:0;
        el.style.pointerEvents = vis?'auto':'none';
      });
    if(typeof TYG.hexPolygonUseDots==='function') TYG.hexPolygonUseDots(true);
    TYG.controls().autoRotate=true;
    TYG.controls().autoRotateSpeed=0.32;
    TYG.controls().enableDamping=true;
    /* 球半徑在 globe.gl 是 100,所以 minDistance 直接決定「最近能貼多近」。
       原本 170(高度 0.7)差不多是看一整個洲 —— 使用者要的是像參考那款遊戲
       一樣可以一路推到看得見街廓,所以放到 106(高度 0.06)。
       maxDistance 也放寬,拉遠可以看到整顆球加大氣層。 */
    TYG.controls().minDistance=106;
    TYG.controls().maxDistance=900;
    TYG.controls().zoomSpeed=1.5;
    // 3D 建築、傾斜鏡頭、沙盤貼圖(見 world3d.js)。替身與舊版會安靜地不啟用。
    if(window.W3D) W3D.attach(TYG);
    /* 鏡頭高度分三級,交給 CSS 決定哪些標記要收起來 / 放大。
       東亞那一團互相蓋住的城市名,九成是拉遠的時候才擠在一起的。 */
    if(typeof TYG.onZoom==='function') TYG.onZoom(pov=>{
      tyZoomTier(pov&&pov.altitude);
      if(window.W3D) W3D.onZoom(pov);
    });
    // 使用者一動就停止自轉,九秒沒動再轉回來 —— 跟主地球同一套手感
    ['pointerdown','wheel','touchstart'].forEach(e =>
      document.getElementById('tyGlobe').addEventListener(e, ()=>{
        TYG.controls().autoRotate=false;
        clearTimeout(window.__tyar);
        window.__tyar=setTimeout(()=>{ if(TYG) TYG.controls().autoRotate=true; }, 9000);
      }, {passive:true}));
  }

  const el=document.getElementById('tyGlobe');
  const w=Math.max(240, el.clientWidth||slot.clientWidth||600);
  const h=Math.max(220, el.clientHeight||360);
  TYG.width(w).height(h);
  /* 第一次掛上來才擺鏡頭:對準你的出身地,高度依畫面比例算(見 tyFitAlt)。
     ⚠ 一定要在 width/height 設好之後 —— tyFitAlt 讀的就是那兩個數字。
     ⚠ 也一定只做一次:每次重畫都擺一次的話,你手動轉到的地方會被拉回去。 */
  if(fresh){
    const home=tySite(TY.home), alt=tyFitAlt();
    TYG.pointOfView({ lat:home.lat, lng:home.lng, altitude:alt }, 0);
    tyZoomTier(alt);
  }
  if(window.W3D) W3D.attach(TYG);
  tyPaintGlobe();
  tyGlobeData();
  tyGlobeAwake(true);

  /* 分頁寬度會變(手機轉向、桌機拉視窗),而 globe.gl 的尺寸是寫死的數字,
     不會自己跟著容器走 —— 沒有這個觀察器,轉個向地球就變成橢圓。 */
  if(!TYG_RO && typeof ResizeObserver==='function'){
    TYG_RO=new ResizeObserver(()=>{
      const e=document.getElementById('tyGlobe');
      if(!e || !e.clientWidth || !TYG) return;
      TYG.width(e.clientWidth).height(Math.max(220,e.clientHeight));
    });
    TYG_RO.observe(el);
  }
}

/* 鏡頭高度分三級,寫在 #tyGlobeHost 上讓 CSS 去決定哪些標記要收、哪些要放大。
   「東亞那一團城市名擠成一坨」九成是拉遠的時候才發生的,
   拉遠就把還沒進場的城市與對手的名字收起來,那一團自然就散了。
   ⚠ 一定要跟初始鏡頭一起設一次 —— 只掛 onZoom 的話,使用者沒動過滾輪之前
     這個屬性是空的,等於第一眼看到的就是最擠的那一版。 */
function tyZoomTier(alt){
  const host=document.getElementById('tyGlobeHost');
  if(!host || !isFinite(alt)) return;
  const z = alt>1.1 ? 'far' : alt>0.38 ? 'mid' : 'near';
  if(host.dataset.z!==z) host.dataset.z=z;
}

/* 「剛好塞滿畫面」的鏡頭高度。
   globe.gl 的相機視角(fov)固定 50° 是**垂直**的,水平視角要乘上長寬比 ——
   所以在又窄又長的手機上,水平方向才是瓶頸。寫死一個高度的話,
   同一個數字在桌機剛剛好、在手機會有半顆球在畫面外(而且你的據點就在外面)。
   fill>1 = 讓球稍微溢出邊緣,那是參考的那款遊戲「地圖很大」的感覺來源。 */
function tyFitAlt(mult){
  const el=document.getElementById('tyGlobe');
  const w=Math.max(1, (el&&el.clientWidth)||600), h=Math.max(1, (el&&el.clientHeight)||600);
  const t=Math.tan(25*Math.PI/180);
  const dh=1/Math.sin(25*Math.PI/180);                    // 上下剛好塞滿的距離
  const dw=1/Math.sin(Math.atan(t*(w/h)));                // 左右剛好塞滿的距離
  /* 寬螢幕:上下是瓶頸,照 dh 走就看得到整顆球。
     直立的手機:照 dw 走的話上下會空掉一大半(使用者說的「太空」),
     照 dh 走又會有半顆球在畫面外 —— 取兩者的幾何平均:
     球稍微溢出左右兩邊,但上下填滿,看起來就是一張很大的地圖。 */
  const d=Math.sqrt(Math.max(dw,dh)*dh)*1.02;
  return tyClamp(d*(mult||1) - 1, 0.35, 5);
}

/* +/− 按鈕。乘除固定倍率,不是加減固定值 —— 高度是幾何級數的,
   加減固定值在拉遠的時候幾乎沒感覺、在貼近的時候會直接穿過地表。 */
function tyZoom(dir){
  if(!TYG) return;
  try{
    /* 傾斜鏡頭之下 pointOfView() 讀到的是「往南挪過」的實際位置,
       拿它算的話每按一次畫面就往南漂一點 —— 要用邏輯位置(W3D.pov)。 */
    const pov=(window.W3D && W3D.pov()) || TYG.pointOfView();
    const alt=tyClamp(pov.altitude*(dir>0?1.55:1/1.55), 0.06, 4.2);
    TYG.controls().autoRotate=false;
    TYG.pointOfView({ lat:pov.lat, lng:pov.lng, altitude:alt }, 320);
  }catch(e){}
}

/* 日夜:跟主地球同一套(見 paintGlobeTheme)。白天不是「把夜晚調亮」——
   海與陸地的明暗關係要整個反過來,不然在白底上是一坨灰球。 */
/* 帝國地球**永遠是夜晚**,不跟站上的淺 / 深色走。
   理由跟指揮台的外殼一樣:這是駕駛艙。實測過跟著站上淺色走的樣子 ——
   白色的球放在深藍的操作面板中間,像一顆貼錯的貼紙,而且淡色的國界
   在白球上完全看不見。 */
function tyPaintGlobe(){
  if(!TYG) return;
  try{
    // 有沙盤貼圖就讓貼圖自己的顏色出來(見 W3D.material 的註解)
    if(window.W3D && W3D.material()){
      TYG.atmosphereColor('#6fd0ff').atmosphereAltitude(0.18);
      TYG.polygonStrokeColor(()=> 'rgba(225,240,250,.16)');
      return;
    }
    const m=TYG.globeMaterial();
    m.color && m.color.set('#07141f');
    m.emissive && m.emissive.set('#030d16');
    if('shininess' in m) m.shininess=0;
    TYG.atmosphereColor('#4fc3f7').atmosphereAltitude(0.16);
    TYG.polygonStrokeColor(()=> 'rgba(125,200,245,.34)');
  }catch(e){ /* 舊版拿不到 material 就維持預設外觀 */ }
}

/* ---------- 點國家 / 點地點 ---------- */
function tyPickIso(code){
  if(!code) return;
  TY_ISO = (TY_ISO===code ? null : code);
  TY_SEL = null; TY_BLD = null;
  TY_MODAL = TY_ISO ? 'site' : null;
  if(TY_ISO && TYG){
    // 鏡頭飛到那個國家。有我的據點就用據點的重心,沒有就用第一個城市。
    const here=TY_SITES.filter(s=>s.iso===TY_ISO);
    const mine=tyIsoSites(TY_ISO);
    if(!here.length){
      // 沒有城市的國家:飛到國土的中心
      const c=tyIsoCenter(TY_ISO);
      if(c){ TYG.controls().autoRotate=false;
             TYG.pointOfView({ lat:c.lat, lng:c.lng, altitude:tyClamp(.9*((tyFitAlt()+1)/2.37), .5, 1.6) }, 900); }
    }else{
      /* 鏡頭要對準「我的東西」,但拉遠到看得完**整個國家**。
         第一版用「我有幾個據點」決定高度 —— 於是在美國只有一棟樓的人會被
         拉到貼著曼哈頓,旁邊六個州一個都看不到,而那正是這一頁想給的資訊。 */
      const use=mine.length?mine:here;
      const lat=use.reduce((s,x)=>s+x.lat,0)/use.length;
      const lng=use.reduce((s,x)=>s+x.lng,0)/use.length;
      const span=Math.max(
        Math.max(...here.map(x=>x.lat))-Math.min(...here.map(x=>x.lat)),
        (Math.max(...here.map(x=>x.lng))-Math.min(...here.map(x=>x.lng)))*Math.cos(lat*Math.PI/180));
      TYG.controls().autoRotate=false;
      /* 高度也要跟著畫面比例縮放(k) —— 同一個「看得完整個美國」的高度,
         在手機的窄視窗裡只看得到中西部。1.37 是寬螢幕的基準值。 */
      const k=(tyFitAlt()+1)/2.37;
      TYG.pointOfView({ lat, lng, altitude: tyClamp((span/26+0.42)*k, .3, 3.2) }, 900);
    }
  }else if(TYG){
    TYG.pointOfView({ altitude:tyFitAlt() }, 800);
  }
  renderPage();
}
function tyPickSite(id, ref){
  // 同一棟再點一次就收起來;點另一棟就換過去
  if(ref){ TY_BLD = (TY_SEL===id && TY_BLD===ref) ? null : ref; TY_SEL=id; }
  else { TY_BLD=null; TY_SEL = (TY_SEL===id && TY_MODAL==='site' ? null : id); }
  TY_MODAL = TY_SEL ? 'site' : null;      // 點地圖就開據點面板,取消就回到地圖
  if(TY_SEL){
    TY_ISO = tySite(id).iso;
    if(TYG){
      const s=tySite(id);
      TYG.controls().autoRotate=false;
      TYG.pointOfView({ lat:s.lat, lng:s.lng,
        altitude: tyClamp(0.62*((tyFitAlt()+1)/2.37), .3, 1.3) }, 900);
    }
  }
  renderPage();
}

/* =========================================================================
   地圖分頁 —— 地球 + 一個會跟著你點的側欄
   -------------------------------------------------------------------------
   三層深度,對應三種問題:
     世界   「我的帝國長什麼樣子?」→ 依國家排序 + 各地區的景氣與競爭
     國家   「美國我到底有什麼?」  → 依州 / 省分組列出每一個據點
     據點   「曼哈頓那一塊值多少?」→ 明細 + 就地可以做的每一件事
   ========================================================================= */
const tyPctNW = v => (v/Math.max(1,tyNW())*100);

/* ---------- 世界 ---------- */
function tyWorldPanel(){
  const mine=tyMySites();
  const byIso={};
  for(const s of mine){ (byIso[s.iso]=byIso[s.iso]||[]).push(s); }
  const rows=Object.entries(byIso).map(([iso,ss])=>{
    const v=ss.reduce((a,x)=>a+tySiteStuff(x.id).val,0);
    return { iso, v, n:ss.length, nm:REGION_NAME[iso]||iso };
  }).sort((a,b)=>b.v-a.v);

  const list = rows.length ? rows.map(r=>`
    <button type="button" class="ty-geo" data-ty="iso" data-k="${r.iso}">
      <span class="g-n">${escH(r.nm)}<em>${r.n} 個據點</em></span>
      <span class="g-b"><i style="width:${Math.min(100,tyPctNW(r.v)).toFixed(0)}%"></i></span>
      <span class="g-v">${tyM(r.v)}<em>${tyPctNW(r.v).toFixed(1)}%</em></span>
    </button>`).join('')
    : `<div class="empty">你的錢還全部在${escH(tySite(TY.cashSite).nm)}。<br>
        去「資產」買點東西,或在「事業」開一家公司 —— 它們會出現在這顆地球上。</div>`;

  const regs=Object.entries(TY_REGIONS).map(([k,d])=>{
    const st=TY.reg[k], has=tyMyRegions().includes(k);
    const par=TY.partners[k];
    return `<div class="ty-reg${has?' on':''}">
      <span class="r-n">${d.nm}${par?`<em>夥伴 ${escH(par.nm)}</em>`:''}</span>
      <span class="r-i ${st.idx>=1?'up':'down'}">${((st.idx-1)*100>=0?'+':'')}${((st.idx-1)*100).toFixed(1)}%</span>
      <span class="r-x">${st.comp>.5?`競爭 ${st.comp.toFixed(1)}`:''}${
        (d.pol||0)>=.8?'<b>政策風險高</b>':''}</span></div>`;
  }).join('');

  return `<div class="p-hd"><b>你的帝國</b>
      <span>${mine.length} 個據點 · ${rows.length} 個國家 · 淨值 ${tyM(tyNW())}</span></div>
    <div class="p-note">點地球上的國家或圖示可以往下看,灰色的名字是你還沒進場的城市。
      錢在${escH(tySite(TY.cashSite).nm)}${
      TY.holdco?`,控股層在${escH(tySite(TY.holdco).nm)}(稅率 ${(tyTaxRate()*100).toFixed(1)}%)`:''}。</div>
    ${list}
    <div class="p-sec">地區景氣<span>指數是相對開局的,直接乘進當地每一樣東西</span></div>
    <div class="ty-regs">${regs}</div>`;
}

/* ---------- 國家 ---------- */
/* ---------- 國家 ----------
   使用者:「點一個國家可以顯示這個國家的所有訊息,經濟、政策等等」。
   參考那款遊戲點國家會跳出一張國家卡:國旗、誰控制、資源、關係。
   這裡的對應:景氣(地區指數)、長期成長與波動、政策風險、稅率、誰的勢力最大、
   你的部隊、有沒有人正在打過來。

   ⚠ 遊戲的經濟模型是以「地區」為單位的(TY_REGIONS),不是每一國一套。
     沒有城市的國家(例如蒙古)歸到**離它最近的那座城市的地區** —— 畫面上會直說
     「依最近的經濟圈推算」,不假裝它有自己的數字。 */
function tyIsoName(code, f){
  if(code && REGION_NAME[code]) return REGION_NAME[code];
  try{ if(code && code.length===2 && typeof Intl!=='undefined' && Intl.DisplayNames)
         return new Intl.DisplayNames(['zh-Hant'],{type:'region'}).of(code); }catch(e){}
  return (f && f.properties && (f.properties.NAME||f.properties.ADMIN)) || code || '';
}
function tyIsoCenter(code, f){
  const here=TY_SITES.filter(s=>s.iso===code);
  if(here.length) return { lat:here.reduce((a,x)=>a+x.lat,0)/here.length, lng:here.reduce((a,x)=>a+x.lng,0)/here.length };
  const feat=f || (window.W3D && W3D.hiFeats || countries || []).find(x=>iso(x)===code);
  if(!feat || !feat.geometry) return null;
  const g=feat.geometry, polys=g.type==='Polygon'?[g.coordinates]:g.coordinates;
  const big=polys.map(p=>p[0]).sort((a,b)=>b.length-a.length)[0]||[];
  if(!big.length) return null;
  let la=0, lo=0; for(const [x,y] of big){ lo+=x; la+=y; }
  return { lat:la/big.length, lng:lo/big.length };
}
function tyIsoInfo(code, f){
  if(!TY) return null;
  const here=TY_SITES.filter(s=>s.iso===code);
  const reg=tyIsoReg(code, f), near=!here.length;
  if(!reg) return null;
  const R=TY_REGIONS[reg], st=TY.reg[reg], idx=tyRegIdx(reg), own=tyRegOwner(reg);
  const pol=R.pol||0;
  const board=[{ nm:'你', v:tyMyTurf(reg), col:'41,151,255', me:true },
    ...tyRivalsA().map(r=>({ nm:r.nm, ic:r.ic, v:tyTurf(r,reg), col:TY_RVCOL[r.id]||'200,200,210', r }))]
    .filter(x=>x.v>.5).sort((a,b)=>b.v-a.v);
  return { reg, near, here, R, st, idx, pol,
    regNm:R.nm, idxTxt:`${idx>=1?'+':''}${((idx-1)*100).toFixed(1)}%`,
    polTxt: pol>=.8?'高':pol>=.45?'中':'低',
    ownerTxt: own.r ? `${own.r.ic||''} ${escH(own.r.nm)}的天下(勢力 ${own.v.toFixed(0)})`
             : own.me>2 ? `你的天下(勢力 ${own.me.toFixed(0)})` : '沒有人獨大',
    board };
}
function tyIsoPanel(code){
  const all=TY_SITES.filter(s=>s.iso===code);
  const mine=tyIsoSites(code);
  const tot=mine.reduce((a,s)=>a+tySiteStuff(s.id).val,0);
  const I=tyIsoInfo(code);

  /* 依州 / 省分組 —— 「點美國要看得到是哪幾個州」就是這一段。
     沒有州別的地方(新加坡、香港、開曼)就自己一組,不要硬掰一個名字。 */
  const groups={};
  for(const s of all) (groups[s.sub||'']=groups[s.sub||'']||[]).push(s);

        <span class="s-b">${bits.length?escH(bits.join(' · ')):'<i>還沒進場</i>'}</span>
        <span class="s-v">${t.val>0?tyM(t.val):''}</span></button>`;
    }).join('');
    return `<div class="ty-sub"><div class="sub-h">${escH(sub||'—')}</div>${rows}</div>`;
  }).join('');

  let info='';
  if(I){

    info=`
    ${I.near?`<div class="p-note">這個國家沒有可以進場的城市。以下是它所在的經濟圈
      「${escH(I.regNm)}」的數字(依最近的經濟圈推算)。</div>`:''}
    <div class="p-sec">經濟<span>${escH(I.regNm)}</span></div>
    <div class="ty-facts">
      <div><em>地區景氣(開局 = 0%)</em><b class="${I.idx>=1?'up':'down'}">${I.idxTxt}</b></div>
      <div><em>長期成長(年)</em><b>${(R.drift*4*100).toFixed(1)}%</b></div>
      <div><em>波動(每季)</em><b>${(R.vol*100).toFixed(1)}%</b></div>
      <div><em>跟全球景氣連動</em><b>${R.beta.toFixed(2)} 倍</b></div>
      ${R.oil?`<div><em>跟油價連動</em><b>${R.oil.toFixed(2)}</b></div>`:''}
      <div><em>當地競爭</em><b>${I.st.comp>.5?I.st.comp.toFixed(1):'—'}</b></div>
    </div>
    <div class="p-sec">政策<span>風險 ${I.polTxt}</span></div>
    <div class="ty-facts">
      <div><em>政策風險(徵收、管制、外匯)</em><b>${I.polTxt}(${(I.pol*100).toFixed(0)})</b></div>
      <div><em>法定公司稅率</em><b>${taxes.length?(Math.min(...taxes)===Math.max(...taxes)
          ?(taxes[0]*100).toFixed(1)+'%':`${(Math.min(...taxes)*100).toFixed(1)}–${(Math.max(...taxes)*100).toFixed(1)}%`):'—'}</b></div>
      <div><em>在地夥伴</em><b>${TY_PARTNERS[I.reg]?(par?'✓ '+escH(TY_PARTNERS[I.reg].nm):'需要 · '+escH(TY_PARTNERS[I.reg].nm)):'不需要'}</b></div>
      <div><em>你的部隊 / 來襲</em><b>${units.length?units.map(u=>TY_UNITS[u.k].ic).join(''):'—'}${threats.length?` · ⚠ ${threats.length}`:''}</b></div>
    </div>
    <div class="p-sec">勢力<span>${I.ownerTxt}</span></div>
    <div class="ty-board">${I.board.length?I.board.map(x=>`<div class="b-r${x.me?' me':''}">
        <span class="b-n">${x.ic||'🔵'} ${escH(x.nm)}</span>
        <span class="b-b"><i style="width:${(x.v/mx*100).toFixed(0)}%;background:rgb(${x.col})"></i></span>
        <span class="b-v">${x.v.toFixed(0)}</span></div>`).join(''):'<div class="empty">這個地區還沒有人有勢力。</div>'}</div>`;
  }

  return `<div class="p-hd"><button type="button" class="p-back" data-ty="iso" data-k="">← 世界</button>
      <i class="p-flag">${flag}</i><b>${escH(tyIsoName(code))}</b>
      <span>${mine.length} 個據點 · ${tyM(tot)}(佔淨值 ${tyPctNW(tot).toFixed(1)}%)</span></div>
    ${info}
    ${all.length?`<div class="p-sec">城市<span>${all.length} 座</span></div>
    <div class="p-note">依州 / 省 / 行政區分組。灰色的是這個國家你還沒進場的城市 ——
      點進去就看得到在那裡能做什麼。</div>
    ${body}`:''}`;
}

const TY_KIND = { ex:'交易所', re:'不動產', hq:'總部', bank:'銀行', vault:'金庫',
                  shell:'法人登記', oil:'油氣', mine:'礦業' };

/* ---------- 一棟建築的資訊卡 ----------
   使用者要的是「點到裡面的積木然後可以顯示他的資訊」。所以每一棟都要能自己
   回答三件事:它是什麼、它現在值多少、我在這裡可以對它做什麼。
   ref 的格式是 tySiteBuildings() 寫進去的:pos:<資產> / biz:<id> / cash / hold。 */
function tyBldCard(id, ref){
  if(!ref) return '';
  const site=tySite(id);
  const F=(l,v,sub)=>`<div><em>${l}</em><b>${v}</b>${sub?`<i>${sub}</i>`:''}</div>`;

  if(ref==='cash'){
    return `<div class="ty-bcard c-cash"><div class="bc-h">
        <span class="k-b">${tyBldHTML({c:'cash',f:1})}</span>
        <b>現金</b><span>放在${escH(site.nm)}</span></div>
      <div class="bc-fig">${F('金額',tyM(TY.cash))}
        ${F('這裡的政策風險',(TY_REGIONS[site.reg].pol||0)>=.8?'高':(TY_REGIONS[site.reg].pol||0)>=.45?'中':'低',
            '外匯管制、銀行危機只發生在錢所在的地方')}</div>
      <div class="ty-acts">${TY_SITES.filter(x=>x.kind.includes('bank')&&x.id!==id).slice(0,4)
        .map(x=>`<button type="button" class="ty-b alt" data-ty="movecash" data-site="${x.id}">搬去${escH(x.nm)}</button>`).join('')}</div>
    </div>`;
  }
  if(ref==='hold'){
    return `<div class="ty-bcard c-hold"><div class="bc-h">
        <span class="k-b">${tyBldHTML({c:'hold',f:2})}</span>
        <b>控股層</b><span>${escH(site.nm)}</span></div>
      <div class="bc-fig">${F('集團稅率',(tyTaxRate()*100).toFixed(1)+'%','原本是 '+(tyHomeTax()*100).toFixed(1)+'%')}
        ${F('每季換來的關注度','+'+(tyTaxGap()*14).toFixed(1),'省得越多,被盯上得越快')}
        ${F('目前關注度',TY.heat.toFixed(0),'滿 100 就是起訴')}</div>
      <div class="p-note">集團的獲利掛在這裡,所以照這一國的稅率課。它本身沒有估值 ——
        它的價值就是那個稅率差。</div>
    </div>`;
  }
  if(ref.startsWith('biz:')){
    const b=TY.biz.find(x=>x.id===+ref.slice(4));
    if(!b) return '';
    const d=TY_BIZ[b.k], shell=d.shell, val=tyBizVal(b)*b.own;
    return `<div class="ty-bcard c-${shell?'shell':'biz'}"><div class="bc-h">
        <span class="k-b">${tyBldHTML({c:shell?'shell':'biz',f:shell?1:tyFloors(val),
          st: shell?'shell':(b.pub?'pub':(b.cf<0?'burn':(b.cf>0?'earn':'')))})}</span>
        <b>${d.nm}</b><span>${escH(site.nm)} · ${tyWhen(b.born)} 成立${b.pub?' · 已上市':''}</span></div>
      <div class="bc-fig">
        ${F('投入資本',tyM(b.cap))}
        ${F('估值',shell?'—':tyM(val), shell?'空殼公司沒有業務':'年化盈餘 × 產業倍數 × 市場情緒')}
        ${F('持股',(b.own*100).toFixed(0)+'%')}
        ${F('上季現金流',shell?'—':`<span class="${b.cf>=0?'up':'down'}">${tySgn(b.cf)}</span>`,
            b.cf<0?'還在燒錢':(b.cf>0?'一年約 '+tyM(b.cf*4):''))}</div>
      <div class="bc-d">${d.dsc}</div>
      <div class="ty-acts">
        ${shell?'':`<button type="button" class="ty-b" data-ty="expand" data-id="${b.id}">加碼擴張</button>`}
        ${(!shell&&!b.pub)?`<button type="button" class="ty-b" data-ty="ipo" data-id="${b.id}">送上市</button>`:''}
        ${(!shell&&!b.pub)?`<button type="button" class="ty-b alt" data-ty="reverse" data-id="${b.id}">借殼上市</button>`:''}
        <button type="button" class="ty-b alt" data-ty="sellbiz" data-id="${b.id}">${
          shell?'註銷':`賣掉(約 ${tyM(val*.94)})`}</button>
        ${shell?'':`<button type="button" class="ty-b warn" data-ty="ch11" data-id="${b.id}">破產保護</button>`}
      </div></div>`;
  }
  if(ref.startsWith('pos:')){
    const k=ref.slice(4), a=tyAsset(k);
    const p=TY.pos.find(x=>x.k===k && x.site===id);
    if(!a || !p) return '';
    const v=tyPosVal(p), gain=v-p.cb, rate=tyCgRate(p), tax=Math.max(0,gain)*rate;
    return `<div class="ty-bcard c-${k==='gold'?'gold':a.g==='real'?'real':'paper'}">
      <div class="bc-h">
        <span class="k-b">${tyBldHTML({c:k==='estate'?'estate':k==='gold'?'gold':a.g==='real'?'real':'paper',
          f:tyFloors(v), st:gain>0?'earn':''})}</span>
        <b>${a.nm}</b><span>${escH(site.nm)}${site.sub?' · '+escH(site.sub):''}</span></div>
      <div class="bc-fig">
        ${F('數量',tyUnitTxt(tyUnitCount(p),a.u),`每${a.u} ${tyM(tyUnitPx(k,id))}`)}
        ${F('市值',tyM(v),`佔淨值 ${tyPctNW(v).toFixed(1)}%`)}
        ${F('成本',tyM(p.cb))}
        ${F('未實現獲利',`<span class="${gain>=0?'up':'down'}">${tySgn(gain)}</span>`,
            tax>1e5?`現在賣掉要繳 ${tyM(tax)} 資本利得稅(${(rate*100).toFixed(1)}%)`
                   :`這裡的處分利得稅率是 ${(rate*100).toFixed(1)}%`)}
        ${a.yld?F('一年孳息',tyM(v*a.yld*4),`${(a.yld*400).toFixed(1)}%/年`):''}
        ${F('可抵押',tyM(v*a.ltv),`成數 ${(a.ltv*100).toFixed(0)}%`)}</div>
      <div class="bc-d">${a.why}</div>
      <div class="ty-acts">
        <button type="button" class="ty-b" data-ty="buy" data-k="${k}" data-site="${id}">再買一些</button>
        <button type="button" class="ty-b" data-ty="sell" data-k="${k}" data-site="${id}">賣出 ${(TY_SIZE*100).toFixed(0)}%</button>
        ${a.g!=='real'?`<button type="button" class="ty-b alt" data-ty="sbl">拿它去質押借錢</button>`:''}
      </div></div>`;
  }
  return '';
}

/* ---------- 據點 ---------- */
/* 城市特色那一排。優點在前、缺點在後,每一個都寫出它實際改變了什麼。 */
function tySpecHTML(id){
  const sp=tySpecs(id);
  if(!sp.length) return '';
  const order=[...sp].sort((a,b)=>(TY_SPEC[b].good?1:0)-(TY_SPEC[a].good?1:0));
  return `<div class="ty-specs">${order.map(k=>{
    const d=TY_SPEC[k]; if(!d) return '';
    return `<div class="sp ${d.good?'good':'bad'}">
      <div class="sp-h"><i>${d.ic}</i><b>${escH(d.nm)}</b></div>
      <div class="sp-d">${escH(d.dsc)}</div></div>`;
  }).join('')}</div>`;
}

function tySitePanel(id){
  const s=tySite(id), t=tySiteStuff(id), R=TY_REGIONS[s.reg];
  const par=TY.partners[s.reg];
  const idx=tyRegIdx(s.reg);

  /* 每一行都是一顆按鈕 —— 點下去開的是跟地圖上點那一棟積木完全一樣的資訊卡。 */
  const row=(ref,nm,sub)=>`<button type="button" class="st${TY_BLD===ref?' on':''}"
      data-ty="site" data-k="${id}" data-r="${escH(ref)}"><b>${nm}</b><span>${sub}</span></button>`;
  const stuff=[];
  for(const b of t.biz) stuff.push(row(`biz:${b.id}`, TY_BIZ[b.k].nm,
      `${TY_BIZ[b.k].shell?'空殼':'估值 '+tyM(tyBizVal(b)*b.own)}
       · 持股 ${(b.own*100).toFixed(0)}%${b.pub?' · 上市':''}`));
  for(const p of t.pos) stuff.push(row(`pos:${p.k}`, tyAsset(p.k).nm,
      `${p.q<0?'空單 ':''}${tyM(Math.abs(tyPosVal(p)))} · 成本 ${tyM(Math.abs(p.cb))}`));
  if(t.cash>0) stuff.push(row('cash','現金',tyM(t.cash)));
  if(t.holdco) stuff.push(row('hold','控股層',`集團利潤掛在這裡,稅率 ${(s.tax*100).toFixed(1)}%`));

  /* 就地可以做的事。
     使用者:「可以在按鈕顯示所需要的條件」—— 所以這裡的每一顆按鈕都跟
     事業 / 手法那兩頁走同一套:條件沒過就是灰的,底下寫著缺什麼缺多少。 */
  const act=(html,need)=>`<div class="ty-act">${html}${need?tyNeedHTML(need,'tight'):''}</div>`;
  const acts=[];
  for(const a of TY_ASSETS){
    if(!s.kind.includes(TY_ASSET_KIND[a.k]||'ex')) continue;
    const edge=tySpecEdge(id,'asset',a.k);
    const lock = a.k==='estate' ? tyNeedPartner(id) : null;
    const need = lock
      ? [tyNb(`${TY_REGIONS[lock].nm}的在地夥伴`, false,
              `在${s.nm}買不動產要先有在地夥伴 —— 去「手法」找 ${TY_PARTNERS[lock].nm}`)]
      : null;
    acts.push(act(
      `<button type="button" class="ty-b${lock?' no':''}" data-ty="buy" data-k="${a.k}"
        data-site="${id}"${lock?' disabled aria-disabled="true"':''}
        title="${escH(lock?`要先有 ${TY_PARTNERS[lock].nm}`:'買 '+a.nm)}">買 ${a.nm}</button>`
      + (edge?`<span class="a-edge">${edge}</span>`:''), need));
  }
  if(s.kind.includes('bank') && TY.cashSite!==id)
    acts.push(act(tyActBtn('movecash', id, '把現金搬來', ` data-site="${id}"`, 'alt'),
                  tyNeeds('movecash', id)));
  if(s.kind.includes('shell'))
    acts.push(act(tyActBtn('found', {k:'shell',site:id},
      `開空殼公司 ${tyM(tyBizCost('shell',id))}`, ` data-k="shell" data-site="${id}"`, 'alt'),
      tyNeeds('found', {k:'shell',site:id})));
  if(TY.biz.some(b=>TY_BIZ[b.k].shell && b.site===id) && TY.holdco!==id)
    acts.push(act(tyActBtn('holdco', id, '設為控股層', ` data-site="${id}"`, 'warn'),
                  tyNeeds('holdco', id)));
  if(TY_PARTNERS[s.reg] && !par)
    acts.push(act(tyActBtn('partner', s.reg, `找 ${TY_PARTNERS[s.reg].nm} 合資 ${tyM(tyPartnerCost())}`,
      ` data-reg="${s.reg}"`, 'alt'), tyNeeds('partner', s.reg)));

  /* 在這裡開公司。每一家都寫出:在這裡要多少錢、比別的地方好在哪、還差什麼。 */
  const founds=Object.entries(TY_BIZ)
    .filter(([k,d])=>!d.shell && s.kind.includes(TY_BIZ_KIND[k]||'hq'))
    .map(([k,d])=>{
      const cost=tyBizCost(k,id), edge=tySpecEdge(id,'biz',k);
      const cf=cost*(d.fameCf ? .015+TY.fame/100*.20 : d.cf)
             * tySpecMul(id,'biz',k,'cf') * tyClamp(idx,.3,2.2);
      return act(
        `<button type="button" class="ty-b${tyCanDo('found',{k,site:id})?'':' no'}"
          data-ty="found" data-k="${k}" data-site="${id}"${
          tyCanDo('found',{k,site:id})?'':' disabled aria-disabled="true"'}
          title="${escH(tyBlock('found',{k,site:id})||d.nm)}">開${d.nm} ${tyM(cost)}</button>`
        + (edge?`<span class="a-edge">${edge}</span>`:'')
        + `<span class="a-pre">第一季現金流約 <b class="${cf>=0?'up':'down'}">${tySgn(cf)}</b></span>`,
        tyNeeds('found',{k,site:id}));
    }).join('');

  /* 部隊:誰駐在這裡、誰可以叫過來。這是「點地圖上的城市 → 調兵過去」那條路。 */
  const uHere=tyUnitsAt(id), uCome=tyUnits().filter(u=>u.to===id);
  const uCall=tyUnits().filter(u=>u.site!==id && u.to!==id);
  const thHere=tyThreats().filter(th=>th.site===id);
  const troops=(uHere.length||uCome.length||uCall.length||thHere.length)?`
    <div class="p-sec">部隊<span>${uHere.length} 支駐紮${uCome.length?` · ${uCome.length} 支在路上`:''}</span></div>
    ${thHere.map(th=>{ const r=tyRival(th.rid); return `<div class="ty-threat"><div class="th-h"><b>⚠ ${escH(r?r.nm:'?')}的併購小組正往這裡來</b>
      <em>${Math.max(0,th.eta-TY.t)} 季後抵達 · 防守率 ${(tyThreatBlock(th)*100).toFixed(0)}%</em></div></div>`; }).join('')}
    ${uHere.length||uCome.length?`<div class="ty-uchips">${[...uHere,...uCome].map(u=>
      `<span class="uch${u.to?' mv':''}">${TY_UNITS[u.k].ic} ${TY_UNITS[u.k].nm}${u.to?` · ${Math.max(1,u.eta-TY.t)} 季後到`:''}</span>`).join('')}</div>`:''}
    ${uCall.length?`<div class="ty-acts">${uCall.map(u=>act(
      tyActBtn('deploy', {u, site:id}, `叫${TY_UNITS[u.k].ic}${TY_UNITS[u.k].nm}過來(${Math.max(1,tyTravel(u.site,id))} 季)`,
               ` data-id="${u.id}" data-site="${id}"`, 'alt'))).join('')}</div>`:''}`:'';

  return `<div class="p-hd">
      <button type="button" class="p-back" data-ty="iso" data-k="${s.iso}">← ${escH(REGION_NAME[s.iso]||s.iso)}</button>
      <b>${escH(s.nm)}</b>
      <span>${escH(s.sub||'')}${s.sub?' · ':''}${escH(REGION_NAME[s.iso]||s.iso)} · ${R.nm}</span></div>
    <div class="ty-facts">
      <div><em>法定公司稅率</em><b>${(s.tax*100).toFixed(1)}%</b></div>
      <div><em>地區指數</em><b class="${idx>=1?'up':'down'}">${((idx-1)*100>=0?'+':'')}${((idx-1)*100).toFixed(1)}%</b></div>
      <div><em>政策風險</em><b>${(R.pol||0)>=.8?'高':(R.pol||0)>=.45?'中':'低'}${par?'(有夥伴,減半)':''}</b></div>
      <div><em>當地競爭</em><b>${TY.reg[s.reg].comp>.5?TY.reg[s.reg].comp.toFixed(1):'—'}</b></div>
    </div>
    <div class="p-note">${escH(s.note)}</div>
    <div class="p-sec">這個城市的特色<span>優點在前,缺點在後 —— 每個城市兩種都有</span></div>
    <div class="expo-note">標籤直接改變<b>在這裡</b>做事的數字:開辦成本、現金流、估值倍數、
      交易成本、租金與配息。所以同一家公司開在不同城市,結果是不一樣的。</div>
    ${tySpecHTML(id)}
    ${TY_BLD?tyBldCard(id,TY_BLD):''}
    ${troops}
    ${stuff.length?`<div class="p-sec">你在這裡有什麼<span>${tyM(t.val)}</span></div>
        <div class="expo-note">點任何一列(或地球上的那一棟)看它自己的資訊與可以做的事。</div>
        ${stuff.join('')}`
                  :`<div class="p-sec">你在這裡什麼都沒有</div>`}
    <div class="p-sec">在這裡可以做什麼<span>${s.kind.map(k=>TY_KIND[k]).join(' · ')}</span></div>
    <div class="ty-acts col">${acts.join('')}</div>
    ${founds?`<div class="p-sec">在這裡開公司<span>金額與現金流都已經算進這個城市的特色</span></div>
      <div class="ty-acts col">${founds}</div>`:''}`;
}


/* =========================================================================
   怎麼玩 —— 名詞表與大師的走法
   -------------------------------------------------------------------------
   使用者回報:「有很多我都沒有看過的名詞,也不知道可以幹嘛。」

   那是我的錯,不是他的。這一頁把富豪們真正用的手法做成按鈕,但那些手法的
   名字(借殼、控股層、浮存金、追繳保證金)本來就是圈內人的話。一個看不懂
   按鈕在做什麼的人,按下去只會覺得自己在亂按 —— 那就不是模擬,是抽獎。

   所以這一分頁有三段:
     1. 三十秒看懂:錢在這裡只有三條路可以走
     2. 名詞表:每一個詞一句白話 + 「在這裡它是哪一顆按鈕」
     3. 大師的走法:把公開報導過的真實商業模式,翻譯成這裡的操作順序,
        而且會標出你已經做到哪一步

   ⚠ 第 3 段寫的是**公開、可查證的商業模式**,不是對任何人的評價,
     也不是建議照著做。這一點畫面上一定要寫出來。
   ========================================================================= */

/* ---- 錢的三條路 ---- */
const TY_PATHS = [
  { ic:'📈', nm:'買資產', dsc:'拿錢換一個會漲、會生孳息的東西。最簡單,天花板也最低 ——'
    + '因為你的報酬就是市場的報酬。', go:'asset' },
  { ic:'🏢', nm:'開事業', dsc:'拿錢換一台每季吐現金、而且可以被**估值倍數**放大的機器。'
    + '真正的巨富幾乎都在這條路上:資產讓你有錢,事業讓你上榜。', go:'biz' },
  { ic:'♟', nm:'改規則', dsc:'不買東西也不開公司,而是改變遊戲本身:借錢放大、把稅搬到別的國家、'
    + '把債丟給公司、用名氣換現金流。這條路最快,也最容易把你送進監獄。', go:'play' },
];

/* ---- 名詞表 ---- */
const TY_TERMS = [
  { g:'錢與風險', t:'淨值', d:'你所有東西加起來、扣掉負債之後真正屬於你的錢。這個遊戲只在乎這一個數字。',
    h:'畫面最上面第一格。' },
  { g:'錢與風險', t:'槓桿', d:'用借來的錢投資。賺的時候賺兩倍,賠的時候賠兩倍 —— 而且利息不管你賺不賺錢都要付。',
    h:'「手法」的抵押借款。' },
  { g:'錢與風險', t:'抵押成數(LTV)', d:'一樣東西可以拿去抵押借到幾成。債券 85%、房地產 75%、加密貨幣只有 20%。',
    h:'資產列上寫著「抵押 75%」的那個數字。' },
  { g:'錢與風險', t:'追繳保證金', d:'抵押品跌價,借款超過可以借的上限,銀行**不問你**直接賣掉你的東西還債。',

function tyLearnTab(){
  const paths=TY_PATHS.map(p=>`<button type="button" class="ty-path" data-ty="tab" data-k="${p.go}">
      <span class="p-ic">${p.ic}</span>
      <span class="p-t"><b>${p.nm}</b><span>${p.dsc.replace(/\*\*(.+?)\*\*/g,'<em>$1</em>')}</span></span>
      <span class="p-go">去看 →</span></button>`).join('');

  const gs=[...new Set(TY_TERMS.map(t=>t.g))];
  const terms=gs.map(g=>`<div class="p-sec">${g}</div>
    <div class="ty-terms">${TY_TERMS.filter(t=>t.g===g).map(t=>`
      <div class="ty-term"><b>${t.t}</b>
        <span>${t.d.replace(/\*\*(.+?)\*\*/g,'<em>$1</em>')}</span>
        <i>▸ ${t.h}</i></div>`).join('')}</div>`).join('');

  const books=TY_PLAYBOOKS.map(b=>{
    const done=b.steps.map(s=>{ try{ return !!s.d(); }catch(e){ return false; } });
    const n=done.filter(Boolean).length;
    return `<div class="ty-book">
      <div class="b-hd"><span class="b-ic">${b.ic}</span>
        <span class="b-t"><b>${b.nm}</b><span>${b.tag}</span></span>
        <span class="b-p">${n} / ${b.steps.length}</span></div>
      <div class="b-real"><em>他實際做過的事:</em>${b.real}</div>
      <div class="b-lesson">${b.lesson.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}</div>
      <div class="b-steps">${b.steps.map((s,i)=>
        `<div class="b-s${done[i]?' on':''}"><i>${done[i]?'✓':i+1}</i>${s.t}</div>`).join('')}</div>
      ${b.scn&&TY.scn!==b.scn?`<div class="b-note">這條路要從「${
        TY_SCN.find(x=>x.k===b.scn).nm}」開局才走得完整 —— 你這一局是「${tyScn().nm}」。</div>`:''}
    </div>`;
  }).join('');

  return `<div class="ty-learn">

/* 頂列那一張很小的淨值走勢圖。
   使用者:「在最上面可以有個小小圖可以顯示我資產的 k 線圖走勢」。
   ⚠ 這裡**不是** K 棒。一季只產生一個價格,四十根柱子看不出任何形狀 ——
     折線才讀得出「這十年你走了什麼路」(跟資產那一頁同一個理由)。
     顏色照台股的規矩:紅漲綠跌,基準是這一局的起點。
   點下去開富豪榜,因為那才是這條線的意義:你跟別人的距離。 */
function tyTopSpark(){
  const d=(TY.nw||[]).slice(-40);
  if(d.length<2) return '';
  const W=40, H=16, P=1.5;
  const mn=Math.min(...d), mx=Math.max(...d), rg=(mx-mn)||1;
  const X=i=>P+i/(d.length-1)*(W-P*2), Y=v=>H-P-(v-mn)/rg*(H-P*2);
  const line=d.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' L');
  const up=d[d.length-1]>=d[0];
  const col=up?'var(--up)':'var(--down)';
  return `<svg class="tg-spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"
      preserveAspectRatio="none">
      <path d="M${X(0).toFixed(1)},${H-P} L${line} L${X(d.length-1).toFixed(1)},${H-P} Z"
            fill="${col}" opacity=".22"/>
      <path d="M${line}" fill="none" stroke="${col}" stroke-width="1.5"
            stroke-linejoin="round" stroke-linecap="round"/>
    </svg>`;
}

/* 右側的功能鈕。參考畫面把它們做成斜切的盾牌貼在右緣 —— 那個形狀的作用是

  'deal:pact':   e=>tyDeal('pact', e.dataset.r),

function bindTycoon(root){
  const el=root.querySelector('#tyRoot');
  if(!el) return;
  // 地圖是底層,永遠在 —— 只要在這一頁就把地球掛進去
  // 面板蓋上來的時候地球是看不到的(見 .tycon[data-modal]),那就別再燒 60fps。
  if(TY){ tyGlobeMount(); tyGlobeAwake(!TY_MODAL || tySideModal()); } else tyParkGlobe();
  // 市場下拉是 <select>,它發的是 change 不是 click
  el.querySelectorAll('select[data-mkt]').forEach(sel=>{
    sel.onchange=()=>{ TY_MKT[sel.dataset.mkt]=sel.value; renderPage(); };
  });
  el.querySelectorAll('select[data-strk]').forEach(sel=>{
    sel.onchange=()=>{ TY_STRK[sel.dataset.strk]=sel.value; renderPage(); };
  });
  el.querySelectorAll('select[data-dep]').forEach(sel=>{
    sel.onchange=()=>{ TY_DEP[sel.dataset.dep]=sel.value; renderPage(); };
  });
  el.querySelectorAll('select[data-bizsite]').forEach(sel=>{
    sel.onchange=()=>{ TY_BIZSITE[sel.dataset.bizsite]=sel.value; renderPage(); };
  });
  /* 金額輸入:一邊打字一邊更新底下的預覽,但**不要重畫整頁** ——
     重畫會讓輸入框失焦,打第二個字就會掉出去。所以只換預覽那幾行。 */
  const amt=el.querySelector('#tyAmt');
  if(amt){
    amt.oninput=()=>{
      const v=parseFloat(amt.value);
      TY_AMT = (amt.value.trim()==='' || !isFinite(v) || v<=0) ? null : v*1e8;
      el.querySelectorAll('.ty-chip[data-ty="size"]').forEach(c=>
        c.classList.toggle('on', TY_AMT==null && Math.abs(TY_SIZE-+c.dataset.v)<1e-9));
      el.querySelectorAll('.ty-row').forEach(r=>{
        const k=r.querySelector('[data-ty="exp"]')?.dataset.k;
        const pre=r.querySelector('.r-pre');
        if(k && pre) pre.innerHTML=tyBuyPreview(k, tyMktOf(k));
      });
    };
  }
  /* 手法 / 加碼的自訂金額。跟上面的下單金額同一個理由:
     一邊打字一邊更新底下那一行預覽,但**不要重畫整頁** —— 重畫會失焦。 */
  el.querySelectorAll('input[data-pa]').forEach(inp=>{
    inp.oninput=()=>{
      const key=inp.dataset.pa, v=parseFloat(inp.value);
      TY_PAMT[key] = (inp.value.trim()==='' || !isFinite(v) || v<0) ? null : v*1e8;
      const box=inp.closest('.ty-money');
      if(box){
        const cur=TY_PAMT[key];
        box.querySelectorAll('.ty-chip[data-ty="pamt"]').forEach(c=>
          c.classList.toggle('on', cur!=null && Math.abs(cur-+c.dataset.v)<1e5));
      }
      const out=el.querySelector(`[data-pav="${CSS.escape(key)}"]`);
      if(out){
        const act=key.split(':')[0];
        const arg=act==='expand' ? TY.biz.find(x=>x.id===+key.split(':')[1]) : undefined;
        out.innerHTML=tyAmtPreview(act, arg, key);
      }
    };
  });
  el.addEventListener('click', ev=>{
    const b=ev.target.closest('[data-ty]');
    if(!b || b.disabled) return;
    const a=b.dataset.ty;

    /* 新的一局落在「怎麼玩」,不是「資產」。
       使用者回報「有很多名詞我沒看過,也不知道可以幹嘛」—— 那代表預設把人
       丟到一整排看不懂的按鈕前面是錯的。先讓他看懂,再讓他按。 */
    if(a==='start'){ tyStart(b.dataset.k); TY_MODAL='learn'; TY_MSG=''; renderPage(); return; }
    if(!TY) return;                 // 還沒開局,除了選劇本沒有別的能按
    /* 面板:modal:asset / modal:log / … 。同一顆再按一次就關掉。 */
    if(a.startsWith('modal:')){
      const k=a.slice(6);
      TY_MODAL = TY_MODAL===k ? null : k;
      if(TY_MODAL==='rank') loadRich();
      renderPage(); return;
    }
    if(a==='close'){ TY_MODAL=null; TY_BLD=null; renderPage(); return; }
    /* 總覽 = 據點面板的最上層(世界):你的帝國在哪幾個國家、各地區的景氣。 */
    if(a==='overview'){
      TY_SEL=null; TY_ISO=null; TY_BLD=null;
      TY_MODAL = TY_MODAL==='site' ? null : 'site';
      renderPage(); return;
    }
    if(a==='tab'){ TY_MODAL=b.dataset.k; renderPage(); return; }
    if(a==='layer'){ TY_LAYER=b.dataset.k; if(TYG) TYG.polygonCapColor(tyCountryColor).polygonSideColor(tyCountrySide).polygonAltitude(tyCountryAlt); renderPage(); if(window.W3D) W3D.repaint(); return; }
    if(a==='zoomin'||a==='zoomout'){ tyZoom(a==='zoomin'?-1:1); return; }
    if(a==='ranktab'){ TY_RANK=b.dataset.k; renderPage(); if(TY_RANK==='real') loadRich(); return; }
    if(a==='rival'){
      // 從別的面板(例如「資料」)點對手 → 直接打開對手面板並展開那一位
      if(TY_MODAL!=='rival'){ TY_MODAL='rival'; TY_RIVAL=b.dataset.k; }
      else TY_RIVAL = TY_RIVAL===b.dataset.k ? null : b.dataset.k;
      TY_DEAL=null; renderPage(); return;
    }
    if(a==='dealx'){ TY_DEAL = TY_DEAL===b.dataset.k ? null : b.dataset.k; renderPage(); return; }
    if(a==='iso'){ tyPickIso(b.dataset.k || (TY_ISO||'')); return; }
    if(a==='site'){ tyPickSite(b.dataset.k, b.dataset.r||null); return; }
    if(a==='size'){ TY_SIZE=+b.dataset.v; TY_AMT=null; renderPage(); return; }
    /* 手法 / 加碼的金額晶片。每一個動作有自己的一格,key 讓同一種動作
       可以有很多個對象(每一家公司一個「加碼多少」)。 */
    if(a==='pamt'){ TY_PAMT[b.dataset.k]=+b.dataset.v; renderPage(); return; }
    if(a==='exp'){ TY_EXP = TY_EXP===b.dataset.k ? null : b.dataset.k; renderPage(); return; }
    /* 下一季:狀態先變、畫面後到。snap 記下「之前」,play 把差別演出來
       (數字跳動、據點浮出賺賠、對手擴張的弧線)。演出只是重播,不影響任何數字。 */
    if(a==='next'){
      TY_MSG='';
      const snap=window.W3D ? W3D.snap() : null;
      tyNext(); renderPage();
      if(snap) W3D.play(snap);
      return;
    }
    if(a==='restart'||a==='quit'){
      /* 放棄要確認 —— 這是這一頁唯一一個「按下去就回不去」的動作。
         用瀏覽器原生的 confirm,跟站上刪除持倉那裡同一種作法。 */
      if(a==='quit' && !confirm('放棄這一局?這一局的紀錄會被刪掉,無法復原。')) return;
      tyClear(); TY_MSG=''; renderPage(); return;
    }
    /* 一局結束之後,除了換分頁與重開,其餘動作一律不受理。
       tyNext() 自己有擋,但買賣、借款、開公司沒有 —— 不擋的話你可以在
       「破產」那張結算卡底下繼續下單,而且淨值還會跟著動。 */
    if(TY.done){
      TY_MSG='這一局已經結束了。按上面的「再玩一局」開新的一局。';
      renderPage(); return;
    }
    /* 🎯 地圖上選:關掉面板(手機)或保留側欄(桌機),進入拉線模式 */
    if(a==='aim'){
      const k=b.dataset.k;
      if(k==='unit'){ const u=tyUnits().find(x=>x.id===+b.dataset.id); if(u) tyAimUnits([u]); }
      else tyAimStrike(k);
      return;
    }
    const fn=TY_ACT[a];
    if(!fn) return;
    TY_LAST_MOVE=null; TY_LAST_STRIKE=null;
    TY_MSG = fn(b) || '';
    renderPage();
    tyPlayLast();
  });
}

tyLoad();      // 有存檔就接著上一局玩,沒有就是選劇本的畫面


/* ═══ 從 ORBIT 帶過來:鍵盤可操作 armKeyboard(原檔 16204–16229 行) ═══ */

const KBD_SEL = ['.mtab','.pf-btn','.sim-btn','.skb','.gchip','.amk','.pre',
                 '.dr-do','.fb-btn','.mk.qb','.star','.kchip','.pclose',
                 'tr[data-tk]','tr[data-row]','article.jn-c','[data-pf]'].join(',');
function armKeyboard(root){
  (root||document).querySelectorAll(KBD_SEL).forEach(el=>{
    // 本來就能聚焦的(<a> <button> <input>)不要動它
    if(el.tabIndex>=0 || ['A','BUTTON','INPUT','SELECT','TEXTAREA'].includes(el.tagName)) return;
    el.tabIndex=0;
    el.dataset.kbd='1';
    if(!el.getAttribute('role') && !['TR','ARTICLE','TD','TH'].includes(el.tagName))
      el.setAttribute('role','button');
  });
}
/* Enter 與空白鍵要跟點一下一樣。<button> 是瀏覽器自己做這件事,
   <span> 得自己來。空白鍵要 preventDefault,不然頁面會往下捲一頁。 */
addEventListener('keydown', e=>{
  if(e.key!=='Enter' && e.key!==' ' && e.key!=='Spacebar') return;
  const el=e.target;
  if(!el || !el.dataset || el.dataset.kbd!=='1') return;
  e.preventDefault();
  el.click();
});

/* 底部分頁列的選取狀態。
   「更多」那一格要在目前這頁被收在裡面時也亮起來 —— 不然使用者在「配息」頁
   會看到底下五格全是暗的,像是自己不在任何一頁上。 */

/* ═══ 從 ORBIT 帶過來:tip / showTip / hideTip(原檔 21651–21663 行) ═══ */

const tip=document.getElementById('tip');
addEventListener('mousemove',e=>{
  // 其他分頁上根本沒有這個框(CSS 已經 display:none),不必每一次滑鼠移動
  // 都去改兩個 style —— 那是整個網站上觸發最頻繁的一段程式碼。
  if(PAGE!=='globe') return;
  tip.style.left=(e.clientX+14)+'px';
  tip.style.top =(e.clientY+14)+'px';
});
function showTip(t){ tip.textContent=t; tip.style.whiteSpace='pre'; tip.style.opacity='1'; }
function hideTip(){ tip.style.opacity='0'; }

/* ========================= 模式切換 ========================= */
// 只有地區曝險那一頁的「客觀 vs 我的」對比才有意義,其他模式隱藏視角切換

/* ═══ 從 ORBIT 帶過來:typeBrief(原檔 21949–21982 行) ═══ */

let typeTimer=null;
function typeBrief(text){
  clearInterval(typeTimer);
  const el=document.getElementById('brief');
  if(!el) return;                 // 晨報面板不在時(例如未來換版面)不該讓呼叫端整個炸掉
  /* ⚠ 這裡是 innerHTML,而呼叫端常常會把標的名稱拼進去
     (「已記錄並更新持倉:${h.nm} …」)。名稱可能來自匯入的檔案或同步下來的
     JSON,不是自己敲的 —— 所以一律先跳脫,再把自己要用的標籤放回去。
     這樣呼叫端可以繼續用 <b> 標重點,但資料裡的 < 不會變成標籤。 */
  const safe=escH(text).replace(/&lt;(\/?)(b|i|em|strong|br)&gt;/g,'<$1$2>');
  let i=0;
  el.innerHTML='<span class="cursor"></span>';
  typeTimer=setInterval(()=>{
    i+=2;
    el.innerHTML=safe.slice(0,i)+'<span class="cursor"></span>';
    if(i>=safe.length) clearInterval(typeTimer);
  },16);
}

/* =========================================================================
   個股詳情 / K 線
   -------------------------------------------------------------------------
   為什麼自己畫而不是拉 TradingView 的 lightweight-charts:
     這個網站是「單一 HTML、無建置流程」,而且整套 HUD 有很固定的視覺語言
     (青色細線、等寬字、掃描線)。外掛圖表庫要嘛長得不像這裡的東西,
     要嘛得寫一堆覆寫樣式。Canvas 自己畫大概兩百行,配色、十字線、
     縮放手感全部拿得回來,也不用多一個 CDN 依賴。

   資料來源:
     歷史 K 線  → /api/kline  (Yahoo chart,台股美股日韓股加密貨幣通用)
     台股盤中   → /api/mis    (證交所 MIS,約 5 秒一次快照,含最佳五檔)
     海外盤中   → /api/quotes (Yahoo,約 15 分鐘延遲,誠實標示出來)
   ========================================================================= */


/* ═══════════════════════════════════════════════════════════════════════
   外殼 —— 這個專案只有一頁,所以路由只是「把帝國畫出來」
   -----------------------------------------------------------------------
   ORBIT 那邊的 renderPage() 要認得十幾頁,這裡不用。保留同名函式是因為
   帝國內部到處都在呼叫 renderPage() 重畫自己 —— 改名的話要動幾十個地方,
   而那才是真正會出錯的地方。

   ⚠ 那兩層包裝(.pg > #pgBody)不可以省。指揮台是全螢幕的,而它的高度
     完全靠這兩條既有的規則撐起來:
       body[data-route="tycoon"] .pg     { height:100%; display:flex; ... }
       body[data-route="tycoon"] #pgBody { flex:1; min-height:0; display:flex; ... }
     第一版直接把 .tycon 塞進 #page,結果整個指揮台塌成 138px 高 ——
     頂部身分列跟底部導覽列疊在一起,而畫面上看起來只是「有點怪」,
     不像壞掉。照原樣包起來,站上所有 CSS 就一條都不用改。
   ═══════════════════════════════════════════════════════════════════════ */
let PAGE='tycoon';
function renderPage(){
  const host=document.getElementById('page');
  if(!host) return;
  tyParkGlobe();                       // 重畫之前先把 WebGL 搬出去(見上面的註解)
  host.innerHTML=`<div class="pg"><div id="pgBody">${tycoonPage()}</div></div>`;
  bindTycoon(host);
}
const goPage = () => renderPage();

/* ---------- 國界 ----------
   地圖那一頁要把國家畫成多邊形,資料是 Natural Earth 的 110m 國界。

   ⚠ 抓不到**不可以讓整個遊戲打不開**。ORBIT 那邊踩過一次:抓不到就把載入
     畫面換成錯誤訊息然後 return,於是那層蓋住全螢幕的元素永遠不會消失,
     整個網站都打不開。所以這裡抓不到就把 GEO_OK 設成 false,
     地圖那一頁自己會說載不到,其餘照常玩。 */
const GEO_URLS=[
  'https://unpkg.com/three-globe/example/country-polygons/ne_110m_admin_0_countries.geojson',
  'https://cdn.jsdelivr.net/npm/three-globe/example/country-polygons/ne_110m_admin_0_countries.geojson',
];
(async function loadGeo(){
  let feats=null;
  for(const u of GEO_URLS){
    try{
      const r=await fetch(u);
      if(!r.ok) continue;
      const j=await r.json();
      feats=j.features; break;
    }catch(e){ /* 換下一個來源 */ }
  }
  if(!feats){ GEO_OK=false; renderPage(); return; }
  countries = feats.filter(f => (f.properties.ADMIN||f.properties.NAME) !== 'Antarctica');
  renderPage();                        // 國界到了,地圖那一頁要重畫一次
})();

/* 佈景:深色 / 淺色 / 跟隨系統。
   ⚠ 這顆鈕不可以放進 #topnav —— 站上有一條
     `body[data-route="tycoon"] #topnav{display:none}`,放進去就永遠看不到。
     (指揮台是全螢幕的,ORBIT 的導覽列在這一頁本來就讓開。) */
function bindTheme(){
  const el=document.getElementById('navTheme');
  if(!el) return;
  const lab={dark:'◐ 深色',light:'◑ 淺色',auto:'◓ 跟隨系統'};
  const paint=()=>{ el.textContent=lab[THEME]||'◐'; };
  const cyc=()=>{ const n=THEME==='dark'?'light':THEME==='light'?'auto':'dark';
                  applyTheme(n); paint(); renderPage(); };
  el.onclick=cyc;
  el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); cyc(); } };
  paint();
}

applyTheme(THEME, true);
bindTheme();
armKeyboard(document);
renderPage();
