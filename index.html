  @keyframes flp{0%,100%{transform:rotate(45deg) scale(.75);opacity:.75}
                 50%{transform:rotate(45deg) scale(1.25);opacity:1}}
  .k-energy .fw{position:absolute;left:0;top:0;border-radius:50%;border:1px solid var(--c);
    transform:translate(-50%,-50%);animation:qw 2.1s ease-out infinite;opacity:0}
  .k-energy .fw.b{animation-delay:1.05s}

  /* — 戰爭:沿用衝突的十字準星 — */
  .k-war .wr{position:absolute;left:-15px;top:-15px;width:30px;height:30px;
    border:1px solid var(--c);opacity:.6;animation:spin 8s linear infinite}
  .k-war .wr.b{left:-9px;top:-9px;width:18px;height:18px;border-style:dashed;
    animation-duration:5s;animation-direction:reverse}
  .k-war .ws{position:absolute;left:0;top:0;border-radius:50%;border:1px solid var(--c);
    transform:translate(-50%,-50%);animation:shock 2.4s cubic-bezier(.15,.7,.3,1) infinite;opacity:0}
  .k-war .ws.b{animation-delay:1.2s}
  .k-war .wc{position:absolute;left:-3.5px;top:-3.5px;width:7px;height:7px;border-radius:50%;
    background:var(--c);box-shadow:0 0 14px var(--c),0 0 28px var(--c)}

  /* 事件類型小標籤 */
  .kd{font-family:var(--mono);font-size:8px;padding:1px 5px;border:1px solid currentColor;
    margin-right:5px;letter-spacing:.08em}
  /* float 在 flex 容器裡不生效,留著只會讓人以為它靠右對齊。改成跟著排。 */
  .ni .play{font-family:var(--mono);font-size:8.5px;color:var(--accent);opacity:.55}
  .ni:hover .play{opacity:1}
  .ni.playing{background:rgba(var(--accent-rgb),.10);border-left:2px solid var(--accent)}

  /* ---------- 衝突詳情面板 ---------- */
  .cd{padding:13px 14px;border-bottom:1px solid var(--line)}
  .cd-hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .cd-nm{font-size:16px}
  .cd-lv{font-family:var(--mono);font-size:9px;padding:2px 6px;border:1px solid currentColor;letter-spacing:.1em}
  .cd-sub{font-family:var(--mono);font-size:9px;color:var(--txt-dim);letter-spacing:.13em;margin-top:4px}
  .sec-lab{font-size:17px;font-weight:600;letter-spacing:-.018em;color:var(--txt);
    margin:26px 0 10px}
  .cmd{font-family:var(--mono);font-size:10.5px;display:flex;justify-content:space-between;margin-bottom:3px}
  .cmdbar{height:4px;border-radius:2px;background:rgba(var(--hairline-rgb),.08);position:relative;margin-bottom:8px}
  .cmdbar::before{content:'';position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:rgba(var(--hairline-rgb),.25)}
  .cmdbar i{position:absolute;top:0;bottom:0;transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .scn{border-left:2px solid;padding:5px 0 5px 9px;margin-bottom:9px;font-size:11.5px;line-height:1.6;color:var(--txt-dim)}
  .scn .p{font-family:var(--mono);font-size:9px;letter-spacing:.1em;display:block;margin-bottom:2px}
  .scn b{color:var(--txt);font-weight:400}
  .dmg{font-family:var(--mono);font-size:22px;margin:2px 0 4px}

  #tip{
    position:fixed;z-index:40;pointer-events:none;padding:6px 9px;
    background:rgba(var(--bg-deep-rgb),.94);border:1px solid var(--line-strong);
    font-family:var(--mono);font-size:10.5px;opacity:0;transition:opacity .12s;white-space:nowrap;
  }
  #load{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
        flex-direction:column;gap:12px;background:var(--bg);transition:opacity .7s}
  #load .lg{font-family:var(--mono);font-size:12px;letter-spacing:.4em;color:var(--accent)}
  #load .lb{width:180px;height:2px;background:rgba(var(--accent-rgb),.15);overflow:hidden}
  #load .lb i{display:block;height:100%;background:var(--accent);width:30%;
    animation:slide 1.1s ease-in-out infinite;box-shadow:0 0 12px var(--accent)}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(430%)}}

  ::-webkit-scrollbar{width:5px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(var(--accent-rgb),.28)}

  @media (max-width:1180px){
    #left,#right{width:250px}
    #right{max-height:calc(100vh - 200px)}
    #gapNote{width:250px}
    #view{top:auto;bottom:74px;left:12px;right:auto}
  }
  /* 手機版:面板改成全螢幕、表單改兩欄、模式列可橫向捲動 */
  @media (max-width:840px){
    #gapNote{display:none}
    #view{display:none}
    /* iPhone 瀏海 / 動態島會蓋住頂端 —— 用 safe-area-inset 把整排往下推,
       viewport-fit=cover 已經在 <meta viewport> 設了,這裡才吃得到這個值。
       手機加到主畫面(standalone)時最明顯,一般 Safari 分頁通常還好但保險起見都加。 */
    #top{top:calc(var(--navh) + 8px);left:10px;right:10px;
         transform:none;width:auto;overflow:hidden}
    #top .brand{font-size:11px;padding:9px 12px;letter-spacing:.28em}
    /* 關鍵修正:flex 子元素預設不會縮小到比內容還窄,
       沒有 min-width:0 的話 .modes 會直接撐開整排,
       把後面的 💰 📰 按鈕擠出 #top 之外,又被 overflow:hidden 整個裁掉 ——
       這就是「按鈕都沒反應」的真正原因,不是按鈕邏輯壞了,是根本按不到。 */
    .modes{overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
    .modes::-webkit-scrollbar{display:none}
    .mode{padding:9px 11px;font-size:9.5px;flex-shrink:0}
    #pfBtn,#newsBtn{flex-shrink:0}

    /* 左欄(持倉)改成跟右欄一樣、從底部滑上來的抽屜,用 💰 鈕開關 */
    #left{top:auto;bottom:calc(var(--tabtop) + 118px);
      left:10px;right:10px;width:auto;
      transition:transform .3s cubic-bezier(.2,.8,.2,1)}
    #left.mob-hide{transform:translateY(140%)}
    .holds{max-height:112px}
    .spark{height:34px}
    .mk{font-size:8px;padding:5px 2px}
    #pfBtn{display:flex}

    /* 右欄改成從底部滑上來的抽屜,用 📰 鈕開關 */
    /* 抽屜滑上來時要停在底部分頁列上方,不能被它切掉最後一行。
       ⚠ 讓開的方式一定要用 padding-bottom,不能改 bottom。收起來的狀態是
         translateY(102%) —— 那是「往下移動自己的 102% 高度」,只有在
         bottom:0 的時候才剛好整個離開畫面。把 bottom 墊高 50px,收起來時
         就會有 50px 卡在畫面下緣,從半透明的分頁列後面透出來。 */
    #right{display:flex;left:10px;right:10px;width:auto;top:auto;bottom:0;
      max-height:calc(66vh + var(--tabtop));padding-bottom:var(--tabtop);
      transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
      z-index:65}
    #right.mob-show{transform:translateY(0)}
    #newsBtn{display:flex}

    #skin{left:10px;right:10px;bottom:calc(var(--tabtop) + 70px);
      overflow-x:auto;scrollbar-width:none}
    #skin::-webkit-scrollbar{display:none}
    #skin .vlab,.skb{white-space:nowrap;padding:8px 8px;font-size:9px}

    #bot{left:10px;right:10px;bottom:calc(var(--tabtop) + 8px)}
    .bi{display:none}
    /* overflow:hidden 換成 overflow-y:auto,手機上可以用手指拖著看完整段晨報, */
    .btxt{font-size:11.5px;padding:9px 12px;max-height:64px;
      overflow-y:auto;-webkit-overflow-scrolling:touch}

    /* 手機螢幕小,原本給桌機的暗角+半透明面板疊在一起看起來偏暗、字不好讀,
       手機版把面板背景加深到接近不透明、暗角收窄,亮度感跟全螢幕面板一致。 */
    .panel{background:var(--panel-solid)}
    #vignette{box-shadow:inset 0 0 80px 0 rgba(0,0,0,.16)}

    /* 彈出面板全螢幕 */
    #alloc,#alloc.show{
      left:0;top:0;width:100vw;height:100vh;max-height:100vh;transform:none;border:0}
    #alloc::before,#alloc::after{display:none}
    /* 手機的關閉鈕要夠大才按得到,而且一定要浮在最上層 */
    .pclose{font-size:12px;padding:9px 14px;position:relative;z-index:20}
    .pclose.mob{display:inline-block}
    #alloc .ttl,#right .ttl{
      position:sticky;top:0;z-index:10;background:rgba(var(--panel-rgb),.97);padding:8px 12px}
    #right .ttl{border-bottom:1px solid var(--line)}
    /* 這兩個是全螢幕面板,從螢幕最頂端 top:0 開始畫,
       上次只顧到 #top 那排浮動按鈕的瀏海留白,忘了這裡也是從頂端算起。 */
    #alloc .ttl{padding-top:calc(8px + env(safe-area-inset-top))}
    #alloc .al-body{padding-bottom:env(safe-area-inset-bottom)}
    #page{inset:var(--navh) 0 0}
    .pg{padding:14px 12px 60px}
    .al-top{flex-direction:column;gap:12px}
    .al-ring{width:150px;height:150px;flex:0 0 150px;align-self:center}
    .al-grid{grid-template-columns:1fr}
    .pf-in,.tf-g{grid-template-columns:repeat(2,1fr)}
    .tag-grid{grid-template-columns:repeat(2,1fr)}
    .tag-card{max-height:88vh;overflow-y:auto}
    .pf-act,.tf-act{flex-direction:column}
    .add-in{flex-wrap:wrap}
    .add-in input{flex:1 1 40%}
  }
  /* ---------- 個股詳情 / K 線 ---------- */
  .kchip{font-family:var(--mono);font-size:8px;letter-spacing:.08em;color:var(--accent);
    border:1px solid var(--line-strong);padding:0 4px;margin-left:6px;opacity:.6;
    transition:.15s;position:relative;z-index:3}
  .hold:hover .kchip{opacity:1}
  .kchip:hover{background:var(--accent);color:var(--on-accent)}
  /* 取消關注只在滑到那一列時才顯示,免得整排都是叉叉、看起來像隨時會刪東西 */
  .kchip.un{color:var(--txt-dim);opacity:0}
  .hold:hover .kchip.un{opacity:.85}
  .kchip.un:hover{background:var(--danger);border-color:var(--danger);color:var(--on-accent);opacity:1}

  #stock{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);
    width:min(940px,calc(100vw - 32px));max-height:calc(100vh - 90px);overflow-y:auto;
    z-index:70;opacity:0;pointer-events:none;transition:.3s cubic-bezier(.2,.8,.2,1);
  }
  #stock.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}

  /* ---------- 電腦版:K 線靠右停靠,不要蓋住底下那一頁 ----------
     使用者的原話:「日誌和技術面可以同時開啟,主要是在電腦版,因為我可能會
     邊看技術面邊寫日誌。」

     ⚠ 只在夠寬的螢幕上停靠(1180px)。再窄一點兩邊都會被擠到不能看,
       那時候浮在上面反而比較好用。
     ⚠ 停靠的時候遮罩要關掉 —— 遮罩存在的理由是「面板蓋住底下,點旁邊關掉」,
       停靠之後底下那一頁是要能用的,蓋一層遮罩等於把它鎖住。 */
  @media (min-width:1180px){
    body.dock #stock{
      left:auto;right:12px;top:64px;transform:none;
      width:min(620px,46vw);max-height:calc(100vh - 88px);
      box-shadow:0 18px 50px rgba(0,0,0,.28);
    }
    body.dock #stock.show{transform:none}
    body.dock #allocMask{display:none}
    /* 內容往左讓位,不要被面板壓在下面 */
    body.dock #page{padding-right:min(644px,calc(46vw + 24px))}
    body.dock .dock-hint{display:inline-flex}
  }
  .dock-hint{display:none;align-items:center;gap:5px;font-size:11px;
    color:var(--txt-faintest);margin-left:8px}
  /* ⚠ 預設藏起來。窄螢幕是頂端導覽,沒有「收起側欄」這個動作 */
  .sb-tg{display:none}
  #stock .ttl{position:sticky;top:0;background:rgba(var(--panel-rgb),.96);z-index:4}
  .sk-body{padding:0 0 16px}
  /* 字級。用 zoom 而不是改每一條 font-size:這一頁的尺寸全是 px,
     要靠變數縮放得先把幾十處改成 em,zoom 一行就能等比放大整個面板。
     只套 #stock —— 套整頁會連地球 canvas 一起縮,套左欄會讓拖曳座標失準。 */
  /* 只套在各面板的「內容區」,不套面板本身:
     套 #left 會讓拖曳的座標換算失準,套 <html> 會連地球 canvas 一起縮。 */
  :root[data-fs="s"]  .nav-box, :root[data-fs="s"]  .mkt, :root[data-fs="s"]  .holds,
  :root[data-fs="s"]  .wsearch, :root[data-fs="s"]  #rgnBox, :root[data-fs="s"]  #news,
  :root[data-fs="s"]  #dtBody, :root[data-fs="s"]  .al-body, :root[data-fs="s"]  #brief,
  :root[data-fs="s"]  .sk-body{zoom:.92}
  :root[data-fs="l"]  .nav-box, :root[data-fs="l"]  .mkt, :root[data-fs="l"]  .holds,
  :root[data-fs="l"]  .wsearch, :root[data-fs="l"]  #rgnBox, :root[data-fs="l"]  #news,
  :root[data-fs="l"]  #dtBody, :root[data-fs="l"]  .al-body, :root[data-fs="l"]  #brief,
  :root[data-fs="l"]  .sk-body{zoom:1.14}
  :root[data-fs="xl"] .nav-box, :root[data-fs="xl"] .mkt, :root[data-fs="xl"] .holds,
  :root[data-fs="xl"] .wsearch, :root[data-fs="xl"] #rgnBox, :root[data-fs="xl"] #news,
  :root[data-fs="xl"] #dtBody, :root[data-fs="xl"] .al-body, :root[data-fs="xl"] #brief,
  :root[data-fs="xl"] .sk-body{zoom:1.3}
  .skb.fs.on{background:var(--accent);color:var(--on-accent)}
  .fs-set{display:flex;border:1px solid var(--line);margin-left:auto;margin-right:8px}
  .fs-set span{font-family:var(--mono);font-size:11px;color:var(--txt-dim);
    padding:3px 8px;cursor:pointer;border-right:1px solid rgba(var(--accent-rgb),.14);transition:.15s}
  .fs-set span:last-child{border-right:0}
  .fs-set span:hover{color:var(--txt);background:rgba(var(--accent-rgb),.07)}
  .fs-set span.on{background:var(--accent);color:var(--on-accent)}

  /* 報價頭 —— 券商 app 最上面那塊 */
  .sk-hd{padding:14px 16px 12px;border-bottom:1px solid rgba(var(--accent-rgb),.12)}
  .sk-nm{font-size:17px;letter-spacing:.02em}
  .sk-sub{font-family:var(--mono);font-size:9.5px;color:var(--txt-dim);
    letter-spacing:.08em;margin-top:3px}
  .sk-px{display:flex;align-items:baseline;gap:12px;margin-top:9px;flex-wrap:wrap}
  .sk-px .big{font-family:var(--mono);font-size:34px;line-height:1;
    text-shadow:0 0 26px currentColor;transition:color .2s}
  .sk-px .dlt{font-family:var(--mono);font-size:14px}
  .sk-px .lv{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;
    border:1px solid currentColor;padding:2px 6px;opacity:.85;white-space:nowrap}
  .sk-px .lv.live{color:var(--ok);animation:kpulse 2s ease-in-out infinite}
  .sk-px .lv.delay{color:var(--amber)}
  /* 位階。中性色 —— 高位階不是「壞消息」,不該染成漲跌那兩個顏色。 */
  .sk-lvl{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;
    border:1px solid var(--line-strong);padding:2px 7px;white-space:nowrap;
    color:var(--txt-dim);display:inline-flex;align-items:baseline;gap:5px;
    cursor:help}
  .sk-lvl b{font-size:12px;font-weight:600;color:var(--txt);letter-spacing:0}
  .sk-lvl i{font-style:normal;font-size:8px;color:var(--txt-faint)}
  .sk-lvl.hot{border-color:rgba(var(--amber-rgb),.55);color:var(--amber)}
  .sk-lvl.hot b{color:var(--amber)}
  .sk-lvl.none{color:var(--txt-faint)}
  .sk-px .lv.shut{color:var(--txt-dim)}
  @keyframes kpulse{0%,100%{opacity:.5}50%{opacity:1}}
  .sk-px .big.tick{animation:kflash .5s ease-out}
  @keyframes kflash{0%{text-shadow:0 0 44px currentColor;filter:brightness(1.6)}
                    100%{text-shadow:0 0 26px currentColor;filter:none}}

  .sk-ohlc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 14px;margin-top:11px}
  .sk-ohlc div{font-family:var(--mono);font-size:10px;color:var(--txt-dim);
    display:flex;justify-content:space-between;gap:6px}
  .sk-ohlc div b{font-weight:400;color:var(--txt)}

  /* 分頁 */
  .sk-tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
  .sk-tab{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--txt-dim);
    padding:11px 16px;cursor:pointer;white-space:nowrap;border-right:1px solid rgba(var(--accent-rgb),.1);
    transition:.15s}
  .sk-tab:hover{color:var(--txt);background:rgba(var(--accent-rgb),.06)}
  .sk-tab.on{color:var(--on-accent);background:var(--accent)}
  .sk-pane{padding:12px 16px 0}

  /* 圖表工具列 */
  .sk-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    padding:10px 16px 8px}
  .sk-set{display:flex;border:1px solid var(--line)}
  .sk-set span{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--txt-dim);
    padding:6px 11px;cursor:pointer;border-right:1px solid rgba(var(--accent-rgb),.14);transition:.15s}
  .sk-set span:last-child{border-right:0}
  .sk-set span:hover{color:var(--txt);background:rgba(var(--accent-rgb),.07)}
  .sk-set span.on{background:var(--accent);color:var(--on-accent)}

  /* 圖 */
  .sk-cv{position:relative;margin:0 16px;border:1px solid rgba(var(--accent-rgb),.13);
    background:rgba(var(--bg-deep-rgb),.45);touch-action:none}
  .sk-cv canvas{display:block;width:100%;height:340px;cursor:crosshair}
  .sk-rd{display:flex;gap:13px;flex-wrap:wrap;padding:8px 16px 0;
    font-family:var(--mono);font-size:11.5px;line-height:1.6;color:var(--txt-dim);min-height:24px}
  .sk-rd b{font-weight:400;color:var(--txt)}
  .sk-ma{display:flex;gap:12px;flex-wrap:wrap;padding:6px 16px 0;
    font-family:var(--mono);font-size:11px;letter-spacing:.03em;line-height:1.6}
  .sk-ma i{font-style:normal;display:inline-block;width:14px;height:2px;
    vertical-align:middle;margin-right:4px}
  .sk-ma [data-edu]{cursor:help}
  .sk-msg{padding:26px 16px;text-align:center;font-size:12px;color:var(--txt-dim);
    font-family:var(--mono);letter-spacing:.05em}

  /* 教學輔助面板。固定在圖表下方而不是跟著游標飄 ——
     滑鼠在線上移動時,浮動 tooltip 會一直抖,而且手機上手指會擋住。 */
  .sk-edu{margin:10px 16px 0;padding:11px 13px;min-height:96px;
    border:1px solid rgba(var(--accent-rgb),.26);background:rgba(var(--accent-rgb),.045)}
  .sk-edu .eh{font-size:14px;color:var(--accent);letter-spacing:.02em;margin-bottom:6px}
  .sk-edu .eh span{font-family:var(--mono);font-size:11px;color:var(--txt-dim);
    margin-left:9px;letter-spacing:0}
  .sk-edu .ed{font-size:13px;line-height:1.75;color:var(--txt)}
  .sk-edu .ed b{color:var(--accent);font-weight:400}
  .sk-edu .en{margin-top:7px;font-size:13px;line-height:1.7;color:var(--ok)}
  .sk-edu .ew{margin-top:7px;font-size:12.5px;line-height:1.7;color:var(--amber);opacity:.92}
  .sk-edu .ew b{color:var(--amber);font-weight:400}

  /* 五檔 */
  .sk-dep{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;padding:2px 16px 0}
  .sk-dep .dh{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--txt-dim);
    padding-bottom:5px;border-bottom:1px solid rgba(var(--accent-rgb),.12);margin-bottom:5px}
  .dp{position:relative;display:flex;justify-content:space-between;
    font-family:var(--mono);font-size:10.5px;padding:4px 6px;margin-bottom:2px}
  .dp i{position:absolute;top:0;bottom:0;opacity:.16;transition:width .3s}
  .dp.b i{right:0}
  .dp.a i{left:0}
  .dp span{position:relative;z-index:2}
  .dp .q{color:var(--txt-dim)}

  /* 部位 */
  .sk-pos{display:grid;grid-template-columns:repeat(3,1fr);gap:9px 14px;padding:4px 16px 0}
  .sk-pos div{border:1px solid rgba(var(--accent-rgb),.13);padding:8px 10px;
    background:rgba(var(--bg-deep-rgb),.4)}
  .sk-pos .k{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;color:var(--txt-dim)}
  .sk-pos .v{font-family:var(--mono);font-size:14px;margin-top:4px}
  .sk-note{margin:12px 16px 0;padding:11px 13px;border:1px solid rgba(var(--accent-rgb),.2);
    border-left:2px solid var(--accent);background:rgba(var(--accent-rgb),.05);
    font-size:12.5px;line-height:1.85;color:var(--txt-dim)}
  .sk-note b{color:var(--txt);font-weight:400}

  .gm{border:1px solid var(--line);padding:10px 12px;margin-bottom:12px;
    background:rgba(var(--accent-rgb),.03)}
  .gm-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .gm .gchip{cursor:default}
  .gm .star{cursor:pointer;padding:0 1px}
  .gm .star:hover{opacity:1;color:var(--accent)}
  .gm [data-gdel]:hover{color:var(--danger)}

  /* ---------- 組合切換列 ---------- */
  .gbar{display:flex;gap:5px;flex-wrap:wrap;align-items:center;
    padding:7px 12px 0}
  .gchip{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;
    color:var(--txt-dim);border:1px solid var(--line);padding:3px 9px;cursor:pointer;
    transition:.14s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
  .gchip:hover{color:var(--txt);border-color:var(--line-strong)}
  .gchip.on{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
  .gchip .n{font-size:9px;opacity:.7}
  .gchip .star{font-size:10px;opacity:.45}
  .gchip .star.set{opacity:1;color:var(--amber)}
  .gchip.on .star.set{color:var(--on-accent)}
  .gchip.add{color:var(--accent);border-style:dashed}
  .gsum{font-family:var(--mono);font-size:9.5px;color:var(--txt-dim);
    padding:4px 12px 0;line-height:1.5}

  /* ---------- 關注清單搜尋 ---------- */
  .wsearch{position:relative;border-top:1px solid var(--line);padding:9px 12px}
  .ws-row{display:flex;gap:6px;align-items:stretch}
  .ws-flt{flex:0 0 auto;font-family:var(--mono);font-size:10px;letter-spacing:.06em;
    color:var(--txt-dim);border:1px solid var(--line-strong);background:rgba(var(--bg-deep-rgb),.9);
    padding:7px 9px;cursor:pointer;white-space:nowrap;transition:.18s}
  .ws-flt:hover{color:var(--accent);border-color:var(--accent)}
  .ws-flt.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  /* 篩選器面板(跟搜尋結果共用往上開的那個框) */
  .scr-g{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:10px}
  .scr-g label{display:flex;flex-direction:column;gap:3px;font-size:10px;color:var(--txt-dim)}
  .scr-g input,.scr-g select{background:rgba(var(--bg-deep-rgb),.9);border:1px solid var(--line);
    color:var(--txt);font-family:var(--mono);font-size:11.5px;padding:5px 7px;outline:none;width:100%}
  .scr-hd{padding:9px 10px;border-bottom:1px solid var(--line);font-size:11px;color:var(--txt)}
  .scr-hd b{color:var(--accent);font-family:var(--mono)}
  .wsearch input{width:100%;background:rgba(var(--bg-deep-rgb),.9);border:1px solid var(--line-strong);
    color:var(--txt);font-family:var(--sans);font-size:12.5px;padding:7px 10px;outline:none}
  .wsearch input:focus{background:rgba(var(--accent-rgb),.10);border-color:var(--accent)}
  .wsearch input::placeholder{color:var(--txt-dim);opacity:.75}
  /* 結果往「上」開:這個輸入框在左欄最底下,往下開會掉出畫面外 */
  .wres{position:absolute;left:12px;right:12px;bottom:calc(100% - 9px);
    max-height:290px;overflow-y:auto;z-index:30;
    background:var(--panel-float);border:1px solid var(--line-strong);
    box-shadow:0 -10px 34px rgba(0,0,0,.18);display:none}
  .wres.show{display:block}
  .wr{display:flex;align-items:baseline;gap:8px;padding:8px 10px;cursor:pointer;
    border-bottom:1px solid rgba(var(--accent-rgb),.09);transition:.12s}
  .wr:hover,.wr.sel{background:rgba(var(--accent-rgb),.13)}
  .wr .c{font-family:var(--mono);font-size:11px;color:var(--accent);flex:0 0 62px}
  .wr .n{font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wr .i{font-family:var(--mono);font-size:10px;color:var(--txt-dim)}
  .wr .has{font-family:var(--mono);font-size:9.5px;color:var(--ok)}
  /* ☆ 關注是獨立按鈕 —— 點整列只是打開來看,不會加進清單 */
  .wr .star{font-family:var(--mono);font-size:10px;flex:0 0 auto;
    color:var(--amber);border:1px solid rgba(var(--amber-rgb),.42);padding:2px 7px;
    white-space:nowrap;transition:.12s}
  .wr .star:hover{background:rgba(var(--amber-rgb),.18);border-color:var(--amber)}
  .wr .star.on{color:var(--ok);border-color:rgba(var(--ok-rgb),.42)}
  .wr .star.on:hover{background:rgba(var(--danger-rgb),.16);border-color:var(--danger);color:var(--danger)}
  .wr .star.on:hover::after{content:' ✕'}
  .wres .msg{padding:10px;font-size:12px;color:var(--txt-dim);text-align:center}

  /* 預覽橫幅:讓人一眼知道「這檔還沒被記下來」 */
  .sk-prev{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:8px 16px;font-size:12px;color:var(--amber);
    background:rgba(var(--amber-rgb),.09);border-bottom:1px solid rgba(var(--amber-rgb),.28)}
  .sk-prev .go{margin-left:auto;font-family:var(--mono);font-size:11px;cursor:pointer;
    border:1px solid var(--amber);padding:3px 10px;white-space:nowrap}
  .sk-prev .go:hover{background:var(--amber);color:var(--on-accent)}

  /* ---------- 風險貢獻 ---------- */
  .rk-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;
    margin-bottom:12px}
  .rk-top>div{border:1px solid var(--line);padding:9px 11px;background:rgba(var(--accent-rgb),.04)}
  .rk-top .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--txt-dim)}
  .rk-top .v{font-size:20px;color:var(--accent);margin:3px 0 2px}
  .rk-top .s{font-size:11px;line-height:1.55;color:var(--txt-dim)}
  .rk-r{border-top:1px solid rgba(var(--accent-rgb),.10);padding:8px 0}
  .rk-nm{font-size:13px;display:flex;align-items:baseline;gap:9px}
  .rk-v{font-family:var(--mono);font-size:10.5px;color:var(--txt-dim)}
  .rk-bars{margin:5px 0 3px}
  .rk-b{display:flex;align-items:center;gap:7px;margin:2px 0}
  .rk-b span{font-family:var(--mono);font-size:9.5px;color:var(--txt-dim);flex:0 0 26px}
  .rk-b i{height:7px;display:block;min-width:1px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .rk-b b{font-family:var(--mono);font-size:10.5px;font-weight:400;margin-left:auto;
    color:var(--txt-dim)}
  .rk-eq{font-family:var(--mono);font-size:10px;color:var(--txt-dim);opacity:.8}
  .rk-eq b{color:var(--amber);font-weight:400}

  /* ---------- 產業鏈 · 基本面 ---------- */
  .fd-hd{padding:10px 16px 0}
  .fd-ind{display:flex;gap:9px;flex-wrap:wrap;align-items:center;
    font-family:var(--mono);font-size:12px;line-height:1.7;color:var(--txt-dim)}
  .fd-ind b{color:var(--accent);font-weight:400;border:1px solid var(--line-strong);padding:2px 8px;font-size:12.5px}

  .chain{display:grid;grid-template-columns:1fr 18px 1fr 18px 1fr;gap:0 4px;
    padding:12px 16px 0;align-items:stretch}
  .cl-col{display:flex;flex-direction:column;gap:7px;min-width:0}
  .cl-hd{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--accent);
    padding-bottom:7px;border-bottom:1px solid var(--line);margin-bottom:3px;line-height:1.6}
  .cl-hd span{color:var(--txt-dim);letter-spacing:0;font-size:10.5px}
  .cl-arrow{display:flex;align-items:flex-start;justify-content:center;
    color:var(--line-strong);font-size:15px;padding-top:52px}
  .cl-box{border:1px solid rgba(var(--accent-rgb),.14);background:rgba(var(--bg-deep-rgb),.42);
    padding:9px 11px;transition:.15s;min-width:0}
  .cl-box.here{border-color:var(--accent);background:rgba(var(--accent-rgb),.10);
    box-shadow:0 0 18px rgba(var(--accent-rgb),.18)}
  .cl-box.own{border-left:2px solid var(--ok)}
  .cl-nm{font-size:14px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .cl-nm i{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--txt-dim)}
  .cl-d{font-size:11.5px;color:var(--txt-dim);margin-top:4px;line-height:1.65}
  .cl-tks{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .cl-tk{font-family:var(--mono);font-size:11px;padding:2px 7px;cursor:pointer;
    border:1px solid rgba(var(--accent-rgb),.22);color:var(--txt-dim);transition:.15s;white-space:nowrap}
  .cl-tk:hover{border-color:var(--accent);color:var(--accent)}
  .cl-tk.own{color:var(--ok);border-color:rgba(var(--ok-rgb),.45)}
  .cl-tk.here{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

  .fd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:12px 16px 0}
  .fd-c{border:1px solid rgba(var(--accent-rgb),.13);background:rgba(var(--bg-deep-rgb),.4);padding:10px 12px}
  .fd-c .k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--txt-dim)}
  .fd-c .v{font-family:var(--mono);font-size:19px;margin-top:5px}
  .fd-c .s{font-family:var(--mono);font-size:10.5px;color:var(--txt-dim);margin-top:4px;line-height:1.5}

  .rev-wrap{padding:12px 16px 0}
  .rev-bars{display:flex;align-items:flex-end;gap:4px;height:104px;
    border-bottom:1px solid var(--line);padding-bottom:0}
  .rev-b{flex:1;position:relative;min-width:0;display:flex;flex-direction:column;
    justify-content:flex-end;height:100%}
  .rev-b i{display:block;background:linear-gradient(180deg,rgba(var(--accent-rgb),.85),rgba(var(--accent-rgb),.25));
    transition:height .5s cubic-bezier(.2,.8,.2,1)}
  .rev-b.up i{background:linear-gradient(180deg,rgba(var(--up-rgb),.85),rgba(var(--up-rgb),.2))}
  .rev-b.dn i{background:linear-gradient(180deg,rgba(var(--down-rgb),.85),rgba(var(--down-rgb),.2))}
  .rev-x{display:flex;gap:3px;margin-top:4px}
  .rev-x span{flex:1;text-align:center;font-family:var(--mono);font-size:10px;line-height:1.5;
    color:var(--txt-dim);min-width:0;overflow:hidden}

  .tl{padding:8px 16px 0;position:relative}
  .tl-row{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:9px 0;
    border-bottom:1px solid rgba(var(--accent-rgb),.09)}
  .tl-dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:0 0 7px}
  .tl-t{font-size:14px;line-height:1.65}
  .tl-t a{color:inherit;text-decoration:none}
  .tl-t a:hover{color:var(--accent)}
  .tl-m{font-family:var(--mono);font-size:11px;color:var(--txt-dim);margin-top:5px;
    display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .tl-tag{border:1px solid currentColor;padding:1px 6px}

  /* ---------- 加密貨幣的「基本面」 ----------
     台股那一頁是證交所的數字,加密貨幣沒有那些欄位,所以這裡改成機制與影響因素。
     版面刻意跟 .fd-c 同一套密度,換頁的時候不會覺得是另一個 app。 */
  .cy-one{margin:12px 16px 0;padding:12px 14px;border:1px solid rgba(var(--accent-rgb),.22);
    background:rgba(var(--accent-rgb),.05);font-size:14px;line-height:1.85}
  .cy-one b{color:var(--accent)}
  .cy-list{padding:10px 16px 0;display:grid;gap:7px}
  .cy-item{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:start;
    border:1px solid rgba(var(--accent-rgb),.12);background:rgba(var(--bg-deep-rgb),.4);
    padding:10px 12px}
  .cy-sig{font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:2px 7px;
    border:1px solid currentColor;white-space:nowrap;margin-top:2px}
  .cy-t{font-size:13.5px;line-height:1.6}
  .cy-d{font-family:var(--mono);font-size:11.5px;color:var(--txt-dim);line-height:1.75;margin-top:4px}

  @media (max-width:840px){
    .chain{grid-template-columns:1fr;gap:8px}
    .cl-arrow{padding:0;transform:rotate(90deg);height:16px}
    .fd-grid{grid-template-columns:repeat(2,1fr)}
    .fd-hd,.chain,.fd-grid,.rev-wrap,.tl,.cy-list{padding-left:10px;padding-right:10px}
    .cy-one{margin-left:10px;margin-right:10px}
  }

  /* ---------- 關聯網路 ---------- */
  .rel-wrap{position:relative;margin:0 16px;border:1px solid rgba(var(--accent-rgb),.13);
    background:radial-gradient(ellipse at 50% 50%,rgba(var(--accent-rgb),.05),rgba(var(--bg-deep-rgb),.5) 70%)}
  .rel-wrap svg{display:block;width:100%;height:330px}
  .rel-ring{fill:none;stroke:rgba(var(--accent-rgb),.16);stroke-dasharray:2 7}
  .rel-spin{transform-origin:50% 50%;animation:spin 40s linear infinite}
  .rel-edge{stroke-linecap:round;transition:.2s}
  .rel-edge:hover{stroke-opacity:1!important}
  .rel-node{cursor:pointer}
  .rel-node circle{transition:.2s}
  .rel-node:hover circle{r:9}
  .rel-node text{font-family:var(--mono);font-size:11.5px;pointer-events:none}
  .rel-hub circle{filter:drop-shadow(0 0 10px var(--accent))}
  @keyframes relpulse{0%,100%{opacity:.25;r:16}50%{opacity:0;r:30}}
  .rel-pulse{fill:none;stroke:var(--accent);animation:relpulse 3s ease-out infinite}

  .rel-list{padding:10px 16px 0}
  .rel-row{display:grid;grid-template-columns:1fr auto;gap:3px 10px;
    padding:9px 11px;margin-bottom:6px;border:1px solid rgba(var(--accent-rgb),.12);
    background:rgba(var(--bg-deep-rgb),.4);cursor:pointer;transition:.15s}
  .rel-row:hover{background:rgba(var(--accent-rgb),.07);border-color:var(--line-strong)}
  .rel-row .n{font-size:14px}
  .rel-row .v{font-family:var(--mono);font-size:14px;text-align:right}
  .rel-row .w{grid-column:1/-1;font-family:var(--mono);font-size:11px;color:var(--txt-dim);
    display:flex;gap:8px;flex-wrap:wrap;line-height:1.7}
  .rel-tag{border:1px solid currentColor;padding:1px 6px;opacity:.9}

  /* 手機版。
     這個 @media 必須放在上面那些 #stock 規則「之後」——
     踩過的坑:原本把它併進檔案前段那個 @media(max-width:840px),結果
     transform:none 被後面的 #stock.show{transform:translate(-50%,-50%)}
     蓋回去(同樣是 id+class 特異度,後者比較晚出現),面板整個飛出畫面左上角。 */
  @media (max-width:840px){
    #stock,#stock.show{
      left:0;top:0;width:100vw;height:100vh;max-height:100vh;transform:none;border:0}
    #stock::before,#stock::after{display:none}
    #stock .ttl{position:sticky;top:0;z-index:10;background:rgba(var(--panel-rgb),.97);
      padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top))}
    #stock .sk-body{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
    /* 圖矮一點、四欄行情擠成兩欄、五檔上下疊 */
    .sk-cv{margin:0 10px}
    .sk-cv canvas{height:min(46vh,300px)}
    .sk-bar,.sk-rd,.sk-ma,.sk-dep,.sk-pos{padding-left:10px;padding-right:10px}
    .sk-hd{padding:12px 12px 10px}
    .sk-px .big{font-size:29px}
    .sk-ohlc{grid-template-columns:repeat(2,1fr)}
    .sk-dep{grid-template-columns:1fr}
    .sk-pos{grid-template-columns:1fr 1fr}
    .sk-note{margin-left:10px;margin-right:10px}
    .sk-tab{padding:11px 13px}
  }

  #newsBtn,#pfBtn{display:none;align-items:center;font-family:var(--mono);font-size:11px;
    padding:11px 13px;cursor:pointer;color:var(--accent);border-left:1px solid var(--line)}
  #newsBtn.on,#pfBtn.on{background:var(--accent);color:var(--on-accent)}
  #pfBtn{border-left:0;border-right:1px solid var(--line)}
  /* ═══════════════════════════════════════════════════════════════════
     排版整理層(Apple 風格)

     為什麼放在最後面而不是回頭改上面幾百條規則:
     上面那些規則是一頁一頁長出來的,尺寸與間距各自為政 —— 有 9.5px 的
     mono 按鈕、10px 的分頁、11px 的說明文字。這一層只做三件事:
       ① 收斂字級:內文 15px / 說明 13px / 標籤 12px,等寬字只留給數字與代號
       ② 統一節奏:卡片 20~24px 內距、區塊之間 44px、圓角一律 --radius-lg
       ③ 手機:字不再被瀏覽器放大、按鈕至少 44px 好按、導覽列六個分頁都進得去
     單一 class 選擇器 + 排在最後 = 蓋得掉上面同權重的舊值,不用動原本的結構。
     ═══════════════════════════════════════════════════════════════════ */

  /* Chrome 手機版會自作主張把長段落的字放大(font boosting),同一頁在手機上
     看起來比設計稿大一號、大小還不一致。關掉它,尺寸完全照設計走。 */
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{font-size:15px;line-height:1.47;letter-spacing:-.01em}

  /* ---------- 頁面骨架 ---------- */
  .pg{max-width:1040px;padding:clamp(26px,4vw,52px) clamp(18px,3vw,26px) 96px}
  .pg-hd{margin-bottom:clamp(22px,3vw,32px)}
  .pg-hd h1{font-size:clamp(30px,4.4vw,44px);font-weight:600;letter-spacing:-.032em;line-height:1.06}
  .pg-hd .sub{font-size:15px;color:var(--txt-faint);margin-top:7px;letter-spacing:-.012em}

  /* 區塊標題。Apple 的層級是靠字重與留白拉開,不靠線與底色。 */
  .hm-sec{font-size:clamp(20px,2.2vw,24px);font-weight:600;letter-spacing:-.024em;
    margin:clamp(32px,4vw,48px) 0 14px}
  .hm-sec .stag{font-size:13.5px;color:var(--txt-faint);letter-spacing:-.008em}
  .sec-lab{font-size:20px;font-weight:600;letter-spacing:-.022em;margin:34px 0 12px}

  /* ---------- 卡片 ---------- */
  /* 卡片寬度下限訂在 236px:1024px 的內容區(扣掉左右 22px 與 12px 間隔)
     剛好排四欄。原本是 178px,會排成五欄 —— 主頁有六張卡,於是第六張
     («年化報酬») 自己孤零零佔一整列,右邊留一大片空白。 */
  .kpi{grid-template-columns:repeat(auto-fit,minmax(236px,1fr));gap:12px;margin-bottom:8px}
  /* 剛好六張的時候改成 3×2 —— 六張排四欄是 4+2,排三欄才是整齊的兩列。
     :has() 不支援的瀏覽器就維持上面那條,結果跟以前一樣,不會更糟。

     ⚠ 一定要包在 min-width 裡。手機那邊寫的是 `.kpi{...repeat(2,1fr)}`,
       特異性只有 (0,1,0),而 `.kpi:has(…)` 是 (0,2,0) —— 就算手機那條寫在
       後面也贏不了,結果 390px 的螢幕被排成三欄,「5,657,769」被截成
       「5,657…」。踩過一次了。 */
  @media(min-width:841px){
    .kpi:has(> :nth-child(6):last-child){grid-template-columns:repeat(3,1fr)}
  }
  .kpi .k{padding:19px 20px 17px;border-radius:var(--radius-lg);container-type:inline-size}
  .kpi .lab{font-size:12.5px;color:var(--txt-faint);letter-spacing:-.008em}
  /* 數字不換行 —— 「1,420,000」被折成兩行是最破壞版面的一種錯。
     字級跟著容器縮,寧可小一點也要一行講完。 */
  /* cqi = 卡片自己的寬度。五張卡並排時字自動小一號,兩張卡時就放大 ——
     用 vw 做不到這件事,因為同一個視窗寬度下卡片可能是 1/5 也可能是 1/2 寬。 */
  .kpi .val{font-size:clamp(19px,13cqi,29px);margin-top:7px;letter-spacing:-.03em;
    white-space:nowrap;word-break:normal;overflow:hidden;text-overflow:ellipsis}
  .kpi .sub{font-size:12.5px;margin-top:5px;line-height:1.4}

  .kn{padding:21px 22px 19px;border-radius:var(--radius-lg);container-type:inline-size}
  .kn .lab{font-size:12.5px}
  .kn .val{font-size:clamp(26px,11cqi,34px);margin:8px 0 7px;letter-spacing:-.032em}
  .kn .why{font-size:13.5px;line-height:1.45;color:var(--txt-faint)}

  .hm-ex{padding:18px 20px;border-radius:var(--radius-lg)}
  .hm-ex .t{font-size:15.5px;line-height:1.45}
  .hm-ex .n{font-size:13px;margin-top:7px;line-height:1.45}
  .hm-geo{padding:18px 22px;border-radius:var(--radius-lg);margin-top:clamp(28px,3.5vw,44px)}
  .hm-geo .t{font-size:15px}
  .hm-geo .go{font-size:15px;padding:10px 20px;font-weight:500}

  /* ---------- 說明文字 ----------
     這些是「看一眼就懂」用的,不是文件。字級拉到 13.5px 讓它讀得下去,
     顏色壓淡讓它退到數字後面。(真正的長篇說明已經從畫面上拿掉了。) */
  .expo-note{font-size:13.5px;line-height:1.5;color:var(--txt-faint);margin-top:9px}
  /* 說明裡的重點原本一律染成琥珀色,一段話裡三個橘字等於沒有重點。
     改成同色加粗;真正的警告還是用 style="color:var(--amber)" 明寫。 */
  .expo-note b{color:var(--txt);font-weight:600}
  .empty{font-size:14px;color:var(--txt-faint);padding:34px 16px;line-height:1.55}
  /* 區段裡沒東西的時候不要撐開一大片空白。
     標題本身上下就有 48px 的留白,再加上置中的 34px 內距,一句
     「未來兩個月沒有除權息」會佔掉快 170px 的畫面 —— 而它只是一句話。
     跟標題靠左對齊也比較好讀:置中的一行字掛在靠左的標題底下看起來像跑版。 */
  .hm-sec + .empty, .sec-lab + .empty{padding:2px 0 0;text-align:left}
  .qs-at{font-family:var(--sans);font-size:12.5px;letter-spacing:-.008em;color:var(--txt-faint)}
  .al-warn{border:0;border-radius:var(--radius);background:rgba(var(--alert-rgb),.08);
    padding:13px 15px;font-size:13.5px;line-height:1.55;color:var(--txt-dim)}
  .al-warn b{color:var(--alert);font-weight:500}

  /* ---------- 表格 ---------- */
  .tw{border-radius:var(--radius-lg)}
  .tw table{font-size:14.5px;min-width:0}
  .tw th,.tw td{padding:14px 16px;letter-spacing:-.012em;border-bottom:1px solid var(--line)}
  .tw th{font-size:12.5px;color:var(--txt-faint)}
  .tw td .tk{font-size:11.5px}
  .tw .sub-pct{opacity:.72}
  /* 寬螢幕有獨立的「持有」欄,這一行是給窄螢幕補的(見 560px 那段),
     不藏起來就會一個資訊講兩次。 */
  .tw .sub-days{display:none}

  /* ---------- 按鈕 ----------
     原本是 9.5px 的等寬字加外框,在手機上又小又難按。改成 Apple 的藥丸鈕:
     主要動作實心藍、次要動作淺灰底,高度至少 44px(iOS 的最小點擊尺寸)。 */
  /* flex:1 + display:flex 會讓按鈕的最小寬度變成整串字,兩顆就換行變成上下兩條。
     改成照內容寬度排、排不下才換行 —— Apple 的按鈕本來就是包住文字的大小。 */
  .pf-btn{font-family:var(--sans);font-size:15px;letter-spacing:-.01em;font-weight:500;
    padding:11px 18px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;
    gap:6px;border:0;background:rgba(var(--hairline-rgb),.06);color:var(--txt);
    flex:0 1 auto;min-width:0;white-space:nowrap}
  .pf-btn:hover{background:rgba(var(--hairline-rgb),.11)}
  .pf-btn.buy{background:var(--accent);color:var(--on-accent)}
  .pf-btn.buy:hover{background:var(--accent-dim)}
  .pf-btn.sell{background:rgba(var(--down-rgb),.12);color:var(--down)}
  .tf-act{gap:9px;margin-top:10px;flex-wrap:wrap}
  /* 主要動作在手機上獨佔一行比較好按 */
  @media(max-width:560px){ .tf-act .pf-btn{flex:1 1 auto} }

  /* 「儲存」那顆原本是 9.5px 的等寬小字,改成跟其他主要動作一致的藥丸鈕 */
  .sim-btn{font-family:var(--sans);font-size:15px;font-weight:500;letter-spacing:-.01em;
    color:var(--on-accent);background:var(--accent);border:0;border-radius:var(--radius-pill);
    padding:13px 0;margin-top:14px}
  .sim-btn:hover{background:var(--accent-dim)}

  /* 組合列的小標籤 */
  .gm{border:0;background:rgba(var(--hairline-rgb),.05);border-radius:var(--radius-lg);
    padding:16px 18px;margin-bottom:16px}
  .gchip{font-family:var(--sans);font-size:13.5px;letter-spacing:-.008em;border-radius:var(--radius-pill);
    padding:7px 13px;min-height:36px;display:inline-flex;align-items:center;gap:5px}
  .gchip .n{font-size:12px}
  .gchip .star{font-size:12px}
  .pf-note{font-size:13.5px;line-height:1.5;color:var(--txt-faint)}
  .add-box{border:0;background:rgba(var(--hairline-rgb),.05);border-radius:var(--radius-lg);
    padding:14px 16px}
  .ps{padding:20px 20px 18px}

  /* ---------- 設定頁 ---------- */
  /* 分段控制項在寬螢幕不需要拉滿 —— Apple 的分段控制項是固定寬度、靠左的 */
  .mtabs{max-width:560px}
  /* 大段落標題:拿掉底色橫幅,改用留白與一條細線分段 */
  .set-hd{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:var(--txt-faint);background:none;border:0;border-top:1px solid var(--line);
    padding:30px 0 0;margin:14px 20px 0}
  .set-hd:first-child{border-top:0;padding-top:4px;margin-top:0}
  /* 選項膠囊:字級跟其他控制項一致,別再用 9.5px 的等寬字 */
  .skb{font-family:var(--sans);font-size:14px;letter-spacing:-.008em;font-weight:500;
    border-right:0;border-radius:var(--radius-pill)}
  .set-row{gap:8px;margin:10px 0 4px}
  .set-row .skb{border:1px solid var(--line);padding:10px 18px;min-height:40px;
    display:inline-flex;align-items:center}
  .set-row .skb.on{border-color:transparent}
  /* ---------- 交易日誌卡 ---------- */
  .jn-b1{padding:14px 16px 0}
  .jn-b2{padding:8px 16px 0;gap:10px}
  .jn-b3{padding:9px 16px 0;font-size:13px}
  .jn-b3:last-child{padding-bottom:16px}
  .jn-nm{font-size:16px}
  .jn-b{font-size:12px;padding:4px 11px;font-weight:500}
  .jn-pl{font-size:16px}
  .jn-b2 .jn-m{font-size:14px}
  /* 標籤原本是 8.5px 的等寬字加外框,像除錯用的標記。改成淡底的膠囊。 */
  .tg-chip{font-family:var(--sans);font-size:12px;letter-spacing:-.005em;padding:4px 11px;
    border:0;border-radius:var(--radius-pill);
    background:color-mix(in srgb, currentColor 14%, transparent)}

  /* ---------- 個股詳情 ----------
     這一面板在手機上是整頁蓋滿的,但 z-index 比導覽列低,標題和關閉鈕
     會被導覽列蓋掉一整條 —— 直接拉到導覽列之上。 */
  /* ---------- 蓋滿整個畫面的面板要在導覽列(z-index:80)之上 ----------
     ⚠ 實測到的可用性 bug:#alloc 是 z-index:70,在手機上它是全螢幕的,
       但它的「✕ 關閉」剛好落在導覽列底下 —— elementFromPoint 打到的是
       #navSearch。使用者按關閉會**打開搜尋框**,面板關不掉。
       #stock 之前也是同一個問題(標題整條被蓋掉)。
     模態面板本來就該在導覽列之上,不然「蓋住全螢幕」這件事本身就是假的。 */
  #stock{z-index:90}
  #alloc{z-index:90}
  #allocMask{z-index:89}
  .sk-tabs{border-bottom:1px solid var(--line);gap:2px;padding:0 12px;
    scrollbar-width:none}
  .sk-tabs::-webkit-scrollbar{display:none}
  .sk-tab{font-family:var(--sans);font-size:14.5px;letter-spacing:-.01em;font-weight:500;
    border-right:0;padding:13px 14px;border-radius:0;background:none}
  .sk-tab.on{color:var(--accent);background:none;box-shadow:inset 0 -2px 0 var(--accent)}
  .sk-tab:hover{background:none;color:var(--txt)}
  /* 圖表上面那幾排開關:改成膠囊,一整排橫向捲,不要疊成五層 */
  /* 寬螢幕排得下就換行,手機才改成一整排橫向捲(疊成五層更難用) */
  .sk-bar{gap:8px;padding:12px 16px 8px;scrollbar-width:none}
  @media(max-width:840px){ .sk-bar{flex-wrap:nowrap;overflow-x:auto} }
  .sk-bar::-webkit-scrollbar{display:none}
  .sk-set{border:0;gap:4px;flex:0 0 auto;background:rgba(var(--hairline-rgb),.06);
    border-radius:var(--radius-pill);padding:3px}
  .sk-set span{font-family:var(--sans);font-size:13px;letter-spacing:-.008em;border-right:0;
    padding:7px 13px;border-radius:var(--radius-pill);white-space:nowrap}
  .sk-set span.on{background:var(--accent);color:var(--on-accent)}
  .sk-cv{border:0;border-radius:var(--radius);overflow:hidden}
  .sk-msg{font-family:var(--sans);font-size:14px;letter-spacing:-.01em;padding:40px 16px}
  /* 報價數字不加光暈 —— 那是 HUD 的語言,Apple 的數字是平的 */
  .sk-px .big{text-shadow:none;font-size:clamp(28px,8vw,36px)}
  .sk-px .lv{font-family:var(--sans);font-size:11.5px;letter-spacing:0;border-radius:var(--radius-pill);
    padding:3px 9px;border-color:var(--line-strong)}
  @media(max-width:560px){
    /* 面板自己的字級開關在手機上太佔位,設定頁已經有一個全站的 */
    #stock .fs-set{display:none}
  }

  /* 面板的關閉鈕:手機版原本被放大到跟主要動作一樣重,壓過了面板標題 */
  .pclose{font-family:var(--sans);font-size:13.5px;letter-spacing:-.008em;
    border:0;border-radius:var(--radius-pill);padding:7px 13px;
    background:rgba(var(--hairline-rgb),.07)}
  .pclose:hover{background:var(--accent);color:var(--on-accent)}

  /* ---------- 決策卡(交易日誌 · 決策) ---------- */
  .dc{padding:18px 18px 16px}
  .dc-nm{font-size:16px;letter-spacing:-.018em}
  .dc-h .tk{font-size:11.5px}
  .dc-meta{font-size:12.5px}
  .dc-lab{font-family:var(--sans);font-size:12.5px;letter-spacing:-.005em;color:var(--txt-faint);
    margin:14px 0 6px}
  .dc-ta{font-size:15px;padding:12px 13px;border:0;border-radius:var(--radius);
    background:rgba(var(--hairline-rgb),.06);min-height:88px}
  .dc-ta:focus{background:rgba(var(--accent-rgb),.08);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.22)}
  .dc-act{gap:9px;margin-top:11px}
  .dc-msg{font-size:13px}
  .dc-ai{border:0;background:rgba(var(--accent-rgb),.07);padding:14px 15px;border-radius:var(--radius)}
  .dc-score{font-size:24px}
  .dc-grade{font-family:var(--sans);font-size:12px;letter-spacing:-.005em;padding:3px 10px}
  .dc-at{font-family:var(--sans);font-size:12px}
  .dc-verdict{font-size:14px;line-height:1.5}
  .dc-list{font-size:13.5px;line-height:1.55}
  .dc-ask{font-size:13.5px;line-height:1.5}

  /* 手機上把「核對用」的預覽表格轉成一列一張卡。
     這張表有 8 欄,在 390px 一定要橫向捲才看得完 —— 但這張表的用途就是
     「逐列核對」,需要捲才看得到的欄位等於沒被核對到。 */
  @media(max-width:560px){
    .ps .tw{overflow-x:visible}
    .ps .tw table{min-width:0}
    .ps .tw thead{display:none}
    .ps .tw tbody,.ps .tw tr,.ps .tw td{display:block;width:auto}
    .ps-row{position:relative;padding:12px 12px 12px 42px;margin-bottom:8px;
      border-radius:var(--radius);background:rgba(var(--hairline-rgb),.05)}
    .ps-row td{border:0;padding:1px 0;text-align:left!important;white-space:normal;
      line-height:1.5}
    .ps-row td[data-lab]::before{content:attr(data-lab);display:inline-block;min-width:56px;
      color:var(--txt-faint);font-size:12.5px;margin-right:6px}
    .ps-row td[data-lab="原文"]{font-size:12px;opacity:.7;margin-top:4px}
    .ps-row .ps-ck{position:absolute;left:12px;top:12px;padding:0}
    .ps-row .ps-ck input{width:22px;height:22px}
    .ps-row .ps-fee{width:130px}
  }

  /* ---------- 趨勢:錢在做的事,對上你在做的事 ----------
     ⚠ 買超 / 賣超一律用 --accent / --alert,**不可以**用紅綠。
       紅綠在這個網站只代表漲跌損益,法人買超不是漲。
       (站上既有的 .ck-bars 與 .sec-r 就是這樣配的,這裡照抄同一套。) */
  .trd-head{border:1px solid rgba(var(--accent-rgb),.2);background:rgba(var(--accent-rgb),.05);
    padding:14px 16px;font-size:14.5px;line-height:1.8}
  .trd-pick{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 12px}
  .trd-p{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;padding:5px 13px;
    border:1px solid currentColor;cursor:pointer;border-radius:var(--radius)}
  .trd-p.on{color:var(--on-accent)}

  .trd-chain{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:start}
  .trd-arrow{align-self:center;color:var(--txt-faint);font-size:13px;padding:0 2px}
  .trd-col{min-width:0}
  /* 分段標題:產業色的底線 —— 換一條鏈,整欄的識別色跟著換 */
  .trd-ch{font-family:var(--mono);font-size:11.5px;letter-spacing:.07em;
    padding:0 2px 9px;margin-bottom:9px;line-height:1.55;
    border-bottom:2px solid var(--line);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .trd-ch b{font-size:16px;letter-spacing:-.015em;margin-left:auto}
  .trd-ch b.in{color:var(--accent)} .trd-ch b.out{color:var(--alert)}
  .trd-ch b.na{color:var(--txt-faint)}
  .trd-ch em{font-style:normal;font-size:10.5px;color:var(--txt-faint);
    flex:1 0 100%;letter-spacing:.04em}
  /* 節點卡:左邊一條產業色的粗線,是「這一格屬於哪一條鏈」最快的辨識 */
  .trd-n{border:1px solid var(--line);border-left:3px solid var(--cc,var(--accent));
    background:rgba(var(--bg-deep-rgb),.5);padding:10px 12px;margin-bottom:7px;
    border-radius:0 var(--radius) var(--radius) 0}
  .trd-n.mine{border-color:var(--cc,var(--accent));
    background:linear-gradient(90deg,rgba(var(--accent-rgb),.08),rgba(var(--bg-deep-rgb),.5) 60%)}
  .trd-nm{font-size:13.5px;line-height:1.4;display:flex;align-items:baseline;gap:6px;
    letter-spacing:-.01em}
  .trd-nm i{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--accent);
    margin-left:auto;white-space:nowrap}
  .trd-v{font-family:var(--mono);font-size:15px;margin-top:7px;
    display:flex;align-items:baseline;gap:7px;letter-spacing:-.01em}
  .trd-v span{font-size:10.5px;color:var(--txt-faint);letter-spacing:.04em}
  .trd-v.in{color:var(--accent)} .trd-v.out{color:var(--alert)}
  .trd-v.na{color:var(--txt-faint);font-size:12px}
  .trd-bar{height:4px;margin-top:7px;background:rgba(var(--hairline-rgb),.14);
    border-radius:2px;overflow:hidden}
  .trd-bar i{display:block;height:100%}
  .trd-bar i.in{background:var(--accent)} .trd-bar i.out{background:var(--alert)}

  .trd-rows{display:grid;gap:7px}
  .trd-r{border:1px solid rgba(var(--accent-rgb),.13);background:rgba(var(--bg-deep-rgb),.4);
    padding:10px 12px;cursor:pointer}
  .trd-r:hover{border-color:rgba(var(--accent-rgb),.4)}
  .trd-rh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .trd-rh b{font-size:14.5px;letter-spacing:-.01em}
  .trd-rh em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--txt-faint)}
  .trd-rh u{margin-left:auto;text-decoration:none;font-family:var(--mono);font-size:11.5px}
  /* 每日長條要**看得出一根一根**。
     第一版每根寬度 = 整格,十天在 1100px 底下就是十塊 110px 的色塊連成一片,
     讀起來像一條分段的色帶,不像節奏。所以把長條寬度收窄、置中,
     格子之間自然留白;再畫一條零線,上下才分得出買超賣超。 */
  .trd-strip{display:flex;gap:2px;align-items:center;height:34px;margin-top:9px;position:relative}
  .trd-strip::before{content:'';position:absolute;left:0;right:0;top:50%;height:1px;
    background:rgba(var(--hairline-rgb),.2)}
  .trd-d{flex:1;min-width:0;height:100%;position:relative;display:flex;flex-direction:column;
    justify-content:center}
  .trd-d i{display:block;border-radius:2px;width:min(100%,26px);
    margin-left:auto;margin-right:auto}
  .trd-d i.in{background:var(--accent)} .trd-d i.out{background:var(--alert)}
  .trd-d i.zero{background:rgba(var(--hairline-rgb),.2);height:2px}
  .trd-me{display:flex;gap:2px;margin-top:3px}
  .trd-m{flex:1;min-width:0;text-align:center;font-family:var(--mono);font-size:9.5px;
    line-height:1.3;color:var(--txt-faint);height:13px;overflow:hidden}
  .trd-m.b{color:var(--accent)} .trd-m.s{color:var(--violet)}
  .trd-ax{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;
    color:var(--txt-faint);margin-top:3px}

  @media (max-width:760px){
    .trd-chain{grid-template-columns:1fr;gap:4px}
    .trd-arrow{transform:rotate(90deg);padding:2px 0;text-align:center}
    .trd-ch{margin-top:10px}
    .trd-v{font-size:14px}
  }

  /* ---------- 回顧:你的紀律有沒有在進步 ---------- */
  .rvw-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .rvw-c{border:1px solid rgba(var(--accent-rgb),.14);background:rgba(var(--bg-deep-rgb),.4);
    padding:13px 15px}
  .rvw-c .k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--txt-dim)}
  .rvw-c .v{font-family:var(--mono);font-size:30px;line-height:1.15;margin-top:6px}
  .rvw-c .s{font-family:var(--mono);font-size:11px;color:var(--txt-dim);margin-top:5px;line-height:1.6}
  .rvw-chart{margin-top:12px;border:1px solid rgba(var(--accent-rgb),.13);
    background:rgba(var(--bg-deep-rgb),.4);padding:14px 12px 10px}
  .rvw-chart svg{display:block;width:100%;height:190px}
  .rvw-lg{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;
    color:var(--txt-dim);padding:8px 4px 0}
  .rvw-lg i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px}
  .rvw-flaw{display:grid;gap:8px;margin-top:10px}
  .rvw-f{border:1px solid rgba(var(--accent-rgb),.13);background:rgba(var(--bg-deep-rgb),.4);
    padding:12px 14px}
  .rvw-fh{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .rvw-rank{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--txt-faint)}
  .rvw-fn{font-size:14.5px;line-height:1.45;flex:1;min-width:0}
  .rvw-n{font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:2px 8px;
    border:1px solid currentColor;color:var(--alert);white-space:nowrap}
  .rvw-fd{font-family:var(--mono);font-size:11.5px;color:var(--txt-dim);line-height:1.75;margin-top:6px}
  .rvw-fix{font-size:13px;line-height:1.65;margin-top:8px;padding-left:11px;
    border-left:2px solid rgba(var(--accent-rgb),.4)}
  .rvw-which{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .rvw-w{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;padding:2px 7px;
    border:1px solid rgba(var(--accent-rgb),.25);color:var(--txt-dim);cursor:pointer}
  .rvw-w:hover{color:var(--accent);border-color:var(--accent)}
  @media (max-width:560px){
    .rvw-two{grid-template-columns:1fr}
    .rvw-c .v{font-size:26px}
  }

  /* ---------- 配置目標與再平衡 ---------- */
  .tgt{background:var(--panel);border-radius:var(--radius-lg);padding:18px 20px}
  .tg-row{display:flex;align-items:center;gap:10px;padding:9px 0;
    border-bottom:1px solid var(--line)}
  .tg-row:last-of-type{border-bottom:0}
  .tg-sw{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .tg-nm{font-size:15px;letter-spacing:-.012em}
  .tg-cur{margin-left:auto;font-size:13px;color:var(--txt-faint);
    font-variant-numeric:tabular-nums}
  .tg-in{display:flex;align-items:center;gap:5px;flex:0 0 auto}
  .tg-in input{width:72px;text-align:right;font-family:var(--sans);font-size:16px;
    padding:9px 10px;border:0;border-radius:10px;background:rgba(var(--hairline-rgb),.07);
    color:var(--txt);-moz-appearance:textfield;appearance:textfield}
  .tg-in input::-webkit-outer-spin-button,.tg-in input::-webkit-inner-spin-button{
    -webkit-appearance:none;margin:0}
  .tg-in input:focus{outline:none;background:rgba(var(--accent-rgb),.10);
    box-shadow:0 0 0 3px rgba(var(--accent-rgb),.22)}
  .tg-in span{font-size:14px;color:var(--txt-faint)}
  .tg-sum{font-size:13.5px;color:var(--amber);margin-top:12px;letter-spacing:-.008em}
  .tg-sum.ok{color:var(--ok)}

  .dr-row{padding:12px 0;border-bottom:1px solid var(--line)}
  .dr-row:last-of-type{border-bottom:0}
  .dr-hd{display:flex;align-items:center;gap:9px}
  .dr-nm{font-size:15px;letter-spacing:-.012em}
  .dr-pct{margin-left:auto;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;
    letter-spacing:-.02em}
  .dr-pct.off{color:var(--amber)}
  .dr-pct .dr-t{font-size:12.5px;font-weight:400;color:var(--txt-faint);margin-left:2px}
  /* 進度條上那條白線是目標位置 —— 一眼看得出來現在是超過還是不足 */
  .dr-bar{position:relative;height:6px;border-radius:3px;margin:9px 0 8px;
    background:rgba(var(--hairline-rgb),.08);overflow:visible}
  .dr-bar i{display:block;height:100%;border-radius:3px}
  .dr-bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--txt);
    border-radius:1px;opacity:.75}
  .dr-act{display:flex;gap:12px;flex-wrap:wrap;font-size:13.5px;letter-spacing:-.008em}
  .dr-ok{color:var(--txt-faint)}
  /* ⚠ 這裡刻意不用 --up / --down。那兩個顏色在這個網站只代表「漲跌損益」
     (而且台股是紅漲綠跌),拿去標「加碼 / 減碼」會被讀成「這是賺的 / 賠的」——
     再平衡是動作,不是盈虧。用中性色 + 粗體金額。 */
  .dr-do{color:var(--txt-dim)}
  .dr-do b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}
  .dr-fee{color:var(--txt-faint)}
  .dr-fee.warn{color:var(--amber)}

  /* 記住密語的開關 */
  .sy-rem{display:flex;gap:11px;align-items:flex-start;margin-top:12px;padding:12px 14px;
    border-radius:var(--radius);background:rgba(var(--hairline-rgb),.05);cursor:pointer}
  .sy-rem input{width:22px;height:22px;flex:0 0 auto;margin-top:1px;accent-color:var(--accent)}
  .sy-rem b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.012em}
  .sy-rem em{display:block;font-style:normal;font-size:13px;color:var(--txt-faint);
    line-height:1.5;margin-top:3px}

  /* ---------- 「內建資料更新了」橫幅 ----------
     用強調色不用警示色:這不是錯誤,是一個選擇。 */
  .seedb{background:rgba(var(--accent-rgb),.08);border:1px solid rgba(var(--accent-rgb),.35);
    border-radius:var(--radius-lg);padding:15px 17px;margin-bottom:12px}
  .seedb .sb-t{font-size:15.5px;font-weight:600;letter-spacing:-.018em;color:var(--accent)}
  .seedb .sb-d{font-size:12.5px;color:var(--txt-dim);line-height:1.7;margin-top:7px}
  .seedb .sb-d b{color:var(--txt)}
  .seedb .sb-a{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .seedb .sb-b{font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;
    background:var(--accent);color:var(--on-accent);border:0;
    border-radius:var(--radius-pill);padding:9px 17px}
  .seedb .sb-b:hover{filter:brightness(1.08)}
  .seedb .sb-b.ghost{background:none;color:var(--txt-dim);
    border:1px solid var(--line-strong)}
  @media(max-width:520px){ .seedb .sb-b{flex:1 1 100%;text-align:center} }

  /* ---------- 資料健檢 ---------- */
  .hp{background:rgba(var(--amber-rgb),.07);border-radius:var(--radius-lg);
    padding:16px 18px;margin-bottom:16px}
  .hp-hd{font-size:15.5px;font-weight:600;letter-spacing:-.018em;margin-bottom:4px}
  .hp-i{padding:11px 0;border-bottom:1px solid rgba(var(--hairline-rgb),.08)}
  .hp-i:last-child{border-bottom:0;padding-bottom:0}
  .hp-t{font-size:14.5px;font-weight:600;letter-spacing:-.012em;
    display:flex;gap:8px;align-items:baseline;cursor:pointer;
    /* Safari 不吃 display:flex 於 summary,要先把預設的三角形拿掉 */
    list-style:none;-webkit-tap-highlight-color:transparent}
  .hp-t::-webkit-details-marker{display:none}
  /* 自己畫收合箭頭:靠右、展開時轉 90 度 */
  .hp-t::after{content:'›';margin-left:auto;color:var(--txt-faint);font-size:17px;
    line-height:1;transition:transform .2s;transform-origin:50% 50%}
  .hp-i[open] .hp-t::after{transform:rotate(90deg)}
  .hp-t:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
  @media(prefers-reduced-motion:reduce){ .hp-t::after{transition:none} }
  .hp-ic{flex:0 0 auto}
  .hp-i.warn .hp-ic{color:var(--amber)}
  .hp-i.info .hp-ic{color:var(--txt-faint)}
  .hp-d{font-size:13.5px;line-height:1.5;color:var(--txt-faint);margin:4px 0 0 20px}
  .hp-w{display:inline-block;font-size:12.5px;color:var(--accent);
    margin:5px 0 0 20px;text-decoration:none}
  .hp-w:hover{text-decoration:underline}

  /* 年度結算:年度底下那一行小字(市場拆分、勝負筆數) */
  .ys-b{font-size:11.5px;color:var(--txt-faint);font-weight:400;margin-top:3px;
    letter-spacing:0;white-space:normal}
  .ys table{min-width:0}
  /* 窄畫面塞不下四欄:趟數與買賣總額折進年度底下那一行小字。
     直接讓表格橫向捲的話,最重要的「這一年賺賠多少」會被捲出畫面外。 */
  .ys-m{display:none}
  @media(max-width:700px){ .ys .ys-x{display:none} .ys .ys-m{display:block} }

  /* 主頁那一行提示 */
  .hm-health{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit;
    background:rgba(var(--hairline-rgb),.05);border-radius:var(--radius-lg);
    padding:14px 18px;margin:14px 0 0;transition:.2s}
  .hm-health.warn{background:rgba(var(--amber-rgb),.09)}
  .hm-health:hover{background:rgba(var(--hairline-rgb),.10)}
  .hm-h-ic{flex:0 0 auto;font-size:15px}
  .hm-health.warn .hm-h-ic{color:var(--amber)}
  .hm-h-t{flex:1;min-width:0;font-size:14px;line-height:1.45;color:var(--txt-dim);
    letter-spacing:-.01em}
  .hm-h-t b{color:var(--txt);font-weight:600;margin-right:6px}
  .hm-h-go{flex:0 0 auto;font-size:13.5px;color:var(--accent);white-space:nowrap}

  /* 復原點 */
  .undo{margin-top:14px;padding:14px 16px;border-radius:var(--radius);
    background:rgba(var(--hairline-rgb),.05)}
  .undo-t{font-size:14.5px;font-weight:600;letter-spacing:-.012em}
  .undo-s{font-size:13px;color:var(--txt-faint);line-height:1.5;margin:5px 0 11px}
  .undo .pf-btn{display:inline-flex}

  /* 安裝到主畫面 */
  .inst{background:rgba(var(--accent-rgb),.07);border-radius:var(--radius-lg);
    padding:18px 20px;margin-bottom:6px}
  .inst-t{font-size:17px;font-weight:600;letter-spacing:-.02em}
  .inst-s{font-size:13.5px;color:var(--txt-faint);line-height:1.5;margin:7px 0 12px}
  .inst-s b{color:var(--txt);font-weight:600}
  .inst .pf-btn{display:inline-flex}
  .inst-ios{font-size:13.5px;line-height:1.6}
  .inst-ios b{font-weight:600}
  .inst-ic{font-family:-apple-system,BlinkMacSystemFont,sans-serif}

  /* 檔案拖放區 */
  .ps-drop{margin-top:14px;padding:18px 16px;border-radius:var(--radius);
    border:1.5px dashed var(--line-strong);text-align:center;transition:.18s}
  .ps-drop.on{border-color:var(--accent);background:rgba(var(--accent-rgb),.07)}
  .ps-drop.busy{opacity:.55;pointer-events:none}
  .ps-drop-t{font-size:15px;font-weight:600;letter-spacing:-.015em}
  .ps-drop-s{font-size:13px;color:var(--txt-faint);line-height:1.5;margin:6px 0 12px}
  .ps-drop .pf-btn{display:inline-flex}

  /* 貼上對帳單:預覽表格裡可以直接改的手續費欄 */
  /* 加密貨幣的手續費會是 0.014523 這種長數字,欄位要夠寬才不會被截掉 */
  .ps-fee{width:104px;text-align:right;font-family:var(--sans);font-size:14px;
    padding:6px 8px;border:0;border-radius:8px;background:rgba(var(--hairline-rgb),.07);
    color:var(--txt);-moz-appearance:textfield;appearance:textfield}
  .ps-fee::-webkit-outer-spin-button,.ps-fee::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .ps-fee:focus{outline:none;background:rgba(var(--accent-rgb),.10);
    box-shadow:0 0 0 3px rgba(var(--accent-rgb),.22)}
  .ps-est{font-size:11px;color:var(--amber);margin-left:5px;vertical-align:1px}
  .ps-dup{font-size:11px;color:var(--amber);border:1px solid currentColor;border-radius:var(--radius-pill);
    padding:1px 7px;margin-left:6px;vertical-align:1px}
  .ps-row.dup{opacity:.62}

  .qs-row{padding:12px 0}
  .qs-nm{font-size:14.5px;letter-spacing:-.01em}
  .qs-st,.qs-b{font-family:var(--sans);font-size:12.5px;letter-spacing:-.005em}

  /* ---------- 持倉卡 ----------
     原本每一列是藍框 + 藍底,十幾檔排下來整頁都是藍的。改成中性的卡片,
     顏色只留給「數字」——漲跌、損益才是該被看見的東西。 */
  .pf-row{border:0;border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:10px;
    background:rgba(var(--hairline-rgb),.045)}
  .pf-row.has{background:rgba(var(--hairline-rgb),.06);
    box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.18)}
  .pf-hd{margin-bottom:12px}
  .pf-nm{font-size:16px;font-weight:600;letter-spacing:-.018em}
  .pf-tk{font-size:11.5px}
  .pf-tag{font-size:10px;padding:1px 6px;border-radius:var(--radius-pill)}
  .pf-val{font-size:16px;font-weight:600;letter-spacing:-.02em}
  .pf-x{font-size:15px;padding:4px 6px}
  .pf-in{gap:10px}
  .pf-in label{font-family:var(--sans);font-size:12px;letter-spacing:-.005em}
  .pf-in input{font-family:var(--sans);font-size:16px;padding:10px 11px;border:0;
    border-radius:10px;background:rgba(var(--hairline-rgb),.06);margin-top:5px;min-height:42px}
  .pf-in input:focus{background:rgba(var(--accent-rgb),.10);
    box-shadow:0 0 0 3px rgba(var(--accent-rgb),.22)}
  .pf-in select{font-family:var(--sans);font-size:15px;padding:9px 10px;border-radius:10px;
    min-height:42px;margin-top:5px;width:100%}
  .pf-calc{font-family:var(--sans);font-size:13px;gap:5px 16px;margin-top:12px;padding-top:11px;
    border-top:1px solid var(--line);letter-spacing:-.008em}
  .pf-calc b{font-weight:600;margin-left:4px}
  .pf-act{gap:9px;margin-top:12px;flex-wrap:wrap}


  /* ---------- 輸入框 ----------
     手機上字級小於 16px,iOS 一聚焦就會把整頁放大 —— 那是最惱人的手機體驗之一。 */
  .add-in{gap:9px}
  .add-in input{font-family:var(--sans);font-size:16px;padding:12px 14px;border:0;
    border-radius:var(--radius);background:rgba(var(--hairline-rgb),.06);min-height:44px}
  .add-in input:focus{background:rgba(var(--accent-rgb),.10);
    box-shadow:0 0 0 3px rgba(var(--accent-rgb),.25)}
  .add-in .pf-btn{flex:0 0 auto;padding:11px 16px}

  /* ---------- 分頁切換:改成 iOS 的分段控制項 ----------
     原本是四格滿版、選中的整塊塗成藍色,視覺重量比頁面標題還重。
     改成灰底容器 + 白色滑塊,選中的那格才是白的。 */
  .mtabs{border:0;background:rgba(var(--hairline-rgb),.06);border-radius:10px;
    padding:3px;gap:2px;margin-bottom:22px;backdrop-filter:none;position:relative}
  .mtab{font-family:var(--sans);font-size:14px;letter-spacing:-.01em;font-weight:500;
    color:var(--txt-dim);padding:9px 0;border-right:0;border-radius:8px;min-height:38px;
    display:flex;align-items:center;justify-content:center}
  .mtab:hover{background:rgba(var(--hairline-rgb),.05);color:var(--txt)}
  .mtab.on{background:var(--panel-float);color:var(--txt);border-radius:8px;
    box-shadow:0 1px 3px rgba(0,0,0,.10),0 0 1px rgba(0,0,0,.12)}

  /* ---------- 導覽列 ---------- */
  #topnav a{font-size:13.5px;padding:13px 12px;letter-spacing:-.012em}
  #topnav .nbrand{font-size:15.5px;letter-spacing:-.022em}

  /* ================= 電腦版:左側欄導覽(幣安式)=================
     使用者要的排版:左邊一條固定的側欄放導覽,右邊是內容,表格密一點。

     ⚠ 刻意**不改 HTML**,只用 CSS 把同一條 <nav> 轉成側欄。
       理由:導覽列上那幾顆(主題、搜尋、設定)的事件、鍵盤操作、
       手機的橫向捲動全部都已經寫好而且有測試在守。複製一份側欄的 markup
       出來,等於同樣的東西要維護兩份,而且兩份遲早會長歪。
     ⚠ 門檻 1100px:再窄的話側欄 + 內容 + 停靠的 K 線面板會互相擠。 */
  @media (min-width:1100px){
    :root{ --sbw:196px }
    body.sbmin{ --sbw:58px }
    /* 收起來的時候只留圖示與縮寫,而且要留得住「哪一頁是選中的」 */
    body.sbmin #topnav a{text-align:center;padding:10px 4px;font-size:11px;
      overflow:hidden;white-space:nowrap}
    body.sbmin #topnav .nbrand{font-size:0;padding:10px 0 14px}
    body.sbmin #topnav .nbrand::after{content:'◎';font-size:19px}
    body.sbmin #topnav .nics{flex-direction:column;gap:2px}
    body.sbmin .sb-tg{transform:rotate(180deg)}
    #topnav{
      top:0;bottom:0;right:auto;width:var(--sbw);
      flex-direction:column;align-items:stretch;
      overflow-x:hidden;overflow-y:auto;
      border-bottom:0;border-right:1px solid var(--line);
      padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));
    }
    #topnav .nbrand{padding:10px 12px 16px;font-size:17px}
    /* 收合鈕。只在側欄模式下出現 —— 頂端導覽沒有「收起來」這件事 */
    .sb-tg{display:flex;align-items:center;justify-content:center;
      width:26px;height:26px;border:0;cursor:pointer;border-radius:var(--radius);
      font:inherit;font-size:13px;line-height:1;color:var(--txt-faint);
      background:rgba(var(--hairline-rgb),.08);margin:0 auto 8px}
    .sb-tg:hover{color:var(--txt);background:rgba(var(--hairline-rgb),.16)}
    #topnav a{
      padding:9px 12px;border-radius:var(--radius);margin-bottom:1px;
      font-size:13.5px;border-bottom:0;
    }
    /* 側欄上「選中」要整條反白,不是底下一條線 —— 直的排版看不到底線 */
    #topnav a.on,#topnav a[aria-current="page"]{
      background:rgba(var(--accent-rgb),.12);color:var(--accent);
      border-bottom:0;box-shadow:none;
    }
    #topnav a:hover{background:rgba(var(--hairline-rgb),.07)}
    #topnav .nsp{flex:1 1 auto}
    /* 三顆工具鈕在側欄底部排成一列 */
    #topnav .nics{position:static;display:flex;gap:4px;padding:8px 6px 0;
      border-top:1px solid var(--line);background:none}
    #topnav .nics .nic{flex:1;text-align:center}

    #page{inset:0 0 0 var(--sbw)}
    /* 內容區可以寬一點,而且不用再留頂端導覽的高度 */
    .pg{max-width:1180px;padding:32px 28px 88px}
    .pg-hd{margin-bottom:22px}

    /* 表格密一點 —— 桌機一屏要看得到更多列 */
    .tw th,.tw td{padding-top:9px;padding-bottom:9px;font-size:13px}
    .tw th{font-size:11.5px}

    /* K 線停靠的時候,右邊讓位要扣掉側欄 */
    body.dock #page{padding-right:min(620px,42vw)}
  }
  /* 側欄模式下,手機用的底部分頁列要收起來 */
  @media (min-width:1100px){ #tabbar{display:none} }

  /* ---------- 手機 ---------- */
  @media(max-width:840px){
    /* 分頁改由底部那條負責(見 #tabbar),上面這條只留品牌與三顆圖示。
       量過:七個分頁的文字寬度是 392px,390px 的手機扣掉圖示只剩 280px,
       縮字級、縮 padding 全部加起來也省不到 112px —— 塞不下就是塞不下。 */
    #topnav a[data-r]{display:none}
    #topnav .nbrand{padding-right:10px}
    #topnav .nic{padding:12px 9px}
    #topnav .nic:last-child{padding-right:14px}

    /* ---------- 底部分頁列 ---------- */
    /* 47px 是量出來的:圖示 23 + 間距 3 + 字 11 + 上下 padding 10。

       安全區另外加,因為 iPhone 的 home indicator 在它下面 —— 但**不加滿**。
       iOS 給的 env(safe-area-inset-bottom) 是 34pt,整個墊上去的話字底下會空出
       一大塊(使用者的回報就是「下面太多空白」)。home indicator 本身只有 5pt 高、
       離螢幕底 8pt,留 34 是為了手勢範圍,不是為了不被蓋住。
       這裡留一半多一點:夠讓標籤不被指示器壓到,又不會空出一整條。 */
    :root{ --tabbot:max(6px, calc(env(safe-area-inset-bottom, 0px) - 14px)); }
    :root{ --tabtop:calc(47px + var(--tabbot)); }
    #tabbar{
      display:flex;position:fixed;left:0;right:0;bottom:0;z-index:86;
      background:rgba(var(--panel-rgb),.82);border-top:1px solid var(--line);
      backdrop-filter:saturate(180%) blur(20px);
      -webkit-backdrop-filter:saturate(180%) blur(20px);
      padding-bottom:var(--tabbot);
    }
    /* 沒有 backdrop-filter 的瀏覽器(舊 Android WebView、關掉合成的環境)
       半透明底下的內容會直接透出來,分頁名跟持股數字疊在一起看不清楚。
       那種情況就不要透明。 */
    @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
      #tabbar{background:var(--panel)}
    }
    #tabbar > *{
      flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:3px;padding:6px 2px 4px;color:var(--txt-faint);text-decoration:none;
      cursor:pointer;-webkit-tap-highlight-color:transparent;
      /* 44px 是能穩定按中的最小值。字級再小也不會讓格子變矮。 */
      min-height:44px;
    }
    #tabbar svg{width:23px;height:23px;fill:none;stroke:currentColor;
      stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    #tabbar i{font-style:normal;font-size:10.5px;letter-spacing:-.01em;line-height:1}
    #tabbar .on{color:var(--accent)}
    #tabbar > *:focus-visible{outline:2px solid var(--accent);outline-offset:-3px;border-radius:10px}

    /* ---------- 「更多」選單 ---------- */
    #moreSheet{position:fixed;inset:0;z-index:120;display:flex;
      flex-direction:column;justify-content:flex-end}
    #moreSheet .ms-back{position:absolute;inset:0;background:rgba(0,0,0,.35)}
    #moreSheet .ms-card{position:relative;background:var(--panel);
      border-radius:16px 16px 0 0;padding:8px 0 calc(8px + env(safe-area-inset-bottom));
      box-shadow:0 -8px 40px rgba(0,0,0,.22);
      animation:msUp .22s cubic-bezier(.32,.72,0,1)}
    @keyframes msUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    #moreSheet a{display:block;padding:13px 20px;color:var(--txt);text-decoration:none;
      font-size:16px;letter-spacing:-.01em}
    #moreSheet a span{display:block;font-size:12.5px;color:var(--txt-faint);margin-top:2px;
      letter-spacing:0}
    #moreSheet a.on{color:var(--accent)}
    #moreSheet .ms-x{display:block;width:calc(100% - 24px);margin:6px 12px 0;
      padding:13px;border:0;border-top:1px solid var(--line);background:transparent;
      color:var(--accent);font:inherit;font-size:16px;cursor:pointer}
    @media(prefers-reduced-motion:reduce){ #moreSheet .ms-card{animation:none} }

    /* 底部分頁列是 fixed 的,會蓋住最後一行 —— 所以內容要墊出它的高度。
       但只要墊「它的高度 + 一點呼吸」就好。原本多加 72px,捲到底之後
       是一整塊什麼都沒有的空白,每一頁都這樣。 */
    .pg{padding-bottom:calc(var(--tabtop) + 18px)}
    .pclose{padding:10px 15px}
    .kpi{grid-template-columns:repeat(2,1fr);gap:10px}
    .kpi .k{padding:16px 16px 14px}
    .know{gap:10px}
    .kn{padding:18px 18px 16px}
    .tw table{font-size:14px}
    .tw th,.tw td{padding:13px 12px}
    .mtab{font-size:13px}
    /* 手機看不完整張表:留下「我現在要知道的」那幾欄,其餘收起來。
       (橫向捲動的表格在手機上等於沒人會看到後面那幾欄。) */
    .tw .col-opt{display:none}
    /* 舊規則在 840px 以下把按鈕排成一直條(當年按鈕只有 9.5px 才需要)。
       現在按鈕本身就有 44px 高,橫排 + 排不下才換行比較省空間。 */
    .pf-act,.tf-act{flex-direction:row;flex-wrap:wrap}
  }
  @media(max-width:560px){
    /* 剩下「標的 · 市值 · 損益」三欄。橫向捲動的表格在手機上等於沒人看得到,
       寧可只留三個真的會看的數字。 */
    .tw .col-mid{display:none}
    .tw th,.tw td{padding:12px 10px}
    .tw table{font-size:13.5px}
    /* 損益的百分比換到第二行,一格才塞得下「+225,000」跟「+22.17%」 */
    .tw .sub-pct{display:block;font-size:12px;opacity:.62;margin-top:2px}
    /* 同上:已出場那張表的「持有幾天」折進標的底下 */
    .tw .sub-days{display:block;font-size:11.5px;color:var(--txt-faint);margin-top:2px}
  }
  @media(max-width:420px){
    .pg{padding-left:16px;padding-right:16px}
  }


  /* ---------- 這個專案自己的幾條(ORBIT 沒有的) ---------- */
  /* 佈景切換鈕。不能放進 #topnav —— 站上有一條
     body[data-route="tycoon"] #topnav{display:none},放進去就永遠看不到。 */
  #navTheme{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 54px);
    z-index:40;font-family:var(--mono);font-size:11px;letter-spacing:.04em;
    padding:5px 10px;border-radius:var(--radius);cursor:pointer;
    color:var(--g-t2);background:rgba(11,22,32,.82);border:1px solid var(--g-line);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  #navTheme:hover{color:var(--g-ac);border-color:var(--g-ac)}
  @media (min-width:900px){ #navTheme{bottom:10px} }


  /* ═══════════ world3d.js 的畫面層 ═══════════ */
  /* 星空:地球後面不再是一片平的深藍。三層不同大小的點,錯開重複週期,
     看起來就不會有明顯的格子感。 */
  .tg-map{background:
    radial-gradient(1px 1px at 23px 41px,rgba(255,255,255,.75),transparent 60%),
    radial-gradient(1px 1px at 131px 97px,rgba(200,230,255,.6),transparent 60%),
    radial-gradient(1.5px 1.5px at 77px 163px,rgba(255,255,255,.55),transparent 60%),
    radial-gradient(1px 1px at 181px 19px,rgba(255,240,210,.5),transparent 60%),
    radial-gradient(ellipse at 50% 42%,#0f2a40 0%,#08131c 60%,#040a10 100%);
    background-size:211px 223px,173px 181px,239px 197px,151px 163px,100% 100%}
  #tyGlobeHost{position:relative}
  /* 3D 建築啟用:CSS 積木收起來,名牌從地面往下垂 */
  #tyGlobeHost[data-w3d] .tyk .k-b{display:none}
  #tyGlobeHost[data-w3d] .tyk:not(.rv):not(.idle){transform:translate(-50%,6px)}
  #tyGlobeHost[data-w3d] .tyk.rv{transform:translate(-50%,6px)}
  #tyGlobeHost[data-w3d] .tyk.rv .k-ic{display:none}
  .tyk .k-lv{font-style:normal;display:inline-block;min-width:13px;margin-right:4px;
    padding:0 3px;border-radius:3px;background:#e0b23c;color:#2a1c02;font-weight:800;
    font-size:.9em;text-align:center;font-variant-numeric:tabular-nums}

  /* 過場:季別橫幅 + 浮字。整層不吃點擊,不會擋住任何按鈕。 */
  #w3dFx{position:absolute;inset:0;pointer-events:none;z-index:170;overflow:hidden}
  .w3d-ban{position:absolute;left:50%;top:18%;transform:translate(-50%,0);
    display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;
    padding:12px 26px 13px;min-width:min(260px,80%);max-width:calc(100% - 32px);
    background:linear-gradient(180deg,rgba(12,30,46,.92),rgba(8,20,31,.88));
    border:1px solid rgba(224,178,60,.55);border-radius:8px;
    box-shadow:0 10px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);
    animation:w3dIn .45s cubic-bezier(.2,1.4,.4,1) both;transition:opacity .5s,transform .5s}
  .w3d-ban.out{opacity:0;transform:translate(-50%,-14px)}
  .w3d-ban em{font-style:normal;font-size:11px;color:#9fb6c8;letter-spacing:.06em}
  .w3d-ban b{font-size:26px;font-weight:800;letter-spacing:-.02em;color:#f4d27a;
    text-shadow:0 2px 12px rgba(224,178,60,.35);font-variant-numeric:tabular-nums}
  .w3d-ban span{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .w3d-ban span.up{color:var(--up,#ff453a)} .w3d-ban span.dn{color:var(--down,#30d158)}
  .w3d-ban i{font-style:normal;font-size:11.5px;color:#d7e4ee;margin-top:3px;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @keyframes w3dIn{from{opacity:0;transform:translate(-50%,16px) scale(.92)}
                   to{opacity:1;transform:translate(-50%,0) scale(1)}}
  .w3d-float{position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;font-weight:800;
    font-variant-numeric:tabular-nums;padding:2px 7px;border-radius:10px;
    background:rgba(6,16,24,.82);border:1px solid currentColor;
    text-shadow:0 1px 2px rgba(0,0,0,.7);will-change:transform,opacity}
  .w3d-float.up{color:var(--up,#ff453a)} .w3d-float.dn{color:var(--down,#30d158)}
  .w3d-float.rv{color:#ffd27a;font-weight:600;font-size:11px}
  /* 資源列的數字變動時閃一下:漲紅跌綠,跟站上的漲跌色一致 */
  .w3d-up{animation:w3dUp 1.4s ease-out}
  .w3d-dn{animation:w3dDn 1.4s ease-out}
  @keyframes w3dUp{0%,30%{color:var(--up,#ff453a);text-shadow:0 0 10px rgba(255,69,58,.6)}}
  @keyframes w3dDn{0%,30%{color:var(--down,#30d158);text-shadow:0 0 10px rgba(48,209,88,.6)}}
  @media (prefers-reduced-motion:reduce){ .w3d-ban{animation:none} }

  /* ═══════════ 資本部隊 ═══════════ */
  /* 地圖上的單位牌:站在城市名牌的上方,方形、粗框 —— 一眼跟名牌分得開 */
  .tyu{transform:translate(-50%,calc(-100% - 26px));display:flex;align-items:center;gap:3px;
    cursor:pointer;user-select:none;white-space:nowrap;font-family:var(--sans);line-height:1;
    padding:3px 6px 3px 5px;border-radius:4px;background:linear-gradient(180deg,#1d5f95,#12406a);
    border:1.5px solid #6fd0ff;box-shadow:0 2px 8px rgba(0,0,0,.55),0 0 10px rgba(79,195,247,.35);
    color:#fff;font-size:12px}
  .tyu b{font-weight:400;letter-spacing:-1px}
  .tyu em{font-style:normal;font-size:9.5px;font-weight:700;color:#cfeaff;font-variant-numeric:tabular-nums}
  .tyu.mv{border-style:dashed;opacity:.92}
  .tyu.th{background:linear-gradient(180deg,#6a1a1a,#3f0d0d);border-color:var(--rc,#ff453a);
    box-shadow:0 2px 8px rgba(0,0,0,.55),0 0 12px rgba(255,69,58,.55);animation:tyuPulse 1.4s ease-in-out infinite}
  .tyu.th i{font-style:normal;font-size:11px}
  .tyu.th em{color:#ffb3aa}
  @keyframes tyuPulse{50%{box-shadow:0 2px 8px rgba(0,0,0,.55),0 0 20px rgba(255,69,58,.9)}}
  #tyGlobeHost[data-z="far"] .tyu{font-size:10px;padding:2px 4px}

  /* 部隊面板 */
  .ty-threat{border:1px solid rgba(255,69,58,.45);background:rgba(255,69,58,.08);border-radius:8px;
    padding:9px 11px;margin:6px 0}
  .ty-threat .th-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12.5px}
  .ty-threat .th-h em{font-style:normal;color:#ff9a9a;font-size:11.5px}
  .ty-threat .th-b{font-size:12px;margin-top:4px;color:var(--g-t2)}
  .ty-threat .th-n{font-size:11px;margin-top:4px;color:var(--g-t3);line-height:1.6}
  .ty-unit{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--g-line);flex-wrap:wrap}
  .ty-unit .u-ic{font-size:20px;width:30px;text-align:center;flex:0 0 auto}
  .ty-unit .u-nm{display:flex;flex-direction:column;gap:2px;flex:1 1 140px;min-width:0}
  .ty-unit .u-nm b{font-size:13px}
  .ty-unit .u-nm em{font-style:normal;font-size:10.5px;color:var(--g-t3)}
  .ty-unit .u-at{font-size:11.5px;color:var(--g-t2)}
  .ty-unit .u-mv{font-size:11.5px;color:#7fd4ff}
  .ty-unit .u-go{display:flex;gap:5px;align-items:center;flex-wrap:wrap;flex:1 1 220px;justify-content:flex-end;min-width:0}
  .ty-unit select{font:inherit;font-size:12px;max-width:100%;min-width:0;flex:1 1 120px;
    background:#0f2233;color:var(--g-t);border:1px solid var(--g-line2);border-radius:5px;padding:5px 6px}
  .ty-ucards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
  .ty-ucard{border:1px solid var(--g-line);border-radius:8px;padding:10px 11px;background:rgba(15,34,51,.6);min-width:0}
  .ty-ucard .uc-h{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .ty-ucard .uc-h i{font-style:normal;font-size:18px}
  .ty-ucard .uc-h b{font-size:13.5px}
  .ty-ucard .uc-h span{font-size:11px;color:var(--g-t3);margin-left:auto}
  .ty-ucard p{font-size:11.5px;line-height:1.65;color:var(--g-t2);margin:6px 0 8px}
  .ty-uchips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 8px}
  .ty-uchips .uch{font-size:11.5px;padding:3px 8px;border-radius:5px;border:1px solid #6fd0ff;
    background:rgba(29,95,149,.35)}
  .ty-uchips .uch.mv{border-style:dashed}

  /* 3D 部隊棋子上方的標籤(位置由 world3d.js 每一幀投影) */
  #w3dTags{position:absolute;inset:0;pointer-events:none;z-index:165;overflow:hidden}
  .w3d-tag{position:absolute;left:0;top:0;font:inherit;font-size:11px;line-height:1;white-space:nowrap;
    cursor:pointer;color:#fff;padding:2px 5px;border-radius:3px;
    background:rgba(18,64,106,.92);border:1px solid #6fd0ff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
  .w3d-tag b{font-weight:700;font-size:10px;color:#cfeaff;font-variant-numeric:tabular-nums}
  .w3d-tag.mv{border-style:dashed}
  .w3d-tag.th{background:rgba(90,18,18,.94);border-color:var(--rc,#ff453a)}
  .w3d-tag.th b{color:#ffb3aa}

  /* ═══════════ 第三輪:字體放大、側欄、遠看兵種圖示、懸停 ═══════════
     使用者:「整體來說字都太小了」。這一段放在最後面,覆蓋前面各處的字級。 */
  .tg-id b{font-size:15px}
  .tg-pill,.tg-reg{font-size:13px}
  .tg-nwp b{font-size:16px} .tg-nwp em{font-size:12px}
  .tg-go b{font-size:14px} .tg-go em{font-size:10.5px}
  .tg-res .r b{font-size:14px} .tg-res .r em{font-size:10px} .tg-res .r i{font-size:12px}
  .tg-nb i{font-size:18px} .tg-nb span{font-size:12px}
  .tg-sb i{font-size:16px} .tg-sb span{font-size:11px}
  .tg-c{font-size:12.5px;padding:4px 11px}
  .tg-lay .lg{font-size:11.5px}
  .tg-ticker .t-i{font-size:13px}
  .tg-mt b{font-size:19px}
  .tg-mb{font-size:14px}
  .tg-mb .p-sec{font-size:13.5px}
  .tg-mb .ty-facts em{font-size:12px} .tg-mb .ty-facts b{font-size:16px}
  .tyk .k-n{font-size:11.5px;padding:3px 8px}
  .tyk.idle .k-n{font-size:10.5px}
  .tyk.rv .k-n{font-size:11px}
  #tyGlobeHost[data-z="far"] .tyk .k-n{font-size:10.5px;padding:2px 6px}
  #tyGlobeHost[data-z="near"] .tyk .k-n{font-size:13.5px;padding:4px 10px}
  .w3d-tag{font-size:13px;padding:3px 6px} .w3d-tag b{font-size:12px}
  /* 手機窄的時候資源列七格擠在一排:數字放大到 14px 會被截成「15.0...」 */
  @media (max-width:420px){ .tg-res .r b{font-size:12.5px;letter-spacing:-.04em} .tg-res .r em{font-size:9.5px} }
  @media (min-width:900px){
    .tg-id b{font-size:17px}
    .tg-pill,.tg-reg{font-size:14px}
    .tg-nwp b{font-size:19px} .tg-nwp em{font-size:13px}
    .tg-go{padding:5px 16px} .tg-go b{font-size:16px} .tg-go em{font-size:11.5px}
    .tg-res .r{padding:6px 4px 5px} .tg-res .r b{font-size:18px} .tg-res .r em{font-size:12px} .tg-res .r i{font-size:15px}
    .tg-nb{padding-top:8px;padding-bottom:8px} .tg-nb i{font-size:21px} .tg-nb span{font-size:14px}
    .tg-sb{width:68px;min-height:56px} .tg-sb i{font-size:19px} .tg-sb span{font-size:12.5px}
    .tg-c{font-size:14px;padding:5px 13px} .tg-lay .lg{font-size:13px}
    .tg-ticker .t-i{font-size:14.5px}
    .tg-mb{font-size:15px}
    .tyk .k-n{font-size:13.5px;padding:3px 10px}
    .tyk.idle .k-n{font-size:12px} .tyk.rv .k-n{font-size:12.5px}
    #tyGlobeHost[data-z="far"] .tyk .k-n{font-size:12px}
    #tyGlobeHost[data-z="near"] .tyk .k-n{font-size:15px;padding:4px 12px}
    .w3d-tag{font-size:15px} .w3d-tag b{font-size:13px}
    .w3d-ban b{font-size:34px} .w3d-ban em{font-size:13px} .w3d-ban span{font-size:16px} .w3d-ban i{font-size:14px}
    .w3d-float{font-size:15px}
  }

  /* 側欄:桌機上點國家 / 城市 / 部隊 / 對手,地圖留著 */
  .tycon[data-modal][data-side] #tyGlobeSlot,.tycon[data-modal][data-side] .tg-scrim,
  .tycon[data-modal][data-side] .tg-lay,.tycon[data-modal][data-side] .tg-ticker{visibility:visible}
  .tycon[data-side] .tg-modal{left:auto;width:min(480px,40vw);
    border-left:1px solid var(--g-line2);box-shadow:-12px 0 40px rgba(0,0,0,.45);
    background:rgba(10,23,34,.97)}
  .tycon[data-side] .tg-side{right:min(480px,40vw)}

  /* 國家卡 */
  .p-flag{font-style:normal;font-size:26px;line-height:1;margin:4px 0 2px;display:block}
  .ty-board{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px}
  .ty-board .b-r{display:grid;grid-template-columns:minmax(0,9em) 1fr 3em;gap:8px;align-items:center;font-size:13px}
  .ty-board .b-r.me .b-n{color:#7fd4ff;font-weight:700}
  .ty-board .b-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ty-board .b-b{height:9px;border-radius:5px;background:rgba(150,200,235,.1);overflow:hidden}
  .ty-board .b-b i{display:block;height:100%;border-radius:5px}
  .ty-board .b-v{text-align:right;font-variant-numeric:tabular-nums;color:var(--g-t2)}
  .ty-site .s-n .k-lv{margin-right:6px}

  /* 遠看:3D 棋子收起來,標籤變成參考畫面那種方形兵種圖示(綠 = 你,紅 = 敵人) */
  #tyGlobeHost[data-far="1"] .w3d-tag{display:flex;flex-direction:column;align-items:center;gap:1px;
