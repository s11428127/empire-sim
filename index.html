    min-width:34px;padding:4px 5px 3px;border-radius:4px;font-size:17px;line-height:1.05;
    background:linear-gradient(180deg,#2f8a3a,#1d5c25);border:2px solid #d8f5c8;
    box-shadow:0 2px 6px rgba(0,0,0,.6);transform-origin:50% 100%}
  #tyGlobeHost[data-far="1"] .w3d-tag b{font-size:10.5px;color:#eaffdf}
  #tyGlobeHost[data-far="1"] .w3d-tag.mv{border-style:dashed}
  #tyGlobeHost[data-far="1"] .w3d-tag.th{background:linear-gradient(180deg,#b3261e,#7a1510);border-color:#ffd0c8}
  #tyGlobeHost[data-far="1"] .w3d-tag.th b{color:#ffe1dc}

  /* 滑鼠停在國家 / 城市上的小卡 */
  .w3d-hover{position:absolute;left:0;top:0;z-index:175;pointer-events:none;max-width:240px;
    display:flex;flex-direction:column;gap:3px;padding:8px 11px;border-radius:7px;
    background:rgba(8,20,31,.94);border:1px solid rgba(255,236,150,.55);
    box-shadow:0 6px 22px rgba(0,0,0,.5);font-size:12.5px;color:#d7e4ee}
  .w3d-hover b{font-size:14.5px;color:#fff}
  .w3d-hover .lv{font-style:normal;font-size:11px;padding:0 5px;border-radius:3px;background:#e0b23c;color:#2a1c02;margin-left:4px}
  .w3d-hover .dim{color:#8aa3b8}
  @media (min-width:900px){ .w3d-hover{font-size:13.5px} .w3d-hover b{font-size:16px} }

  /* 地圖上的字:參考畫面那種白字 + 黑色描邊。第一版是灰藍色的字直接印在綠地上,
     使用者說「顏色都太不明顯」。 */
  .tyk.idle,.tyk.idle:hover{opacity:1}
  .tyk.idle .k-n,.tyk.rv .k-n{color:#fff;font-weight:600;
    text-shadow:0 0 2px #000,0 0 3px #000,0 1px 3px rgba(0,0,0,.95),0 0 6px rgba(0,0,0,.6)}
  .tyk.rv .k-n{color:#ffe3a3}
  #tyGlobeHost[data-z="near"] .tyk.idle{opacity:1}
  .tyk .k-n{box-shadow:0 1px 5px rgba(0,0,0,.6)}
  /* 3D 模式:每座城市正中央站著它的地標,還沒進場的城市名改掛在地標下面 */
  #tyGlobeHost[data-w3d] .tyk.idle{transform:translate(-50%,10px)}

  /* ═══════════ 第五輪:拉線、部隊小卡、爆炸、部隊面板字級 ═══════════ */
  #w3dAim{position:absolute;left:50%;top:56px;transform:translateX(-50%);z-index:220;display:flex;align-items:center;gap:10px;
    flex-wrap:wrap;justify-content:center;max-width:calc(100% - 24px);
    padding:8px 12px;border-radius:8px;background:rgba(8,20,31,.94);border:1px solid #ffe178;
    box-shadow:0 6px 22px rgba(0,0,0,.5);font-size:13.5px;color:#fff}
  #w3dAim span{color:#9fb6c8;font-size:12px}
  #w3dAim button{font:inherit;font-size:12.5px;cursor:pointer;color:#fff;background:#96271b;border:1px solid #e05a4c;
    border-radius:5px;padding:4px 10px}

  .w3d-hover .ok{color:#7ee08f;font-weight:700}
  #w3dUnitPop{position:absolute;left:0;top:0;z-index:215;width:220px;padding:10px 12px;border-radius:8px;
    background:rgba(8,20,31,.96);border:1px solid #6fd0ff;box-shadow:0 8px 26px rgba(0,0,0,.55);font-size:13.5px;color:#e8f1f8}
  #w3dUnitPop .up-h{display:flex;align-items:baseline;gap:6px;margin-bottom:6px}
  #w3dUnitPop .up-h b{font-size:15px} #w3dUnitPop .up-h em{font-style:normal;font-size:11.5px;color:#9fb6c8;flex:1}
  #w3dUnitPop .x{font:inherit;cursor:pointer;background:none;border:0;color:#9fb6c8;font-size:14px}
  #w3dUnitPop label{display:flex;align-items:center;gap:7px;padding:4px 0;cursor:pointer}
  #w3dUnitPop .up-b{display:flex;gap:6px;margin-top:8px}
  #w3dUnitPop .up-b button{flex:1;font:inherit;font-size:12.5px;cursor:pointer;padding:6px 4px;border-radius:5px;
    color:#fff;background:linear-gradient(180deg,#2f8fd0,#1b6aa4);border:1px solid #57b6ee}
  #w3dUnitPop .up-b .pn{background:#15283a;border-color:#3a6288}
  #w3dUnitPop .up-n{font-size:11px;color:#8aa3b8;margin-top:6px}
  .w3d-tag{cursor:grab} .w3d-tag:active{cursor:grabbing}
  .w3d-boom{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,#fff6c8 0,#ffb23c 30%,#ff5a2a 55%,rgba(255,60,30,0) 72%);
    animation:w3dBoom 1s ease-out forwards}
  .w3d-boom.big{animation-duration:1.1s}
  @keyframes w3dBoom{0%{transform:scale(.2);opacity:1}40%{opacity:1}100%{transform:scale(5.5);opacity:0}}
  .w3d-boom.big{animation-name:w3dBoomBig}
  @keyframes w3dBoomBig{0%{transform:scale(.3);opacity:1}40%{opacity:1}100%{transform:scale(9);opacity:0}}
  /* 部隊面板:使用者說「資本部隊字有點小」 */
  .ty-unit .u-nm b{font-size:15.5px} .ty-unit .u-at,.ty-unit .u-mv{font-size:13px} .ty-unit .u-nm em{font-size:12px}
  .ty-unit .u-ic{font-size:24px} .ty-unit select{font-size:13.5px}
  .ty-ucard .uc-h b{font-size:15.5px} .ty-ucard .uc-h span{font-size:12.5px} .ty-ucard p{font-size:13px}
  .ty-ucard .u-go{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .ty-ucard .u-go select{flex:1 1 140px;min-width:0;font:inherit;font-size:13px;background:#0f2233;color:var(--g-t);
    border:1px solid var(--g-line2);border-radius:5px;padding:5px 6px}
  .ty-ucard.strike{border-color:rgba(255,120,80,.45);background:linear-gradient(180deg,rgba(70,22,16,.35),rgba(15,34,51,.6))}
  .ty-ucard.strike.cool{opacity:.72}
  .ty-threat .th-h{font-size:14px} .ty-threat .th-b{font-size:13px} .ty-threat .th-n{font-size:12px}
  @media (min-width:900px){
    .ty-unit .u-nm b{font-size:16.5px} .ty-ucard p{font-size:13.5px} .ty-ucard .uc-h b{font-size:16.5px}
    .tg-mb .expo-note{font-size:13.5px}
  }

  /* ═══════════ 事業等級、金庫、資料頁 ═══════════ */
  .ty-card .c-lv{display:inline-block;font-size:12.5px;font-weight:800;padding:2px 7px;border-radius:5px;margin-right:7px;
    background:linear-gradient(180deg,#f4d27a,#c9951f);color:#2a1c02;vertical-align:1px}

<!-- 地球的停車位。它是 WebGL,不能放在 #page 裡面 —— renderPage() 每次都會
     innerHTML 清空,canvas 連同 WebGL context 一起被銷毀,切幾次分頁就會撞到
     瀏覽器同時允許的 context 上限。所以它永遠住在這裡,要用的時候才 appendChild
     進地圖那一頁,重畫之前先搬回來(見 tyParkGlobe / tyGlobeMount)。 -->

<script>


/* ═══ 從 ORBIT 帶過來:佈景色彩 cssVar / readThemeColors / applyTheme(原檔 4676–4732 行) ═══ */

const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* Canvas 與 globe.gl 只吃真的顏色字串,不吃 var()。原本讀一次就存成 const,
   但現在主題可以切換 —— 切完之後那些常數會是舊主題的顏色,地球與 K 線
   會停在前一個主題。所以改成 let + readThemeColors(),切主題時重讀。 */
let ACC, ACC_RGB, TXT_FAINT, TXT_DIM, UP, DOWN, AMBER, IS_DARK;
function readThemeColors(){
  ACC       = cssVar('--accent')     || '#0071e3';
  ACC_RGB   = cssVar('--accent-rgb') || '0,113,227';
  TXT_FAINT = cssVar('--txt-faint')  || '#86868b';
  TXT_DIM   = cssVar('--txt-dim')    || '#6e6e73';
  UP        = cssVar('--up')         || '#ff3b30';   // 紅 = 漲
  DOWN      = cssVar('--down')       || '#34c759';   // 綠 = 跌
  AMBER     = cssVar('--amber')      || '#ff9500';
  /* 地球要知道自己該畫白天還是夜晚。用背景色的感知亮度判斷,
     這樣「跟隨系統」和「明確指定」兩種情況共用同一段邏輯,不用各判斷一次。 */
  const bg=(cssVar('--bg')||'#ffffff').replace('#','');
  const hx=bg.length===3 ? bg.split('').map(c=>c+c).join('') : bg;
  const n=parseInt(hx,16)||0;
  IS_DARK = (((n>>16&255)*299 + (n>>8&255)*587 + (n&255)*114)/1000) < 128;
}
readThemeColors();
const acc = a => `rgba(${ACC_RGB},${a})`;      // 介面外殼的半透明強調色

/* ---------- 外觀:淺色 / 深色 / 跟隨系統 ---------- */
const THEME_KEY='orbit.theme';
let THEME='system';
try{ const v=localStorage.getItem(THEME_KEY); if(['light','dark','system'].includes(v)) THEME=v; }catch(e){}

function applyTheme(t, quiet){
  if(t) THEME=t;
  try{ localStorage.setItem(THEME_KEY, THEME); }catch(e){}
  // 跟隨系統 = 根元素不帶 data-theme,單純讓 @media 決定
  if(THEME==='system') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = THEME;
  readThemeColors();
  if(typeof paintGlobeTheme==='function') paintGlobeTheme();
  if(typeof tyPaintGlobe==='function') tyPaintGlobe();   // 帝國地球也要跟著換日夜
  document.querySelectorAll('[data-thm]').forEach(el=>
    el.classList.toggle('on', el.dataset.thm===THEME));
  if(!quiet){
    if(typeof refreshGlobe==='function') refreshGlobe();
    if(typeof renderPage==='function' && PAGE!=='globe') renderPage();
    typeBrief(THEME==='system'
      ? '外觀:跟隨系統。系統切深色,這裡就跟著切。'
      : THEME==='dark'
        ? '外觀:深色。地球也會變成夜晚 —— 深藍的海、發光的大氣層、星空。'
        : '外觀:淺色。地球變成白天 —— 淡藍的海、淺灰的陸地,星空關掉。');
  }
}
// 在「跟隨系統」時改了作業系統設定,要即時跟上
try{
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
    if(THEME==='system'){ applyTheme(null, true); if(typeof refreshGlobe==='function') refreshGlobe(); }
  });
}catch(e){}


/* ═══ 從 ORBIT 帶過來:匯率表 FX(榜單要把美元換算成台幣)(原檔 4733–4737 行) ═══ */

const FX = {
  TWD:1, USD:32.48, EUR:34.15, JPY:0.2085, KRW:0.0225, CNY:4.46,
  GBP:41.20, SGD:24.30, HKD:4.17, AUD:21.30, CAD:23.40, CHF:36.50,
  INR:0.385, VND:0.00128, MXN:1.72, BRL:5.62,
};

/* ═══ 從 ORBIT 帶過來:地區名、數字與金額格式 fmt / pct / nf / fmtM / sgnM(原檔 5175–5254 行) ═══ */

const REGION_NAME = {
  TW:'台灣', US:'美國', JP:'日本', KR:'南韓', CN:'中國', NL:'荷蘭', DE:'德國',
  GB:'英國', IN:'印度', VN:'越南', MX:'墨西哥', SG:'新加坡', SV:'薩爾瓦多', YE:'葉門',
  SA:'沙烏地阿拉伯', RU:'俄羅斯', CA:'加拿大', IQ:'伊拉克', AE:'阿聯', IR:'伊朗',
  BR:'巴西', KW:'科威特', NG:'奈及利亞', QA:'卡達', AU:'澳洲', NO:'挪威', GH:'迦納',
  PE:'秘魯', ZA:'南非', UZ:'烏茲別克', CL:'智利', CD:'剛果(金)', ZM:'尚比亞',
  ID:'印尼', UA:'烏克蘭', MM:'緬甸', TH:'泰國', FR:'法國', PK:'巴基斯坦',
  KZ:'哈薩克', NA:'納米比亞', NE:'尼日', IL:'以色列', SD:'蘇丹', EG:'埃及',
  SY:'敘利亞', LB:'黎巴嫩', PS:'巴勒斯坦', ML:'馬利', BF:'布吉納法索', PH:'菲律賓',
  CH:'瑞士', HK:'香港', EC:'厄瓜多', IT:'義大利', ES:'西班牙', PA:'巴拿馬',
  /* 帝國模擬器的據點會用到這幾個 —— 它們在真實持倉那邊幾乎不會出現,
     但地圖上要有名字,不然標題會直接印出 ISO 代碼。 */
  IE:'愛爾蘭', LU:'盧森堡', MC:'摩納哥', KE:'肯亞',
  KY:'開曼群島', VG:'英屬維京群島', BM:'百慕達',
};

/* ========================= 衍生計算 =========================
   這幾個是從 ORBIT 帶過來的共用小工具(數字格式、金額單位、escape)。
   遊戲裡的金額一律走 tyM(),不走 fmtM() —— 理由寫在下面帝國那一段的鐵律 2。
   ============================================================ */
const fmt  = n => nf(0,0).format(n);
const pct  = n => (n>=0?'+':'')+n.toFixed(2)+'%';

/* ---------- 金額顯示:幣別(台幣 / 美元)× 量級(元 / 萬 / 億) ----------
   內部一律存台幣,只有「顯示」這一層才換算,所以切幣別不會動到任何計算。 */
const MONEY_UNITS = {
  TWD:[ {k:'',div:1,dec:0}, {k:'萬',div:1e4,dec:2}, {k:'億',div:1e8,dec:4} ],
  USD:[ {k:'',div:1,dec:0}, {k:'K',div:1e3,dec:2}, {k:'M',div:1e6,dec:4} ],
};
const CUR_SIGN = { TWD:'', USD:'$' };
let DISP = 'TWD';                             // 顯示幣別
let MU   = 0;                                 // 量級 index

/* ---------- 隱私模式:要給別人看畫面時用 ----------
   real = 真實金額(只有你自己看)
   pct  = 絕對金額全部遮掉,只留百分比與比例 → 畫面完全可用,但看不出你有多少錢
   demo = 所有金額乘上一個固定倍率 → 比例、圖形、動畫一模一樣,數字不是你的
   注意:這只擋「看畫面的人」。要擋「拿到檔案的人」得靠部署方式,見下方說明。 */
let PRIV='real';
const DEMO_K=0.372;
function privVal(twd){ return PRIV==='demo' ? twd*DEMO_K : twd; }

function toDisp(twd){ return DISP==='USD' ? twd/FX.USD : twd; }

/* Intl 的格式器**很貴**,但只要建一次就能重複用。
   原本每個數字都寫 v.toLocaleString('zh-TW',{...}) —— 那等於每次呼叫都要
   重新解析語系與選項。實測(4 倍節流的手機、載入那 2.6 秒)fmtM 自己就佔了
   160ms,是整份程式碼裡最貴的單一函式,因為畫面上每一個金額都會經過它。
   改成用 key 快取 Intl.NumberFormat 之後,輸出字串完全一樣。 */
const NF_CACHE=new Map();
function nf(min,max){
  const k=min+'|'+max;
  let f=NF_CACHE.get(k);
  if(!f){ f=new Intl.NumberFormat('zh-TW',{minimumFractionDigits:min,maximumFractionDigits:max});
          NF_CACHE.set(k,f); }
  return f;
}

function fmtM(twdVal){
  if(PRIV==='pct') return '••••••';
  const set=MONEY_UNITS[DISP], u=set[MU]||set[0];
  const v=toDisp(privVal(twdVal))/u.div;
  return CUR_SIGN[DISP] + nf(u.dec,u.dec).format(v) + (u.k?' '+u.k:'');
}
/* 「-0」是格式化的瑕疵,不是一個金額。小到會被四捨五入成 0 的損益一律當 0 看,
   正負號跟著寫成 +,免得畫面上出現「-0」或紅色的「-0 元」。 */
const sgnM = n => {
  if(PRIV==='pct') return '••••••';
  const body=fmtM(Math.abs(n));
  const isZero=/^[^\d]*0(\.0+)?(\s|$)/.test(body);
  return (n>=0||isZero?'+':'-')+body;
};

/* ---------- 部位:以「股數 / 顆數」為準,價格與匯率再換算成台幣 ---------- */
/* 內建清單的原始樣子。loadPF() 要能「取代」而不是「疊加」,就得有東西可以還原。
   踩過的坑:原本 loadPF() 只覆寫存檔裡有的代號,存檔裡沒提到的內建標的會保留
   預設持股量 —— 從雲端下載別人(或舊版)的組合時,畫面上會多出台積電 1000 股
   這種你根本沒有的部位,而且下次上傳還會把它一起寫進雲端,越污染越嚴重。 */

/* ═══ 從 ORBIT 帶過來:escH(原檔 5708–5709 行) ═══ */

const escH = t => String(t ?? '').replace(/[<>&"]/g,
  c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

/* ═══ 從 ORBIT 帶過來:seeded 亂數(原檔 5734–5735 行) ═══ */

function seeded(s){ return ()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; }; }


/* ═══ 從 ORBIT 帶過來:countries / flowTimer 宣告(原檔 6023–6024 行) ═══ */

let countries=[];
let flowTimer=null;

/* ═══ 從 ORBIT 帶過來:地球載不載得到 globeStub / GLOBE_OK / GEO_OK(原檔 6121–6141 行) ═══ */

/* ========================= 地球 ========================= */
/* ⚠ globe.gl 是從 CDN 載的,而這一行在頂層執行 —— 抓不到的時候
   `Globe is not defined` 會在這裡丟出來,**後面所有程式碼都不會執行**:
   載入動畫永遠轉不完、七個分頁一頁都畫不出來,使用者連自己的持倉都打不開。

   實測過:把 unpkg 擋掉之後 #page 的內容長度是 0、#load 永遠停在 flex。
   手機訊號差、公司或學校網路擋 CDN、unpkg 自己掛掉,都會踩到。

   一個看板網站不該因為「裝飾用的 3D 地球載不到」就整個不能用。
   所以載不到時換成一個「任何方法都回傳自己」的替身:53 個 globe.xxx()
   呼叫點照常跑,只有地球本身不會出現,其餘功能完全不受影響。 */
function globeStub(){
  const mk = () => new Proxy(function(){}, {
    get: (t,p) => p==='then' ? undefined : (t[p]!==undefined ? t[p] : mk()),
    set: () => true,
    apply: () => mk(),
  });
  return mk();
}
const GLOBE_OK = typeof Globe === 'function';
let GEO_OK = true;                    // 國界資料抓到了沒(抓不到只影響地球那一頁)

/* ═══ 從 ORBIT 帶過來:iso() 與 ISO_FALLBACK(原檔 6354–6363 行) ═══ */

function iso(f){
  if(!f) return null;
  const p=f.properties||{};
  const a=p.ISO_A2 && p.ISO_A2!=='-99' ? p.ISO_A2 : null;
  return a || ISO_FALLBACK[p.ADMIN] || null;
}
const ISO_FALLBACK={ 'France':'FR','Norway':'NO','Netherlands':'NL','Taiwan':'TW',
                     'South Korea':'KR','Republic of Korea':'KR','Yemen':'YE' };



/* ═══ 從 ORBIT 帶過來:getRes / getJSON(帶逾時的 fetch)(原檔 7015–7024 行) ═══ */

async function getRes(url, ms=13000){
  const c=new AbortController(), t=setTimeout(()=>c.abort(), ms);
  try{
    const r=await fetch(url,{signal:c.signal, cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r;
  } finally{ clearTimeout(t); }
}
const getJSON = async u => (await getRes(u)).json();
const getText = async u => (await getRes(u)).text();

/* ═══ 從 ORBIT 帶過來:後端代打 probeProxy / apiPath(原檔 7035–7059 行) ═══ */

const PROXY_KEY='orbit.proxy';
let PROXY='';
try{ PROXY=localStorage.getItem(PROXY_KEY)||''; }catch(e){}

// 兩個平台的預設路徑都試,哪個通就記住哪個
const PROXY_CANDIDATES=['/api/quotes','/.netlify/functions/tw-quotes'];
let PROXY_OK=null;
async function probeProxy(){
  if(PROXY){ PROXY_OK=PROXY.replace(/\/$/,''); return PROXY_OK; }
  if(location.protocol==='file:') return null;
  if(PROXY_OK) return PROXY_OK;
  for(const c of PROXY_CANDIDATES){
    try{
      const r=await fetch(c+'?src=__ping',{cache:'no-store'});
      if(r.ok||r.status===400){ PROXY_OK=c; return c; }   // 400 = 函式在,只是參數不對
    }catch(e){}
  }

        同一顆種子 + 同一串操作 = 同一個結果,測試才驗得動,重開瀏覽器
        也不會因為「換了一組亂數」讓上一季的結果對不起來。

   模型有多真?

     方向是對的,幅度是為了十年之內看得出差別而調過的。
     千萬不要拿它算真實報酬。
   ========================================================================= */
const TY_KEY='orbit.tycoon.v1';
const TY_QN=40;                       // 一局 40 季 = 10 年
const TY_Y0=2026;                     // 開局年份

/* ---------- 亂數:mulberry32。狀態存在 TY.rng 裡,所以重新整理接得回去 ---------- */
function tyRnd(){
  TY.rng = (TY.rng + 0x6D2B79F5) | 0;
  let t = TY.rng;
  t = Math.imul(t ^ t>>>15, 1|t);
  t ^= t + Math.imul(t ^ t>>>7, 61|t);
  return ((t ^ t>>>14) >>> 0) / 4294967296;
}
/* 近似常態分佈。三個均勻亂數相加的變異數是 1/4,乘 2 之後標準差剛好是 1。
   用它而不是單一均勻亂數的理由:市場大部分時候小漲小跌,偶爾才有大的 ——
   均勻分佈會讓「每一季都是極端行情」。 */
const tyG = () => (tyRnd()+tyRnd()+tyRnd()-1.5)*2;

const tyClamp = (v,a,b) => Math.max(a,Math.min(b,v));

/* ---------- 金額:遊戲裡的錢單位是台幣,但量級跨到「兆」 ---------- */
function tyM(v){
  const s = v<0 ? '-' : '', a=Math.abs(v);
  if(a>=1e12) return s+(a/1e12).toFixed(2)+' 兆';
  if(a>=1e8)  return s+(a/1e8).toFixed(a>=100e8?0:1)+' 億';
  if(a>=1e4)  return s+(a/1e4).toFixed(0)+' 萬';
  return s+Math.round(a);
}
/* ⚠ 負號一定要印出來。原本是 (v>=0?'+':'') 再取絕對值 —— 於是 −1,326 萬
   會印成「1326 萬」,只剩顏色在講它是負的。一家還在燒錢的公司在畫面上
   看起來就跟賺錢的一模一樣,那是這個模擬器最不能弄錯的一個數字。 */
const tySgn = v => (v>=0?'+':'-')+tyM(Math.abs(v)).replace(/^-/,'');
const tyPct1 = n => (n>=0?'+':'')+n.toFixed(1)+'%';

/* 數字要看得懂:6.0 棟 → 6 棟;0.4 棟 → 0.4 棟;1359 張 → 1,359 張 */

        搶他的標的、敵意收購他,關係會壞;做過幾筆生意、政治聯手,關係會好。
        關係壞到一定程度、而且他比你大,他會主動對你出手。
     ⑤ 你可以**談條件**(見 TY_DEALS)。互不侵犯、合資、買他的事業、
        賣事業給他、請他當 IPO 基石、政治聯手、敵意收購 —— 七種。
        每一種都有價碼、有條件、有他接不接受的機率,而那個機率**寫在畫面上**,
        不是藏起來的骰子。

   ⚠ 對手的行為一律走同一支 tyRivalTurn(),而且只讀 TY 的公開狀態 ——
     沒有任何一行是「因為玩家做了 X 所以我偷偷懲罰他」。他們的動機只有
     三個:擴張、吃掉比自己小的、對敵意最高的人出手。
   ========================================================================= */

/* 流派決定他吃哪一種景氣、擴張得多快、槓桿多高。

const tyRival   = id => TY.rivals.find(r=>r.id===id && r.alive!==false);
const tyRivalsA = () => TY.rivals.filter(r=>r.alive!==false);
/* 他在這個地區有多少勢力(0~100)。你自己的勢力算法一樣,拿資產比重換算。 */
const tyTurf = (r, reg) => (r.turf && r.turf[reg]) || 0;
/* 你在一個地區的勢力:那裡的資產佔你淨值的比重,拉到 0~100 的尺度上。
   ⚠ 用**絕對金額**跟對手比才公平 —— 一個只有十億的人把全部押在非洲,
     不該顯示成「非洲最大的勢力」。所以還要乘上你跟他們的相對規模。 */
function tyMyTurf(reg){
  let v=0;
  for(const p of TY.pos) if(p.q>0 && tySite(p.site).reg===reg) v+=tyPosVal(p);
  for(const b of TY.biz) if(tySite(b.site||TY.home).reg===reg) v+=tyBizVal(b)*b.own;
  if(tySite(TY.cashSite).reg===reg) v+=Math.max(0,TY.cash);
  const scale=Math.max(1, tyNW());
  return tyClamp(v/scale*100 * tyClamp(tyNW()/Math.max(1e8, tyTopNW()), .25, 1.6), 0, 100);
}
const tyTopNW = () => Math.max(1e8, ...tyRivalsA().map(r=>r.nw));
/* 一個地區現在是誰的天下 —— 地圖「勢力範圍」那一層就是畫這個。 */
function tyRegOwner(reg){
  let best=null, bv=tyMyTurf(reg), me=bv;
  for(const r of tyRivalsA()){ const v=tyTurf(r,reg); if(v>bv){ bv=v; best=r; } }
  return { r:best, v:bv, me };
}

/* ---- 每一季對手自己走一步 ---- */
function tyRivalTurn(){
  const M=TY.macro;
  for(const r of tyRivalsA()){
    const A=TY_ARCH[r.arch]||TY_ARCH.estate;
    /* 成長:基礎 + 流派對景氣的敏感度 + 他勢力所在地區的指數 + 槓桿放大的雜訊。
       槓桿是雙面的:漲的時候多漲,雜訊也跟著放大。 */
    const regs=Object.keys(r.turf||{});
    const ri = regs.length
      ? regs.reduce((s,k)=>s+TY.reg[k].idx*tyTurf(r,k),0)/Math.max(1,regs.reduce((s,k)=>s+tyTurf(r,k),0))
      : 1;
    const macro = A.senti*M.senti*.045 + A.rate*(M.rate-2.5)*.004
                + A.oil*((TY.px.oil/100)-1)*.03;
    r.nw *= 1 + r.b + macro + (ri-1)*.06 + tyG()*.05*(1+r.lev);
    r.nw = Math.max(5e7, r.nw);
    r.rel = tyClamp((r.rel||0)*.94, -100, 100);     // 恩怨會淡,但不會歸零
    r.heat = tyClamp((r.heat||0)*.95, 0, 100);
    (r.hist=r.hist||[]).push(r.nw);

    /* 危機 + 高槓桿 = 斷掉。這是名次真正會翻的時候。 */
    if((M.reg==='crisis'||M.reg==='recess') && tyRnd() < r.lev*.16){
      r.nw *= .5 + tyRnd()*.2;
      tyLog('rival', `${r.nm}的槓桿在這一季斷了,身家腰斬。`);
      continue;
    }
    if(TY.t<3) continue;                 // 開局三季讓玩家先站穩

    /* 一季一個動作。權重來自「他是誰」:aggressive 的人比較常出手。 */
    const roll=tyRnd();
    if(roll < .34){
      /* ① 擴張:優先去自己已經有勢力、或指數最好的地區。
         如果那裡也是你的地盤,競爭度上升、關係變差 —— 那就是「被搶生意」。 */
      if(r.pact && r.pact>TY.t) { /* 互不侵犯期間不進你的地盤 */ }
      const mine=new Set(tyMyRegions());
      const cand=Object.keys(TY_REGIONS).filter(k=>k!=='off')
        .sort((a,b)=>(TY.reg[b].idx+tyTurf(r,b)/200)-(TY.reg[a].idx+tyTurf(r,a)/200));
      let pick=cand[Math.floor(tyRnd()*3)%3];
      if(r.pact && r.pact>TY.t && mine.has(pick))
        pick=cand.find(k=>!mine.has(k))||pick;      // 有約就繞開你的地盤
      r.turf=r.turf||{};
      r.turf[pick]=tyClamp(tyTurf(r,pick)+6+tyRnd()*8, 0, 100);
      /* ⚠ 擴張與上市**幾乎不能**直接加淨值。第一版擴張 +2%、上市 +10~22%,
         期望值等於每季多 2.3% —— 對手的成長率整整多一倍,四十季之後
         量測跑出來「首富」這個結局在九種策略裡一次都沒發生過。
         他們的行動要改變的是**地盤與名次**,不是憑空長錢。 */
      r.nw*=1.006;
      if(mine.has(pick) && !(r.pact&&r.pact>TY.t)){
        TY.reg[pick].comp += 1.2;
        r.rel = tyClamp((r.rel||0)-7, -100, 100);
        tyLog('rival', `${r.nm}打進${TY_REGIONS[pick].nm} —— 你在那裡的現金流會被壓一段時間。`);
      }
    }else if(roll < .46){
      /* ② 大吃小:併掉一個比自己小很多的對手。勢力相加。 */
      const prey=tyRivalsA().filter(x=>x.id!==r.id && x.nw < r.nw*.45)
        .sort((a,b)=>b.nw-a.nw)[0];
      if(prey){
        r.nw += prey.nw*.85;
        for(const k in (prey.turf||{}))
          r.turf[k]=tyClamp(tyTurf(r,k)+tyTurf(prey,k)*.7, 0, 100);
        prey.alive=false;
        tyLog('rival', `${r.nm}把${prey.nm}整個買下來了。榜上少一個人,而他多了一塊地盤。`);
      }
    }else if(roll < .56){
      /* ③ 上市 / 大額募資:身家跳一段,但關注度也上去 */
      r.nw*=1.03+tyRnd()*.04; r.heat=tyClamp((r.heat||0)+8,0,100);
      tyLog('rival', `${r.nm}把旗下事業送上市,身家跳了一段。`);
    }else if(roll < .66 + r.agg*.12){
      /* ④ 對你出手 —— 只在關係壞、而且他比你大的時候。
         三種手段,對應現實裡真的會發生的三件事。 */
      const me=tyShownNW();
      if((r.rel||0) < -25 && r.nw > me*.8){
        const mine=tyMyRegions();
        const how=Math.floor(tyRnd()*3)%3;
        if(how===0 && mine.length){
          const g=mine[Math.floor(tyRnd()*mine.length)%mine.length];
          /* 以前這一下是當場生效(競爭 +2.2)。現在他派的是一支會走路的併購小組:
             你看得到它出發、看得到幾季後到,有時間把律師團調過去(見 tyUnitsTurn)。
             ⚠ 同一個人同時只派一支 —— 不然關係爛掉的對手會每季疊一支上來。 */
          if(!tyThreats().some(x=>x.rid===r.id)) tyRivalMarch(r, g);
          else TY.reg[g].comp += 1;
        }else if(how===1){
          TY.heat=tyClamp(TY.heat+7,0,120);
          tyLog('rival', `${r.nm}把你的架構整理成一份簡報,送到了不該送的地方。關注度 +7。`);
        }else{
          TY.fame=tyClamp(TY.fame-5,0,100);
          tyLog('rival', `${r.nm}在媒體上點名你。名氣 −5 —— 他要的就是你解釋。`);
        }
        r.rel=tyClamp((r.rel||0)-4,-100,100);
      }
    }
  }
  /* 全部死光不可能,但保險:至少留一個對手,不然排名沒有意義 */
  if(!tyRivalsA().length && TY.rivals.length) TY.rivals[0].alive=true;
}

/* =========================================================================
   資本部隊 —— 地圖上真的會走路的人
   -------------------------------------------------------------------------
   使用者要的是參考的那款遊戲(Conflict of Nations)的手感:單位在地圖上移動、
   要花時間走過去、對手也看得到你在調兵。這個遊戲的「兵」是錢養的專業團隊:

     ⚔ 併購小組  駐在一個地區 → 每季削掉那裡最強對手的勢力;
                 駐在對手大本營的地區 → 對他敵意收購的成功率變高
     ⚖ 律師團    駐在哪裡都壓關注度;駐在被攻擊的地區 → 防守主力
     🏛 遊說團    駐在一個地區 → 每季漲人脈(也會被多看一眼)
     👔 經理人    駐在一個城市 → 那裡的事業現金流 +15%

   三條規矩:
     ① **最多六支**(TY_UNIT_MAX)。沒有上限的話最佳解就是每種都買滿,
        選擇就消失了。上限逼你決定「這一季重點在哪」。
     ② **要養**。招募付一次,之後每季付維持費(招募價的 8%)。養不起就得解散。
     ③ **要走路**。同一個地區 1 季、四千公里內 1 季、再遠 2 季。
        路上的部隊沒有任何效果 —— 那段空窗就是調兵的代價。

   對手也有兵:關係壞到一定程度、而且比你大的對手,會派併購小組打你有東西的
   城市(tyRivalTurn 的「對你出手」那一支)。部隊出發的那一刻你就看得到
   ——「⚠ 2 季後抵達台北」—— 你有時間把律師團調過去。到的那一季擲一次防守。

   ⚠ 所有隨機都走 tyRnd(),而且只有在「真的有攻擊要判定」的時候才擲 ——
     沒有部隊、沒有人打你的一局,亂數序列跟以前完全一樣。
   ========================================================================= */
const TY_UNIT_MAX = 6;
const TY_UNITS = {
  raid:  { nm:'併購小組', ic:'⚔', pct:.030, min:.5e8, def:.7,
           dsc:'駐在一個地區:每季削掉那裡最強對手 3 點勢力、壓低當地競爭。駐在對手大本營的地區:對他敵意收購 +10%(最多 +30%)。' },
  law:   { nm:'律師團',   ic:'⚖', pct:.020, min:.3e8, def:1.0,
           dsc:'不管駐在哪裡,每季關注度 −1.5。被攻擊的時候是防守主力(防守力 1.0,其他部隊只有它的一半左右)。' },
  lobby: { nm:'遊說團',   ic:'🏛', pct:.025, min:.4e8, def:.4,
           dsc:'駐在一個地區:每季人脈 +1.2、關注 +0.3。遊說是看得見的 —— 走得越勤,被記下來的也越多。' },
  mgr:   { nm:'經理人',   ic:'👔', pct:.015, min:.25e8, def:.2,
           dsc:'駐在一個城市:你在那裡的事業現金流 +15%(同一城最多算兩位)。他不打仗,但他讓錢變多。' },
};
const TY_UNIT_UP = .08;
let TY_LAST_MOVE=null;                        // 最近一次派遣(畫面層用來播飛機 / 船的動畫)                       // 每季維持費 = 招募價的 8%
const tyUnits   = () => (TY.units   = TY.units   || []);
const tyThreats = () => (TY.threats = TY.threats || []);
const tyUnitCost = k => Math.max(TY_UNITS[k].min, tyNW()*TY_UNITS[k].pct);
const tyUnitUpkeep = () => tyUnits().reduce((s,u)=>s+(u.up||0),0);
/* 駐在某處(不在路上)的部隊 */
const tyUnitsAt  = site => tyUnits().filter(u=>!u.to && u.site===site);
const tyUnitsIn  = reg  => tyUnits().filter(u=>!u.to && tySite(u.site).reg===reg);
const tyUnitN    = (list, k) => list.filter(u=>u.k===k).length;

/* 兩個城市之間要走幾季。大圓距離,不是經緯度差 —— 經緯度差在高緯度會把
   倫敦到莫斯科算成跟赤道上一樣遠。 */
function tyKm(a, b){
  const R=6371, t=Math.PI/180;
  const dLat=(b.lat-a.lat)*t, dLng=(b.lng-a.lng)*t;
  const h=Math.sin(dLat/2)**2 + Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
}
function tyTravel(from, to){
  if(from===to) return 0;
  const a=tySite(from), b=tySite(to);
  if(a.reg===b.reg) return 1;
  return tyKm(a,b) <= 4000 ? 1 : 2;
}
/* 路上的東西在畫面上該站在哪裡(0 = 剛出發,1 = 到了)。純顯示用。 */
function tyUnitProg(u){
  if(!u.to) return 1;
  const tot=Math.max(1,(u.eta||0)-(u.dep||0));
  return tyClamp((TY.t-(u.dep||0))/tot, 0, 1);
}

/* ---- 動作 ---- */
function tyRecruit(k){
  const d=TY_UNITS[k]; if(!d) return '';
  const blocked=tyBlock('recruit', k); if(blocked) return blocked;
  const cost=tyUnitCost(k);
  TY.cash-=cost;
  TY.unitId=(TY.unitId||1);
  tyUnits().push({ id:TY.unitId++, k, site:TY.home, to:null, dep:TY.t, eta:TY.t, up:cost*TY_UNIT_UP });
  tyLog('unit', `招募${d.nm}(${tyM(cost)}),在${tySite(TY.home).nm}待命。`);
  tySave();
  return `<b>${d.ic} ${d.nm}成軍。</b>付出 ${tyM(cost)},之後每季維持費 ${tyM(cost*TY_UNIT_UP)}。`
       + `他們在${tySite(TY.home).nm}待命 —— 到「部隊」或任何一個城市的面板把他們派出去。`;
}
function tyDeploy(id, site){
  const u=tyUnits().find(x=>x.id===id);
  const blocked=tyBlock('deploy', {u, site}); if(blocked) return blocked;
  const from=u.site;                            // 走到一半改道 = 從出發地重新算(不會半路瞬移)
  /* 使用者:「部隊可以直接變成下一季就有效,除非是攻擊手段才需要冷卻時間,比較公平」。
     所以自己的部隊一律**下一季到位**(不管多遠);對手打過來的部隊維持原本的行軍時間 ——
     那是給你反應的時間。距離還是有意義:它決定出發動畫是搭飛機還是走海運。 */
  const n=1;
  u.to=site; u.dep=TY.t; u.eta=TY.t+n;
  TY_LAST_MOVE={ id:u.id, k:u.k, from, to:site };   // 給畫面層播出發動畫(不進存檔)
  tyLog('unit', `${TY_UNITS[u.k].nm}從${tySite(from).nm}出發前往${tySite(site).nm},下一季到位。`);
  tySave();
  return `<b>${TY_UNITS[u.k].ic} ${TY_UNITS[u.k].nm}出發了。</b>${tySite(from).nm} → ${tySite(site).nm},`
       + `下一季到位並開始生效。`;
}
function tyDisband(id){
  const u=tyUnits().find(x=>x.id===id);
  if(!u) return '';
  TY.units=tyUnits().filter(x=>x.id!==id);
  tyLog('unit', `解散${TY_UNITS[u.k].nm}。`);
  tySave();
  return `${TY_UNITS[u.k].nm}解散了。招募費不會退,但維持費從下一季起就不用再付。`;
}

/* =========================================================================
   打擊 —— 經濟版的飛彈與空襲
   -------------------------------------------------------------------------
   使用者:「可以多加一些武器對應完經濟的攻擊,像是飛彈、空襲」。
   這個遊戲裡的「武器」是錢打出去的:
     🚀 做空飛彈  對一個對手的控股公司放空狙擊 —— 他的身家掉一截,你賺回其中一小部分
     ✈ 輿論空襲  在一個地區對一個對手媒體轟炸 —— 他在那裡的勢力大跌、關係惡化
   兩個都有**冷卻時間**(使用者說的「攻擊手段需要冷卻時間比較公平」),
   也都會讓你被盯、讓對手記恨 —— 打出去的每一發都會讓他更想派兵回來打你。
   ⚠ 賺回的那一部分有上限(花費的 1.5 倍),不然打大對手變成穩賺的印鈔機。
   ========================================================================= */
const TY_STRIKES = {
  missile: { nm:'做空飛彈', ic:'🚀', cd:4, pct:.02, min:2e8,
    dsc:'對一個對手的控股公司放空狙擊:他的身家 −4~8%,你賺回其中兩成(最多花費的 1.5 倍)。關注 +8、他對你 −30。冷卻 4 季。' },
  air:     { nm:'輿論空襲', ic:'✈', cd:3, pct:.015, min:1.5e8,
    dsc:'在一個城市所在的地區對一個對手發動媒體轟炸:他在那個地區的勢力 −12、對你 −15。名氣 −2、關注 +4。冷卻 3 季。' },
};
const tyStrikeCost = k => Math.max(TY_STRIKES[k].min, tyNW()*TY_STRIKES[k].pct);
const tyStrikeReady = k => ((TY.cd||{})[k]||0) <= TY.t;
/* 打哪一個對手:飛彈打他本人(目標城市 = 他的大本營);空襲打那個地區勢力最大的對手 */
function tyStrikeTarget(k, site){
  const S=TY_SITE[site]; if(!S) return null;
  if(k==='missile') return tyRivalsA().find(r=>r.home===site) || null;
  return tyRivalsA().filter(r=>tyTurf(r,S.reg)>0).sort((a,b)=>tyTurf(b,S.reg)-tyTurf(a,S.reg))[0] || null;
}
let TY_LAST_STRIKE=null;                      // 給畫面層播飛彈 / 空襲動畫(不進存檔)
function tyStrike(k, site){
  const d=TY_STRIKES[k]; if(!d) return '';
  const blocked=tyBlock('strike', { k, site }); if(blocked) return blocked;
  const r=tyStrikeTarget(k, site), cost=tyStrikeCost(k), S=tySite(site);
  TY.cash-=cost;
  TY.cd=TY.cd||{}; TY.cd[k]=TY.t+d.cd;
  let txt='';
  if(k==='missile'){
    const hit=r.nw*(.04+tyRnd()*.04);
    const gain=Math.min(hit*.2, cost*1.5);
    r.nw-=hit; TY.cash+=gain;
    r.rel=tyClamp((r.rel||0)-30,-100,100);
    TY.heat=tyClamp(TY.heat+8,0,120);
    txt=`${r.nm}的身家被打掉 <b>${tyM(hit)}</b>,你的空單賺回 ${tyM(gain)}(花費 ${tyM(cost)})。`
       +`他現在很想報復(關係 ${r.rel.toFixed(0)}),關注 +8。`;
    tyLog('strike', `🚀 做空飛彈命中${r.nm}(${S.nm}):他的身家 −${tyM(hit)},你賺回 ${tyM(gain)}。`);
  }else{
    const before=tyTurf(r,S.reg);
    r.turf[S.reg]=tyClamp(before-12,0,100);
    r.rel=tyClamp((r.rel||0)-15,-100,100);
    TY.fame=tyClamp(TY.fame-2,0,100); TY.heat=tyClamp(TY.heat+4,0,120);
    txt=`${r.nm}在${TY_REGIONS[S.reg].nm}的勢力 ${before.toFixed(0)} → <b>${tyTurf(r,S.reg).toFixed(0)}</b>(花費 ${tyM(cost)})。`
       +`名氣 −2、關注 +4,他對你 −15。`;
    tyLog('strike', `✈ 輿論空襲${TY_REGIONS[S.reg].nm}:${r.nm}的勢力 −12。`);
  }
  TY_LAST_STRIKE={ k, from:TY.home, to:site, rid:r.id };
  tySave();
  return `<b>${d.ic} ${d.nm}發射。</b>${txt}下一次可以用是 ${tyWhen(TY.cd[k])}。`;
}

/* ---- 每一季:到達、維持費、駐紮效果、攻防判定 ----
   順序寫在 tyNext 裡:對手先走(可能派兵),這裡後走。 */
function tyUnitsTurn(){
  const U=tyUnits();
  // ① 到達
  for(const u of U){
    if(u.to && TY.t>=u.eta){
      u.site=u.to; u.to=null;
      tyLog('unit', `${TY_UNITS[u.k].nm}抵達${tySite(u.site).nm}。`);
    }
  }
  // ② 維持費
  const up=tyUnitUpkeep();
  if(up>0){ TY.cash-=up; TY.unitPaid=(TY.unitPaid||0)+up; }

  // ③ 駐紮效果
  const law=U.filter(u=>!u.to && u.k==='law').length;
  if(law) TY.heat=tyClamp(TY.heat-1.5*law, 0, 120);
  const regs=new Set(U.filter(u=>!u.to).map(u=>tySite(u.site).reg));
  for(const reg of regs){
    const here=tyUnitsIn(reg);
    const lob=tyUnitN(here,'lobby');
    if(lob){ TY.infl=tyClamp(TY.infl+1.2*lob,0,100); TY.heat=tyClamp(TY.heat+.3*lob,0,120); }
    const raid=tyUnitN(here,'raid');
    if(raid){
      TY.reg[reg].comp=Math.max(0, TY.reg[reg].comp-.5*raid);
      // 削的是那裡勢力最大、而且沒跟你簽約的那一個
      const top=tyRivalsA().filter(r=>!(r.pact>TY.t) && tyTurf(r,reg)>0)
        .sort((a,b)=>tyTurf(b,reg)-tyTurf(a,reg))[0];
      if(top){
        top.turf[reg]=tyClamp(tyTurf(top,reg)-3*raid, 0, 100);
        top.rel=tyClamp((top.rel||0)-2*raid, -100, 100);
      }
    }
  }

  // ④ 對手的部隊到了 → 擲一次防守
  const keep=[];
  for(const th of tyThreats()){
    const r=tyRival(th.rid);
    if(!r || r.pact>TY.t){                       // 他倒了、或你們簽了約:撤兵
      if(r) tyLog('unit', `${r.nm}撤回了往${tySite(th.site).nm}的部隊。`);
      continue;
    }
    if(TY.t < th.eta){ keep.push(th); continue; }
    const p=tyThreatBlock(th);
    const held = tyRnd() < p;
    const S=tySite(th.site);
    if(held){
      TY.fame=tyClamp(TY.fame+2,0,100);
      r.nw*=.99;
      tyNews('good', `擋下${r.nm}`, `他的併購小組在${S.nm}碰壁。名氣 +2(防守率 ${(p*100).toFixed(0)}%)。`);
      tyLog('unit', `在${S.nm}擋下${r.nm}的併購小組(防守率 ${(p*100).toFixed(0)}%)。`);
    }else{
      TY.reg[th.reg].comp += 2.5*th.pow;
      let hit='';
      for(const b of TY.biz) if(b.site===th.site && !TY_BIZ[b.k].shell){ b.cap*=.94; hit='那裡的事業被挖走 6% 的資本,'; }
      tyNews('bad', `${r.nm}攻破${S.nm}`, `${hit}${TY_REGIONS[th.reg].nm}的競爭度 +${(2.5*th.pow).toFixed(1)}。`);
      tyLog('rival', `${r.nm}的併購小組攻進${S.nm}:${hit}當地競爭 +${(2.5*th.pow).toFixed(1)}(防守率只有 ${(p*100).toFixed(0)}%)。`);
    }
  }
  TY.threats=keep;
}

/* 防守率:駐在那個地區的部隊 → 防守力,對手越兇越難擋。
   畫面上看得到這個數字(來襲清單),所以「調律師團過去」是一個算得出來的決定。 */
function tyThreatBlock(th){
  const def=tyUnitsIn(th.reg).reduce((s,u)=>s+TY_UNITS[u.k].def,0);
  return tyClamp(.1 + def*.28 - (th.pow-1)*.1, .05, .92);
}

/* 對手派兵(tyRivalTurn 呼叫)。目標是你在那個地區最值錢的城市。 */
function tyRivalMarch(r, reg){
  const mine=tyMySites().filter(s=>s.reg===reg)
    .sort((a,b)=>tySiteStuff(b.id).val-tySiteStuff(a.id).val);
  const site=(mine[0]||tySite(TY.cashSite)).id;
  const n=Math.max(1, tyTravel(r.home, site));
  const pow=1 + (r.agg||0) + (r.nw>tyShownNW()*1.5 ? .5 : 0);
  TY.unitId=TY.unitId||1;
  tyThreats().push({ id:TY.unitId++, rid:r.id, reg:tySite(site).reg,
                     site, from:r.home, dep:TY.t, eta:TY.t+n, pow });
  tyNews('bad', `⚠ ${r.nm}出兵`, `他的併購小組往${tySite(site).nm}出發,${n} 季後抵達。把律師團調過去。`);
  tyLog('rival', `⚠ ${r.nm}派出併購小組往${tySite(site).nm},${n} 季後抵達。`);
}



/* =========================================================================
   談條件 —— 七種可以跟對手做的事
   -------------------------------------------------------------------------
   使用者:「可以合作、談條件等等。」

   每一筆交易有三個部分:
     · 條件(tyNeeds):你有沒有資格開這個口
     · 價碼(TY_MONEY):你要出多少 —— 而且**出得越多他越可能點頭**
     · 態度(tyDealOdds):他會不會答應,以及為什麼

   ⚠ 成功率**寫在畫面上**。這裡沒有隱藏的骰子:你看得到「他大概不會答應」,
     所以加價是一個真的決策,不是一個賭。
   ⚠ 每一筆談成的交易都會改變關係(rel),而關係會回頭改變下一筆的成功率 ——
     這就是為什麼「先做幾筆小生意再開大口」在這裡是有用的。
   ========================================================================= */
const TY_DEALS = {
  pact: { nm:'互不侵犯', ic:'🤝', money:true, rel:+10,
    dsc:'約定十二季內互不進入對方的地盤。他不再往你的地區擴張,你在那裡的競爭度也會慢慢降下來。',
    base:()=>Math.max(1e8, tyNW()*.02) },
  jv: { nm:'合資開發', ic:'🏗', money:true, rel:+14,
    dsc:'用他的地盤開一家公司:政策風險對你減半、開辦成本打八折,代價是他分走現金流的一成五。',
    base:()=>Math.max(3e8, tyNW()*.06) },
  buy: { nm:'買下他的一塊事業', ic:'📥', money:true, rel:+6,
    dsc:'把他在某個城市的事業整個買過來。價格是他開的,出得比他心裡的數字高才談得成。',
    base:()=>Math.max(8e8, tyNW()*.12) },
  sell: { nm:'把事業賣給他', ic:'📤', money:false, rel:+8,
    dsc:'他想要的城市,他會出溢價。你少一台每季吐錢的機器,換一筆現在就進帳的錢。' },
  anchor: { nm:'請他當 IPO 基石', ic:'🪙', money:true, rel:+12,
    dsc:'下一次上市由他認購一大塊。募資金額多兩成五,名氣也跟著上去 —— 但他從此是你的股東。',
    base:()=>Math.max(2e8, tyNW()*.04) },
  lobby: { nm:'政治聯手', ic:'🏛', money:true, rel:+16,
    dsc:'兩邊的說客走同一條路。人脈一起上去,關注度也是 —— 兩個人一起遊說比一個人顯眼。',
    base:()=>Math.max(1.5e8, tyNW()*.03) },
  hostile: { nm:'敵意收購', ic:'⚔', money:true, rel:-45,
    dsc:'不談了,直接對他的控股公司出價。成功就吃掉他一大塊身家與地盤;失敗會賠掉錢、名氣,'
       +'而且他從此是你的敵人。這是這一頁最貴也最危險的一顆按鈕。',
    base:()=>0 },
};

/* 這一筆要出多少錢。base 是「行情」,出到行情的兩倍差不多就穩了。 */
function tyDealPrice(k, r){
  const d=TY_DEALS[k];
  if(k==='hostile') return Math.max(tyRivalStake(r)*1.15, 5e8);
  if(k==='buy')     return tyRivalBizVal(r)*1.2;
  if(!d.money)      return 0;
  return d.base();
}
/* 他名下「買得到」的那一塊(不是全部身家 —— 沒有人賣掉全部)。 */
const tyRivalStake  = r => r.nw*.35;
const tyRivalBizVal = r => r.nw*.14;

/* 他答應的機率。三件事決定:關係、你出的價相對行情、以及相對實力。
   ⚠ 一定要 clamp 在 5%~95%:沒有必成的交易,也沒有不可能的交易。 */
function tyDealOdds(k, r, amt){
  const d=TY_DEALS[k]; if(!d||!r) return 0;
  const rel=(r.rel||0);
  let p = .38 + rel/300;                              // 關係:−100 → +0.05,+100 → +0.71
  if(d.money){
    const want = tyDealPrice(k, r);
    p += tyClamp((amt/Math.max(1,want) - 1) * .45, -.35, .40);   // 出得越多越好談
  }
  // 他比你大很多的時候,你在他眼裡沒有份量;反過來他會比較願意坐下來
  p += tyClamp(Math.log10(Math.max(1e7,tyShownNW())/Math.max(1e7,r.nw))*.18, -.22, .22);
  p += (TY.fame-30)/400;                              // 名氣讓人願意接電話
  if(k==='hostile'){
    p -= .18;                                          // 敵意收購本來就難
    // 你的併購小組已經駐在他大本營的地區:每一支 +10%,最多 +30%
    p += Math.min(.3, .1*tyUnitN(tyUnitsIn(tySite(r.home).reg),'raid'));
  }
  if(k==='pact' && (r.pact||0)>TY.t) p += .2;          // 已經有過約的比較好續
  return tyClamp(p, .05, .95);
}
const tyOddsTxt = p => p>=.75?'他很有興趣' : p>=.55?'應該談得成' : p>=.35?'看他當天的心情'
                     : p>=.18?'他大概不會答應' : '幾乎不可能 —— 先把關係做好';

/* 交易的對象:面板上目前選的那一個對手 */
let TY_RIVAL=null;                 // 目前展開的對手 id
let TY_DEAL=null;                  // 目前展開的交易 key

/* ---- 真的去談 ---- */
function tyDeal(k, rid){
  const r=tyRival(rid||TY_RIVAL); const d=TY_DEALS[k];
  if(!r || !d) return '';
  const blocked=tyBlock('deal:'+k, r); if(blocked) return blocked;
  const amt = d.money ? tyAmtOf('deal:'+k, r, `deal:${k}:${r.id}`) : 0;
  const p   = tyDealOdds(k, r, amt);
  const ok  = tyRnd() < p;

  /* 談不成:錢只花掉一部分(顧問費、盡職調查),關係小跌。
     ⚠ 完全不花錢的失敗會讓「一直談到成功為止」變成最佳解。 */
  if(!ok){
    const burn = Math.min(TY.cash, amt*.12);
    TY.cash -= burn;
    r.rel = tyClamp((r.rel||0) - (k==='hostile'?22:4), -100, 100);
    if(k==='hostile'){ TY.fame=tyClamp(TY.fame-6,0,100); TY.heat=tyClamp(TY.heat+8,0,120); }
    tyLog('rival', `跟${r.nm}談「${d.nm}」破局。`);
    tySave();
    return `<b>${r.nm}拒絕了。</b>成功率是 ${(p*100).toFixed(0)}%,這一次沒過。`
         + (burn>1e6?`顧問費與盡職調查花掉 ${tyM(burn)}。`:'')
         + (k==='hostile'?'而且他現在把你當敵人 —— 敵意收購失敗的代價從來不只是錢。'
                         :'關係差了一點,下次更難談。加價、或先把關係做起來。');
  }

  /* ⚠ 先把「談成之後還要花的錢」算完再動任何狀態。
     原本是先扣款、關係先加,合資的自有資本不夠才退錢 —— 錢退得回來,
     關係加過的那一下退不回來。 */
  let jv=null;
  if(k==='jv'){
    const reg=Object.keys(r.turf||{}).sort((a,b)=>tyTurf(r,b)-tyTurf(r,a))[0]||tySite(r.home).reg;
    const site=(TY_SITES.filter(x=>x.reg===reg && x.kind.includes('hq'))[0]||tySite(r.home)).id;
    const kind = r.arch==='tech'?'tech' : r.arch==='energy'?'energy'
               : r.arch==='mine'?'energy' : r.arch==='luxury'?'brand'
               : r.arch==='mfg'?'infra' : 'dev';
    jv={ reg, site, kind, cost:tyBizCost(kind, site)*.8 };
    if(TY.cash < amt + jv.cost)
      return `合資談成之後還要拿出 ${tyM(jv.cost)} 的自有資本(${TY_BIZ[jv.kind].nm}·${tySite(jv.site).nm}),`
           + `加上入場費 ${tyM(amt)} 一共要 ${tyM(amt+jv.cost)} —— 你的現金只有 ${tyM(TY.cash)}。`;
  }

  TY.cash -= amt;
  r.rel = tyClamp((r.rel||0) + d.rel, -100, 100);
  let extra='';
  switch(k){
    case 'pact': {
      r.pact = TY.t + 12;
      for(const g of tyMyRegions()) TY.reg[g].comp = Math.max(0, TY.reg[g].comp - 1.5);
      extra = `十二季內他不會再進你的地盤,你現在的競爭度也降了一截。`;
      break;
    }
    case 'jv': {
      /* 合資:在他最強的地區開一家公司,成本打八折、不需要在地夥伴、
         政策風險減半,但他抽走現金流的 15%(jvCut,結算時扣)。 */
      TY.cash -= jv.cost;
      TY.biz.push({ id:TY.bizId++, k:jv.kind, site:jv.site, cap:jv.cost, own:1, pub:false, cf:0,
                    born:TY.t, jv:r.id, jvCut:.15 });
      extra = `${TY_BIZ[jv.kind].nm}在${tySite(jv.site).nm}成立(自有資本 ${tyM(jv.cost)},已打八折)。`
            + `${r.nm}分走它現金流的 15%,但${TY_REGIONS[jv.reg].nm}的政策風險對你減半,`
            + `而且你不需要另外找在地夥伴 —— 他就是。`;
      break;
    }
    case 'buy': {
      const reg=Object.keys(r.turf||{}).sort((a,b)=>tyTurf(r,b)-tyTurf(r,a))[0]||tySite(r.home).reg;
      const site=(TY_SITES.filter(x=>x.reg===reg && x.kind.includes('hq'))[0]||tySite(r.home)).id;
      const kind = r.arch==='tech'?'tech' : r.arch==='energy'?'energy'
                 : r.arch==='mine'?'energy' : r.arch==='luxury'?'brand'
                 : r.arch==='mfg'?'infra' : 'dev';
      /* 買到的規模就是你付出去的錢 —— 溢價的部分是買「已經在跑」這件事。 */
      TY.biz.push({ id:TY.bizId++, k:kind, site, cap:amt*.85, own:1, pub:false, cf:0, born:TY.t });
      r.nw -= amt*.5; r.turf[reg]=tyClamp(tyTurf(r,reg)-12,0,100);
      extra = `${TY_BIZ[kind].nm}(${tySite(site).nm})從今天起是你的,投入資本記 ${tyM(amt*.85)}。`
            + `他在${TY_REGIONS[reg].nm}的勢力少了一塊。`;
      break;
    }
    case 'sell': {
      const b=TY.biz.filter(x=>!TY_BIZ[x.k].shell)
        .sort((x,y)=>tyBizVal(y)*y.own-tyBizVal(x)*x.own)[0];
      if(!b) return '你沒有可以賣的事業。';
      const reg=tySite(b.site||TY.home).reg;
      const prem = 1.12 + tyTurf(r,reg)/400;      // 他想要那個城市,就出得起溢價
      const got = tyBizVal(b)*b.own*prem;
      TY.cash += got;
      r.turf[reg]=tyClamp(tyTurf(r,reg)+8,0,100);
      TY.biz=TY.biz.filter(x=>x.id!==b.id);
      extra = `${TY_BIZ[b.k].nm}(${tySite(b.site||TY.home).nm})賣給他,入帳 <b>${tyM(got)}</b>`
            + `(溢價 ${((prem-1)*100).toFixed(0)}% —— 他在那個地區的勢力越大,出得越多)。`;
      break;
    }
    case 'anchor': {
      TY.anchor = { by:r.id, until:TY.t+8 };
      extra = `未來八季內第一次上市,他會認購一大塊:募資金額 +25%、名氣多加 5。`;
      break;
    }
    case 'lobby': {
      const up=tyBuyPts(amt, TY_DEALS.lobby.base(), 10, 22);
      TY.infl=tyClamp(TY.infl+up,0,100);
      TY.heat=tyClamp(TY.heat+5,0,120);
      r.rel=tyClamp(r.rel+6,-100,100);
      extra = `人脈 +${up.toFixed(0)}、關注 +5。兩個人一起遊說比一個人有效,也比一個人顯眼。`;
      break;
    }
    case 'hostile': {
      const take=r.nw*.45;
      TY.nwGrab=(TY.nwGrab||0)+take;
      /* 吃下來的東西變成一家在他大本營的公司 —— 那才是「勢力」真正易主。 */
      const site=r.home;
      TY.biz.push({ id:TY.bizId++, k: r.arch==='tech'?'tech':r.arch==='energy'?'energy':'dev',
                    site, cap:take, own:1, pub:false, cf:0, born:TY.t });
      r.nw -= take;
      for(const g in (r.turf||{})) r.turf[g]=tyClamp(tyTurf(r,g)*.55,0,100);
      TY.heat=tyClamp(TY.heat+14,0,120); TY.fame=tyClamp(TY.fame+8,0,100);
      if(r.nw < 2e8) r.alive=false;
      extra = `你吃下他 ${tyM(take)} 的資產,他在每一個地區的勢力都縮水了一半。`
            + `名氣 +8、關注 +14 —— 這種事沒有人會沒看見。`;
      break;
    }
  }
  tyLog('rival', `跟${r.nm}談成「${d.nm}」${amt>0?`(${tyM(amt)})`:''}`);
  tySave();
  return `<b>${r.nm}答應了。</b>${amt>0?`付出 ${tyM(amt)}。`:''}${extra}`
       + `(成功率 ${(p*100).toFixed(0)}%,關係 ${r.rel>=0?'+':''}${r.rel.toFixed(0)})`;
}

/* =========================================================================
   地理 —— 讓「錢在哪裡」變成一個真的問題
   -------------------------------------------------------------------------
   第一版的模擬器是**沒有地方**的:你買房地產,就只是「房地產」這個數字變大。
   但現實裡富豪的每一個決定都有座標 —— 公司登記在德拉瓦、控股放開曼、
   錢存蘇黎世、房子買曼哈頓、工廠設在越南、礦在剛果。那不是風味設定,
   那是決定他繳多少稅、被誰管、什麼事情會打到他的東西。

   所以現在每一筆部位、每一家公司、每一塊錢都掛在一個**地點**上:

     地點(TY_SITES)  = 一座真實的城市或司法管轄區,有真實的經緯度、
                        真實的國家與州/省、以及**真實的法定公司稅率**
     地區(TY_REGIONS)= 地點所屬的大區,有自己的景氣指數與政策風險

   一筆資產現在值多少 = 數量 × 該類資產的全球價格 × **它所在地區的指數**。
   所以「同樣是房地產,買杜拜和買東京是兩件事」——
   而這就是那顆地球上要讓你一眼看懂的東西。

   ⚠ 稅率是真的(法定公司所得稅率,2024/2025 前後,見 README 的來源說明),

   ========================================================================= */

/* =========================================================================
   城市特色 —— 為什麼在新竹開科技公司跟在拉哥斯開不一樣
   -------------------------------------------------------------------------
   使用者:「地圖上可以顯示原本這個城市有的東西,根據他們真實的特色,
            然後那些資產、事業在每個城市都不一樣,都各有優缺點。」

   原本每個地點只有三個數字(稅率、地區指數、政策風險),所以 44 個城市
   實際上只是「稅率不同的同一個城市」。現在每個城市帶 2–4 個**特色標籤**,
   標籤決定:
     · 事業:開辦成本、現金流、估值倍數
     · 資產:交易成本、孳息(租金 / 配息)
     · 少數幾個標籤還會動到別的東西(低利率的地方放現金 → 借款利率降)

   ⚠ 標籤沒有「好」「壞」之分 —— 每一個城市都同時帶著優點與缺點。
     紐約是全世界最深的資本市場(交易成本最低),但也什麼都最貴(開辦成本 +20%)
     而且租金回報最差(房價已經把未來三十年都算進去了)。
     這就是「各有優缺點」:你不是在挑最好的城市,你是在挑要付哪一種代價。

   ⚠ 效果刻意壓在 ±10~45% 之間,而且 tySpecMul 會把整體乘積夾在 0.5~2.0。
     再大就會變成「只有一條正確答案」,那 44 個城市又白做了。
     ⚠ 量測(npm run tycoon)只有 12 局,而且**任何**會改變分支的東西
       (例如開辦成本變貴,於是某一季少開了一家公司)都會把整條亂數流
       往後推,十年後的結果完全不一樣。所以那張表的中位數不是精密儀器 ——
       要看的是「什麼都不做」有沒有守住 1.3 倍上下、每條路線的相對順序、
       以及破產與起訴到不到得了。單獨量過城市特色本身:固定同一組種子時,

     再大就會變成「只有一條正確答案」,那 44 個城市又白做了。

   來源:每一條 dsc 講的都是那個城市真實的產業結構(半導體聚落在新竹、
   黃金實體結算在倫敦、12.5% 稅率在都柏林、鎳在雅加達、銅在聖地牙哥)。
   數字本身是模型,不是統計。
   ========================================================================= */

/* 一個城市的特色標籤是**顯示**用的順序:優點在前、缺點在後。 */
const tySpecs = id => (tySite(id).spec || []);

/* 這個地點對某一件事的加成。kind = 'biz' | 'asset'。
   '*' 是萬用鍵(「什麼都貴」「市場淺」這種不分類別的標籤)。
   ⚠ 一定要夾在 0.5~2.0:一個城市帶三個同向標籤的話,乘起來會失控。 */
function tySpecMul(id, kind, key, field){
  let m = 1;
  for(const sp of tySpecs(id)){
    const d = TY_SPEC[sp]; if(!d || !d[kind]) continue;
    for(const kk of ['*', key]){
      const e = d[kind][kk];
      if(e && e[field] != null) m *= e[field];
    }
  }
  return tyClamp(m, .5, 2);
}
/* 「在這裡做這件事跟別的地方差多少」—— 給畫面用的一句話。
   只列真的有差的欄位,沒差就回空字串(不要為了填版面說廢話)。 */
function tySpecEdge(id, kind, key){
  const F = kind==='biz'
    ? [['cost','開辦成本',true], ['cf','現金流',false], ['mult','估值倍數',false]]
    : [['fee','交易成本',true],  ['yld','孳息',false]];
  const out=[];
  for(const [f,nm,lowGood] of F){
    const m = tySpecMul(id, kind, key, f);
    if(Math.abs(m-1) < .02) continue;
    const pct = (m-1)*100;
    /* ⚠ 這裡**不可以**用 --up / --down。那兩個顏色在這個網站只代表盈虧
       (而且是紅漲綠跌),「開辦成本 −15%」不是跌,是對你有利 ——
       借用漲跌色會讓同一個綠色在兩行之間代表相反的意思。
       所以自己一組:對你有利用強調色、對你不利用警示色。 */
    const good = lowGood ? pct<0 : pct>0;
    out.push(`<em class="${good?'gain':'cost'}">${nm} ${pct>0?'+':''}${pct.toFixed(0)}%</em>`);
  }
  return out.join(' · ');
}

/* 開一家公司在這裡要多少錢。掠奪者的折扣與城市的成本加成都在這裡,
   ⚠ 只能有這一支 —— 三個地方(動作、門檻、畫面)都要拿到同一個數字。 */
const tyBizCost = (k, site) =>
  TY_BIZ[k].cost * (TY.scn==='raider'?.75:1) * tySpecMul(site, 'biz', k, 'cost');

const tySite  = id => TY_SITE[id] || TY_SITE.tpe;

const tyCan   = (id,k) => (TY_SITE[id]?.kind||[]).includes(k);
/* 某一類資產可以放在哪些地點 */
const TY_ASSET_KIND = { stock:'ex', bond:'ex', gold:'vault', estate:'re',
                        fx:'bank', crypto:'ex', oil:'oil', art:'re' };
const tyMarkets = k => TY_SITES.filter(s=>s.kind.includes(TY_ASSET_KIND[k]||'ex'));
/* 事業要開在哪裡:每一種事業有自己合理的地點 */
const TY_BIZ_KIND = { dev:'re', hotel:'re', media:'hq', brand:'hq', tech:'hq',
                      fund:'bank', bank:'bank', energy:'oil', infra:'hq', shell:'shell' };
const tyBizSites = k => TY_SITES.filter(s=>s.kind.includes(TY_BIZ_KIND[k]||'hq'));

/* 地區指數:一筆資產在這裡值多少的乘數 */
const tyRegIdx  = reg => (TY.reg && TY.reg[reg] ? TY.reg[reg].idx : 1);
const tySiteIdx = id  => tyRegIdx(tySite(id).reg);

/* ---------- 部位 ----------
   TY.pos = [{ k:資產類別, site:地點, q:數量, cb:成本基礎 }]
   一個 (資產, 地點) 只會有一筆,買同一個地方就加在同一筆上。 */
const tyPosVal  = p => p.q * TY.px[p.k] * tySiteIdx(p.site);
const tyAssetVal = () => TY.pos.reduce((s,p)=>s+tyPosVal(p),0);
const tyQty     = k => TY.pos.reduce((s,p)=>s+(p.k===k?p.q:0),0);
const tyVal     = k => TY.pos.reduce((s,p)=>s+(p.k===k?tyPosVal(p):0),0);
function tyPosOf(k, site){
  let p=TY.pos.find(x=>x.k===k && x.site===site);
  if(!p){ p={ k, site, q:0, cb:0 }; TY.pos.push(p); }
  return p;
}
/* 空的部位不要留著 —— 不然賣光之後地球上還有一根 0 元的光柱 */
const tyTidyPos = () => { TY.pos = TY.pos.filter(p=>Math.abs(p.q*TY.px[p.k])>1); };

/* 這個地點上的所有東西(部位 + 事業 + 現金 + 對手),地球與側欄都用這一支 */
function tySiteStuff(id){
  const pos = TY.pos.filter(p=>p.site===id);
  const biz = TY.biz.filter(b=>b.site===id);
  const cash = TY.cashSite===id ? TY.cash : 0;
  const holdco = TY.holdco===id;
  const rivals = tyRivalsA().filter(r=>r.home===id);
  const val = pos.reduce((s,p)=>s+tyPosVal(p),0)
            + biz.reduce((s,b)=>s+tyBizVal(b)*b.own,0) + Math.max(0,cash);
  return { pos, biz, cash, holdco, rivals, val };
}
const tyMySites = () => TY_SITES.filter(s=>{
  const t=tySiteStuff(s.id);
  return t.pos.length || t.biz.length || t.cash>0 || t.holdco;
});
/* 一個國家裡我有東西的地點(點國家之後要列的就是這個) */
const tyIsoSites = iso => tyMySites().filter(s=>s.iso===iso);

/* =========================================================================
   狀態與存檔
   ========================================================================= */
let TY=null;                 // null = 還沒開局(畫面上是選劇本)
/* 蓋在地圖上的面板。null = 只有地圖(指揮台的預設狀態)。
   舊版是「分頁」,地圖只是其中一頁;現在地圖是底層,其餘全部是蓋上去的面板。 */
let TY_MODAL=null;
let TY_SIZE=.25;             // 下單比例:買用現金的幾成、賣用持有的幾成
/* 畫面上每一類資產目前選的市場。這是純 UI 狀態(不進存檔)——
   重新整理之後回到各類的第一個市場,不會影響任何已經買下去的部位。 */
let TY_MKT={};
let TY_BIZSITE={};           // 同上,但是「這家公司要開在哪」
let TY_SEL=null;             // 地圖上目前選的地點
let TY_ISO=null;             // 地圖上目前放大的國家

function tySave(){ try{ localStorage.setItem(TY_KEY, JSON.stringify(TY)); }catch(e){} }
function tyLoad(){
  try{
    const d=JSON.parse(localStorage.getItem(TY_KEY)||'null');
    // 版本不合就當作沒有存檔 —— 用舊結構去跑新規則只會噴一堆 undefined
    if(d && d.v===2 && d.scn) TY=d;
  }catch(e){ TY=null; }
}
function tyClear(){ TY=null; try{ localStorage.removeItem(TY_KEY); }catch(e){} }

/* seed:選填。不給的話用時鐘 —— 每一局的對手起手都不一樣,那是這個遊戲該有的樣子。
   給了就整局可重現。⚠ 這個參數存在的理由是「對手是在 tyStart 裡面用亂數發牌的」:
   測試如果先 tyStart() 再改 TY.rng,牌早就發完了,那一局其實是**時鐘**決定的
   —— 於是同一條測試會忽好忽壞。(實際踩到兩次:對手的關係值、以及乾淨玩家的
   監理關注度 —— 對手有機率去檢舉你,一檢舉關注度就不是 0 了。) */
function tyStart(scnK, seed){
  const s=TY_SCN.find(x=>x.k===scnK)||TY_SCN[0];
  TY={
    v:2, scn:s.k, home:s.home, t:0, rng:(seed==null?(Date.now()^0x9e3779b9):seed)|0, done:'',
    cash:s.cash, debt:s.debt,
    // 錢也有地址。cashSite 決定它受哪一國管、被哪一場危機掃到。
    cashSite:s.home, holdco:null,
    fame:s.fame, infl:s.infl, heat:0, credit:s.credit,
    pos:[], px:{}, pxH:{}, reg:{}, biz:[], bizId:1, evAt:{}, partners:{}, sbl:0,
    struct:{ trust:false },
    macro:{ reg:'expand', rate:2.0, inf:1.8, senti:.55 },
    nw:[], log:[], news:[],
    rivals:[], peak:0, worst:0, ipo:0, ch11:0, taxPaid:0, interest:0,
    units:[], threats:[], unitId:1,
  };
  for(const a of TY_ASSETS){ TY.px[a.k]=100; TY.pxH[a.k]=[100]; }
  TY.pxPrev={...TY.px};
  for(const k in TY_REGIONS) TY.reg[k]={ idx:1, comp:0 };
  // 對手的起始身家也要走種子亂數,不然「重開同一顆種子結果不同」
  TY.rivals=TY_RIVALS.map(r=>({ ...r, turf:{...r.turf}, nw:(25+tyRnd()*85)*1e8,
                                rel:0, heat:0, pact:0, alive:true, hist:[] }));
  if(s.biz) tyFound(s.biz, s.home, true);
  TY.nw=[tyNW()];
  tyLog('start', `${s.nm}:${s.sub}。人在${tySite(s.home).nm},手上 ${tyM(TY.cash)} 現金`
        + (TY.debt? `,以及 ${tyM(TY.debt)} 的負債。` : '。'));
  tySave();
}

/* =========================================================================
   計算
   ========================================================================= */


/* 一家事業的估值。
   核心概念:**估值 = 資本 × 產業倍數 × 市場願意付的溢價**。
   第三項跟公司本身完全無關 —— 它是情緒。上市之後這一項會直接反映在你的
   身家上,所以上市的人身家會抖,沒上市的人不會。 */
function tyBizVal(b){
  const d=TY_BIZ[b.k]; if(!d || d.shell) return 0;
  let mult=d.mult;
  if(TY.scn==='founder' && b.k==='tech') mult*=1.5;
  /* 城市特色:同一家科技公司,開在舊金山市場給的倍數就是比別的地方高 ——
     因為買家也都在那裡。見 TY_SPEC。 */
  mult *= tySpecMul(b.site||TY.home, 'biz', b.k, 'mult');
  const hype = tyClamp(1 + TY.macro.senti*(b.pub?.28:.12) + (TY.fame-30)/260, .35, 2.6);
  /* 倍數乘的是**年化盈餘**,不是投入資本 —— 那才是現實裡本益比的意思。
     第一版寫成 cap×mult×係數,結果是一家公司的估值只有你投進去的六成:
     開公司在按下去的那一秒就先賠四成,整條「開公司 → 上市」的路線
     從第一步就是虧的。改成盈餘之後,一家建設公司值大約 1.8 倍投入資本,
     這也是為什麼現實裡有人願意花力氣把錢變成一家公司,而不是就放著。

     還在燒錢的公司(cf 是負的)沒有盈餘可乘 —— 那就用資本乘一個很小的
     係數,因為市場買的是故事,不是損益表。科技公司的倍數之所以是 30,
     講的正是這件事。 */
  const earn = (b.cf || b.cap*d.cf) * 4;
  const val  = earn>0 ? earn*mult*hype : b.cap*mult*.075*hype;
  /* 最後乘上**它開在哪裡**。同一家建設公司,開在杜拜和開在東京值的錢不一樣 ——
     而且會隨著那個地區自己的循環變動,跟全球景氣是兩件事。 */
  return Math.max(b.cap*.4, val) * tySiteIdx(b.site||TY.home);
}

const tyBizTotal = () => TY.biz.reduce((s,b)=>s+tyBizVal(b)*b.own, 0);
const tyNW = () => TY.cash + tyAssetVal() + tyBizTotal() - TY.debt;

/* 可以抵押借到多少:每一類資產的成數不同,事業只算七成的估值,
   信用分數決定你能不能借到上限。放空的部位不但不能抵押,還要佔用額度。 */
function tyBorrowMax(){
  let base=0;
  for(const p of TY.pos){
    const a=tyAsset(p.k), v=tyPosVal(p);
    if(v>0) base += v*a.ltv;
    else base += v;                      // 空頭部位是負的,直接扣額度
  }
  base += tyBizTotal()*.7 + TY.cash*.9;
  let f = .45 + TY.credit/100*.45;
  if(TY.scn==='raider') f += .15;
  return Math.max(0, base*f);
}
/* 借款年利率 = 政策利率 + 信用價差。信用 100 分的人加 1.2%,40 分的人加 6% 以上。 */
function tyRate(){
  let r = TY.macro.rate + 1.2 + (100-TY.credit)/100*7;
  if(TY.scn==='heir') r -= 1.2;
  /* 錢放在長期低利率的地方,借款利率就跟著那裡走 —— 借便宜的日圓 / 瑞郎
     去買別的地方的資產,是一整代人真的在做的生意。
     代價是你的現金從此暴露在那個地區的危機裡(外匯管制、銀行危機、資產凍結
     都只發生在錢所在的地方,見 tyMoveCash)。 */
  if(tySpecs(TY.cashSite).includes('lowrate')) r -= .8;
  return Math.max(.6, r);
}
/* 現在的現金放在哪裡、換到了什麼 —— 給畫面用的一句話 */
const tyCarry = () => tySpecs(TY.cashSite).includes('lowrate')
  ? `現金放在${tySite(TY.cashSite).nm}(長期低利率),借款利率 −0.8%` : '';
/* 稅率不再是一個開關,而是一個**地址**。
   沒有控股架構就照你出身地的法定公司稅率課(台北 20%、紐約 21%、倫敦 25%);
   把控股層設在別的地方,就照那裡的稅率課(新加坡 17%、都柏林 12.5%、開曼 0%)。
   這些數字是真的(見 README 的來源),所以「省下多少」也是真的算得出來的。
   代價寫在 tyNext 的第 5 段:省得越多,關注度長得越快。 */
const tyHomeTax = () => tySite(TY.home).tax;
const tyTaxRate = () => TY.holdco ? tySite(TY.holdco).tax : tyHomeTax();
/* 每一季因為避稅架構而增加的關注度 —— 跟「你到底省了幾個百分點」成正比。 */
const tyTaxGap  = () => Math.max(0, tyHomeTax() - tyTaxRate());

/* 富豪榜上「別人看到的」你。分層控股把一部分身家藏在別人查不到的地方,
   所以你在榜上會比實際窮 —— 這正是很多人做這件事的理由。 */
const tyShownNW = () => TY.struct.trust ? tyNW()*.7 : tyNW();

function tyLog(kind, txt){
  TY.log.push({ t:TY.t, kind, txt });
  if(TY.log.length>240) TY.log.splice(0, TY.log.length-240);
}
const tyYear = t => TY_Y0 + Math.floor(t/4);
const tyQ    = t => (t%4)+1;
const tyWhen = t => `${tyYear(t)} Q${tyQ(t)}`;

/* =========================================================================
   推進一季 —— 整個遊戲的心臟
   -------------------------------------------------------------------------
   順序很重要,而且順序本身就是規則:
     1. 景氣先轉  → 你這一季的決定是在**上一季的資訊**下做的,這才公平
     2. 價格再動
     3. 事業吐現金流 / 資產配息
     4. 利息先扣(債權人永遠排在你前面)
     5. 課稅
     6. 事件發生
     7. 追繳保證金 → 破產判定(這一步在最後,前面每一項都可能是壓垮你的那一根)
   ========================================================================= */
function tyNext(){
  if(!TY || TY.done) return;
  TY.t++;
  TY.news=[];
  const M=TY.macro, prevRate=M.rate;

  /* ---- 1. 景氣循環 ---- */
  const nx=TY_REGIME[M.reg].next;
  let r=tyRnd(), acc=0, pick=M.reg;
  for(const [k,p] of Object.entries(nx)){ acc+=p; if(r<=acc){ pick=k; break; } }
  if(pick!==M.reg){
    tyNews('macro', `景氣轉向 ${TY_REGIME[pick].nm}`, TY_REGIME[pick].dsc);
    tyLog('macro', `景氣進入「${TY_REGIME[pick].nm}」`);
  }
  M.reg=pick;
  const R=TY_REGIME[pick];
  // 利率往目標走一半,再加一點雜訊 —— 央行是慢慢動的
  M.rate = tyClamp(M.rate + (R.tgt-M.rate)*.5 + tyG()*.25, 0, 14);
  M.senti = tyClamp(R.senti + tyG()*.35, -3, 2.6);
  M.inf   = tyClamp(M.inf + (M.rate-M.inf)*.18 + (R.senti*.3) + tyG()*.3, -1.5, 9);
  const dRate = M.rate - prevRate;

  /* ---- 1.5 地區指數 ----
     全球景氣只是背景。真正決定「你買在哪裡對不對」的是這一段:每個大區
     有自己的長期成長、自己的波動、對全球情緒的不同敏感度。非洲的長期
     成長是北美的兩倍多,波動也是兩倍多 —— 這就是新興市場的定義。
     comp 是競爭度(對手打進來會上升),它會直接吃掉你在那裡的現金流。 */
  for(const [rk,rd] of Object.entries(TY_REGIONS)){
    const st=TY.reg[rk];
    const ret = rd.drift + rd.beta*M.senti*.020
              + (rd.oil||0)*((TY.px.oil/100)-1)*.020 + rd.vol*tyG();
    st.idx = Math.max(.12, st.idx*(1+tyClamp(ret,-.35,.5)));
    st.comp = Math.max(0, st.comp*.92);      // 競爭會慢慢淡掉,但不會消失
  }

  /* ---- 2. 價格 ----
     ⚠ 原油要先算。能源股有一個 oilb 係數是「跟著油價走」,那一項需要的是
       **這一季**的油價變動,不是上一季的 —— 所以順序不能顛倒。 */
  TY.pxPrev={...TY.px};                 // 畫面上的「本季」漲跌要有比較基準
  const step = a => {
    /* 通膨那一項要用「離 2% 有多遠」,不是通膨本身。
       第一版寫成 a.inf*(M.inf/100*10):通膨停在 8% 的時候,原油每季就多
       3.2% 的無風險漲幅,四十季複利下來實測中位數是 242 倍 —— 黃金 9 倍。
       那不是通膨,那是把一個常數當成報酬率在加。 */
    const ret = a.drift + a.beta*M.senti + a.rat*dRate + a.inf*((M.inf-2)/100*3)
              + (a.oilb||0)*dOil + a.vol*tyG();
    TY.px[a.k] = Math.max(1, TY.px[a.k]*(1+tyClamp(ret,-.75,1.2)));
  };
  let dOil=0;
  step(tyAsset('oil'));
  dOil = TY.px.oil/(TY.pxPrev.oil||100) - 1;
  for(const a of TY_ASSETS) if(a.k!=='oil') step(a);
  // 走勢圖要有東西可以畫。一局 40 季 × 13 種資產 = 520 個數字,存得起。
  for(const a of TY_ASSETS){
    (TY.pxH[a.k]=TY.pxH[a.k]||[100]).push(+TY.px[a.k].toFixed(2));
  }

  /* ---- 3. 現金流 ---- */
  let inc=0;
  for(const p of TY.pos){
    const a=tyAsset(p.k); if(!a.yld) continue;
    const v=tyPosVal(p);
    // 同一種資產,租金回報率會被當地的競爭吃掉一部分
    const comp = 1 - Math.min(.5, TY.reg[tySite(p.site).reg].comp*.06);
    /* 孳息也吃城市特色:同樣一棟收租的房子,大阪的租金回報就是比東京好 ——
       那不是因為租金比較高,是因為房價比較低。 */
    const ym = tySpecMul(p.site, 'asset', p.k, 'yld');
    if(v>0) inc += v*a.yld*comp*ym;     // 空頭部位要付利息給出借人,不是收
    else    inc += v*a.yld*1.4;
  }
  for(const b of TY.biz){
    const d=TY_BIZ[b.k]; if(!d || d.shell) continue;
    let rate=d.cf;
    if(d.fameCf) rate = .015 + TY.fame/100*.20;      // 品牌授權:名氣就是營收
    // 城市特色:在新竹開科技公司跟在拉哥斯開,同樣的資本吐出來的現金流不一樣
    rate *= tySpecMul(b.site||TY.home, 'biz', b.k, 'cf');
    const s=d.sens||{};
    /* 係數要大到「升息循環把建設公司壓到只剩六成現金流」看得出來。
       第一版寫成 (M.rate-2.5)/100*4,利率從 2.5% 升到 8% 只讓現金流少 20%
       —— 現實裡那已經足夠讓一整個產業停止動工。 */
    let m = 1 + (s.senti||0)*M.senti*.40 + (s.rate||0)*(M.rate-2.5)*.10
              + (s.oil||0)*((TY.px.oil/100)-1)*.5;
    if(TY.scn==='self') m*=1.25;
    /* 在地因素:當地景氣指數的高低、對手打進來的競爭、以及夥伴要抽的成。
       這三件事都只發生在**那一個地方**,全球景氣一點關係都沒有。 */
    const bs=tySite(b.site||TY.home), br=TY.reg[bs.reg];
    m *= tyClamp(br.idx, .3, 2.2);
    m *= 1 - Math.min(.5, br.comp*.06);
    // 經理人:駐在這個城市的每一位 +15%,最多算兩位
    const mg=Math.min(2, tyUnitN(tyUnitsAt(b.site||TY.home),'mgr'));
    if(mg) m *= 1 + .15*mg;
    let cf = b.cap*rate*Math.max(-.6,m) + b.cap*d.vol*.012*tyG();
    const par = TY.partners[bs.reg];
    if(par && cf>0) cf *= (1-par.cut);   // 在地夥伴抽成:進得去的代價
    // 合資案:對方分走的那一成五(見 TY_DEALS.jv)
    if(b.jv && cf>0) cf *= (1-(b.jvCut||.15));
    b.cf=cf; inc+=cf*b.own;
    if(d.fame) TY.fame = tyClamp(TY.fame + d.fame*(TY.scn==='self'?2:1)*.6, 0, 100);
    if(d.float) TY.cash += b.cap*d.float*.012;       // 浮存金:保費先進來的那筆錢
  }
  TY.cash += inc;

  /* ---- 4. 利息 ----
     質押借款那一段的利率比較低(抵押品是隨時處分得掉的證券),所以要分開算,
     不能整筆用同一個利率 —— 不然質押的好處會少掉一半。 */
  const sbl=Math.min(TY.sbl||0, TY.debt);
  const intr = (TY.debt-sbl)*tyRate()/100/4 + sbl*tySblRate()/100/4;
  TY.cash -= intr; TY.interest += intr;

  /* ---- 5. 稅 ---- */
  if(inc>0){
    const tax = inc*tyTaxRate();
    TY.cash -= tax; TY.taxPaid += tax;
    /* 關注度跟「你省了幾個百分點」成正比,不是一個固定值。
       台北 20% 搬到新加坡 17%,幾乎沒有人會多看你一眼(每季 +0.4);
       搬到開曼 0%,每季 +2.8 —— 那是一條會在十年之內把你推到起訴的斜率。
       越有名的人,同一個架構被盯上得越快:記者是照名字找題目的。 */
    const gap=tyTaxGap();
    if(gap>0) TY.heat += gap*14 + TY.fame/100*1.5*(gap>.05?1:0);
  }

  /* ---- 名氣與關注度自然衰減 ---- */
  TY.fame = tyClamp(TY.fame*.985, 0, 100);
  /* 關注度的平衡點 = 每季新增 ÷ 衰減率。第一版是 6% 衰減、每季新增 1.6,
     平衡點只有 26 —— 「起訴」那個結局實測 16 局一次都沒出現,等於寫了沒用。
     現在衰減 4%(有人脈的人 10%),境外架構每季 +2.5:沒有政商關係的人
     會一路漂到 60~90,再被一則事件推過去;有人脈的人穩在 25 附近。
     這句話本身就是這個手法的設計:**避稅不是被抓到才失敗,是沒有人罩才失敗。** */
  TY.heat = tyClamp(TY.heat*(TY.infl>60?.88:.97) - (TY.scn==='self'?1:.3), 0, 120);
  TY.credit = tyClamp(TY.credit + (TY.debt < tyBorrowMax()*.5 ? .8 : -.5), 0, 100);
  if(TY.scn==='float') TY.credit=Math.max(TY.credit,45);

  /* ---- 6. 事件 ---- */
  tyEvents();

  /* ---- 對手 ----
     他們也住在地圖上,而且成長跟自己大本營所在地區的指數綁在一起 ——
     所以「這一季誰在漲」同時是一個景氣訊號和一個地理訊號。 */
  tyRivalTurn();

  /* ---- 資本部隊:到達、維持費、駐紮效果、對手部隊的攻防 ---- */
  tyUnitsTurn();

  /* ---- 7. 追繳保證金 → 破產 ---- */
  tyMargin();

  const nw=tyNW();
  TY.nw.push(nw);
  TY.peak=Math.max(TY.peak,nw);
  if(TY.peak>0) TY.worst=Math.min(TY.worst||0, (nw-TY.peak)/TY.peak*100);

  if(!TY.done && TY.heat>=100){
    tyEnd('indicted', '檢方起訴。海外架構、空殼、政治獻金一路串起來 —— 資產凍結,遊戲在這裡結束。');
  }
  /* t 是「第幾季」的索引:t=0 是 2026 Q1。所以第 40 季是 t=39,不是 t=40 ——
     寫成 >=TY_QN 的話畫面上會出現「第 41 / 40 季 · 2036 Q1」,多跑了一季。 */
  if(!TY.done && TY.t>=TY_QN-1) tyEnd('done','');
  tySave();
}

/* =========================================================================
   結算日 —— 這一季你撐不撐得住
   -------------------------------------------------------------------------
   這一支是遊戲裡唯一「不問你意見」的地方,所以它的順序就是規則本身:

     ① 現金透支 → 銀行自動動用你的抵押額度補上(利息照算)。
        現實裡沒有人的帳戶會停在 -3 億,那是一筆自動生出來的貸款。
     ② 空單失控 → 強制回補。空頭的虧損沒有上限,券商不會等你。
     ③ 負債超過抵押上限 → 強制處分多頭部位還債,從最好賣的開始 ——
        這是槓桿真正的代價:你被迫在最壞的時候賣掉最好的東西。
     ④ 還是透支 → 繼續賣。
     ⑤ 資不抵債 → 有信託就保住一部分重來,沒有就是破產。

   ⚠ 第 ⑤ 步一定要在最外層、無條件執行。
     第一版把它寫在「負債超過上限」那個 if 裡面 —— 於是一個人可以靠放空
     把淨值做到 -20 億,只因為他沒有借款,所以整支函式在第一行就 return 了,
     破產判定永遠碰不到。實測跑完 40 季拿到 nw = -2,096,139,874 卻顯示
     「十年到期」,而不是破產。
   ========================================================================= */
/* 變現順序:越前面越好賣。被追繳保證金的時候銀行就是照這個順序處分你的東西
   —— 先賣掉最好賣的,留下一堆賣不掉的,這正是槓桿最痛的地方。 */
const TY_LIQ=['bond','fin','cons','health','tech','semi','nrg','crypto','gold','fx','oil','estate','art'];

function tyMargin(){
  /* ① 現金透支 → 自動動用抵押額度 */
  if(TY.cash<0){
    const take=Math.min(Math.max(0, tyBorrowMax()-TY.debt), -TY.cash);
    if(take>0){ TY.debt+=take; TY.cash+=take; }
  }

  /* ①.5 質押維持率。
     證券質押最危險的地方不是利息,是**維持率**:證券一跌,額度跟著縮,
     券商會要你補錢,補不出來就直接處分 —— 而那一賣就實現了獲利,
     當場課一次資本利得稅。「不賣就不用繳稅」的前提是你撐得住不賣。 */
  if((TY.sbl||0) > tySblMax()*1.15 && tySecVal()>0){
    const need=Math.max(0,(TY.sbl||0)-tySblMax()*.85);
    const pay=Math.min(need, Math.max(0,TY.cash));
    TY.sbl-=pay; TY.debt-=pay; TY.cash-=pay;
    if((TY.sbl||0) > tySblMax()*1.15){
      tyNews('bad','質押追繳',
        `你質押的證券跌了,額度跟著縮水。券商要求補錢,不然就處分 ——`
        + `而一被處分就實現獲利,那筆你一直沒繳的資本利得稅會在最壞的時候一次到期。`);
    }
  }

  /* ② 空單失控 → 強制回補六成 */
  let cov=0;
  for(const p of TY.pos){
    if(p.q>=0) continue;
    const a=tyAsset(p.k), eq=Math.max(0,tyNW()), sv=-tyPosVal(p);
    if(sv<=eq*.6) continue;
    const q=Math.abs(p.q)*.6, cost=q*TY.px[p.k]*tySiteIdx(p.site)*(1+a.fee*2);
    p.q+=q; TY.cash-=cost; cov+=cost;
  }

  /* ③ 負債超過抵押上限 → 強制處分。只賣「補到安全線」需要的量,不是全部。
     賣的順序是「最好賣的先賣」,同一類資產裡先賣**指數最高的那個地方**——
     銀行處分抵押品時看的是「哪一塊現在賣得掉」,不是你捨不得哪一塊。 */
  let sold=0;
  const liq = TY.pos.filter(p=>p.q>0)
    .sort((x,y)=> TY_LIQ.indexOf(x.k)-TY_LIQ.indexOf(y.k) || tyPosVal(y)-tyPosVal(x));
  for(const p of liq){
    if(TY.debt <= tyBorrowMax()*1.02) break;
    const a=tyAsset(p.k), v=tyPosVal(p);
    if(v<=0) continue;
    const need=Math.max(0, TY.debt - tyBorrowMax()*.9);
    const take=Math.min(v, need/Math.max(.15,a.ltv));
    const got=take*(1-a.fee*2);                        // 被迫賣的時候成本是兩倍
    p.q-=take/(TY.px[p.k]*tySiteIdx(p.site));
    TY.debt=Math.max(0,TY.debt-got); sold+=got;
  }

  /* ④ 回補完還是透支 → 繼續賣 */
  for(const p of liq){
    if(TY.cash>=0) break;
    const a=tyAsset(p.k), v=tyPosVal(p);
    if(v<=0) continue;
    const take=Math.min(v, -TY.cash/(1-a.fee*2));
    const got=take*(1-a.fee*2);
    p.q-=take/(TY.px[p.k]*tySiteIdx(p.site));
    TY.cash+=got; sold+=got;
  }
  tyTidyPos();

  if(sold>0) TY.sbl=Math.max(0, Math.min(TY.sbl||0, TY.debt));
  if(sold>0 || cov>0){
    TY.credit=tyClamp(TY.credit-8,0,100);
    tyNews('bad','追繳保證金',
      (cov>0?`空單虧損超過門檻,${tyM(cov)} 的部位被強制回補。`:'')
      + (sold>0?`抵押品跌破門檻,銀行直接處分了 ${tyM(sold)} 的部位。`:'')
      + '你沒有選擇賣哪一個的權利 —— 這就是槓桿的帳單。');
    tyLog('bad',`被追繳保證金,強制處分 ${tyM(sold+cov)}`);
  }

  /* ⑤ 資不抵債。無條件檢查。 */
  if(tyNW()<0 && !TY.done){
    if(TY.struct.trust){
      // 信託隔離:債權人進不去,你保住一部分本金,而且這次沒有負債
      const keep=Math.max(2e8, Math.abs(tyNW())*.4);
      TY.debt=0; TY.sbl=0; TY.cash=keep; TY.pos=[];
      TY.biz=TY.biz.filter(b=>TY_BIZ[b.k].shell);
      TY.struct.trust=false;
      TY.credit=tyClamp(TY.credit-30,0,100); TY.fame=tyClamp(TY.fame-10,0,100);
      tyNews('bad','債權人上門,但信託擋住了',
        `事業與抵押品全部被拿走。信託裡的 ${tyM(keep)} 動不了 —— 你還在場上,而且這次沒有負債。`);
      tyLog('bad','觸發信託隔離,保住 '+tyM(keep));
    }else{
      tyEnd('bankrupt','資產全部處分完還是還不完債,而且沒有任何隔離架構。債權人接管一切。');
    }
  }
}

function tyNews(kind, title, txt){ TY.news.push({ kind, title, txt }); }

function tyEnd(how, why){
  TY.done=how;
  TY.endTxt=why;
  tyLog('end', why || '十年到期,結算。');
}

/* 我在哪些地區有東西。
   地理事件只打在你真的碰得到的地方 —— 一則「剛果政變」對一個從來沒去過
   非洲的人只是一句沒有意義的新聞,而遊戲裡沒有意義的新聞就是雜訊。 */
function tyMyRegions(){
  const set=new Set();
  for(const p of TY.pos) if(Math.abs(p.q)>1e-9) set.add(tySite(p.site).reg);
  for(const b of TY.biz) set.add(tySite(b.site||TY.home).reg);
  set.add(tySite(TY.cashSite).reg);
  return [...set];
}
/* 挑一個「我有東西、而且政策風險夠高」的地區。沒有就回 null。 */
function tyRiskyRegion(minPol){
  const c=tyMyRegions().filter(r=>(TY_REGIONS[r].pol||0)>=minPol);
  return c.length ? c[Math.floor(tyRnd()*c.length)%c.length] : null;
}
function tyRegHit(reg, mul){ TY.reg[reg].idx=Math.max(.08, TY.reg[reg].idx*mul); }
/* 有在地夥伴的地方,政策風險對你只剩一半 —— 這就是他抽那 18% 的理由。
   跟對手合資也一樣:他在那裡的勢力就是你的保護傘(見 TY_DEALS.jv)。 */
const tyPolMul = reg => (TY.partners[reg]
  || TY.biz.some(b=>b.jv && tySite(b.site||TY.home).reg===reg)) ? .5 : 1;

/* 每一則事件都有冷卻期(cd,單位是季)。
   為什麼需要它:條件寬鬆的事件會一直待在候選池裡,而候選池平常只有五六則,
   所以「產油區衝突」這種無條件事件實測四十季會抽中十次 —— 每次 ×1.3,
   原油價格從 100 漲到 2,800。那不是地緣政治,那是同一件事重播十遍。
   冷卻期一加,同一則最多出現三四次,而且中間隔得夠遠,讀起來像不同的事。 */
function tyEvents(){
  if(!TY.evAt) TY.evAt={};
  const pool=TY_EVENTS.filter(e=> TY.t-(TY.evAt[e.id]??-99) >= (e.cd||6) && e.when());
  if(!pool.length) return;
  const n = tyRnd()<.35 ? 2 : 1;
  const used=new Set();
  for(let i=0;i<n;i++){
    const cand=pool.filter(e=>!used.has(e.id));
    if(!cand.length) break;
    const tot=cand.reduce((s,e)=>s+e.w,0);
    let r=tyRnd()*tot, hit=cand[0];
    for(const e of cand){ r-=e.w; if(r<=0){ hit=e; break; } }
    used.add(hit.id); TY.evAt[hit.id]=TY.t;
    const [kind,title,txt]=hit.run();
    tyNews(kind,title,txt); tyLog(kind,title);
  }
}

/* =========================================================================
   動作 —— 玩家能按的每一顆按鈕
   -------------------------------------------------------------------------
   每一支都遵守同一個規矩:自己檢查條件、自己說明為什麼不行(回傳一句話)、
   成功的話寫進 log 並存檔。畫面層只負責顯示那句話,不重複判斷條件 ——
   兩邊各判一次,遲早會有一邊忘記改。
   ========================================================================= */
function tyFeeMul(){
  if(TY.scn==='float') return .5;
  return 1;
}
/* ---- 在地夥伴 ----
   政策風險高的地區(大中華、非洲、拉美)不是「有錢就進得去」。合資規定、
   土地所有權限制、外匯管制、以及「認識誰」—— 這些是真的存在的門檻,
   所以這裡把它做成規則:沒有在地夥伴就不能在那裡買不動產或開公司。
   夥伴要抽成(現金流 18%),但他同時把那個地區的政策風險打對折。 */
const TY_PARTNERS = {
  cn   : { nm:'陳家儀', tag:'華潤系二代', cut:.18 },
  af   : { nm:'Kwame Adeyemi', tag:'礦權掮客', cut:.18 },
  latam: { nm:'Isabel Duarte', tag:'家族銀行', cut:.18 },
};
const tyNeedPartner = site => {
  const r=tySite(site).reg;
  if(!TY_PARTNERS[r] || TY.partners[r]) return null;
  /* 合資案等於一個在地夥伴:只要在那個地區跟某個對手有合資,就進得去。
     這是「談條件」真正的價值 —— 它換到的是原本買不到的門票。 */
  if(TY.biz.some(b=>b.jv && tySite(b.site||TY.home).reg===r)) return null;
  return r;
};

/* ---- 買賣:每一筆都要有地址 ----
   site 沒給就用畫面上目前選的市場(TY_MKT)。所有價格都要乘上
   tySiteIdx() —— 同一種資產在不同地區是不同的價格。 */
function tyMktOf(k){
  const ms=tyMarkets(k);
  const cur=TY_MKT[k];
  return (cur && ms.some(m=>m.id===cur)) ? cur : ms[0].id;
}
function tyBizSiteOf(k){
  const ss=tyBizSites(k);
  const cur=TY_BIZSITE[k];
  return (cur && ss.some(x=>x.id===cur)) ? cur : (ss[0]||tySite(TY.home)).id;
}
function tyBuy(k, site){
  const a=tyAsset(k); if(!a) return '';
  site = site || tyMktOf(k);
  if(!tyCan(site, TY_ASSET_KIND[k]||'ex'))
    return `${tySite(site).nm}沒有${a.nm}的市場。`;
  if(k==='estate'){
    const need=tyNeedPartner(site);
    if(need) return `在${tySite(site).nm}買不動產要有在地夥伴 —— 去「手法」找 ${TY_PARTNERS[need].nm}。`;
  }
  const amt=tyOrderAmt();
  if(amt<1e6) return '現金不夠,連一筆像樣的單都下不了。';
  const fee=tyFeeOf(k, site);
  const px=TY.px[k]*tySiteIdx(site);
  const p=tyPosOf(k,site);
  const before=tyUnitCount(p);
  p.q += amt*(1-fee)/px; p.cb += amt;
  TY.cash-=amt;
  const got=tyUnitCount(p)-before;
  tyLog('trade',`在${tySite(site).nm}買進 ${a.nm} ${tyUnitTxt(got,a.u)}(${tyM(amt)})`);
  tySave();
  return `在${tySite(site).nm}買進 <b>${tyUnitTxt(got,a.u)}</b>的${a.nm},花了 ${tyM(amt)}`
       + `(每${a.u} ${tyM(tyUnitPx(k,site))},交易成本 ${tyM(amt*fee)})。`;
}
function tySell(k, site){
  const a=tyAsset(k); if(!a) return '';
  const list = site ? TY.pos.filter(p=>p.k===k&&p.site===site&&p.q>0)
                    : TY.pos.filter(p=>p.k===k&&p.q>0);
  if(!list.length) return `你沒有${site?tySite(site).nm+'的':''} ${a.nm} 可以賣。`;
  let got=0, sold=0, tax=0, gain=0, where=[];
  for(const p of list){
    // 交易成本按**這一筆部位在哪裡**算,不是按下拉選的那個市場
    const fee=tyFeeOf(k, p.site);
    const q=p.q*TY_SIZE, cut=q*TY.px[k]*tySiteIdx(p.site)*(1-fee);
    const basis=p.cb*TY_SIZE;
    const g=cut-basis;
    if(g>0){ gain+=g; tax+=g*tyCgRate(p); }
    sold += q*100/a.up;
    p.q-=q; p.cb-=basis; got+=cut; where.push(tySite(p.site).nm);
  }
  /* 賣出 = 實現獲利 = 課稅。這一行是 buy-borrow-die 的另外一半 ——
     沒有它,「不賣、改成借」就完全沒有理由。 */
  TY.cash+=got-tax; TY.taxPaid+=tax; tyTidyPos();
  tyLog('trade',`賣出 ${a.nm} ${tyUnitTxt(sold,a.u)}(${where.join('、')}),`
        + `入帳 ${tyM(got-tax)}${tax>0?`(已扣資本利得稅 ${tyM(tax)})`:''}`);
  tySave();
  return `賣掉 ${where.join('、')}的 <b>${tyUnitTxt(sold,a.u)}</b>${a.nm},`
       + (tax>0
          ? `實現獲利 ${tyM(gain)},其中 <b>${tyM(tax)}</b> 被課走(資本利得稅),`
            + `實際入帳 ${tyM(got-tax)}。`
            + `如果不賣、改成拿它去質押借款,這筆稅今天一毛都不用繳。`
          : `入帳 ${tyM(got)}。`
            + (gain>1e6?`(${tySite(TY.home).nm}的證券資本利得稅率是 0%,所以這一筆沒有被課到。)`:''));
}
function tyShort(k, site){
  const a=tyAsset(k);
  if(!a || !a.short) return `${a?a.nm:'這個'}沒有可以放空的市場。`;
  if(TY.credit<45) return '信用不足 45,沒有券商願意借券給你。';
  site = site || tyMktOf(k);
  let cap=tyNW()*.35*(TY.scn==='macro'?2:1);
  const cur=Math.max(0,-tyVal(k));
  if(cur>=cap) return `${a.nm} 的空單已經到達額度上限(${tyM(cap)})。`;
  const amt=Math.min(cap-cur, tyNW()*TY_SIZE*.5);
  if(amt<1e6) return '額度不足,放不了空。';
  let fee=a.fee*(TY.scn==='macro'?.5:1);
  const p=tyPosOf(k,site);
  p.q -= amt/(TY.px[k]*tySiteIdx(site));
  TY.cash+=amt*(1-fee);
  tyLog('trade',`在${tySite(site).nm}放空 ${a.nm} ${tyM(amt)}`);
  tySave();
  return `在${tySite(site).nm}放空 ${a.nm} ${tyM(amt)}。價格漲上去你就要賠,而且沒有上限。`;
}
function tyCover(k){
  const a=tyAsset(k);
  const list=TY.pos.filter(p=>p.k===k&&p.q<0);
  if(!list.length) return `${a.nm} 沒有空單要回補。`;
  let cost=0;
  for(const p of list) cost += Math.abs(p.q)*TY_SIZE*TY.px[k]*tySiteIdx(p.site)*(1+tyFeeOf(k,p.site));
  if(cost>TY.cash) return `回補要 ${tyM(cost)},你的現金不夠 —— 這就是空單最危險的地方。`;
  for(const p of list) p.q -= p.q*TY_SIZE;
  TY.cash-=cost; tyTidyPos();
  tyLog('trade',`回補 ${a.nm} 空單`);
  tySave();
  return `回補 ${a.nm} 空單,付出 ${tyM(cost)}。`;
}
/* =========================================================================
   條件與金額 —— 「這顆按鈕要什麼」和「這一次要花多少」
   -------------------------------------------------------------------------
   使用者的三句話:
     「我點上市的時候,如果名氣不夠可以顯示出來,在我這個頁面要看得到」
     「加碼、上市等等的所有功能都要幫我寫所需要的條件」
     「手法和其他的也可以選擇要多少錢」

   ① tyNeeds(act, arg) 回傳這個動作的每一條門檻:標籤、你現在多少、要多少、
      過了沒有。三個地方讀它 —— 按鈕的 disabled、卡片上那一行字、
      以及動作函式自己的守門(tyBlock)。
      ⚠ 條件**只能寫在這裡**。原本每一支動作函式各自寫一次 if,畫面上又
        什麼都不寫,所以規則只能靠試錯發現;而只要有人改了其中一邊,
        就會變成「看起來可以按,按下去說不行」或更糟的反過來。

   ② TY_MONEY 是每一個「要花錢」的動作的金額規則(上限、建議值、下限),
      畫面上長出一組比例晶片 + 自訂金額,效果跟著金額走 ——
      不然「可以選要多少錢」只是一個假的選項。
      ⚠ 用錢買點數的三個手法(獻金 / 曝光 / 慈善)效果是 **0.6 次方**遞減
        而且有單次上限:線性的話,錢多的人一季就能把名氣人脈買到滿,
        後面四十季就沒有任何取捨了。
   ========================================================================= */

/* 一條數字門檻:你現在 have,需要 want。 */
const tyNd = (lab, have, want, fmt) => {
  const f = fmt || (v => v.toFixed(0));
  return { lab, ok: have >= want - 1e-6, now: f(Math.max(0,have)), want: f(Math.max(0,want)) };
};
/* 一條「有沒有」門檻。lab 寫成**通過時**的樣子,no 是沒過時要說的那句話。 */
const tyNb = (lab, ok, no) => ({ lab, ok, no });
