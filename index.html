<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>帝國 —— 富豪養成模擬器</title>
<meta name="description" content="沙盤推演:買事業、發債、質押借款、跟對手併購,四十季跑完看你排到真實富豪榜第幾名。這裡的錢全部是假的。">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0d12">
<script src="https://unpkg.com/globe.gl"></script>
<!-- 畫面層(3D 建築、傾斜鏡頭、季間過場)。只讀 TY、不碰規則,見檔頭註解 -->
<script src="world3d.js"></script>

<style>
  /* ═══════════════════════════════════════════════════════════════════
     Apple 設計語言
     -------------------------------------------------------------------
     色票是 Apple 實際在用的值(HIG 系統色 + apple.com 的灰):
       #f5f5f7  Apple 的招牌淺灰,拿來當卡片與區塊底
       #1d1d1f  近黑的主文色,不是純黑 —— 純黑在白底上太銳利
       #0071e3  按鈕藍(淺色)/ #2997ff 連結藍(深色)
       #86868b  次要文字,整個 apple.com 都是這個灰

     ⚠ 字體是誠實的取捨:SF Pro 只在 Apple 裝置上有,而且授權不允許
       CDN 引入(CSP 也擋)。-apple-system 在 Mac / iPhone 上會拿到真的 SF,
       在 Windows 上會退到 Segoe UI。中文同理:PingFang TC(Apple)→
       Microsoft JhengHei(Windows)。所以這個網站在 iPhone 上看最接近,
       在 Windows 上是「同樣的排版與色票,不同的字」。

     ⚠ 淺色是預設,跟 apple.com 一樣;系統設深色就跟著深色。
       但**地球那一頁永遠是黑的** —— 它是 3D 深色場景,放在白底上會變成
       一坨黑點。這正是 apple.com 自己的做法:淺色導覽 + 整段全出血的黑。
     ═══════════════════════════════════════════════════════════════════ */
  :root{
    --bg:#ffffff;
    --bg-deep:#f5f5f7;
    --panel-rgb:245,245,247;
    --panel:#f5f5f7;
    --panel-solid:#f5f5f7;
    --panel-float:#ffffff;
    --scrim-rgb:0,0,0;

    /* Apple 幾乎不用框線,靠底色的明暗差分層。留下來的都極淡。 */
    --line:rgba(0,0,0,.09);
    --line-strong:rgba(0,0,0,.16);
    --hairline-rgb:0,0,0;

    /* #0071e3 在白底是 4.70、在卡片底色只有 4.31 —— 而所有可點的文字
       (「看詳情 →」「去『持倉』修」、底部分頁列選中那一格)都是它。
       深一點點到 #0066cc(5.57 / 5.11),看起來還是同一個藍。 */
    --accent-rgb:0,102,204;
    --accent:#0066cc;
    --accent-dim:#004e9e;
    --on-accent:#ffffff;

    /* ⚠ 淺色的次要文字整體調深了一階。
       量過:原本的 --txt-faint #86868b 在白底是 3.62、在卡片底色是 3.33,
       低於一般文字要的 4.5。而它是這個網站用最兇的顏色 —— 每一個欄位標籤、
       每一個代號、每一句說明都是它。這是一個看錢的 App,而且多半在手機上、
       在白天看,看不清楚不是美觀問題。
       (Apple 自己在淺色底也是用比較深的一階,#86868b 那種是給灰底用的。) */
    --txt:#1d1d1f;
    --txt-dim:#545458;      /* 白底 6.9 */
    --txt-faint:#6e6e73;    /* 白底 5.07、卡片底 4.66 */
    --txt-faintest:#86868b; /* 只用在純裝飾性的地方 */

    /* ⚠ 台股是**紅漲綠跌**,跟 Apple / 美股相反。
       這個網站的使用者每天在券商 App 看到的就是「紅色 = 賺錢」——
       兩邊不一致比不好看嚴重得多:會在一秒之內把賺看成賠。

       --up / --down 從此只代表**漲跌損益**。
       跟漲跌無關的綠(市場開盤中、已連線、已持有)用 --ok,
       跟漲跌無關的紅(警告、刪除、載入失敗)用 --alert ——
       那兩個永遠不跟著翻,否則「警告」會變成綠色的。 */
    /* ⚠ 淺色的漲跌色也要調深。原本 #34c759 的綠在白底只有 **2.22**,
       是全站對比最差的顏色 —— 而它標的是「你today賠了多少」。
       紅的 #ff3b30 是 3.55,也不夠。兩個都換成 Apple 給淺色底用的深一階
       (systemRed/systemGreen 的 accessible 變體),深色模式維持原本的亮色。
       台股紅漲綠跌的方向沒有變。 */
    --up-rgb:215,0,21;       --up:#d70015;    /* 白底 5.38 */
    --down-rgb:8,127,63;     --down:#087f3f;  /* 白底 5.10 */
    --ok-rgb:8,127,63;       --ok:#087f3f;
    /* ⚠ --alert 以前跟 --up 是**同一個色碼** #ff3b30。
       註解寫著「跟漲跌無關的紅用 --alert」,但兩個長得一模一樣,所以那個
       區分在畫面上等於不存在:「集中度 96%」看起來就跟「+20% 獲利」一樣,
       而它其實是要你小心的意思。台股紅漲,紅色在這個網站已經被「賺錢」佔走了。
       改成琥珀色 —— 一眼就分得出「這是提醒」不是「這是賺的」。
       淺色用深一點的 #cc6600(白底對比 3.84,比原本的紅 3.55 還好讀),
       深色用亮一點的 #ff9f0a。 */
    /* 淺色的琥珀也要夠深才讀得到:#ff9500 在白底只有 2.20,
       而它是「⚠ 交易紀錄對不上」「合計 —— 要湊到 100%」這些提醒用的顏色,
       提醒看不清楚就不叫提醒。#b35309 是 5.05,而且拿來當底色配白字
       (那個「◈ 真實 / 模擬」的切換鈕)也從 2.20 變成 5.05。
       深色模式維持原本的亮橘,那裡本來就夠亮。 */
    --alert-rgb:179,83,9;    --alert:#b35309;   --alert-soft:#cc6600;
    /* 刪除類動作維持紅色 —— 那是「按下去東西會不見」的通用約定,
       跟「這個數字要注意」是兩件事,不該共用一個顏色。 */
    --danger-rgb:215,0,21;   --danger:#d70015;
    --amber-rgb:179,83,9;    --amber:#b35309;
    /* 白字配 #af52de 只有 4.13 —— 那是「模擬 / 真實」切換鈕選中時的樣子。
       深一階到 #8944ab 是 6.04,看起來還是同一個紫。 */
    --violet-rgb:137,68,171;
    --violet:#8944ab;        --violet-soft:#a765c4;
    --gold:#ffcc00;          --gold-soft:#ffe066;     --gold-deep:#b38600;
    --flare-rgb:255,149,0;

    /* 導覽列高度。手機要加上瀏海 / 狀態列的安全區。
       ⚠ 這一條掉了的話 var(--navh) 會變成無效值,整條 inset / top 宣告
         會被瀏覽器丟掉 —— #page 失去定位就縮成內容寬度(主頁右半邊會
         透出地球)、#left 跑到導覽列底下被切掉。改 :root 時要記得它。 */
    --navh:calc(45px + env(safe-area-inset-top, 0px));

    /* 底部分頁列的上緣,從畫面下緣往上量。桌機沒有那條,所以是 0 ——
       這樣地球那幾層浮動面板可以一律寫 calc(var(--tabtop) + N),
       不用為了桌機 / 手機各寫一份。手機的值在 @media 裡改。
       ⚠ 跟 --navh 一樣:這一行掉了,所有用到它的 bottom 會整條失效,
         面板會直接掉到畫面外。 */
    --tabtop:0px;

    --radius:12px;
    --radius-lg:18px;
    --radius-pill:980px;

    --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',
           'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;
  }

  /* 系統深色 */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#000000;
      --bg-deep:#1d1d1f;
      --panel-rgb:29,29,31;
      --panel:#1d1d1f;
      --panel-solid:#1d1d1f;
      --panel-float:#2c2c2e;
      --line:rgba(255,255,255,.12);
      --line-strong:rgba(255,255,255,.22);
      --hairline-rgb:255,255,255;
      --accent-rgb:41,151,255;
      --accent:#2997ff;
      --accent-dim:#1c6fbd;
      /* 深色模式的按鈕改成「亮底 + 深字」。
         白字配 #2997ff 只有 3.02 —— 那是「＋ 記錄買進」「✓ 儲存」這些
         最常按的鈕。同一個藍要同時當「深色底上的連結文字」(需要夠亮)
         和「按鈕底色配白字」(需要夠深),一個色碼做不到兩件事。
         深色主題本來就是亮底深字(Apple / Material 都是這樣),
         換過來之後藍、紅、琥珀、紫這四個當底色的鈕全部一次過關。 */
      --on-accent:#0b0e14;
      --txt:#f5f5f7;
      --txt-dim:#a1a1a6;
      --txt-faint:#86868b;
      --txt-faintest:#6e6e73;
      --up-rgb:255,69,58;      --up:#ff453a;
      --down-rgb:48,209,88;    --down:#30d158;
      --ok-rgb:48,209,88;      --ok:#30d158;
      --alert-rgb:255,159,10;  --alert:#ff9f0a;  --alert-soft:#ffb340;
      --danger-rgb:255,69,58;  --danger:#ff453a;
      --amber-rgb:255,159,10;  --amber:#ff9f0a;
      --violet-rgb:191,90,242; --violet:#bf5af2; --violet-soft:#d089f5;
    }
  }
  /* 明確選了深色:要蓋過系統的淺色設定 */
  :root[data-theme="dark"]{
      --bg:#000000;
      --bg-deep:#1d1d1f;
      --panel-rgb:29,29,31;
      --panel:#1d1d1f;
      --panel-solid:#1d1d1f;
      --panel-float:#2c2c2e;
      --line:rgba(255,255,255,.12);
      --line-strong:rgba(255,255,255,.22);
      --hairline-rgb:255,255,255;
      --accent-rgb:41,151,255;
      --accent:#2997ff;
      --accent-dim:#1c6fbd;
      /* 深色模式的按鈕改成「亮底 + 深字」。
         白字配 #2997ff 只有 3.02 —— 那是「＋ 記錄買進」「✓ 儲存」這些
         最常按的鈕。同一個藍要同時當「深色底上的連結文字」(需要夠亮)
         和「按鈕底色配白字」(需要夠深),一個色碼做不到兩件事。
         深色主題本來就是亮底深字(Apple / Material 都是這樣),
         換過來之後藍、紅、琥珀、紫這四個當底色的鈕全部一次過關。 */
      --on-accent:#0b0e14;
      --txt:#f5f5f7;
      --txt-dim:#a1a1a6;
      --txt-faint:#86868b;
      --txt-faintest:#6e6e73;
      --up-rgb:255,69,58;      --up:#ff453a;
      --down-rgb:48,209,88;    --down:#30d158;
      --ok-rgb:48,209,88;      --ok:#30d158;
      --alert-rgb:255,159,10;  --alert:#ff9f0a;  --alert-soft:#ffb340;
      --danger-rgb:255,69,58;  --danger:#ff453a;
      --amber-rgb:255,159,10;  --amber:#ff9f0a;
      --violet-rgb:191,90,242; --violet:#bf5af2; --violet-soft:#d089f5;
  }

  /* 地球那一頁跟著主題走。深色時面板要更透一點,讓底下的星空透出來;
     淺色時就是一般的實心卡片。 */
  :root[data-theme="dark"] body[data-route="globe"] .panel,
  body[data-route="globe"] .panel{ background:rgba(var(--panel-rgb),.78); }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);
    color:var(--txt);
    font-family:var(--sans);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- background layers ---------- */
  #stars{position:fixed;inset:0;pointer-events:none;z-index:0}
  /* ⚠ 這個 class 原本叫 .star,跟 UI 上的「☆ 關注」「✎ 改名」按鈕撞名 ——
     那些按鈕於是繼承了 position:absolute + 白色圓形背景,變成白點疊在文字上。
     星空是背景裝飾,改成一個不可能被 UI 拿去用的名字。 */
  .sky-dot{position:absolute;background:#fff;border-radius:50%;animation:tw 4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:.75}}
  /* 經緯格線與掃描線是科幻 HUD 的語言,Apple 的深色區塊是乾淨的黑。
     兩個都關掉,只留星空當景深。 */
  #grid,#scan{display:none}
  #grid{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:64px 64px;
    opacity:.10;
    mask-image:radial-gradient(ellipse at 50% 50%,#000 10%,transparent 78%);
    -webkit-mask-image:radial-gradient(ellipse at 50% 50%,#000 10%,transparent 78%);
  }
  #scan{
    position:fixed;inset:0;z-index:60;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(var(--accent-rgb),.030) 0 1px,transparent 1px 3px);
    mix-blend-mode:screen;
  }
  /* 暗角。原本是 240px/40px/.85,壓得很深 —— 而面板全都貼在螢幕邊緣,
     等於把最需要讀的地方蓋掉。這裡只留很淡的一層維持景深,
     spread 也歸零(spread 會讓陰影從邊界往內「實心」推,是邊緣死黑的主因)。 */
  #vignette{position:fixed;inset:0;z-index:59;pointer-events:none;
    box-shadow:inset 0 0 120px 0 rgba(0,0,0,.26)}

  #globeViz{position:fixed;inset:0;z-index:2}

  /* ---------- HUD chrome ---------- */
  /* ═══════════════════════════════════════════════════════════
     路由與分頁
     -----------------------------------------------------------
     地球是 WebGL,容器一旦 display:none 就會量到 0×0,再顯示時
     整個壞掉。所以地球**永遠掛在原地當固定背景不動** ——
     其他分頁是一層不透明的容器蓋在它上面,只有 #/globe 這一頁
     把容器變透明,讓地球露出來。這樣零風險,globe.gl 一行都不用改。
     ═══════════════════════════════════════════════════════════ */
  #topnav{
    position:fixed;top:0;left:0;right:0;z-index:80;display:flex;align-items:stretch;
    padding-top:env(safe-area-inset-top, 0px);
    background:rgba(var(--panel-rgb),.72);border-bottom:1px solid var(--line);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    overflow-x:auto;scrollbar-width:none;
  }
  #topnav::-webkit-scrollbar{display:none}
  #topnav .nbrand{
    font-size:15px;font-weight:600;letter-spacing:-.02em;color:var(--txt);
    padding:12px 18px 12px 4px;white-space:nowrap;flex:0 0 auto;cursor:pointer;
  }
  #topnav a{
    font-size:12.5px;padding:12px 13px;color:var(--txt-dim);text-decoration:none;
    white-space:nowrap;flex:0 0 auto;transition:.2s;letter-spacing:-.005em;
  }
  #topnav a:hover{color:var(--txt)}
  #topnav a.on{color:var(--txt);font-weight:600}
  #topnav a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  /* 用鍵盤操作時要看得出焦點在哪 —— 這些都是 <span> 做的按鈕,
     瀏覽器不會自動給它們焦點樣式。 */
  /* ⚠ 這一段的樣式本來就寫好了,但那些 <span> 沒有 tabindex —— 焦點根本
     走不到它們身上,所以這條規則從來沒生效過。現在由 armKeyboard() 在每次
     重繪之後補上 tabindex(標記成 data-kbd),樣式才真的用得到。 */
  [role="button"]:focus-visible,.pf-btn:focus-visible,.skb:focus-visible,
  .mtab:focus-visible,.gchip:focus-visible,[data-kbd]:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
  /* 表格列拿不到圓角外框(會被 overflow 切掉),改用底色標示 */
  tr[data-kbd]:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  #topnav .nsp{flex:1;min-width:6px}
  #topnav .nic{font-size:14px;padding:12px 11px;color:var(--txt-faint);cursor:pointer;
    flex:0 0 auto;transition:.2s}
  #topnav .nics{display:flex;align-items:stretch;flex:0 0 auto}
  #topnav .nic:hover{color:var(--accent)}

  /* ---------- 底部分頁列(只有手機看得到) ----------
     桌機用不到:上面那條放得下全部七頁,再多一條只是佔位置。 */
  #tabbar{display:none}
  #moreSheet[hidden]{display:none}

  /* 文件型分頁的捲動容器。蓋住地球,所以要不透明。 */
  #page{
    position:fixed;inset:var(--navh) 0 0;z-index:22;overflow-y:auto;
    background:var(--bg);-webkit-overflow-scrolling:touch;
  }
  .pg{max-width:1024px;margin:0 auto;padding:40px 22px 88px}
  .pg-hd{margin-bottom:28px}
  .pg-hd h1{font-size:clamp(28px,4.6vw,40px);margin:0;font-weight:600;
    letter-spacing:-.025em;line-height:1.08;text-wrap:balance}
  .pg-hd .sub{display:block;font-size:15px;color:var(--txt-faint);margin-top:8px;
    letter-spacing:-.01em}

  /* 地球那一頁:容器透明、不吃點擊,讓底下的地球與原本的浮動面板照舊運作 */
  body[data-route="globe"] #page{background:transparent;pointer-events:none}
  body[data-route="globe"] #page > *{pointer-events:auto}

  /* 地球專用的浮動面板,只有在地球那一頁才出現。
     ⚠ 一定要寫成 body:not(...) 的形式:
       `#top,#left,…{display:none}` 的優先權跟後面的 `#top{…}` 一樣是 (1,0,0),
       但排在前面,所以會被後面那條蓋掉 —— 等於完全沒作用。
     ⚠ 而且**不能**反過來硬設 display:flex:#left 原本沒有 display(是 block),
       強制 flex 之後子元素從直排變橫排,整個左欄會散開。
       只在「不是地球頁」時 display:none,其餘讓它保持原本的值。 */
  /* 地球載不到時,它的控制列不該還留在畫面上 —— 按了不會有任何事,
     而且會壓在說明文字上。 */
  body[data-globe="down"] #top,
  body[data-globe="down"] #left,
  body[data-globe="down"] #right,
  body[data-globe="down"] #bot,
  body[data-globe="down"] #skin,
  body[data-globe="down"] #pfBtn,
  body[data-globe="down"] #newsBtn{display:none}

  body:not([data-route="globe"]) #top,
  body:not([data-route="globe"]) #view,
  body:not([data-route="globe"]) #left,
  body:not([data-route="globe"]) #right,
  body:not([data-route="globe"]) #bot,
  body:not([data-route="globe"]) #skin,
  body:not([data-route="globe"]) #gapNote{display:none}
  /* 國家提示框的 z-index 是 40,而 #page 是 22 —— 它會浮在每一頁的內容上面。
     沒有這一條的話,在地球上滑過某個國家留下的那個框會跟著滑鼠出現在
     持倉、交易日誌、帝國每一頁上,而且因為地球在背後繼續自轉,框裡的國名
     還會自己一直換 —— 看起來就像「我明明沒開地球,卻一直點到國家」。 */
  body:not([data-route="globe"]) #tip{display:none}
  /* 星空 / 掃描線 / 暗角只在地球頁畫,其他頁是純色底,留著只會透出來 */
  body:not([data-route="globe"]) #stars,
  body:not([data-route="globe"]) #grid,
  body:not([data-route="globe"]) #scan,
  body:not([data-route="globe"]) #vignette{display:none}

  .panel{
    position:fixed;z-index:20;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    overflow:hidden;
  }
  /* 面板四角原本有科幻感的直角括號。Apple 的語言裡沒有這種東西 ——
     分層靠圓角與底色明暗,不靠裝飾線。整個拿掉。 */

  .ttl{
    font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:-.01em;
    color:var(--txt);padding:13px 16px 11px;display:flex;align-items:center;gap:8px;
    border-bottom:1px solid var(--line);
  }
  .ttl .dot{width:5px;height:5px;background:var(--accent);border-radius:50%;
    box-shadow:0 0 8px var(--accent);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  /* Apple 的數字用 SF Pro 加 tabular-nums 對齊,不是換成等寬字體 ——
     等寬字在中文介面裡看起來像終端機。 */
  .num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1;letter-spacing:-.01em}
  .up{color:var(--up)} .down{color:var(--down)}

  /* ---------- top bar ---------- */
  #top{top:calc(var(--navh) + 12px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:0;
       padding:0;z-index:22}
  #top .brand{
    font-family:var(--mono);font-size:13px;letter-spacing:.42em;color:var(--accent);
    padding:11px 20px;border-right:1px solid var(--line);text-shadow:0 0 14px rgba(var(--accent-rgb),.6);
  }
  .modes{display:flex}
  .mode{
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--txt-dim);
    padding:11px 16px;cursor:pointer;border-right:1px solid var(--line);
    transition:.18s;white-space:nowrap;user-select:none;
  }
  .mode:last-child{border-right:0}
  .mode:hover{color:var(--txt);background:rgba(var(--accent-rgb),.06)}
  .mode.on{color:var(--on-accent);background:var(--accent);text-shadow:none}
  .mode.sim.on{background:var(--amber)}

  /* ---------- 雙軌視角切換 ---------- */
  #view{
    top:16px;right:16px;display:flex;align-items:center;padding:0;z-index:22;
    opacity:0;pointer-events:none;transition:opacity .3s;
  }
  #view.show{opacity:1;pointer-events:auto}
  #view .vlab{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--txt-dim);
    padding:11px 12px;border-right:1px solid var(--line);white-space:nowrap}
  .vbtn{
    font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--txt-dim);
    padding:11px 14px;cursor:pointer;border-right:1px solid var(--line);
    transition:.18s;white-space:nowrap;user-select:none;
  }
  .vbtn:last-child{border-right:0}
  .vbtn:hover{color:var(--txt);background:rgba(var(--accent-rgb),.06)}
  .vbtn.on{color:var(--on-accent);background:var(--accent)}
  .vbtn[data-view="world"].on{background:var(--violet);color:var(--on-accent)}
  #gapNote{
    position:fixed;bottom:74px;right:16px;z-index:21;width:322px;
    font-family:var(--sans);font-size:11px;line-height:1.65;color:var(--txt-dim);
    background:rgba(var(--panel-rgb),.85);border:1px solid rgba(var(--violet-rgb),.35);
    border-left:2px solid var(--violet);padding:9px 12px;backdrop-filter:blur(10px);
    opacity:0;transform:translateY(-6px);transition:.35s;pointer-events:none;
  }
  #gapNote.show{opacity:1;transform:none}
  #gapNote b{color:var(--violet-soft);font-weight:400}

  /* ---------- 原料 / 匯率分頁 ---------- */
  .mtabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;
    background:rgba(var(--panel-rgb),.95);backdrop-filter:blur(8px);z-index:3}
  .mtab{flex:1;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    color:var(--txt-dim);padding:9px 0;cursor:pointer;transition:.18s;
    border-right:1px solid var(--line)}
  .mtab:last-child{border-right:0}
  .mtab:hover{color:var(--txt);background:rgba(var(--accent-rgb),.06)}
  .mtab.on{color:var(--on-accent);background:var(--accent)}
  .cd-lv.up{color:var(--up)} .cd-lv.down{color:var(--down)}
  .chip[data-cf]{cursor:pointer}
  .chip[data-cf]:hover{background:rgba(var(--hairline-rgb),.08)}

  /* ---------- 沙盤推演 ---------- */
  .sim-wrap{padding:13px 14px}
  .sim-kv{display:flex;justify-content:space-between;align-items:baseline;
    font-family:var(--mono);font-size:11px;margin-bottom:4px}
  .sim-kv span:first-child{color:var(--txt-dim);font-size:10px;letter-spacing:.1em}
  .sim-big{font-family:var(--mono);font-size:25px;letter-spacing:-.5px;margin:2px 0 1px}
  .sim-arrow{color:var(--txt-dim);font-family:var(--mono);font-size:11px;margin:0 5px}
  select.scn-sel{
    width:100%;margin-top:4px;background:rgba(var(--bg-deep-rgb),.9);color:var(--txt);
    border:1px solid var(--line-strong);font-family:var(--mono);font-size:10.5px;
    padding:7px 8px;outline:none;cursor:pointer;appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--accent) 50%),
                     linear-gradient(135deg,var(--accent) 50%,transparent 50%);
    background-position:calc(100% - 14px) 13px,calc(100% - 9px) 13px;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  }
  select.scn-sel optgroup{background:var(--bg-deep);color:var(--txt-dim)}
  select.scn-sel option{background:var(--bg-deep);color:var(--txt)}
  .sl-row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;
    padding:8px 0 9px;border-bottom:1px solid rgba(var(--accent-rgb),.09)}
  .sl-row .n{font-size:12px}
  .sl-row .n .px{display:block;font-family:var(--mono);font-size:8.5px;color:var(--txt-faint);
    letter-spacing:.04em;margin-top:1px}
  .sl-row .v{font-family:var(--mono);font-size:11px;text-align:left;color:var(--accent)}
  .sl-row .v.zero{color:var(--txt-dim)}
  .sl-row .d{font-family:var(--mono);font-size:9px;color:var(--amber);text-align:right;letter-spacing:.06em}
  /* 手動輸入 + 單位切換 */
  .qin{display:flex;align-items:stretch;border:1px solid var(--line-strong)}
  .qin .qnum{width:74px;background:rgba(var(--bg-deep-rgb),.9);border:0;color:var(--txt);
    font-family:var(--mono);font-size:11.5px;padding:4px 5px;text-align:right;outline:none;
    -moz-appearance:textfield;appearance:textfield}
  .qin .qnum::-webkit-outer-spin-button,.qin .qnum::-webkit-inner-spin-button{
    -webkit-appearance:none;margin:0}
  .qin .qnum:focus{background:rgba(var(--accent-rgb),.10)}
  .qin .usel{background:rgba(var(--accent-rgb),.10);border:0;border-left:1px solid var(--line-strong);
    color:var(--accent);font-family:var(--mono);font-size:10px;padding:0 4px;outline:none;cursor:pointer}
  .qin .usel option{background:var(--bg-deep);color:var(--txt)}
  .sl-row input[type=range]{grid-column:1/-1;width:100%;margin:5px 0 0;height:3px;
    -webkit-appearance:none;appearance:none;background:rgba(var(--accent-rgb),.16);outline:none;cursor:pointer}
  .sl-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:11px;height:11px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 9px var(--accent);cursor:pointer}
  .sl-row input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;
    background:var(--accent);box-shadow:0 0 9px var(--accent);cursor:pointer}
  .sl-row.added input[type=range]::-webkit-slider-thumb{background:var(--amber);box-shadow:0 0 9px var(--amber)}
  .sl-row.added input[type=range]::-moz-range-thumb{background:var(--amber);box-shadow:0 0 9px var(--amber)}
  .sim-btn{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--accent);
    border:1px solid var(--line-strong);padding:7px 0;text-align:center;cursor:pointer;
    transition:.15s;margin-top:11px;
  }
  .sim-btn:hover{background:rgba(var(--accent-rgb),.1)}
  .xrow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;
    padding:4px 0;border-bottom:1px solid rgba(var(--accent-rgb),.07)}
  .xrow .to{color:var(--txt)}
  .xrow .up2{color:var(--amber)} .xrow .dn2{color:var(--accent)}

  /* ---------- left: portfolio ---------- */
  /* 左欄可拖曳、可縮放。resize 要生效,overflow 不能是 visible。
     min/max 是防呆:縮到看不見或撐爆畫面都救不回來。 */
  #left{top:calc(var(--navh) + 76px);left:20px;width:300px;
    resize:both;overflow:auto;
    min-width:236px;max-width:min(620px,94vw);
    min-height:150px;max-height:min(86vh,900px)}
  #left > .ttl{cursor:move;user-select:none;-webkit-user-select:none;
    position:sticky;top:0;z-index:6;background:rgba(var(--panel-rgb),.97)}
  #left.dragging{transition:none;opacity:.94;
    box-shadow:0 18px 60px rgba(0,0,0,.18),0 0 0 1px var(--line)}
  /* 右下角那個縮放把手,瀏覽器預設畫得很淡,補一個看得見的角標 */
  #left::after{content:'';position:absolute;right:1px;bottom:1px;
    width:12px;height:12px;border:1px solid var(--accent);
    border-left:0;border-top:0;opacity:.85;pointer-events:none}
  /* 標題列已經很擠(NT$/US$/1/萬/億),提示只留一個符號,說明放 title 屬性 */
  .grip{font-size:9px;color:var(--txt-dim);opacity:.5;transition:.15s}
  #left:hover .grip{opacity:.95;color:var(--accent)}
  .nav-box{padding:14px 14px 12px}
  .nav-lab{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--txt-dim)}
  .nav-val{font-family:var(--mono);font-size:30px;letter-spacing:-.5px;margin-top:2px;
           text-shadow:0 0 22px rgba(var(--accent-rgb),.35)}
  .nav-chg{font-family:var(--mono);font-size:12px;margin-top:4px;display:flex;gap:10px;align-items:center}
  .spark{height:42px;margin-top:5px;display:block;width:100%}

  /* 幣別 / 金額單位切換 */
  .tog-wrap{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
  .mu-set{display:flex;gap:0;border:1px solid var(--line)}
  .cu{font-family:var(--mono);font-size:9px;padding:2px 6px;color:var(--txt-dim);
    cursor:pointer;border-right:1px solid var(--line);transition:.15s;letter-spacing:0}
  .cu:last-child{border-right:0}
  .cu:hover{color:var(--txt)}
  .cu.on{background:var(--accent);color:var(--on-accent)}

  /* 走勢圖切換 */
  .spark-hd{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
  .sp-tabs{display:flex;border:1px solid var(--line)}
  .sp{font-family:var(--mono);font-size:8.5px;padding:2px 6px;color:var(--txt-dim);
    cursor:pointer;border-right:1px solid var(--line);transition:.15s}
  .sp:last-child{border-right:0}
  .sp:hover{color:var(--txt)}
  .sp.on{background:rgba(var(--accent-rgb),.22);color:var(--accent)}
  .sp-rng{font-size:8.5px;color:var(--txt-dim);letter-spacing:.04em}

  /* 市場開盤狀態 */
  .mkt{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    background:rgba(var(--accent-rgb),.03)}
  .mk{flex:1;padding:6px 4px;text-align:center;font-family:var(--mono);font-size:8.5px;
    color:var(--txt-dim);border-right:1px solid rgba(var(--accent-rgb),.12);line-height:1.5}
  .mk:last-child{border-right:0}
  .mk b{display:block;font-weight:400;font-size:9.5px;color:var(--txt-dim);letter-spacing:.08em}
  .mk.open b{color:var(--ok)}
  .mk .dt{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--txt-faint);
    margin-right:3px;vertical-align:1px}
  .mk.open .dt{background:var(--ok);box-shadow:0 0 6px var(--ok);animation:pulse 1.6s infinite}
  .mk.live{cursor:pointer;color:var(--accent)}
  .mk.live:hover{background:rgba(var(--accent-rgb),.1)}
  .mk.live.on{background:rgba(var(--ok-rgb),.14);color:var(--ok)}
  .mk.qb{cursor:pointer;color:var(--amber);flex:0 0 44px}
  .mk.qb:hover{background:rgba(var(--amber-rgb),.14)}
  .mk.qb b{color:var(--amber)}

  /* 報價來源狀態 */
  .qs-row{padding:8px 0;border-bottom:1px solid rgba(var(--accent-rgb),.1)}
  .qs-a{display:flex;align-items:center;gap:8px}
  .qs-nm{font-size:12.5px}
  .qs-st{font-family:var(--mono);font-size:9.5px;margin-left:auto}
  .qs-b{font-family:var(--mono);font-size:9px;color:var(--txt-dim);margin-top:4px;padding-left:14px}
  .qs-at{font-family:var(--mono);font-size:9.5px;color:var(--txt-dim);letter-spacing:.06em}

  /* 更新標示 */
  .nb{font-family:var(--mono);font-size:7.5px;letter-spacing:.1em;padding:1px 4px;
    background:var(--accent);color:var(--on-accent);margin-left:5px;vertical-align:1px;
    animation:nbp 1.8s ease-in-out infinite}
  @keyframes nbp{0%,100%{opacity:1}50%{opacity:.5}}
  .upd{padding:11px 14px;border-bottom:1px solid var(--line);
    background:linear-gradient(90deg,rgba(var(--accent-rgb),.09),transparent)}
  .upd-hd{display:flex;justify-content:space-between;align-items:center;
    font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--accent)}
  .upd-rst{color:var(--txt-dim);cursor:pointer;font-size:8.5px;letter-spacing:.06em}
  .upd-rst:hover{color:var(--accent)}
  .upd-li{font-size:11.5px;line-height:1.7;margin-top:6px;color:var(--txt-dim)}
  .upd-li b{color:var(--txt);font-weight:400}
  .upd-li i{font-style:normal;color:var(--accent)}
  .upd-none{font-size:11px;color:var(--txt-dim);margin-top:6px}
  .flash{animation:fl .8s ease-out}
  @keyframes fl{0%{background:rgba(var(--accent-rgb),.35)}100%{background:transparent}}
  .ni.new{border-left:2px solid var(--accent);background:rgba(var(--accent-rgb),.045)}
  .mu{font-family:var(--mono);font-size:9px;padding:2px 7px;color:var(--txt-dim);
    cursor:pointer;border-right:1px solid var(--line);transition:.15s;letter-spacing:0}
  .mu:last-child{border-right:0}
  .mu:hover{color:var(--txt)}
  .mu.on{background:var(--accent);color:var(--on-accent)}

  /* 未實現損益 */
  .pl-box{margin-top:9px;padding-top:8px;border-top:1px solid rgba(var(--accent-rgb),.14)}
  .pl-lab{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--txt-dim)}
  .pl-val{font-family:var(--mono);font-size:17px;margin-top:2px}
  .pl-pct{font-size:11px;opacity:.8;margin-left:6px}

  .holds{max-height:min(38vh,320px);overflow-y:auto;border-top:1px solid var(--line)}
  .hold{
    display:grid;grid-template-columns:1fr auto;gap:2px 8px;
    padding:8px 14px;border-bottom:1px solid rgba(var(--accent-rgb),.09);
    cursor:pointer;transition:.15s;position:relative;
  }
  .hold .pl-row{grid-column:1/-1;font-family:var(--mono);font-size:9.5px;
    margin-top:3px;letter-spacing:.03em;overflow:hidden}
  .ccy-tag{font-family:var(--mono);font-size:8px;border:1px solid currentColor;
    padding:0 3px;margin-left:4px;opacity:.7}
  .hold:hover{background:rgba(var(--accent-rgb),.07)}
  .hold.sel{background:rgba(var(--accent-rgb),.13)}
  .hold.sel::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent);
    box-shadow:0 0 10px var(--accent)}
  .hold .nm{font-size:12.5px}
  .hold .tk{font-family:var(--mono);font-size:9.5px;color:var(--txt-dim);letter-spacing:.06em}
  .hold .vl{font-family:var(--mono);font-size:12px;text-align:right}
  .hold .cg{font-family:var(--mono);font-size:10px;text-align:right}
  .hold.dim{opacity:.3}
  .hold.watch .nm{color:var(--txt-dim)}
  .hold.watch .vl{color:var(--txt-dim)}
  .hold.watch .tk{color:var(--txt-faint)}
  .sub-hd{
    font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--txt-dim);
    padding:8px 14px 5px;background:rgba(var(--accent-rgb),.04);
    border-top:1px solid var(--line);border-bottom:1px solid rgba(var(--accent-rgb),.09);
  }
  .sub-hd:first-child{border-top:none}

  /* ---------- right: region / news ---------- */
  #right{top:calc(var(--navh) + 76px);right:20px;width:326px;display:flex;flex-direction:column;
         max-height:calc(100vh - 190px)}
  .rgn{padding:13px 14px;border-bottom:1px solid var(--line)}
  .rgn-nm{font-size:17px;letter-spacing:.04em}
  .rgn-sub{font-family:var(--mono);font-size:9.5px;color:var(--txt-dim);letter-spacing:.14em;margin-top:3px}
  .expo{margin-top:11px}
  .expo-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;margin-bottom:5px}
  .bar{height:5px;background:rgba(var(--accent-rgb),.12);position:relative;overflow:hidden}
  .bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--accent-dim),var(--accent));
         box-shadow:0 0 12px var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .bar.warn i{background:linear-gradient(90deg,var(--gold-deep),var(--amber));box-shadow:0 0 12px var(--amber)}
  .expo-note{font-size:11px;color:var(--txt-dim);margin-top:8px;line-height:1.6}
  .expo-note b{color:var(--amber);font-weight:400}

  .news{overflow-y:auto;flex:1}
  .ni{padding:11px 14px;border-bottom:1px solid rgba(var(--accent-rgb),.09);cursor:pointer;transition:.15s}
  .ni:hover{background:rgba(var(--accent-rgb),.07)}
  /* ⚠ flex-wrap 不能拿掉:沒有它的話,擠不下時每個子元素會被壓成最小寬度,
     中文會變成一個字一行(「比 特 幣」直著排)。子元素再各自 nowrap。 */
  .ni .meta{font-family:var(--mono);font-size:9px;color:var(--txt-dim);letter-spacing:.1em;
            display:flex;flex-wrap:wrap;gap:3px 8px;margin-bottom:4px;align-items:center}
  .ni .meta > *{flex:0 0 auto;white-space:nowrap}
  .sev{width:6px;height:6px;border-radius:50%}
  .ni .hl{font-size:12.5px;line-height:1.5}
  .ni .im{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:9px;padding:2px 6px;border:1px solid currentColor;opacity:.85}
  .empty{padding:22px 14px;font-size:11.5px;color:var(--txt-dim);text-align:center;line-height:1.7}

  /* ---------- bottom: brief ---------- */
  #bot{bottom:16px;left:16px;right:16px;display:flex;align-items:stretch}
  .bi{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--accent);
      padding:12px 15px;border-right:1px solid var(--line);white-space:nowrap;display:flex;align-items:center;gap:7px}
  /* flex:1 + min-width:0 缺一不可。少了 min-width:0,flex 子元素的最小寬度是
     內容寬度,一長串中文會直接把整條面板撐出畫面。 */
  .bi{flex:0 0 auto}
  .btxt{padding:12px 16px;font-size:12.5px;line-height:1.55;color:var(--txt);
        flex:1 1 auto;min-width:0;overflow:hidden;display:flex;align-items:center}
  .cursor{display:inline-block;width:7px;height:14px;background:var(--accent);margin-left:3px;
          animation:blink 1s steps(2) infinite;vertical-align:-2px}
  @keyframes blink{50%{opacity:0}}

  /* ---------- 地球外觀切換 ---------- */
  /* 多了「光柱」那組之後這排會變長,窄一點的螢幕要能橫向捲,不要撐爆版面 */
  #skin{bottom:74px;left:16px;display:flex;padding:0;z-index:22;
    max-width:calc(100vw - 32px);overflow-x:auto;scrollbar-width:none}
  #skin::-webkit-scrollbar{display:none}
  #skin .vlab,#skin .skb{flex:0 0 auto;white-space:nowrap}
  .skb.cm.on{background:var(--accent);color:var(--on-accent)}
  .skb.bl.on{background:var(--accent);color:var(--on-accent)}
  #skin .vlab.bl-lab{border-left:1px solid var(--line)}

  /* 國家新聞數徽章。pointer-events:none —— 這是標籤不是按鈕,
     擋到拖曳的話整顆地球會變得很難轉。 */
  .nbadge{
    pointer-events:none;transform:translate(-50%,-50%);text-align:center;
    font-family:var(--mono);line-height:1.15;white-space:nowrap;
    padding:4px 8px;border-radius:var(--radius);
    background:rgba(var(--panel-rgb),.82);border:1px solid var(--line);
    backdrop-filter:saturate(180%) blur(10px);
    -webkit-backdrop-filter:saturate(180%) blur(10px);
  }
  .nbadge b{display:block;font-size:13px;font-weight:600;color:var(--txt)}
  .nbadge em{display:block;font-style:normal;font-size:8.5px;letter-spacing:.08em;
    color:var(--txt-faint);margin-top:1px}
  .nbadge i{display:block;font-style:normal;font-size:8.5px;letter-spacing:.06em;
    color:var(--accent);margin-top:2px}
  .nbadge.mine{border-color:rgba(var(--accent-rgb),.55)}
  #skin .vlab{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--txt-dim);
    padding:9px 11px;border-right:1px solid var(--line)}
  .skb{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--txt-dim);
    padding:9px 12px;cursor:pointer;border-right:1px solid var(--line);transition:.18s}
  .skb:last-child{border-right:0}
  .skb:hover{color:var(--txt);background:rgba(var(--accent-rgb),.06)}
  .skb.on{background:var(--accent);color:var(--on-accent)}
  /* 隱私循環鈕:平常是暗的,一旦不是「真實」就用紫色亮起來 ——
     金額被遮住的時候必須一眼看得出來,不然會以為網站壞了。 */
  /* 新聞面板上的連續播放列(原本的「影響鏈回放」模式) */
  .flowbar{display:flex;align-items:center;gap:10px;padding:8px 14px;
    border-bottom:1px solid var(--line);background:rgba(var(--accent-rgb),.04)}
  .fb-btn{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--accent);
    border:1px solid var(--line);border-radius:3px;padding:5px 10px;cursor:pointer;
    white-space:nowrap;transition:.18s}
  .fb-btn:hover{background:rgba(var(--accent-rgb),.1)}
  .fb-btn.on{background:var(--amber);border-color:var(--amber);color:var(--on-accent)}
  .fb-note{font-size:10px;color:var(--txt-dim);line-height:1.35}
  /* 交易日誌卡片牆 */
  .jn-wall{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .jn-c{background:var(--panel);border-radius:var(--radius-lg);overflow:hidden;
    cursor:pointer;transition:.2s}
  .jn-c:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.10)}
  .jn-spark{display:block;width:100%;height:76px;background:var(--bg-deep)}
  /* 沒有走勢圖時原本會留一個 76px 的灰底空盒子。那塊不帶任何資訊,卻讓手機上
     一個畫面只放得下兩張卡 —— 要多捲三倍才看得完同樣的東西。
     現在那句話併進卡片底下的說明列(跟「1 筆買進 · 已抱 171 天」同一行),
     所以這條規則沒有用到的地方了,留著只是備忘為什麼不再有那個盒子。 */
  .jn-b1{padding:12px 14px 0;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
  .jn-nm{font-size:15px;font-weight:600;letter-spacing:-.015em}
  .jn-b1 .tk{font-family:var(--mono);font-size:11px;color:var(--txt-faint)}
  .jn-b2{padding:7px 14px 0;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .jn-b{font-size:11px;padding:2px 9px;border-radius:var(--radius-pill);font-weight:600}
  .jn-b.hold{background:rgba(var(--accent-rgb),.14);color:var(--accent)}
  .jn-b.out{background:rgba(var(--hairline-rgb),.09);color:var(--txt-faint)}
  .jn-pl{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;
    letter-spacing:-.02em}
  .jn-b2 .jn-m{margin-left:auto;font-size:13px;color:var(--txt-faint);
    font-variant-numeric:tabular-nums}
  .jn-b3{padding:8px 14px 0;font-size:12px;color:var(--txt-faint);line-height:1.5}
  .jn-b3:last-child{padding-bottom:14px}

  /* 決策紀錄:一筆交易一張,標籤旁邊多一段「當時你怎麼想」 */
  .dc{background:var(--panel);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:12px}
  .dc-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:7px}
  .dc-nm{font-size:14px;font-weight:600}
  .dc-h .tk{font-family:var(--mono);font-size:10.5px;color:var(--txt-faint)}
  .dc-meta{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--txt-faint)}
  .dc-ta{width:100%;box-sizing:border-box;background:rgba(var(--hairline-rgb),.06);
    border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:9px 11px;
    font-family:inherit;font-size:12.5px;line-height:1.6;resize:vertical;min-height:64px}
  .dc-ta:focus{outline:none;border-color:var(--accent);background:rgba(var(--accent-rgb),.07)}
  .dc-ta::placeholder{color:var(--txt-faint)}
  /* ⚠ 「這筆之後走了 +3.72%」後面的 ✓ / ✗ 是在講**決策對不對**,不是漲跌。
     原本整句套 .up / .down —— 於是「賣掉之後它又漲了」(決策錯)會被畫成綠色,
     而這個網站綠色是「跌」。畫面上就變成一個綠色的 +3.72%,顏色跟數字互相打架。
     現在數字維持一般文字色(對賣出來說那根本不是你的損益,是你走了之後它的走勢),
     只有 ✓ / ✗ 用 --ok / --alert —— 那兩個本來就是「跟漲跌無關」的語意色。 */
  .dc-ok{color:var(--ok);font-weight:500}
  .dc-no{color:var(--alert);font-weight:500}
  .dc-lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--txt-dim);
    margin:10px 0 5px}
  .dc-act{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap;align-items:center}
  .dc-msg{font-size:11px;color:var(--txt-dim)}
  /* AI 評分結果。分數本身不上色 —— 顏色留給「後來賺賠」,免得看起來像在預測賺賠 */
  .dc-ai{margin-top:11px;padding:11px 13px;border-radius:10px;
    background:rgba(var(--accent-rgb),.06);border:1px solid rgba(var(--accent-rgb),.16)}
  .dc-ai-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .dc-score{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.02em}
  .dc-grade{font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:2px 8px;
    border-radius:var(--radius-pill);border:1px solid currentColor}
  .dc-at{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--txt-faint)}
  .dc-verdict{font-size:12.5px;line-height:1.6;margin-top:7px}
  .dc-list{margin-top:7px;font-size:12px;line-height:1.65;color:var(--txt-dim)}
  .dc-list b{font-weight:600;color:var(--txt)}
  .dc-ask{margin-top:8px;padding-top:8px;border-top:1px solid rgba(var(--accent-rgb),.14);
    font-size:12px;line-height:1.6;color:var(--accent)}

  /* 配息頁的說明區塊 */
  /* ---------- 新聞牆 ---------- */
  .nw-wall{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(268px,1fr))}
  .nw-c{background:var(--panel);border-radius:var(--radius-lg);padding:16px 17px 14px;
    display:flex;flex-direction:column;gap:9px;cursor:pointer;transition:.2s;
    border:1px solid transparent}
  .nw-c:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.10)}
  .nw-c.mine{border-color:rgba(var(--accent-rgb),.28)}
  .nw-hd{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:11px;
    color:var(--txt-faint)}
  .nw-hd > *{flex:0 0 auto;white-space:nowrap}
  .nw-t{font-size:14.5px;line-height:1.5;letter-spacing:-.012em;color:var(--txt);
    font-weight:500}
  .nw-tk{font-size:12px;color:var(--txt-dim);display:flex;flex-wrap:wrap;gap:6px;
    align-items:baseline}
  .nw-r{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);
    display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .nw-r .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;
    letter-spacing:-.02em}
  .nw-r .n{font-size:11.5px;color:var(--txt-faint);line-height:1.45}
  .nw-r.wait{color:var(--txt-faint);font-size:11.5px;line-height:1.5;display:block}
  .nw-ext{margin-left:auto;font-size:11px;color:var(--accent);text-decoration:none;
    flex:0 0 auto}

  .dv-note{background:var(--panel);border-radius:var(--radius);padding:16px 18px;
    margin-top:12px;font-size:13px;color:var(--txt-dim);line-height:1.6;
    letter-spacing:-.005em}
  .dv-note b{color:var(--txt);font-weight:600}

  /* 貼上對帳單 */
  .ps{background:var(--panel);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:18px}
  .ps-ta{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;
    color:var(--txt);font-family:var(--mono);font-size:12.5px;padding:11px 12px;
    outline:none;resize:vertical;line-height:1.6}
  .ps-ta:focus{border-color:var(--accent)}
  .ps-hd{font-size:13.5px;color:var(--txt-dim);margin-top:14px;letter-spacing:-.005em}
  .ps-hd b{color:var(--txt)}

  /* 同業五維雷達 */
  .radar-wrap{display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap}
  .radar{width:156px;height:152px;flex:0 0 auto}
  .radar-list{flex:1 1 240px;min-width:0}

  /* ---------- 主頁 ---------- */
  .kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
  .kpi .k{background:var(--panel);border-radius:var(--radius-lg);
    padding:20px 20px 18px;min-width:0}
  .kpi .lab{font-size:12px;color:var(--txt-faint);letter-spacing:-.005em}
  .kpi .val{font-size:28px;margin-top:8px;line-height:1.1;font-weight:600;
    letter-spacing:-.028em;font-variant-numeric:tabular-nums;
    word-break:break-word;color:var(--txt)}
  /* ⚠ 這兩條一定要留著:上面那條 .kpi .val 有 color,優先權 (0,2,0) 比
     .up / .down 的 (0,1,0) 高,不補這兩條的話 KPI 數字永遠是黑的。 */
  .kpi .val.up{color:var(--up)} .kpi .val.down{color:var(--down)}
  .kpi .sub{font-size:12px;color:var(--txt-faint);margin-top:6px;
    font-variant-numeric:tabular-nums;line-height:1.45;letter-spacing:-.005em}

  .hm-sec{font-size:21px;font-weight:600;letter-spacing:-.02em;color:var(--txt);
    margin:40px 0 14px;display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
  .hm-sec .stag{font-size:13px;font-weight:400;color:var(--txt-faint);
    letter-spacing:-.005em}

  .hm-ex{background:rgba(var(--accent-rgb),.08);border-radius:var(--radius-lg);
    padding:18px 20px}
  .hm-ex .t{font-size:15px;line-height:1.5;letter-spacing:-.01em;color:var(--txt)}
  .hm-ex .t b{color:var(--accent);font-weight:600}
  .hm-ex .n{font-size:12.5px;color:var(--txt-faint);margin-top:8px;line-height:1.5}

  /* 持倉表。窄畫面自己橫向捲,不讓整頁跟著左右晃。 */
  .tw{background:var(--panel);border-radius:var(--radius-lg);overflow:hidden}
  .tw{overflow-x:auto}
  .tw table{border-collapse:collapse;width:100%;min-width:660px;font-size:14px}
  .tw th,.tw td{padding:13px 16px;text-align:right;white-space:nowrap;
    border-bottom:1px solid var(--line);letter-spacing:-.01em}
  .tw th{font-size:12px;color:var(--txt-faint);font-weight:400;background:none}
  .tw th:first-child,.tw td:first-child,
  .tw th:nth-child(2),.tw td:nth-child(2){text-align:left}
  .tw tbody tr:last-child td{border-bottom:0}
  .tw tbody tr{cursor:pointer}
  .tw tbody tr{transition:.15s}
  .tw tbody tr:hover{background:rgba(var(--hairline-rgb),.04)}
  .tw td.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
  .tw td .tk{font-family:var(--mono);font-size:11px;color:var(--txt-faint);margin-left:4px}
  .wbar{display:inline-block;width:46px;height:4px;border-radius:2px;
    background:rgba(var(--hairline-rgb),.10);vertical-align:middle;margin-right:9px}
  .wbar i{display:block;height:100%;border-radius:2px;background:var(--accent);opacity:.8}

  .know{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .kn{background:var(--panel);border-radius:var(--radius-lg);padding:22px 22px 20px}
  .kn .lab{font-size:12px;color:var(--txt-faint);letter-spacing:-.005em}
  .kn .val{font-size:34px;margin:9px 0 8px;font-weight:600;letter-spacing:-.03em;
    line-height:1;font-variant-numeric:tabular-nums;color:var(--txt)}
  .kn .why{font-size:13px;color:var(--txt-faint);line-height:1.5;letter-spacing:-.005em}
  .kn .val.up{color:var(--up)} .kn .val.down{color:var(--down)}
  .kn.warn .val{color:var(--alert)}

  .hm-geo{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:40px;
    background:var(--panel);border-radius:var(--radius-lg);padding:20px 22px;
    text-decoration:none;color:inherit;transition:.2s}
  .hm-geo:hover{background:var(--panel-float)}
  .hm-geo .gl{width:34px;height:34px;border-radius:50%;flex:0 0 auto;position:relative;
    border:1px solid rgba(var(--accent-rgb),.55);
    background:radial-gradient(circle at 34% 30%,rgba(var(--accent-rgb),.28),transparent 62%)}
  .hm-geo .gl::after{content:'';position:absolute;inset:0;border-radius:50%;
    border-top:1px solid rgba(var(--accent-rgb),.35);
    border-bottom:1px solid rgba(var(--accent-rgb),.35)}
  .hm-geo .t{flex:1;min-width:150px;font-size:15px;color:var(--txt-dim);
    letter-spacing:-.01em}
  .hm-geo .t b{color:var(--txt);font-weight:600}
  .hm-geo .go{font-size:14px;color:var(--on-accent);background:var(--accent);
    border-radius:var(--radius-pill);padding:8px 18px;white-space:nowrap;
    letter-spacing:-.01em}


  /* ---------- 主頁上的地球入口 ----------
     地球以前掛在主頁最底下的一行小字裡(.hm-geo),而它其實是這個網站
     最花時間做、也最好看的東西 —— 放在捲三次才看得到的地方等於沒有。
     現在把它提到 KPI 正下方,做成一張夠大的卡片。 */
  .hm-globe{display:flex;align-items:center;gap:20px;flex-wrap:wrap;
    margin:0 0 8px;padding:22px 24px;text-decoration:none;color:inherit;
    background:linear-gradient(135deg,rgba(var(--accent-rgb),.13),rgba(var(--violet-rgb),.09));
    border:1px solid rgba(var(--accent-rgb),.22);
    border-radius:var(--radius-lg);transition:.2s}
  .hm-globe:hover{border-color:rgba(var(--accent-rgb),.45);
    background:linear-gradient(135deg,rgba(var(--accent-rgb),.19),rgba(var(--violet-rgb),.13))}
  /* 小地球:兩條經線一條緯線,純 CSS。不用圖片,深淺色都自己成立。 */
  .hm-globe .gl{width:56px;height:56px;flex:0 0 auto;border-radius:50%;position:relative;
    border:1.5px solid rgba(var(--accent-rgb),.6);
    background:radial-gradient(circle at 33% 28%,rgba(var(--accent-rgb),.42),
               rgba(var(--accent-rgb),.06) 62%,transparent 78%)}
  .hm-globe .gl::before,.hm-globe .gl::after{content:'';position:absolute;inset:0;
    border-radius:50%;border:1px solid rgba(var(--accent-rgb),.34)}
  .hm-globe .gl::before{inset:0 34%}
  .hm-globe .gl::after{inset:34% 0}
  .hm-globe .t{flex:1 1 220px;min-width:0}
  .hm-globe .t b{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em;
    color:var(--txt);margin-bottom:5px}
  .hm-globe .t span{display:block;font-size:13.5px;color:var(--txt-dim);line-height:1.5;
    letter-spacing:-.005em}
  .hm-globe .go{font-size:14px;color:var(--on-accent);background:var(--accent);
    border-radius:var(--radius-pill);padding:9px 20px;white-space:nowrap;letter-spacing:-.01em}

  /* ---------- 帝國 · 富豪模擬器 ----------
     這一頁的元件全部自己一套(ty- 開頭),不共用主頁的 .kpi / .kn ——
     那些是「真實資產」的樣式,兩邊如果共用,以後任何一邊改樣式都會
     不小心動到另一邊,而這兩件事在語意上完全不該連動。 */
  .ty-intro p{font-size:15px;line-height:1.72;color:var(--txt-dim);
    letter-spacing:-.008em;margin:0 0 12px;max-width:70ch}
  .ty-intro p b{color:var(--txt);font-weight:600}
  .ty-intro p.warn{color:var(--alert);font-size:13.5px;margin-top:18px}
  .ty-scns{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .ty-scn{display:block;width:100%;text-align:left;font:inherit;cursor:pointer;
    background:var(--panel);border:1px solid transparent;border-radius:var(--radius-lg);
    padding:20px 20px 18px;transition:.18s;color:inherit}
  .ty-scn:hover{border-color:rgba(var(--accent-rgb),.5);background:var(--panel-float)}
  .ty-scn .nm{font-size:19px;font-weight:600;letter-spacing:-.02em;color:var(--txt)}
  .ty-scn .nm span{display:block;font-size:13px;font-weight:400;color:var(--txt-faint);
    margin-top:4px;letter-spacing:-.005em}
  .ty-scn .dsc{font-size:13.5px;color:var(--txt-dim);line-height:1.6;margin:12px 0 10px;
    letter-spacing:-.005em}
  .ty-scn .fig{font-size:13px;color:var(--txt-dim);font-variant-numeric:tabular-nums}
  .ty-scn .fig b{color:var(--accent);font-weight:600}
  .ty-scn .perk{font-size:12.5px;color:var(--txt-faint);line-height:1.55;margin-top:10px;
    padding-top:10px;border-top:1px solid var(--line)}

  .ty-bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    background:var(--panel);border-radius:var(--radius-lg);padding:18px 22px;margin-bottom:12px}
  .ty-bar .tb-l{flex:1 1 260px;min-width:0}
  .ty-bar .q{font-size:22px;font-weight:600;letter-spacing:-.02em;color:var(--txt)}
  .ty-bar .q span{font-size:12.5px;font-weight:400;color:var(--txt-faint);margin-left:10px;
    letter-spacing:-.005em}
  .ty-bar .rg{margin-top:8px;font-size:13.5px;color:var(--txt-dim);letter-spacing:-.005em}
  .ty-bar .rg b{color:var(--accent);font-weight:600;margin-right:8px}
  .ty-bar .mm{margin-top:6px;font-size:12.5px;color:var(--txt-faint);
    font-variant-numeric:tabular-nums}
  .ty-bar .mm b{color:var(--txt-dim);font-weight:600}
  .ty-next{font:inherit;font-size:15px;font-weight:600;letter-spacing:-.01em;cursor:pointer;
    background:var(--accent);color:var(--on-accent);border:0;border-radius:var(--radius-pill);
    padding:14px 30px;white-space:nowrap;transition:.15s}

  /* ---------- 帝國地圖 ----------
     地球是第二顆 WebGL 實例,住在 #tyGlobePark 裡面,只有地圖那一分頁
     才被搬進 #tyGlobeSlot。所以尺寸要靠容器給,不能靠它自己量。 */
  #tyGlobePark[hidden]{display:none}
  #tyGlobeHost{width:100%;height:100%}
  #tyGlobe{width:100%;height:100%;cursor:grab}
  #tyGlobe:active{cursor:grabbing}

  .ty-map{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.85fr);
    gap:14px;align-items:start}
  .ty-map-g{position:relative;background:var(--panel);border-radius:var(--radius-lg);
    overflow:hidden;height:min(72vh,680px)}
  .ty-map-g #tyGlobeSlot{position:absolute;inset:0 0 44px}
  .ty-lay{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;
    gap:8px;padding:8px 12px;flex-wrap:wrap;
    background:linear-gradient(to top,rgba(var(--panel-rgb),.96),rgba(var(--panel-rgb),0))}
  .ty-lay .lg{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-left:auto;
    font-size:10.5px;color:var(--txt-faint)}
  .ty-lay .lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px;
    vertical-align:middle}
  /* 地球上的標記。像大富翁一樣:地上一塊有顏色的地磚(那是 points 圖層),
     上面站著你在那裡實際擁有的東西 —— 房子、旅館、工地、油井、金庫。

     ⚠ 顏色寫死成深色,不吃站上的 --panel / --txt:
       指揮台永遠是夜晚,淺色佈景下的白色藥丸貼在深藍地球上會亮到看不見字。

     ⚠ 兩個「不要重疊」的機制:
       --lane  同一區的城市名字互相錯開幾個 pixel(見 tyGlobeData 的分道),
               建築本身**不動** —— 使用者要的是「在對應的位子」,
               所以移動的只有名牌。
       data-z  鏡頭拉遠的時候把還沒進場的城市名、對手名收起來、標記縮小。
               東亞那一團字擠在一起,九成是拉遠時才發生的。 */
  .tyk{transform:translate(-50%,-100%);text-align:center;cursor:pointer;
    font-family:var(--sans);line-height:1;user-select:none;white-space:nowrap;
    transition:opacity .2s}
  .tyk .k-ic{display:block;font-style:normal;font-size:15px;letter-spacing:-2px;
    filter:drop-shadow(0 1.5px 2px rgba(0,0,0,.55))}
  .tyk .k-n{display:inline-block;font-size:9.5px;font-weight:600;margin-top:3px;
    padding:2px 7px;border-radius:9px;
    background:rgba(10,23,34,.82);color:#e8f1f8;
    border:1px solid rgba(120,190,235,.34);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    letter-spacing:-.01em;box-shadow:0 1px 4px rgba(0,0,0,.5);
    transform:translateY(calc(var(--lane,0) * var(--laneh,13px)));transition:transform .2s}
  .tyk .k-n span{color:#7fd4ff;margin-left:4px;font-variant-numeric:tabular-nums}
  .tyk:hover .k-n{background:#4fc3f7;color:#06202e;border-color:#4fc3f7}
  .tyk:hover .k-n span{color:#06202e}
  /* 建築站的那塊地:一片扁扁的光暈,讓方塊看起來是「站在地上」而不是浮著 */
  .tyk .k-b{position:relative}
  .tyk .k-b::before{content:'';position:absolute;left:50%;bottom:-3px;
    width:calc(100% + 14px);height:9px;transform:translateX(-50%);
    border-radius:50%;opacity:.45;
    background:radial-gradient(ellipse,var(--kg,#4fc3f7) 0,transparent 72%);
    pointer-events:none}
  /* 對手:一個人形,名字不加底,不要跟自己的據點搶注意力 */
  .tyk.rv{transform:translate(-50%,-50%)}
  .tyk.rv .k-ic{font-size:11px;opacity:.7}
  .tyk.rv .k-n{background:none;box-shadow:none;border:0;backdrop-filter:none;
    -webkit-backdrop-filter:none;font-weight:400;color:#9db4c8;font-size:9px}
  /* 還沒進場的地方:只有一個很淡的名字,提醒你「這裡也可以去」 */
  .tyk.idle{transform:translate(-50%,-50%);opacity:.5}
  .tyk.idle .k-n{background:none;box-shadow:none;border:0;backdrop-filter:none;
    -webkit-backdrop-filter:none;font-weight:400;font-size:8.5px;color:#7d94a8}
  .tyk.idle:hover{opacity:1}
  /* 拉遠:只留下自己的東西。近:全部放大看得清楚。 */
  #tyGlobeHost[data-z="far"] .tyk.idle,
  #tyGlobeHost[data-z="far"] .tyk.rv .k-n{display:none}
  #tyGlobeHost[data-z="far"] .tyk .k-n{font-size:8.5px;padding:1px 5px}
  #tyGlobeHost[data-z="far"] .tyk .k-n span{display:none}
  #tyGlobeHost[data-z="far"] .tyk .k-b{transform:scale(.7);transform-origin:50% 100%}
  #tyGlobeHost[data-z="near"] .tyk .k-b{transform:scale(1.45);transform-origin:50% 100%}
  #tyGlobeHost[data-z="near"] .tyk .k-n{font-size:11px;padding:3px 9px}
  /* 貼近之後字變大,讓道也要跟著變寬,不然兩張名牌會黏在一起 */
  #tyGlobeHost[data-z="near"] .tyk{--laneh:19px}
  #tyGlobeHost[data-z="near"] .tyk.idle{opacity:.8}

  .ty-site:hover{background:rgba(var(--hairline-rgb),.06)}
  .ty-site .s-n{flex:0 0 30%;font-size:13.5px;color:var(--txt);min-width:0}
  .ty-site .s-n em{display:block;font-style:normal;font-size:10px;color:var(--txt-faintest)}
  .ty-site .s-b{flex:1;font-size:11.5px;color:var(--txt-dim);min-width:0;line-height:1.45}
  .ty-site .s-b i{font-style:normal;color:var(--txt-faintest)}
  .ty-site .s-v{flex:0 0 auto;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--txt)}

  .ty-facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
  .ty-facts div{background:rgba(var(--hairline-rgb),.05);border-radius:8px;padding:9px 11px}
  .ty-facts em{display:block;font-style:normal;font-size:10.5px;color:var(--txt-faintest)}
  .ty-facts b{font-size:14px;color:var(--txt);font-variant-numeric:tabular-nums}
  .ty-facts b.up{color:var(--up)} .ty-facts b.down{color:var(--down)}

  /* 「你在這裡有什麼」的每一列現在是按鈕(點開那一棟的資訊卡) */
  .st{display:flex;justify-content:space-between;gap:10px;padding:9px 8px;font-size:12.5px;
    border-bottom:1px solid var(--line);width:100%;font:inherit;background:none;border-left:0;
    border-right:0;border-top:0;cursor:pointer;text-align:left;color:inherit;border-radius:6px}
  .st:hover{background:rgba(var(--hairline-rgb),.05)}
  .st.on{background:rgba(var(--accent-rgb),.12)}
  .st b{color:var(--txt);font-weight:600;font-size:12.5px}
  .st span{color:var(--txt-faint);text-align:right;font-variant-numeric:tabular-nums;
    font-size:11.5px;line-height:1.45}

  /* 一棟建築的資訊卡 */
  .ty-bcard{background:rgba(var(--hairline-rgb),.05);border-radius:var(--radius);
    padding:15px 16px;margin:12px 0;border-left:3px solid var(--bl,var(--accent))}
  .ty-bcard .bc-h{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
  .ty-bcard .bc-h .k-b{filter:none;transform:scale(1.15);transform-origin:bottom left;
    margin-right:4px}
  .ty-bcard .bc-h b{font-size:16px;font-weight:600;color:var(--txt);letter-spacing:-.02em}
  .ty-bcard .bc-h span{font-size:11.5px;color:var(--txt-faint);flex:1 1 100%}
  .ty-bcard .bc-fig{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));
    gap:8px;margin:12px 0}
  .ty-bcard .bc-fig div{background:rgba(var(--panel-rgb),.55);border-radius:8px;padding:8px 10px}
  .ty-bcard .bc-fig em{display:block;font-style:normal;font-size:10.5px;color:var(--txt-faint)}
  .ty-bcard .bc-fig b{display:block;font-size:15px;font-weight:600;color:var(--txt);margin:2px 0;
    font-variant-numeric:tabular-nums;letter-spacing:-.015em}
  .ty-bcard .bc-fig i{font-style:normal;font-size:10px;color:var(--txt-faintest);line-height:1.4}
  .ty-bcard .bc-d{font-size:12px;color:var(--txt-dim);line-height:1.6;margin-bottom:11px}
  /* 地圖上被點開的那一棟要看得出來 */
  .bld.sel i:nth-child(1){box-shadow:0 0 0 1.5px var(--txt)}
  .ty-acts{display:flex;gap:6px;flex-wrap:wrap}

  /* 資產列上的市場下拉 */
  .ty-mkt{font:inherit;font-size:12px;padding:6px 8px;border-radius:var(--radius-pill);
    border:1px solid var(--line);background:var(--panel-float);color:var(--txt-dim);
    max-width:150px}
  .ty-open .o-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .ty-open .o-lock{font-size:11px;color:var(--alert)}

  /* 司法管轄區卡片(空殼 / 存款 / 夥伴共用) */
  .ty-juris{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
  .ty-j{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 15px;display:flex;flex-direction:column;gap:7px}
  .ty-j.on{border-color:rgba(var(--accent-rgb),.5);background:rgba(var(--accent-rgb),.07)}
  .ty-j .j-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .ty-j .j-h b{font-size:14.5px;font-weight:600;color:var(--txt)}
  .ty-j .j-h span{font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums}
  .ty-j .j-d{flex:1;font-size:11.5px;color:var(--txt-faint);line-height:1.55}
  .ty-j .j-a{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .ty-j .j-on{font-size:11.5px;color:var(--accent)}
  .ty-card .tag.site{font:inherit;font-size:11px;cursor:pointer;color:var(--accent);
    border-color:rgba(var(--accent-rgb),.4);background:none}

  /* ---------- 條件與金額 ----------
     使用者:「我點上市的時候,如果名氣不夠可以顯示出來,在我這個頁面要看得到」。
     所以每一顆按鈕底下都有一行小標,一條門檻一顆:打勾的是你已經有的,
     打叉的是還差的,而且**打叉的那一顆要一眼認得出來** —— 它是紅的、有底、
     字比較重。按鈕本身直接 disabled,滑過去的 title 寫著同一句話。 */
  /* ---------- 城市特色 ----------
     使用者:「地圖上可以顯示原本這個城市有的東西,根據他們真實的特色,
     然後那些資產、事業在每個城市都不一樣,都各有優缺點。」
     所以優點與缺點用同一種卡片、只差顏色 —— 一個城市兩種都有,
     而挑城市就是在挑「要付哪一種代價」。 */
  .ty-specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:7px;
    margin-bottom:4px}
  .ty-specs .sp{border-radius:var(--radius);padding:9px 11px;border:1px solid var(--line)}
  .ty-specs .sp.good{background:rgba(var(--accent-rgb),.07);
    border-color:rgba(var(--accent-rgb),.28)}
  .ty-specs .sp.bad{background:rgba(var(--alert-rgb),.07);
    border-color:rgba(var(--alert-rgb),.28)}
  .ty-specs .sp-h{display:flex;align-items:center;gap:6px}
  .ty-specs .sp-h i{font-style:normal;font-size:14px;line-height:1}
  .ty-specs .sp-h b{font-size:13px;font-weight:600;color:var(--txt)}
  .ty-specs .sp.bad .sp-h b{color:var(--alert)}
  .ty-specs .sp-d{font-size:11.5px;color:var(--txt-faint);line-height:1.55;margin-top:4px}

  /* 據點面板上的每一個動作:按鈕 + 它跟別的城市差多少 + 它還缺什麼 */
  .ty-acts.col{display:grid;gap:8px}
  .ty-act{display:flex;flex-direction:column;gap:0}
  .ty-act > .ty-b{align-self:flex-start}
  .ty-act .a-edge{font-size:11px;color:var(--txt-faint);margin-top:5px;
    font-variant-numeric:tabular-nums}
  .ty-act .a-edge em{font-style:normal}
  .ty-act .a-edge em.gain{color:var(--accent);font-weight:600}
  .ty-act .a-edge em.cost{color:var(--alert);font-weight:600}
  .ty-act .a-pre{font-size:11px;color:var(--txt-faintest);margin-top:3px;
    font-variant-numeric:tabular-nums}
  /* 地球上的名牌前面那兩個特色圖示 */
  .tyk .k-n .k-s{text-decoration:none;margin-right:3px;letter-spacing:-1px}


  /* ---------- 對手 ----------
     使用者:「可以看到對手的勢力,還有可以合作、談條件」。
     所以一張卡上有四層:他是誰 → 跟你什麼關係 → 勢力在哪 → 可以談什麼。 */
  .ty-card.rv{padding:14px 16px}
  .rv-h{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;
    background:none;border:0;padding:0;cursor:pointer;color:inherit}
  .rv-ic{font-size:22px;line-height:1;flex:0 0 auto}
  .rv-n{flex:1;min-width:0}
  .rv-n b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.015em;color:var(--txt)}
  .rv-n em{display:block;font-style:normal;font-size:11.5px;color:var(--txt-faint);margin-top:2px}
  .rv-v{text-align:right;flex:0 0 auto}
  .rv-v b{display:block;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;color:var(--txt)}
  .rv-v em{font-style:normal;font-size:10.5px;font-variant-numeric:tabular-nums}
  .rv-v em.up{color:var(--up)} .rv-v em.down{color:var(--down)}

  /* 關係:一條從敵對到盟友的軸 */
  .rv-rel{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:11px}
  .rv-rel .rl-b{display:block;width:96px;height:5px;border-radius:3px;flex:0 0 auto;
    background:linear-gradient(90deg,rgba(var(--alert-rgb),.35),rgba(var(--hairline-rgb),.12),
      rgba(var(--accent-rgb),.35));position:relative}
  .rv-rel .rl-b u{position:absolute;top:-2px;left:0;width:0;height:9px;
    border-right:2px solid var(--txt);text-decoration:none}
  .rv-rel .rl-t{color:var(--txt-faint);font-variant-numeric:tabular-nums}
  .rv-rel .rl-t.good{color:var(--accent)} .rv-rel .rl-t.bad{color:var(--alert)}
  .rv-rel .rl-p{color:var(--accent)}
  .rv-rel .rl-c{color:var(--alert)}

  /* 勢力:他的實心條 + 你的細線疊在同一格上 —— 一眼看得出誰壓著誰 */
  .rv-turf{margin-top:9px;display:grid;gap:4px}
  .rv-turf .tf{display:flex;align-items:center;gap:7px;font-size:11px}
  .rv-turf .tf-n{flex:0 0 92px;color:var(--txt-faint)}
  .rv-turf .tf.clash .tf-n{color:var(--alert)}
  .rv-turf .tf-b{flex:1;height:8px;border-radius:3px;background:rgba(var(--hairline-rgb),.08);
    position:relative;overflow:hidden}
  .rv-turf .tf-b u{position:absolute;inset:0 auto 0 0;text-decoration:none;
    background:rgba(var(--alert-rgb),.5)}
  .rv-turf .tf-b i{position:absolute;left:0;bottom:0;height:3px;
    background:var(--accent)}
  .rv-turf .tf-v{flex:0 0 24px;text-align:right;color:var(--txt-faintest);
    font-variant-numeric:tabular-nums}
  .rv-turf .tf-lg{font-size:10.5px;color:var(--txt-faintest);line-height:1.5;margin-top:3px}
  .rv-more{font-size:11.5px;color:var(--txt-faintest);margin-top:9px}

  /* 談條件 */
  .rv-deals{display:grid;gap:6px;margin-top:11px}
  .rv-deal{background:rgba(var(--hairline-rgb),.05);border-radius:var(--radius);
    border:1px solid transparent}
  .rv-deal.open{border-color:var(--line);background:rgba(var(--hairline-rgb),.07)}
  .rv-deal.warn.open{border-color:rgba(var(--alert-rgb),.4)}
  .rv-dh{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:inherit;
    background:none;border:0;padding:9px 11px;cursor:pointer;color:inherit}
  .rv-dh i{font-style:normal;font-size:15px;line-height:1}
  .rv-dh b{font-size:13.5px;font-weight:600;color:var(--txt)}
  .rv-dh em{font-style:normal;font-size:11px;color:var(--txt-faintest);margin-left:auto;
    text-align:right}
  .rv-odds{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;
    padding:1px 7px;border-radius:var(--radius-pill)}
  .rv-odds.o3{color:var(--accent);background:rgba(var(--accent-rgb),.14)}
  .rv-odds.o2{color:var(--txt-dim);background:rgba(var(--hairline-rgb),.10)}
  .rv-odds.o1{color:var(--alert);background:rgba(var(--alert-rgb),.14)}
  .rv-db{padding:0 11px 11px}
  .rv-dd{font-size:12px;color:var(--txt-dim);line-height:1.65;margin-bottom:8px}
  .rv-note{font-size:11px;color:var(--txt-faintest);line-height:1.6;margin-top:8px}
  .rv-note b{color:var(--txt-dim)}

  /* 頂列那條小走勢圖。就住在金色的淨值格裡面 ——
     頂列只有一列,多一個獨立元件會把左邊的名字擠掉。
     而且它本來就屬於那一格:那是分數,這是分數的走勢。 */
  .tg-spark{display:block;width:40px;height:16px;flex:0 0 auto;
    background:rgba(35,23,5,.16);border-radius:2px}
  @media(max-width:430px){ .tg-spark{width:30px} }

  .ty-need{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .ty-need.tight{margin-top:4px}
  .ty-need .n{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:1.5;
    padding:2px 8px;border-radius:var(--radius-pill);white-space:nowrap;
    font-variant-numeric:tabular-nums;letter-spacing:-.005em}
  .ty-need .n i{font-style:normal;font-size:10px}
  .ty-need .n b{font-weight:600}
  .ty-need .n.ok{color:var(--txt-faint);background:rgba(var(--hairline-rgb),.06)}
  .ty-need .n.ok i{color:var(--ok)}
  .ty-need .n.no{color:var(--alert);background:rgba(var(--alert-rgb),.14);
    border:1px solid rgba(var(--alert-rgb),.35)}
  .ty-need .n.no b{color:var(--alert)}
  /* 條件沒過的按鈕:看得出來是「還不行」,不是「壞掉」 */
  .ty-b.no[disabled]{background:rgba(var(--alert-rgb),.08);
    color:var(--alert);opacity:.75;border:1px dashed rgba(var(--alert-rgb),.4)}

  /* 一個動作 = 按鈕 + 它的條件 + 它會怎樣 */
  .ty-card .c-acts{display:grid;gap:10px;margin-top:4px}
  .ty-card .c-a{background:rgba(var(--hairline-rgb),.04);border-radius:var(--radius);
    padding:10px 12px}
  .ty-card .c-a-t{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .ty-card .c-gain{font-size:11.5px;color:var(--txt-faint);letter-spacing:-.005em;
    font-variant-numeric:tabular-nums}
  .ty-card .c-note{font-size:11.5px;color:var(--txt-faintest);line-height:1.6;margin-top:6px}
  .ty-card .c-note b{color:var(--alert)}
  .ty-open .o-pre{font-size:11.5px;color:var(--txt-dim);line-height:1.6;margin-top:7px;
    padding-top:7px;border-top:1px solid var(--line);letter-spacing:-.005em}
  .ty-open.is-done{opacity:.6}

  /* 金額選擇器:比例晶片 + 自訂金額 + 一行「這樣按下去會怎樣」 */
  .ty-money{margin-top:8px;background:rgba(var(--hairline-rgb),.05);
    border-radius:var(--radius);padding:9px 11px}
  .ty-money .m-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:7px}
  .ty-money .m-h b{font-size:12.5px;font-weight:600;color:var(--txt)}
  .ty-money .m-h span{font-size:11px;color:var(--txt-faintest);
    font-variant-numeric:tabular-nums}
  /* 晶片與自訂金額用同一組彈性基準,四顆比例剛好一排,自訂金額接在後面。
     不給基準的話,窄畫面上 flex:1 會讓「建議」與輸入框各佔一整行,
     一張卡片就長到要捲兩頁。 */
  .ty-money .m-c{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .ty-money .m-c .ty-chip{flex:1 1 58px;min-width:0;text-align:center;
    padding:5px 8px;font-size:12px}
  .ty-money .ty-amt{flex:1 1 108px;min-width:0}
  .ty-money .ty-amt input{width:100%}
  .ty-money .m-v{font-size:11.5px;color:var(--txt-dim);line-height:1.65;margin-top:7px;
    letter-spacing:-.005em}
  .ty-money .m-v b{color:var(--accent);font-weight:600}
  .ty-money .ty-amt input{width:82px}

  @media(max-width:520px){
    .ty-card .c-a-t{gap:7px}
    .ty-card .c-a-t .ty-b{flex:1 1 100%;text-align:center}
    .ty-money{padding:8px 9px}
    .ty-money .m-c .ty-chip{flex:1 1 52px;padding:5px 4px;font-size:11.5px}
    .ty-money .ty-amt{flex:1 1 96px}
  }




  /* ---------- 技術面 ----------
     版面的重點刻意放在「歷史成績」那一排數字上,不是訊號的名字。
     一個綠色的向上箭頭很容易畫,但它會讓人以為找到了什麼;
     「觸發 37 次 · 51% · +1.2%」才是這個訊號真正的樣子。 */
  .ta-warn{border-left:3px solid var(--amber);padding-left:12px}
  /* 合計成績。放在卡片清單之前,因為它回答的是「哪一個訊號值得看」——
     那個問題比「這一檔今天怎樣」重要。 */
  .ta-pool{background:var(--panel);border-radius:var(--radius-lg);padding:14px 16px;
    margin-bottom:10px}
  .tap-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .tap-h b{font-size:14.5px;font-weight:600;color:var(--txt)}
  .tap-h span{font-size:11.5px;color:var(--txt-faintest)}
  .tap-rows{display:grid;gap:6px}
  .tap{display:flex;align-items:center;gap:8px;font-size:12px}
  .tap.on{background:rgba(var(--accent-rgb),.07);border-radius:var(--radius);
    padding:4px 6px;margin:-4px -6px}
  .tap .tp-i{flex:0 0 auto;font-size:12px;color:var(--accent);width:22px;text-align:center}
  .tap .tp-n{flex:1;min-width:0;color:var(--txt-dim)}
  .tap .tp-n em{display:block;font-style:normal;font-size:10.5px;color:var(--accent);margin-top:1px}
  .tap .tp-b{flex:0 0 76px;height:6px;border-radius:3px;
    background:rgba(var(--hairline-rgb),.10);position:relative;overflow:hidden}
  .tap .tp-b u{position:absolute;inset:0 auto 0 0;text-decoration:none}
  .tap .tp-b u.up{background:var(--up)} .tap .tp-b u.down{background:var(--down)}
  .tap .tp-v{flex:0 0 52px;text-align:right;font-weight:600;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .tap .tp-v.up{color:var(--up)} .tap .tp-v.down{color:var(--down)}
  .tap .tp-v.na{color:var(--txt-faintest);font-weight:400;font-size:11px}
  .tap .tp-c{flex:0 0 46px;text-align:right;font-size:11px;color:var(--txt-faintest);
    font-variant-numeric:tabular-nums}
  .tap-f{font-size:11px;color:var(--txt-faintest);line-height:1.65;margin-top:11px;
    padding-top:10px;border-top:1px solid var(--line)}
  @media(max-width:520px){
    .tap .tp-b{flex:0 0 44px}
    .tap .tp-c{display:none}
  }

  .ta-cards{display:grid;gap:10px}
  .ta-card{background:var(--panel);border-radius:var(--radius-lg);padding:14px 16px}
  .ta-card.open{outline:1px solid rgba(var(--accent-rgb),.35)}
  .ta-h{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;
    background:none;border:0;padding:0;cursor:pointer;color:inherit}
  .ta-n{flex:1;min-width:0}
  .ta-n b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.015em;color:var(--txt)}
  .ta-n em{display:block;font-style:normal;font-size:11.5px;color:var(--txt-faint);margin-top:2px}
  .ta-st{flex:0 0 auto;font-size:11.5px;font-weight:600;padding:3px 9px;
    border-radius:var(--radius-pill)}
  .ta-st.s-bull{color:var(--up);background:rgba(var(--up-rgb),.12)}
  .ta-st.s-bear{color:var(--down);background:rgba(var(--down-rgb),.12)}
  .ta-st.s-mix,.ta-st.s-na{color:var(--txt-faint);background:rgba(var(--hairline-rgb),.08)}
  .ta-sig{flex:0 0 auto;display:flex;align-items:center;gap:4px}
  .ta-sig i{font-style:normal;font-size:12px;color:var(--accent)}
  .ta-sig u{text-decoration:none;font-size:11px;color:var(--accent)}
  .ta-sig u.dim{color:var(--txt-faintest)}

  .ta-ms{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .ta-m{display:inline-flex;flex-direction:column;gap:1px;padding:5px 9px;
    background:rgba(var(--hairline-rgb),.05);border-radius:var(--radius);min-width:68px}
  .ta-m em{font-style:normal;font-size:10px;color:var(--txt-faintest)}
  .ta-m b{font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--txt)}
  .ta-m.up b{color:var(--up)} .ta-m.down b{color:var(--down)}
  /* 超買 / 超賣用琥珀與藍,不是漲跌色 —— 「RSI 78」不是「漲了 78」 */
  .ta-m.hot b{color:var(--amber)} .ta-m.cold b{color:var(--accent)}

  .ta-stance{font-size:12px;line-height:1.65;color:var(--txt-dim);margin-top:9px;
    padding-top:9px;border-top:1px solid var(--line)}
  .ta-more{font-size:11.5px;color:var(--txt-faintest);margin-top:9px}
  .ta-foot{font-size:11px;color:var(--txt-faintest);line-height:1.6;margin-top:10px}

  .ta-sigs{display:grid;gap:8px;margin-top:11px}
  .ta-sig-row{background:rgba(var(--hairline-rgb),.05);border-radius:var(--radius);
    padding:11px 13px;border:1px solid transparent}
  .ta-sig-row.on{border-color:rgba(var(--accent-rgb),.45);
    background:rgba(var(--accent-rgb),.07)}
  .tsr-h{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .tsr-h i{font-style:normal;font-size:13px;color:var(--accent)}
  .tsr-h b{font-size:13.5px;font-weight:600;color:var(--txt)}
  .tsr-h u{text-decoration:none;font-size:10.5px;padding:1px 7px;border-radius:var(--radius-pill)}
  .tsr-h u.now{color:var(--accent);background:rgba(var(--accent-rgb),.16);font-weight:600}
  .tsr-h u.ago{color:var(--txt-faintest);background:rgba(var(--hairline-rgb),.08)}
  .tsr-d{font-size:11.5px;color:var(--txt-faint);line-height:1.6;margin-top:5px}
  .tsr-stat{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px}
  .tsr-stat span{display:flex;flex-direction:column;gap:1px}
  .tsr-stat em{font-style:normal;font-size:10px;color:var(--txt-faintest)}
  .tsr-stat b{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;color:var(--txt)}
  .tsr-stat b.up{color:var(--up)} .tsr-stat b.down{color:var(--down)}
  .tsr-v{font-size:11.5px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
  .tsr-v.v-good{color:var(--up)}
  .tsr-v.v-coin{color:var(--txt-dim)}
  .tsr-v.v-bad {color:var(--down)}
  .tsr-v.v-na  {color:var(--txt-faintest)}

  /* 三個期間的勝率。這一段在回答「什麼時候賣」,所以要看得比單一數字明顯 */
  .tsr-hz{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:9px;
    padding-top:8px;border-top:1px dashed var(--line)}
  .tsr-hz>em{font-style:normal;font-size:10px;color:var(--txt-faintest);flex:0 0 auto}
  .tsr-hz span{display:flex;flex-direction:column;gap:0;align-items:center;
    padding:3px 9px;border-radius:var(--radius);background:rgba(var(--hairline-rgb),.06)}
  .tsr-hz b{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;color:var(--txt)}
  .tsr-hz span.up b{color:var(--up)} .tsr-hz span.down b{color:var(--down)}
  .tsr-hz span.na b{color:var(--txt-faintest);font-weight:400}
  .tsr-hz u{text-decoration:none;font-size:9.5px;color:var(--txt-faintest);white-space:nowrap}

  /* 進場 / 出場的分隔。出場那一組用琥珀 —— 它不是「跌」,是「該注意了」 */
  .ta-grp{font-size:11px;font-weight:600;color:var(--txt-faint);
    letter-spacing:.04em;margin:4px 0 0}
  .ta-grp.ex{color:var(--amber);margin-top:10px;padding-top:10px;
    border-top:1px solid var(--line);font-weight:400;letter-spacing:0;line-height:1.6}
  .ta-grp.ex b{font-weight:600}

  /* ---------- 結論卡片 ----------
     ⚠ 五個結論色都**不是**漲跌色。這個網站的紅綠只留給損益 ——
       「技術面偏多」不是「今天漲了」,把它染成紅色的話,一個下跌 3% 但
       均線還排得好好的日子,畫面上會同時有兩個互相打架的紅。 */
  .tv{margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
  .tv-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tv-badge{font-size:13px;font-weight:700;padding:4px 12px;border-radius:var(--radius-pill);
    letter-spacing:-.01em}
  .v-strong .tv-badge{color:#0b3b2e;background:#6ee7b7}
  .v-mild   .tv-badge{color:#0b3b2e;background:rgba(110,231,183,.32)}
  .v-flat   .tv-badge{color:var(--txt-dim);background:rgba(var(--hairline-rgb),.14)}
  .v-weak   .tv-badge{color:#4a2408;background:#fcd34d}
  .v-bad    .tv-badge{color:#fff;background:#c2410c}
  .tv-px{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;color:var(--txt)}
  .tv-act{flex:1 1 200px;font-size:11.5px;color:var(--txt-faint);line-height:1.5}
  .tv-sec{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
  .tv-sec.last{border-top-style:solid}
  .tv-st{font-size:11px;font-weight:600;color:var(--txt-faint);letter-spacing:.05em;
    margin-bottom:6px}
  .tv-why{list-style:none;margin:0;padding:0;display:grid;gap:5px}
  .tv-why li{font-size:12.5px;line-height:1.6;color:var(--txt-dim);
    padding-left:19px;position:relative}
  .tv-why li b{color:var(--txt);font-weight:600}
  .tv-why li::before{position:absolute;left:0;top:0;font-size:11px;font-weight:700}
  /* ✓ / ✗ / · 用中性的強調色與警示色,不是漲跌色 */
  .tv-why li.y::before{content:'✓';color:var(--accent)}
  .tv-why li.n::before{content:'✗';color:var(--alert)}
  .tv-why li.m::before{content:'·';color:var(--txt-faintest);font-size:15px;top:-3px}
  .tv-do{font-size:13px;line-height:1.7;color:var(--txt);margin:0 0 9px}
  .tv-do b{font-weight:600}
  .tv-lv{display:flex;flex-wrap:wrap;gap:8px}
  .tv-lv span{flex:1 1 46%;display:flex;flex-direction:column;gap:1px;padding:8px 11px;
    border-radius:var(--radius);background:rgba(var(--hairline-rgb),.06);
    border-left:3px solid var(--line)}
  .tv-lv .stop{border-left-color:var(--alert)}
  .tv-lv .res{border-left-color:var(--accent)}
  .tv-lv em{font-style:normal;font-size:10.5px;color:var(--txt-faintest)}
  .tv-lv b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;color:var(--txt)}
  .tv-lv u{text-decoration:none;font-size:10.5px;color:var(--txt-faint)}
  .tv-sup{font-size:11px;color:var(--txt-faintest);margin-top:7px}
  .tv-hist{font-size:12px;line-height:1.7;color:var(--txt-dim);margin:0}
  .tv-hist b{color:var(--txt);font-weight:600}
  .tv-warn{font-size:11px;line-height:1.7;color:var(--txt-faintest);margin:9px 0 0;
    padding:8px 11px;background:rgba(var(--hairline-rgb),.05);border-radius:var(--radius);
    border-left:3px solid var(--amber)}
  .tv-warn b{color:var(--txt-faint);font-weight:600}

  /* 原始數字收起來 —— 它是佐證不是主角 */
  .ta-nums{margin-top:10px}
  .ta-nums>summary{cursor:pointer;font-size:11px;color:var(--txt-faintest)}
  .ta-nums .ta-ms{margin-top:8px}

  /* 卡片標題上的結論標籤 */
  .ta-st.v-strong{color:var(--accent);background:rgba(var(--accent-rgb),.16)}
  .ta-st.v-mild{color:var(--accent);background:rgba(var(--accent-rgb),.09)}
  .ta-st.v-flat{color:var(--txt-faint);background:rgba(var(--hairline-rgb),.08)}
  .ta-st.v-weak{color:var(--alert-soft);background:rgba(var(--alert-rgb),.09)}
  .ta-st.v-bad{color:var(--alert);background:rgba(var(--alert-rgb),.14)}

  @media(max-width:520px){
    .tv-lv span{flex:1 1 100%}
  }

  /* ---------- 分數表 ----------
     一行一檔:名字 · 分數條 · 分數 · 一句話。其他全部收進點擊之後。 */
  /* ---------- 分數表 ----------
     ⚠⚠ 這一層叫 .scl 不叫 .tl。`.tl` / `.tl-row` 早就被新聞頁的時間軸佔走了
       (見約 3300 行),而且它是 `display:grid;grid-template-columns:auto 1fr` ——
       撞上去之後,一行四個元素會被塞進兩欄變成兩排,每一列從 30px 變成 83px。
       畫面上看起來就是「排版很鬆散、資訊很少卻很長」。
       ⚠ 在這裡新增 class 之前,先在整份 CSS 搜一次同名的。這個檔案已經因為
         同樣的原因改過名兩次了(帝國指揮台的 .tg → .tycon,還有這一次)。 */
  .scl{background:var(--panel);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:12px}
  .scl-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .scl-h b{font-size:15px;font-weight:600;letter-spacing:-.015em;color:var(--txt)}
  .scl-h span{font-size:11px;color:var(--txt-faintest)}
  .scl-gt{font-size:10.5px;font-weight:600;color:var(--txt-faintest);letter-spacing:.05em;
    margin:10px 0 4px}
  .scl-row{display:flex;align-items:center;gap:9px;width:100%;font:inherit;text-align:left;
    background:none;border:0;color:inherit;cursor:pointer;padding:7px 8px;
    border-radius:var(--radius);border-left:3px solid transparent}
  .scl-row:hover{background:rgba(var(--hairline-rgb),.06)}
  .scl-row.v-strong{border-left-color:var(--accent)}
  .scl-row.v-mild{border-left-color:rgba(var(--accent-rgb),.5)}
  .scl-row.v-flat{border-left-color:var(--line)}
  .scl-row.v-weak{border-left-color:var(--alert-soft)}
  .scl-row.v-bad{border-left-color:var(--alert)}
  .scl-nm{flex:1 1 34%;min-width:0;display:flex;align-items:baseline;gap:5px}
  .scl-nm i{font-style:normal;font-size:8px;color:var(--accent);flex:0 0 auto}
  .scl-nm b{font-size:14px;font-weight:600;letter-spacing:-.015em;color:var(--txt);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .scl-nm em{font-style:normal;font-size:10.5px;color:var(--txt-faintest);flex:0 0 auto}
  /* 分數條:刻度線畫在 50(方向不明),讓「高於一半」看得出來 */
  .scl-bar{flex:0 0 84px;height:7px;border-radius:4px;position:relative;overflow:hidden;
    background:rgba(var(--hairline-rgb),.14)}
  .scl-bar::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;
    background:rgba(var(--hairline-rgb),.5)}
  .scl-bar u{position:absolute;inset:0 auto 0 0;text-decoration:none;border-radius:4px}
  .v-strong .scl-bar u{background:var(--accent)}
  .v-mild   .scl-bar u{background:rgba(var(--accent-rgb),.55)}
  .v-flat   .scl-bar u{background:rgba(var(--hairline-rgb),.45)}
  .v-weak   .scl-bar u{background:var(--alert-soft)}
  .v-bad    .scl-bar u{background:var(--alert)}
  .scl-sc{flex:0 0 30px;text-align:right;font-size:15px;font-weight:600;
    font-variant-numeric:tabular-nums;letter-spacing:-.03em;color:var(--txt)}
  .scl-v{flex:0 0 auto;display:flex;align-items:center;gap:6px;
    font-size:11.5px;color:var(--txt-faint)}
  .scl-chip{font-size:10px;padding:1px 6px;border-radius:var(--radius-pill);white-space:nowrap}
  .scl-chip.in{color:var(--accent);background:rgba(var(--accent-rgb),.14)}
  .scl-chip.out{color:var(--alert);background:rgba(var(--alert-rgb),.14)}
  /* 桌機才出現的「現價 / 漲跌」欄。
     分數表原本是 .scl-nm 在 flex-grow,所以名稱右邊一路空到小 K 線 ——
     1800px 寬的時候那是九百多像素的空白。
     桌機改成:名稱固定寬、補一欄現價、**讓小 K 線去 grow**。
     那條線本來就是這一列最值得佔空間的東西。 */
  .scl-px{display:none}
  @media (min-width:1100px){
    .scl-row{gap:14px;padding:8px 10px}
    .scl-nm{flex:0 1 240px}
    .scl-px{display:flex;flex:0 0 108px;flex-direction:column;gap:1px;align-items:flex-end;
      font-variant-numeric:tabular-nums;line-height:1.25}
    .scl-px b{font-size:13.5px;font-weight:600;color:var(--txt)}
    .scl-px u{text-decoration:none;font-size:10.5px}
    .scl-bar{flex:0 0 110px;height:8px}
    .scl-v{flex:0 0 190px;justify-content:flex-end}
  }

  .scl-more{font-size:11px;color:var(--txt-faintest);padding:6px 8px}
  .scl-note{margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
  .scl-note>summary{cursor:pointer;font-size:11.5px;color:var(--txt-faintest)}
  .scl-nb{font-size:11.5px;line-height:1.75;color:var(--txt-faint);margin-top:8px}
  .scl-nb b{color:var(--txt-dim);font-weight:600}

  /* 兩種分數的切換。分頁本身要講出「它在回答什麼問題」——
     只寫「趨勢分 / 反彈分」四個字,使用者還是不知道差在哪。 */
  .scl-tabs{display:flex;gap:6px;margin-bottom:9px}
  .scl-tab{flex:1;font:inherit;text-align:left;cursor:pointer;padding:7px 11px;
    border-radius:var(--radius);border:1px solid var(--line);background:none;color:inherit}
  .scl-tab b{display:block;font-size:13px;font-weight:600;color:var(--txt-faint)}
  .scl-tab em{display:block;font-style:normal;font-size:10.5px;color:var(--txt-faintest);
    margin-top:1px;line-height:1.4}
  .scl-tab.on{border-color:rgba(var(--accent-rgb),.45);background:rgba(var(--accent-rgb),.08)}
  .scl-tab.on b{color:var(--accent)}

  /* 分數的意思。⚠ 一定要寫出來 —— 使用者問過「分數越高低代表什麼」 */
  .scl-leg{display:grid;gap:3px;font-size:10.5px;line-height:1.55;color:var(--txt-faintest);
    padding:8px 10px;margin-bottom:6px;border-radius:var(--radius);
    background:rgba(var(--hairline-rgb),.05)}
  .scl-leg b{display:inline-block;min-width:44px;font-weight:600;margin-right:5px}
  .scl-leg .hi b{color:var(--accent)}
  .scl-leg .mid b{color:var(--txt-faint)}
  .scl-leg .lo b{color:var(--alert)}
  .scl-dd{font-size:10px;padding:1px 6px;border-radius:var(--radius-pill);
    color:var(--txt-faint);background:rgba(var(--hairline-rgb),.1);white-space:nowrap}
  .scl-sc.na{color:var(--txt-faintest);font-size:12px;font-weight:400}

  /* ---------- 今天的重點(顧問交給你的那一頁)----------
